<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Maze Speedrunner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;height:100dvh}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-family:'Courier New',monospace;font-weight:bold;z-index:10;background:rgba(8,12,36,0.88)}
.hud-score{color:#ffd93d;font-size:1.1rem}
.hud-center{text-align:center}
.hud-timer{color:#0ff;font-size:1.5rem}
.hud-level{color:#8cf;font-size:0.8rem}
.hud-btn{width:42px;height:42px;background:rgba(0,255,255,0.12);border:2px solid #0ff;border-radius:10px;color:#0ff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
#overlay{position:fixed;inset:0;background:rgba(8,12,36,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;font-family:'Courier New',monospace;text-align:center;padding:20px}
#overlay.hidden{display:none}
#overlay h2{font-size:1.9rem;color:#0ff;margin-bottom:10px;text-shadow:0 0 20px #0ff}
#overlay p{font-size:1rem;color:#8cf;margin-bottom:5px;line-height:1.5}
.final-score{font-size:2.2rem;color:#ffd93d;margin:14px 0;text-shadow:0 0 15px rgba(255,217,61,0.5)}
#overlay button{margin-top:16px;padding:14px 40px;font-size:1.2rem;background:rgba(0,255,255,0.12);border:2px solid #0ff;border-radius:12px;color:#0ff;font-family:inherit;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent}
#overlay button:active{background:rgba(0,255,255,0.28)}
#overlay a{display:inline-block;margin-top:14px;color:#8cf;font-size:0.95rem;text-decoration:none}
</style>
</head>
<body>

<div id="hud">
    <a href="index.html" class="hud-btn" style="text-decoration:none">🏠</a>
    <div><span class="hud-score" id="scoreDisp">0000 ⭐</span></div>
    <div class="hud-center"><span class="hud-timer" id="timerDisp">120 s.</span> ⏳<br><span class="hud-level" id="levelDisp">Niveau 1</span></div>
    <div><div class="hud-btn" id="pauseBtn">⏸</div></div>
</div>

<canvas id="c"></canvas>

<div id="overlay">
    <h2 id="ovTitle">🏁 Maze Speedrunner</h2>
    <p id="ovMsg">Trouve la sortie avant la fin du temps !<br>Glisse pour te déplacer.<br><br>⭐ Bonus score (+200 pts)<br>⏳ Bonus temps (+15 s.)<br><br>Chaque nouvelle case = +10 pts<br>Revenir en arrière = −3 pts</p>
    <div class="final-score" id="ovScore"></div>
    <button id="ovBtn">GO !</button>
    <a href="index.html">← Menu</a>
</div>

<script src="leaderboard.js"></script>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('scoreDisp');
var timerEl = document.getElementById('timerDisp');
var levelEl = document.getElementById('levelDisp');
var pauseBtn = document.getElementById('pauseBtn');
var overlay = document.getElementById('overlay');
var ovTitle = document.getElementById('ovTitle');
var ovMsg = document.getElementById('ovMsg');
var ovScore = document.getElementById('ovScore');
var ovBtn = document.getElementById('ovBtn');

var W, H, CELL, COLS, ROWS, mazeX, mazeY;
var HUD_H = 52;
var maze, mazeBuffer;
var playerR, playerC, facing;
var exitR, exitC;
var visited, visitCount;
var bonuses, particles;
var score, timeLeft, level, running, paused;
var animId, lastTimerTick;

/* ── Sizing ─────────────────────────────────── */
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}

function calcGrid() {
    CELL = Math.max(18, Math.floor(W / 16));
    COLS = Math.floor(W / CELL);
    ROWS = Math.floor((H - HUD_H - 12) / CELL);
    if (COLS < 5) COLS = 5;
    if (ROWS < 8) ROWS = 8;
    mazeX = Math.floor((W - COLS * CELL) / 2);
    mazeY = HUD_H + Math.floor((H - HUD_H - ROWS * CELL) / 2);
    exitR = ROWS - 1;
    exitC = COLS - 1;
}

/* ── Maze generation (recursive backtracker) ── */
function generateMaze() {
    maze = [];
    for (var r = 0; r < ROWS; r++) {
        maze[r] = [];
        for (var c = 0; c < COLS; c++) {
            maze[r][c] = { t: true, r: true, b: true, l: true };
        }
    }
    var vis = [];
    for (var r = 0; r < ROWS; r++) { vis[r] = []; for (var c = 0; c < COLS; c++) vis[r][c] = false; }

    var stack = [{ r: 0, c: 0 }];
    vis[0][0] = true;

    while (stack.length > 0) {
        var cur = stack[stack.length - 1];
        var cr = cur.r, cc = cur.c, nb = [];
        if (cr > 0 && !vis[cr - 1][cc]) nb.push({ r: cr - 1, c: cc, d: 't' });
        if (cc < COLS - 1 && !vis[cr][cc + 1]) nb.push({ r: cr, c: cc + 1, d: 'r' });
        if (cr < ROWS - 1 && !vis[cr + 1][cc]) nb.push({ r: cr + 1, c: cc, d: 'b' });
        if (cc > 0 && !vis[cr][cc - 1]) nb.push({ r: cr, c: cc - 1, d: 'l' });

        if (nb.length > 0) {
            var n = nb[Math.floor(Math.random() * nb.length)];
            vis[n.r][n.c] = true;
            if (n.d === 't') { maze[cr][cc].t = false; maze[n.r][n.c].b = false; }
            else if (n.d === 'r') { maze[cr][cc].r = false; maze[n.r][n.c].l = false; }
            else if (n.d === 'b') { maze[cr][cc].b = false; maze[n.r][n.c].t = false; }
            else { maze[cr][cc].l = false; maze[n.r][n.c].r = false; }
            stack.push(n);
        } else {
            stack.pop();
        }
    }
}

/* ── Off-screen maze buffer ───────────────────── */
function renderMazeBuffer() {
    mazeBuffer = document.createElement('canvas');
    mazeBuffer.width = W;
    mazeBuffer.height = H;
    var mc = mazeBuffer.getContext('2d');

    mc.strokeStyle = '#0ff';
    mc.lineWidth = 2.5;
    mc.shadowColor = '#0ff';
    mc.shadowBlur = 8;
    mc.lineCap = 'round';

    mc.beginPath();
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var x = mazeX + c * CELL;
            var y = mazeY + r * CELL;
            var cl = maze[r][c];
            if (cl.t) { mc.moveTo(x, y); mc.lineTo(x + CELL, y); }
            if (cl.r) { mc.moveTo(x + CELL, y); mc.lineTo(x + CELL, y + CELL); }
            if (cl.b) { mc.moveTo(x, y + CELL); mc.lineTo(x + CELL, y + CELL); }
            if (cl.l) { mc.moveTo(x, y); mc.lineTo(x, y + CELL); }
        }
    }
    mc.stroke();
}

/* ── Bonuses ──────────────────────────────────── */
function placeBonuses() {
    bonuses = [];
    var used = {};
    used['0,0'] = true;
    used[exitR + ',' + exitC] = true;
    var total = 5 + Math.floor(Math.random() * 3);
    for (var i = 0; i < total; i++) {
        var r, c, key, tries = 0;
        do { r = Math.floor(Math.random() * ROWS); c = Math.floor(Math.random() * COLS); key = r + ',' + c; tries++; }
        while (used[key] && tries < 300);
        if (tries >= 300) continue;
        used[key] = true;
        bonuses.push({ r: r, c: c, type: i < Math.ceil(total * 0.5) ? 'score' : 'time', collected: false });
    }
}

/* ── Init level ───────────────────────────────── */
function initLevel() {
    calcGrid();
    generateMaze();
    playerR = 0; playerC = 0; facing = 'right';
    visited = {}; visited['0,0'] = true; visitCount = 1;
    placeBonuses();
    particles = [];
    renderMazeBuffer();
}

/* ── Start / Game over / Level complete ───────── */
function startGame() {
    resize();
    score = 0; timeLeft = 120; level = 1;
    running = true; paused = false;
    lastTimerTick = Date.now();
    initLevel();
    overlay.classList.add('hidden');
    updateHUD();
    if (animId) cancelAnimationFrame(animId);
    loop();
}

function levelComplete() {
    var tb = Math.floor(timeLeft * 5);
    var lb = 500 + (level - 1) * 250;
    score += tb + lb;
    timeLeft += Math.max(15, 50 - level * 5);
    level++;
    spawnParticles(W / 2, H / 2, '#ffd93d', 30);
    spawnParticles(W / 2, H / 2, '#0ff', 20);
    initLevel();
    updateHUD();
}

function gameOver() {
    running = false;
    if (animId) cancelAnimationFrame(animId);
    ovTitle.textContent = '⏱️ Temps écoulé !';
    ovMsg.textContent = 'Niveau ' + level + ' • ' + visitCount + ' cellules explorées';
    ovScore.textContent = score + ' pts';
    ovBtn.textContent = 'Rejouer';
    overlay.classList.remove('hidden');
    if (score > 0) {
        var name = Leaderboard.promptName();
        if (name) Leaderboard.add('maze', score, name);
    }
}

/* ── Movement ─────────────────────────────────── */
function canMove(r, c, dr, dc) {
    if (dr === -1) return !maze[r][c].t;
    if (dr === 1)  return !maze[r][c].b;
    if (dc === -1) return !maze[r][c].l;
    if (dc === 1)  return !maze[r][c].r;
    return false;
}

function movePlayer(dr, dc) {
    if (!running || paused) return false;
    var nr = playerR + dr, nc = playerC + dc;
    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return false;
    if (!canMove(playerR, playerC, dr, dc)) return false;

    playerR = nr; playerC = nc;
    if (dr === -1) facing = 'up';
    else if (dr === 1) facing = 'down';
    else if (dc === -1) facing = 'left';
    else facing = 'right';

    var key = nr + ',' + nc;
    if (!visited[key]) {
        visited[key] = true;
        visitCount++;
        score += 10;
    } else {
        score = Math.max(0, score - 3);
    }

    for (var i = 0; i < bonuses.length; i++) {
        var b = bonuses[i];
        if (!b.collected && b.r === nr && b.c === nc) {
            b.collected = true;
            var bx = mazeX + nc * CELL + CELL / 2;
            var by = mazeY + nr * CELL + CELL / 2;
            if (b.type === 'score') {
                score += 200;
                spawnParticles(bx, by, '#ffd93d', 14);
            } else {
                timeLeft += 15;
                spawnParticles(bx, by, '#0ff', 14);
            }
        }
    }

    if (nr === exitR && nc === exitC) levelComplete();
    updateHUD();
    return true;
}

/* ── Particles ────────────────────────────────── */
function spawnParticles(x, y, col, n) {
    for (var i = 0; i < n; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7,
            life: 22 + Math.random() * 16,
            color: col,
            size: 2 + Math.random() * 3
        });
    }
}

/* ── HUD ──────────────────────────────────────── */
function updateHUD() {
    scoreEl.textContent = String(score).padStart(4, '0') + ' ⭐';
    timerEl.textContent = Math.max(0, Math.ceil(timeLeft)) + ' s.';
    levelEl.textContent = 'Niveau ' + level;
}

/* ── Update ───────────────────────────────────── */
function update() {
    var now = Date.now();
    if (now - lastTimerTick >= 1000) {
        timeLeft--;
        lastTimerTick += 1000;
        updateHUD();
        if (timeLeft <= 0) { gameOver(); return; }
    }
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.94; p.vy *= 0.94;
        if (--p.life <= 0) particles.splice(i, 1);
    }
}

/* ── Draw ─────────────────────────────────────── */
function draw() {
    ctx.fillStyle = '#080c24';
    ctx.fillRect(0, 0, W, H);

    // Visited cells — dim trail
    ctx.fillStyle = 'rgba(0,255,255,0.07)';
    for (var key in visited) {
        var kp = key.split(',');
        ctx.fillRect(mazeX + kp[1] * CELL + 1, mazeY + kp[0] * CELL + 1, CELL - 2, CELL - 2);
    }

    // Maze walls from buffer
    ctx.drawImage(mazeBuffer, 0, 0);

    // Bonuses
    var t = Date.now();
    for (var i = 0; i < bonuses.length; i++) {
        var b = bonuses[i];
        if (b.collected) continue;
        var bx = mazeX + b.c * CELL + CELL / 2;
        var by = mazeY + b.r * CELL + CELL / 2;
        var pulse = 0.6 + Math.sin(t / 300 + i * 2.5) * 0.4;
        ctx.save();
        ctx.globalAlpha = pulse;
        if (b.type === 'score') {
            ctx.fillStyle = '#ffd93d';
            ctx.shadowColor = '#ffd93d';
            ctx.shadowBlur = 10;
            drawStar(bx, by, CELL * 0.28, 5);
        } else {
            ctx.fillStyle = '#0ff';
            ctx.shadowColor = '#0ff';
            ctx.shadowBlur = 10;
            drawHourglass(bx, by, CELL * 0.22);
        }
        ctx.restore();
    }

    // Exit portal
    var ex = mazeX + exitC * CELL + CELL / 2;
    var ey = mazeY + exitR * CELL + CELL / 2;
    var ep = 0.5 + Math.sin(t / 200) * 0.5;
    ctx.save();
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 14 * ep;
    ctx.globalAlpha = 0.5 + ep * 0.5;
    var er = CELL * 0.38;
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.stroke();
    // X inside
    var xs = er * 0.5;
    ctx.beginPath();
    ctx.moveTo(ex - xs, ey - xs); ctx.lineTo(ex + xs, ey + xs);
    ctx.moveTo(ex + xs, ey - xs); ctx.lineTo(ex - xs, ey + xs);
    ctx.stroke();
    ctx.restore();

    // Player — triangle with center dot
    var px = mazeX + playerC * CELL + CELL / 2;
    var py = mazeY + playerR * CELL + CELL / 2;
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 12;
    var pr = CELL * 0.32;
    ctx.beginPath();
    if (facing === 'up') { ctx.moveTo(px, py - pr); ctx.lineTo(px - pr * 0.7, py + pr * 0.5); ctx.lineTo(px + pr * 0.7, py + pr * 0.5); }
    else if (facing === 'down') { ctx.moveTo(px, py + pr); ctx.lineTo(px - pr * 0.7, py - pr * 0.5); ctx.lineTo(px + pr * 0.7, py - pr * 0.5); }
    else if (facing === 'left') { ctx.moveTo(px - pr, py); ctx.lineTo(px + pr * 0.5, py - pr * 0.7); ctx.lineTo(px + pr * 0.5, py + pr * 0.7); }
    else { ctx.moveTo(px + pr, py); ctx.lineTo(px - pr * 0.5, py - pr * 0.7); ctx.lineTo(px - pr * 0.5, py + pr * 0.7); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0ff';
    ctx.beginPath(); ctx.arc(px, py, CELL * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Particles
    for (var i = 0; i < particles.length; i++) {
        var pt = particles[i];
        ctx.save();
        ctx.globalAlpha = pt.life / 38;
        ctx.fillStyle = pt.color;
        ctx.shadowColor = pt.color;
        ctx.shadowBlur = 5;
        ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
        ctx.restore();
    }
}

function drawStar(cx, cy, r, pts) {
    ctx.beginPath();
    for (var i = 0; i < pts * 2; i++) {
        var a = (i * Math.PI / pts) - Math.PI / 2;
        var d = i % 2 === 0 ? r : r * 0.38;
        if (i === 0) ctx.moveTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
        else ctx.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
    }
    ctx.closePath(); ctx.fill();
}

function drawHourglass(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy - r);
    ctx.lineTo(cx, cy); ctx.lineTo(cx + r, cy + r);
    ctx.lineTo(cx - r, cy + r); ctx.lineTo(cx, cy);
    ctx.closePath(); ctx.fill();
}

/* ── Main loop ────────────────────────────────── */
function loop() {
    if (!running) return;
    if (!paused) { update(); if (!running) return; draw(); }
    animId = requestAnimationFrame(loop);
}

/* ── Touch controls ───────────────────────────── */
var tx, ty, tActive = false, lastMove = 0;
var SWIPE = 14, COOLDOWN = 65;

canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; tActive = true;
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (!tActive || !running || paused) return;
    var dx = e.touches[0].clientX - tx;
    var dy = e.touches[0].clientY - ty;
    if (Math.abs(dx) < SWIPE && Math.abs(dy) < SWIPE) return;
    var now = Date.now();
    if (now - lastMove < COOLDOWN) return;
    if (Math.abs(dx) > Math.abs(dy)) movePlayer(0, dx > 0 ? 1 : -1);
    else movePlayer(dy > 0 ? 1 : -1, 0);
    lastMove = now;
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: false });

canvas.addEventListener('touchend', function(e) { e.preventDefault(); tActive = false; }, { passive: false });

/* ── Keyboard ─────────────────────────────────── */
document.addEventListener('keydown', function(e) {
    if (!running || paused) return;
    if (e.key === 'ArrowUp') { movePlayer(-1, 0); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { movePlayer(1, 0); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { movePlayer(0, -1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { movePlayer(0, 1); e.preventDefault(); }
});

/* ── Pause ────────────────────────────────────── */
pauseBtn.addEventListener('click', function() {
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : '⏸';
    if (!paused) { lastTimerTick = Date.now(); loop(); }
});

/* ── Overlay ──────────────────────────────────── */
ovBtn.addEventListener('click', startGame);

/* ── Resize ───────────────────────────────────── */
window.addEventListener('resize', function() {
    resize();
    if (running && maze) {
        CELL = Math.min(Math.floor(W / COLS), Math.floor((H - HUD_H - 12) / ROWS));
        mazeX = Math.floor((W - COLS * CELL) / 2);
        mazeY = HUD_H + Math.floor((H - HUD_H - ROWS * CELL) / 2);
        renderMazeBuffer();
    }
});

resize();
</script>
</body>
</html>
