<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Bike Rush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#1a1a2e;width:100%;height:100%;height:100dvh;overflow:hidden;font-family:'Segoe UI',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;height:100dvh;touch-action:none}
#home-btn{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:12px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:5px 12px;color:#fff;font-size:13px;text-decoration:none;z-index:60}
#ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);color:#fff;text-align:center;padding:20px;overflow-y:auto}
#ov h1{font-size:2.4rem;letter-spacing:3px;color:#ff8800;text-shadow:0 0 30px #ff8800,0 2px 0 #884400;margin-bottom:8px}
#ov p{color:#aaa;font-size:.88rem;line-height:1.6;margin-bottom:4px}
#ov button.play{margin-top:18px;padding:14px 48px;font-size:1.15rem;font-weight:bold;background:linear-gradient(180deg,#ff8800 0%,#cc5500 100%);color:#fff;border:none;border-radius:14px;cursor:pointer;box-shadow:0 4px 20px rgba(255,136,0,.5);text-transform:uppercase;letter-spacing:2px}
#ov .diff-row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;justify-content:center}
#ov .diff-btn{padding:8px 20px;border-radius:20px;font-size:.88rem;cursor:pointer;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#aaa;transition:all .2s}
#ov .diff-btn.on{background:rgba(255,136,0,.18);border-color:#ff8800;color:#ff8800}
#ov.hidden{display:none}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<a id="home-btn" href="index.html">&#8592; Accueil</a>
<div id="ov">
  <h1>BIKE RUSH</h1>
  <p style="color:#ff8800;letter-spacing:3px;font-size:.75rem;text-transform:uppercase">Highway Motorcycle</p>
  <p>Faufile-toi entre les vehicules !</p>
  <p>Glisse gauche/droite pour diriger.</p>
  <p>Recupere pieces et nitro en bonus.</p>
  <p style="color:#ff8800;font-weight:bold;margin-top:8px">&#127942; Record : <span id="rec">0</span></p>
  <div class="diff-row">
    <div class="diff-btn on" data-d="0">Facile</div>
    <div class="diff-btn" data-d="1">Normal</div>
    <div class="diff-btn" data-d="2">Difficile</div>
  </div>
  <button class="play" onclick="startGame()">RIDE</button>
</div>
<script>
(function(){
var canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
var W,H,DPR;

function resize(){
  DPR=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initRoad();
  if(player){
    player.y=H*.8;player.w=laneW*.26;player.h=laneW*.68;
    player.x=clamp(player.x);player.tx=clamp(player.tx);
  }
}

function clamp(v){if(v!==v)v=W/2;return Math.max(roadL+20,Math.min(roadR-20,v));}
function rgb(r,g,b){return 'rgb('+r+','+g+','+b+')';}
function hexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lighter(h,n){var c=hexRGB(h);return rgb(Math.min(255,c[0]+n),Math.min(255,c[1]+n),Math.min(255,c[2]+n));}
function darker(h,n){var c=hexRGB(h);return rgb(Math.max(0,c[0]-n),Math.max(0,c[1]-n),Math.max(0,c[2]-n));}

var diff=0,state='idle',score=0,hiScore=parseInt(localStorage.getItem('bikerush_best')||'0');
document.getElementById('rec').textContent=hiScore;
var player=null,obstacles=[],sparks=[],pickups=[];
var speed=0,dist=0,frame=0,kmh=0,combo=0,comboT=0;
var laneCount=3,laneW=0,roadL=0,roadR=0,roadW=0;
var touchId=null,touchStartX=0,playerStartX=0,keys={};

document.querySelectorAll('.diff-btn').forEach(function(b){
  b.onclick=function(){document.querySelectorAll('.diff-btn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');diff=+b.dataset.d;};
});

function initRoad(){roadW=Math.min(W*.7,360);roadL=(W-roadW)/2;roadR=roadL+roadW;laneW=roadW/laneCount;}

var CAR_COLORS=['#3366cc','#cc3333','#33aa33','#888888','#cc6600','#6633cc','#cc3366','#336699'];
var TRUCK_COLORS=['#555555','#774433','#335566','#445533'];

window.startGame=function(){
  initRoad();score=0;dist=0;frame=0;kmh=0;combo=0;comboT=0;
  speed=3.5+diff*.6;
  player={x:W/2,tx:W/2,y:H*.8,w:laneW*.26,h:laneW*.68,lean:0};
  obstacles=[];sparks=[];pickups=[];state='playing';
  document.getElementById('ov').classList.add('hidden');
};

function spawnObs(){
  var isTruck=Math.random()<.2,isCone=!isTruck&&Math.random()<.08;
  var lane=Math.floor(Math.random()*laneCount);
  for(var i=0;i<obstacles.length;i++){if(obstacles[i].lane===lane&&obstacles[i].y<laneW*2.5)return;}
  var w,h,col,type;
  if(isCone){w=laneW*.15;h=laneW*.15;col='#ff6600';type='cone';}
  else if(isTruck){w=laneW*.54;h=laneW*1.5;col=TRUCK_COLORS[Math.floor(Math.random()*TRUCK_COLORS.length)];type='truck';}
  else{w=laneW*.48;h=laneW*.92;col=CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)];type='car';}
  obstacles.push({type:type,lane:lane,x:roadL+laneW*(lane+.5),y:-h,w:w,h:h,col:col,spd:speed*(.38+Math.random()*.38),passed:false});
}

function spawnPickup(){
  var lane=Math.floor(Math.random()*laneCount);
  pickups.push({x:roadL+laneW*(lane+.5),y:-30,type:Math.random()<.6?'coin':'nitro',t:0});
}

function update(dt){
  if(state!=='playing')return;
  frame++;speed+=.0007*dt*(1+diff*.35);dist+=speed*dt;score=Math.floor(dist/8);
  kmh+=(speed*24-kmh)*.05*dt;
  if(comboT>0){comboT-=dt*.016;if(comboT<=0)combo=0;}

  var rate=Math.max(8,44-speed*1.8-diff*5);
  if(frame%Math.max(1,Math.round(rate))===0)spawnObs();
  if(frame%100===0)spawnPickup();

  /* movement */
  player.x+=(player.tx-player.x)*.18*dt;
  var dx=player.tx-player.x;
  player.lean+=(Math.max(-1,Math.min(1,dx/(laneW*.25)))-player.lean)*.15*dt;
  var spk=W*.014*dt;
  if(keys.ArrowLeft||keys.a)player.tx-=spk*2.5;
  if(keys.ArrowRight||keys.d)player.tx+=spk*2.5;
  player.tx=clamp(player.tx);player.x=clamp(player.x);

  /* obstacles */
  for(var i=obstacles.length-1;i>=0;i--){
    var o=obstacles[i];o.y+=(speed-o.spd)*dt;
    if(!o.passed&&o.y>player.y+player.h*.5){
      o.passed=true;score+=Math.floor(8+speed*1.5);
      if(o.type!=='cone'&&Math.abs(o.x-player.x)<(o.w+player.w)*.6){
        combo++;comboT=2;var bonus=Math.floor((15+speed*2)*combo);score+=bonus;
        for(var p=0;p<5;p++)sparks.push({x:player.x+(Math.random()-.5)*player.w,y:player.y-player.h*.3,vx:(Math.random()-.5)*3,vy:-2-Math.random()*3,l:1,d:.04,r:2+Math.random()*2,c:'#ffee00',txt:null});
        sparks.push({x:player.x,y:player.y-player.h,vx:0,vy:-1.5,l:1.3,d:.022,r:0,c:'#ffee00',txt:'NEAR MISS x'+combo+' +'+bonus});
      }
    }
    if(Math.abs(o.x-player.x)<(o.w+player.w)*.36&&Math.abs(o.y-player.y)<(o.h+player.h)*.36){die();return;}
    if(o.y>H+150)obstacles.splice(i,1);
  }

  /* pickups */
  for(var j=pickups.length-1;j>=0;j--){
    var pk=pickups[j];pk.y+=speed*.7*dt;pk.t+=.07*dt;
    if(Math.abs(pk.x-player.x)<laneW*.45&&Math.abs(pk.y-player.y)<laneW*.45){
      if(pk.type==='coin'){score+=100;sparks.push({x:pk.x,y:pk.y-15,vx:0,vy:-1.5,l:1,d:.03,r:0,c:'#ffd700',txt:'+100'});}
      else{speed+=.8;sparks.push({x:pk.x,y:pk.y-15,vx:0,vy:-1.5,l:1,d:.03,r:0,c:'#ff6600',txt:'NITRO!'});}
      for(var pp=0;pp<8;pp++){var aa=Math.random()*6.28;sparks.push({x:pk.x,y:pk.y,vx:Math.cos(aa)*3,vy:Math.sin(aa)*3,l:1,d:.04,r:3,c:pk.type==='coin'?'#ffd700':'#ff4400',txt:null});}
      pickups.splice(j,1);continue;
    }
    if(pk.y>H+40)pickups.splice(j,1);
  }

  /* exhaust */
  if(frame%3===0)sparks.push({x:player.x+(Math.random()-.5)*player.w*.3,y:player.y+player.h*.4,vx:(Math.random()-.5)*.3,vy:.8+Math.random()*.4,l:.5,d:.03,r:2+Math.random()*2,c:'rgba(160,160,160,.35)',txt:null});

  /* sparks */
  for(var k=sparks.length-1;k>=0;k--){
    var s=sparks[k];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=s.d*dt;if(!s.txt)s.r*=.985;
    if(s.l<=0)sparks.splice(k,1);
  }
}

function die(){
  state='dead';
  if(score>hiScore){hiScore=score;localStorage.setItem('bikerush_best',''+hiScore);}
  for(var i=0;i<30;i++){var a=Math.random()*6.28,sp=2+Math.random()*7;
    sparks.push({x:player.x,y:player.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,d:.015,r:3+Math.random()*5,c:['#ff8800','#ffdd00','#fff'][i%3],txt:null});}
  setTimeout(showEnd,1100);
}
function showEnd(){
  var ov=document.getElementById('ov');
  ov.innerHTML='<h1>BIKE RUSH</h1>'+
    '<p style="font-size:1.3rem;color:#ff8800;font-weight:bold;margin:6px 0">CRASH !</p>'+
    '<p style="font-size:1.4rem;margin:6px 0">Score : <strong style="color:#ff8800">'+score+'</strong></p>'+
    '<p style="color:#aaa;font-size:.85rem">Vitesse max : '+Math.floor(kmh)+' km/h</p>'+
    (score>=hiScore?'<p style="color:#ffd700;font-weight:bold">Nouveau record !</p>':'<p style="color:#888">Record : '+hiScore+'</p>')+
    '<div class="diff-row"><div class="diff-btn'+(diff===0?' on':'')+'" data-d="0">Facile</div><div class="diff-btn'+(diff===1?' on':'')+'" data-d="1">Normal</div><div class="diff-btn'+(diff===2?' on':'')+'" data-d="2">Difficile</div></div>'+
    '<button class="play" onclick="startGame()">RETRY</button>';
  ov.classList.remove('hidden');
  ov.querySelectorAll('.diff-btn').forEach(function(b){b.onclick=function(){ov.querySelectorAll('.diff-btn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');diff=+b.dataset.d;};});
}

/* ── draw ── */
function draw(){
  ctx.globalAlpha=1;

  /* night sky */
  ctx.fillStyle='#0a0a18';ctx.fillRect(0,0,W,H);

  /* guardrails */
  var grW=10;var postOff=(dist*3)%55;
  ctx.fillStyle='#555';ctx.fillRect(roadL-grW-3,0,grW,H);ctx.fillRect(roadR+3,0,grW,H);
  ctx.fillStyle='#777';
  for(var gp=0;gp<H/55+2;gp++){ctx.fillRect(roadL-grW-1,gp*55+postOff-55,grW-2,3);ctx.fillRect(roadR+5,gp*55+postOff-55,grW-2,3);}

  /* shoulder */
  ctx.fillStyle='#2a2a2a';ctx.fillRect(roadL-3,0,3,H);ctx.fillRect(roadR,0,3,H);

  /* road */
  ctx.fillStyle='#3c3c3c';ctx.fillRect(roadL,0,roadW,H);

  /* edge lines (solid white) */
  ctx.fillStyle='#ccc';ctx.fillRect(roadL,0,3,H);ctx.fillRect(roadR-3,0,3,H);

  /* lane dashes */
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2.5;
  ctx.setLineDash([laneW*.5,laneW*.5]);
  ctx.lineDashOffset=-(dist*3)%laneW;
  for(var l=1;l<laneCount;l++){var lx=roadL+l*laneW;ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,H);ctx.stroke();}
  ctx.setLineDash([]);

  /* cats eyes */
  var reOff=(dist*3)%35;ctx.fillStyle='rgba(255,200,50,.5)';
  for(var l2=1;l2<laneCount;l2++){var lx2=roadL+l2*laneW;
    for(var ry=0;ry<H/35+2;ry++)ctx.fillRect(lx2-2,ry*35+reOff-35,4,2);}

  /* obstacles */
  for(var i=0;i<obstacles.length;i++){var o=obstacles[i];
    if(o.type==='cone')drawCone(o.x,o.y,o.w,o.h);
    else drawCar(o.x,o.y,o.w,o.h,o.col,o.type==='truck');
  }

  /* pickups */
  for(var j=0;j<pickups.length;j++){
    var pk=pickups[j],bob=Math.sin(pk.t)*4;
    if(pk.type==='coin'){
      ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(pk.x,pk.y+bob,10,0,6.28);ctx.fill();
      ctx.fillStyle='#ffee66';ctx.beginPath();ctx.arc(pk.x-2,pk.y+bob-2,5,0,6.28);ctx.fill();
      ctx.strokeStyle='#aa8800';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(pk.x,pk.y+bob,10,0,6.28);ctx.stroke();
      ctx.fillStyle='#aa7700';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',pk.x,pk.y+bob+1);
    } else {
      ctx.fillStyle='#ff4400';ctx.beginPath();
      ctx.moveTo(pk.x+2,pk.y+bob-11);ctx.lineTo(pk.x+7,pk.y+bob-11);ctx.lineTo(pk.x+1,pk.y+bob+2);
      ctx.lineTo(pk.x+5,pk.y+bob+2);ctx.lineTo(pk.x-3,pk.y+bob+12);ctx.lineTo(pk.x,pk.y+bob+2);
      ctx.lineTo(pk.x-4,pk.y+bob+2);ctx.closePath();ctx.fill();
    }
  }

  /* player moto */
  if(player&&state!=='idle'){
    /* headlight beam */
    ctx.globalAlpha=.06;ctx.fillStyle='#ffffcc';
    ctx.beginPath();ctx.moveTo(player.x-player.w,player.y-player.h*.5);
    ctx.lineTo(player.x+player.w,player.y-player.h*.5);
    ctx.lineTo(player.x+player.w*2.5,player.y-player.h*4);
    ctx.lineTo(player.x-player.w*2.5,player.y-player.h*4);
    ctx.closePath();ctx.fill();ctx.globalAlpha=1;
    drawBike(player.x,player.y,player.w,player.h,player.lean);
  }

  /* sparks */
  for(var k=0;k<sparks.length;k++){
    var s=sparks[k];ctx.globalAlpha=Math.max(0,Math.min(1,s.l));
    if(s.txt){ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=s.c;ctx.fillText(s.txt,s.x,s.y);}
    else{ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,Math.max(.5,s.r),0,6.28);ctx.fill();}
  }
  ctx.globalAlpha=1;

  /* combo */
  if(combo>0&&comboT>0){
    ctx.globalAlpha=Math.min(1,comboT);ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillStyle='#ffee00';
    ctx.fillText('NEAR MISS x'+combo,W/2,H*.14);ctx.globalAlpha=1;}

  /* speed lines */
  if(state==='playing'&&speed>5.5){
    ctx.globalAlpha=Math.min(.1,(speed-5.5)/10*.1);ctx.strokeStyle='#fff';ctx.lineWidth=1;
    for(var sl=0;sl<5;sl++){var slx=roadL+Math.random()*roadW,sly=Math.random()*H;
      ctx.beginPath();ctx.moveTo(slx,sly);ctx.lineTo(slx,sly+20+speed*3);ctx.stroke();}
    ctx.globalAlpha=1;}

  /* HUD */
  var hudH=Math.max(46,H*.065);
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,hudH);
  ctx.fillStyle='#ff8800';ctx.fillRect(0,hudH-2,W,2);
  var fs=Math.round(hudH*.4);ctx.textBaseline='middle';
  ctx.textAlign='left';ctx.font='bold '+fs+'px monospace';ctx.fillStyle='#fff';ctx.fillText(''+score,55,hudH/2);
  ctx.textAlign='center';ctx.font=Math.round(fs*.55)+'px monospace';ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillText('HI '+hiScore,W/2,hudH/2);
  ctx.textAlign='right';ctx.font='bold '+fs+'px monospace';ctx.fillStyle='#ff8800';ctx.fillText(Math.floor(kmh)+'',W-45,hudH/2);
  ctx.font=Math.round(fs*.45)+'px sans-serif';ctx.fillStyle='#888';ctx.fillText('km/h',W-8,hudH/2);
  ctx.textAlign='left';ctx.font=Math.round(fs*.42)+'px sans-serif';ctx.fillStyle='#aaa';ctx.fillText(Math.floor(dist/100)+' m',10,hudH/2);
}

function drawCar(x,y,w,h,col,isTruck){
  /* shadow */
  ctx.fillStyle='rgba(0,0,0,.3)';fillRR(x-w/2+3,y-h/2+3,w,h,w*.1);

  /* body */
  ctx.fillStyle=col;fillRR(x-w/2,y-h/2,w,h,w*.1);
  ctx.fillStyle=lighter(col,30);ctx.fillRect(x-w*.35,y-h/2+2,w*.25,h-4);

  if(isTruck){ctx.fillStyle=darker(col,20);fillRR(x-w*.42,y-h*.08,w*.84,h*.48,3);}

  /* windshield */
  ctx.fillStyle='rgba(80,160,220,.55)';fillRR(x-w*.32,y-h*.3,w*.64,h*.16,3);

  /* tail lights */
  ctx.fillStyle='#ff2222';
  ctx.fillRect(x-w*.4,y+h*.37,w*.17,h*.06);ctx.fillRect(x+w*.23,y+h*.37,w*.17,h*.06);
  ctx.fillStyle='rgba(255,50,50,.12)';
  ctx.beginPath();ctx.arc(x-w*.32,y+h*.44,w*.18,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(x+w*.32,y+h*.44,w*.18,0,6.28);ctx.fill();
}

function drawCone(x,y,w,h){
  ctx.fillStyle='#333';fillRR(x-w*.5,y+h*.2,w,h*.3,2);
  ctx.fillStyle='#ff6600';ctx.beginPath();ctx.moveTo(x,y-h*.7);ctx.lineTo(x+w*.35,y+h*.2);ctx.lineTo(x-w*.35,y+h*.2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(x-w*.18,y-h*.15,w*.36,h*.18);
}

function drawBike(x,y,w,h,lean){
  ctx.save();ctx.translate(x,y);ctx.rotate(lean*.18);

  /* rear wheel */
  ctx.fillStyle='#1a1a1a';fillRR(-w*.32,h*.22,w*.64,h*.18,3);
  ctx.fillStyle='#333';ctx.fillRect(-w*.22,h*.28,w*.44,h*.03);

  /* front wheel */
  ctx.fillStyle='#1a1a1a';fillRR(-w*.28,-h*.44,w*.56,h*.16,3);
  ctx.fillStyle='#333';ctx.fillRect(-w*.18,-h*.38,w*.36,h*.03);

  /* body */
  ctx.fillStyle='#ff7700';
  ctx.beginPath();
  ctx.moveTo(0,-h*.42);ctx.lineTo(w*.28,-h*.22);ctx.lineTo(w*.34,-.02*h);
  ctx.lineTo(w*.28,h*.15);ctx.lineTo(w*.14,h*.34);ctx.lineTo(-w*.14,h*.34);
  ctx.lineTo(-w*.28,h*.15);ctx.lineTo(-w*.34,-.02*h);ctx.lineTo(-w*.28,-h*.22);
  ctx.closePath();ctx.fill();

  /* body highlight */
  ctx.fillStyle='#ff9933';ctx.fillRect(-w*.15,-h*.38,w*.12,h*.55);

  /* tank stripe */
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(-w*.04,-h*.38,w*.08,h*.42);

  /* windscreen */
  ctx.fillStyle='rgba(150,220,255,.5)';
  ctx.beginPath();ctx.moveTo(0,-h*.42);ctx.lineTo(w*.2,-h*.26);ctx.lineTo(-w*.2,-h*.26);ctx.closePath();ctx.fill();

  /* rider torso */
  ctx.fillStyle='#222';fillRR(-w*.2,-h*.08,w*.4,h*.26,3);
  /* arms */
  ctx.fillStyle='#333';ctx.fillRect(-w*.3,-h*.14,w*.12,h*.1);ctx.fillRect(w*.18,-h*.14,w*.12,h*.1);

  /* helmet */
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-h*.14,w*.22,0,6.28);ctx.fill();
  ctx.fillStyle='rgba(100,200,255,.45)';ctx.beginPath();ctx.arc(0,-h*.17,w*.14,0,Math.PI,true);ctx.fill();
  ctx.fillStyle='#ff7700';ctx.fillRect(-w*.02,-h*.22,w*.04,w*.14);

  /* headlight */
  ctx.fillStyle='rgba(255,255,220,.85)';ctx.beginPath();ctx.arc(0,-h*.42,w*.09,0,6.28);ctx.fill();

  /* tail light */
  ctx.fillStyle='#ff2222';ctx.fillRect(-w*.1,h*.33,w*.2,h*.03);

  /* exhaust */
  ctx.fillStyle='#666';ctx.fillRect(w*.2,h*.18,w*.14,h*.07);ctx.fillRect(-w*.34,h*.18,w*.14,h*.07);

  ctx.restore();
}

function fillRR(x,y,w,h,r){
  if(r>w/2)r=w/2;if(r>h/2)r=h/2;if(r<0)r=0;
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();ctx.fill();
}

/* ── input: absolute touch offset ── */
document.addEventListener('touchstart',function(e){
  if(state!=='playing'||!player)return;
  var t=e.changedTouches[0];touchId=t.identifier;touchStartX=t.clientX;playerStartX=player.tx;
  e.preventDefault();
},{passive:false});
document.addEventListener('touchmove',function(e){
  if(touchId===null||!player)return;
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===touchId){
      player.tx=playerStartX+(e.changedTouches[i].clientX-touchStartX);
      player.tx=clamp(player.tx);
    }
  }
  e.preventDefault();
},{passive:false});
document.addEventListener('touchend',function(e){
  for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===touchId)touchId=null;}
},{passive:false});
document.addEventListener('touchcancel',function(){touchId=null;},{passive:false});
document.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key.indexOf('Arrow')===0)e.preventDefault();});
document.addEventListener('keyup',function(e){keys[e.key]=false;});

/* ── loop ── */
resize();window.addEventListener('resize',resize);
var last=0;
function loop(ts){requestAnimationFrame(loop);var dt=Math.min((ts-last)/16.667,3);last=ts;update(dt);draw();}
requestAnimationFrame(function(ts){last=ts;loop(ts);});
})();
</script>
