<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Noodle Jump</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1a0a00;
    display: flex; align-items: center; justify-content: center;
    height: 100dvh; overflow: hidden;
    -webkit-user-select: none; user-select: none;
}
canvas { display: block; border-radius: 14px; box-shadow: 0 0 50px rgba(200,60,0,.4), 0 8px 30px rgba(0,0,0,.8); }
.home-btn {
    position: fixed; top: 14px; left: 14px; z-index: 99;
    padding: 8px 16px; background: rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.2); border-radius: 20px;
    color: #eee; text-decoration: none; font-size: 0.85rem;
    -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>
<a href="index.html" class="home-btn">← Accueil</a>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 420);
const H = Math.min(window.innerHeight * 0.96, W * 1.85);
canvas.width = W; canvas.height = H;

// ══════════════════════════════════════════════════
//  CONSTANTES
// ══════════════════════════════════════════════════
const GRAVITY     = 0.44;
const JUMP_NORM   = -13.8;
const JUMP_SPRING = -22;
const P_SPEED     = 5.2;
const PW = W * 0.11, PH = W * 0.13;          // taille joueur
const PLAT_H = 13;

const T_NORM   = 0;   // Bamboo normal
const T_MOVE   = 1;   // Noodle glissante
const T_BREAK  = 2;   // Fortune cookie (casse)
const T_SPRING = 3;   // Spring roll (superrebond)
const T_VANISH = 4;   // Bun vapeur (disparaît)

const PU_ROCKET = 0;  // Baguettes-fusée
const PU_SPRING = 1;  // Chili piment (super sauts)
const PU_SHIELD = 2;  // Gyoza bouclier

// ══════════════════════════════════════════════════
//  ÉTAT DU JEU
// ══════════════════════════════════════════════════
let gs = 'menu'; // 'menu' | 'play' | 'dead'
let score = 0, best = +localStorage.getItem('nj_best') || 0;
let fr = 0;

// Coordonnées monde : worldY=0 en haut, augmente vers le bas.
// Le joueur démarre en bas. Monter = worldY diminue.
// camTop = worldY du haut de l'écran (diminue quand on monte).
const START_Y = H - 80;
let camTop = 0;

let P   = {};                // joueur
let plats = [], pups = [], enems = [], parts = [], bubbls = [];
let nextGenY = 0;

// Eau bouillante
let waterY = 0, waterSpd = 0, waveOff = 0;
let shakeFrames = 0;

// Input
let inputL = false, inputR = false, tiltX = 0;

// ══════════════════════════════════════════════════
//  DÉCOR FIXE (lanernes + bambous)
// ══════════════════════════════════════════════════
const LANTERNS = Array.from({length: 30}, (_, i) => ({
    x: 8 + Math.random() * (W - 16),
    worldY: -(Math.random() * 300000),
    col: ['#e74c3c','#f39c12','#c0392b','#ff8f00','#d81b60'][i % 5],
    sz: 13 + Math.random() * 11,
    sw: Math.random() * Math.PI * 2,
}));

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
function initGame() {
    fr = 0; score = 0; shakeFrames = 0;
    camTop = START_Y - H + 60;

    P = {
        x: W / 2, worldY: START_Y - PH,
        vx: 0, vy: JUMP_NORM,
        pup: null, pupTimer: 0,
        springLeft: 0,
        shield: false, alive: true,
        facing: 1, squish: 1, squishVel: 0,
        highY: START_Y - PH,   // lowest worldY reached
        rocketFlame: 0,
    };

    plats = []; pups = []; enems = []; parts = []; bubbls = [];
    plats.push(mkPlat(W / 2 - 46, START_Y, 92, T_NORM));
    nextGenY = START_Y;
    genPlats(START_Y - H * 12);

    waterY   = START_Y + 700;
    waterSpd = 0.16;
}

// ══════════════════════════════════════════════════
//  GÉNÉRATION DE PLATEFORMES
// ══════════════════════════════════════════════════
function mkPlat(x, worldY, w, type) {
    return { x, worldY, w, h: PLAT_H, type,
             vx: type === T_MOVE ? (Math.random() > .5 ? 1.6 : -1.6) : 0,
             broken: false, alpha: 1, vanishTimer: 0,
             visible: true, bounced: false, pup: null };
}

function genPlats(untilY) {
    let y = nextGenY;
    while (y > untilY) {
        const hf  = Math.min(1, (START_Y - y) / 25000); // 0→1 difficulty
        const gap = 52 + hf * 65 + Math.random() * 28;
        y -= gap;
        const pw = Math.max(50, 88 - hf * 38);
        const px = 6 + Math.random() * (W - pw - 12);

        let type = T_NORM;
        const r = Math.random();
        if      (hf < 0.25) { if (r<.10) type=T_MOVE; else if (r<.13) type=T_SPRING; else if (r<.16) type=T_BREAK; }
        else if (hf < 0.55) { if (r<.18) type=T_MOVE; else if (r<.25) type=T_SPRING; else if (r<.33) type=T_BREAK; else if (r<.37) type=T_VANISH; }
        else                { if (r<.24) type=T_MOVE; else if (r<.31) type=T_SPRING; else if (r<.42) type=T_BREAK; else if (r<.50) type=T_VANISH; }

        const p = mkPlat(px, y, pw, type);

        // Power-up
        if (Math.random() < 0.10) {
            const r2 = Math.random();
            p.pup = r2 < .40 ? PU_ROCKET : r2 < .70 ? PU_SPRING : PU_SHIELD;
        }
        plats.push(p);

        // Ennemi
        if (hf > 0.18 && Math.random() < 0.07) {
            enems.push({
                x: Math.random() * (W - 36), worldY: y - 28, w: 36, h: 22,
                vx: (Math.random() > .5 ? 1 : -1) * (1.4 + Math.random()),
                alive: true, anim: Math.random() * Math.PI * 2,
            });
        }
    }
    nextGenY = y;
}

// ══════════════════════════════════════════════════
//  UPDATE
// ══════════════════════════════════════════════════
function update() {
    if (gs !== 'play') return;
    fr++;

    // Générer si besoin
    if (nextGenY > camTop - H * 3) genPlats(camTop - H * 4);

    // ── Eau ──
    const heightProgress = Math.max(0, (START_Y - P.highY) / 20000);
    waterSpd = 0.16 + heightProgress * 0.7;
    waterY  -= waterSpd;
    waveOff += 0.05;

    // Bulles
    if (fr % 6 === 0) {
        const bx = waterY - camTop;
        if (bx < H + 60) {
            bubbls.push({ x: 10 + Math.random() * (W - 20), y: waterY + 5,
                          vy: -(0.8 + Math.random() * 1.5), r: 2 + Math.random() * 4, alpha: 1 });
        }
    }
    for (let b of bubbls) { b.y += b.vy; b.alpha -= 0.012; }
    bubbls = bubbls.filter(b => b.alpha > 0);

    // ── Mouvements plateformes ──
    for (let p of plats) {
        if (p.type === T_MOVE) {
            p.x += p.vx;
            if (p.x <= 0 || p.x + p.w >= W) p.vx *= -1;
        }
        if (p.type === T_VANISH && p.vanishTimer > 0) {
            p.vanishTimer--;
            p.alpha = p.vanishTimer / 45;
        }
    }

    // ── Input joueur ──
    let ax = 0;
    if (inputL) ax = -1;
    if (inputR) ax =  1;
    if (Math.abs(tiltX) > 5) ax = tiltX / 30;
    P.vx = ax * P_SPEED;

    // ── Physique joueur ──
    if (P.pup === PU_ROCKET) {
        P.vy = -17; // monte en flèche
        P.rocketFlame = (P.rocketFlame + 1) % 8;
        P.pupTimer--;
        if (P.pupTimer <= 0) P.pup = null;
        spawnPart(P.x, P.worldY + PH, '#ff6b00', 3);
        spawnPart(P.x, P.worldY + PH, '#ffd93d', 2);
    } else {
        P.vy += GRAVITY;
    }

    if (P.pup === PU_SHIELD) {
        P.pupTimer--;
        if (P.pupTimer <= 0) { P.pup = null; P.shield = false; }
    }

    P.worldY += P.vy;
    P.x      += P.vx;

    // Wrap horizontal
    if (P.x < -PW / 2) P.x = W + PW / 2;
    if (P.x > W + PW / 2) P.x = -PW / 2;

    if (P.vx > 0.1) P.facing =  1;
    if (P.vx < -0.1) P.facing = -1;

    // Squish animation
    P.squish   += P.squishVel;
    P.squishVel = P.squish > 1 ? (1 - P.squish) * 0.3 : P.squishVel * 0.85;
    P.squish    = Math.max(0.7, Math.min(1.35, P.squish));

    // ── Collision plateformes ──
    if (P.vy > 0) {
        for (let p of plats) {
            if (!p.visible && p.type !== T_VANISH) continue;
            if (p.type === T_VANISH && p.vanishTimer > 0 && p.alpha < 0.15) continue;
            if (p.broken) continue;
            const prevBot = P.worldY + PH - P.vy;
            const curBot  = P.worldY + PH;
            if (prevBot <= p.worldY + P.vy + 2 && curBot >= p.worldY &&
                P.x + PW * 0.42 > p.x && P.x - PW * 0.42 < p.x + p.w) {
                bounce(p);
                break;
            }
        }
    }

    // ── Collision ennemis ──
    for (let e of enems) {
        if (!e.alive) continue;
        e.x  += e.vx;
        e.anim += 0.12;
        if (e.x <= 0 || e.x + e.w >= W) e.vx *= -1;
        const es = P.worldY + PH - e.worldY;
        if (es > 0 && es < e.h && P.x + PW*0.4 > e.x && P.x - PW*0.4 < e.x + e.w) {
            if (P.vy > 0 && P.worldY + PH < e.worldY + e.h * 0.5) {
                // Saute sur l'ennemi
                e.alive = false;
                P.vy = JUMP_NORM * 0.8;
                for (let i = 0; i < 8; i++) spawnPart(e.x + e.w/2, e.worldY, '#ff6b00', 4);
            } else if (P.pup === PU_ROCKET) {
                e.alive = false; // fusée détruit l'ennemi sans dommage
                for (let i = 0; i < 8; i++) spawnPart(e.x + e.w/2, e.worldY, '#ff6b00', 4);
            } else if (P.shield) {
                e.alive = false; P.shield = false; P.pup = null;
            } else {
                killPlayer();
                return;
            }
        }
    }
    enems = enems.filter(e => e.alive || fr - (e.dieFrame || fr) < 20);

    // ── Collision eau ──
    const waterScreenY = waterY - camTop;
    const playerScreenY = P.worldY - camTop;
    if (playerScreenY + PH >= waterScreenY) {
        if (P.pup === PU_ROCKET) { waterY -= 100; } // fusée repousse l'eau
        else if (P.shield) { P.shield = false; P.pup = null; P.vy = JUMP_NORM; waterY -= 80; }
        else { killPlayer(); return; }
    }

    // ── Tombe hors écran bas ──
    if (P.worldY - camTop > H + 100) {
        if (P.pup === PU_ROCKET) { /* fusée = on ne peut pas tomber */ }
        else { killPlayer(); return; }
    }

    // ── Camera ──
    if (P.worldY < P.highY) P.highY = P.worldY;
    const targetCam = P.highY - H * 0.38;
    if (targetCam < camTop) camTop = targetCam;

    // Score
    score = Math.floor((START_Y - P.highY) / 55);

    // Nettoyage
    const cullY = camTop + H + 200;
    plats = plats.filter(p => p.worldY < cullY);
    enems = enems.filter(e => e.worldY < cullY);

    // Particules
    for (let p2 of parts) { p2.x += p2.vx; p2.y += p2.vy; p2.vy += 0.15; p2.life--; p2.alpha = p2.life / p2.maxLife; }
    parts = parts.filter(p2 => p2.life > 0);

    if (shakeFrames > 0) shakeFrames--;
}

function bounce(p) {
    let jumpForce = JUMP_NORM;
    if (p.type === T_SPRING || P.springLeft > 0) { jumpForce = JUMP_SPRING; if (P.springLeft > 0) P.springLeft--; }
    if (p.type === T_BREAK)  { p.broken = true; p.visible = false; for (let i=0;i<5;i++) spawnPart(p.x+p.w/2, p.worldY, '#f39c12', 5); }
    if (p.type === T_VANISH && p.vanishTimer === 0) p.vanishTimer = 45;

    P.vy = jumpForce;
    P.worldY = p.worldY - PH;
    P.squish = 0.72; P.squishVel = 0.15;
    for (let i = 0; i < 4; i++) spawnPart(P.x + (Math.random()-0.5)*PW, P.worldY + PH, '#fff', 2);

    // Ramasser power-up
    if (p.pup !== null) { activatePup(p.pup); p.pup = null; }
}

function activatePup(type) {
    P.pup = type;
    if (type === PU_ROCKET)  { P.pupTimer = 140; P.vy = -18; }
    if (type === PU_SPRING)  { P.pupTimer = 100; P.springLeft = 5; }
    if (type === PU_SHIELD)  { P.pupTimer = 500; P.shield = true; }
    shakeFrames = 8;
    for (let i = 0; i < 12; i++) spawnPart(P.x, P.worldY, ['#ffd93d','#ff6b00','#6bff8e'][type], 5);
}

function spawnPart(x, worldY, col, spd) {
    parts.push({ x, y: worldY, vx: (Math.random()-0.5)*spd*2, vy: -Math.random()*spd,
                 col, life: 20 + Math.random()*20, maxLife: 40, alpha: 1 });
}

function killPlayer() {
    if (!P.alive) return;
    P.alive = false;
    if (score > best) { best = score; localStorage.setItem('nj_best', best); }
    gs = 'dead';
    for (let i = 0; i < 20; i++) spawnPart(P.x, P.worldY, '#ffd93d', 6);
}

// ══════════════════════════════════════════════════
//  DESSIN
// ══════════════════════════════════════════════════
function draw() {
    const shake = shakeFrames > 0 ? (Math.random()-0.5) * 4 : 0;
    ctx.save();
    if (shake) ctx.translate(shake, shake * 0.5);

    drawBackground();
    drawLanterns();
    if (gs === 'play' || gs === 'dead') {
        drawPlats();
        drawEnems();
        drawParts();
        drawPlayer();
        drawWater();
        drawHUD();
    }
    if (gs === 'menu') drawMenu();
    if (gs === 'dead')  drawDead();

    ctx.restore();
}

// ── Background ─────────────────────────────────────────────────
function drawBackground() {
    const scrollRatio = Math.max(0, -camTop / 30000);
    // Ciel de cuisine chinoise : du rouge sombre en bas au bleu nuit en haut
    const gSky = ctx.createLinearGradient(0, 0, 0, H);
    gSky.addColorStop(0,   `hsl(${220 - scrollRatio*60},${40+scrollRatio*20}%,${8+scrollRatio*5}%)`);
    gSky.addColorStop(0.6, `hsl(${20-scrollRatio*10},${55}%,${12}%)`);
    gSky.addColorStop(1,   `hsl(${10},${60}%,${14}%)`);
    ctx.fillStyle = gSky;
    ctx.fillRect(0, 0, W, H);

    // Motif mur carrelage chinois subtil
    ctx.strokeStyle = 'rgba(255,180,60,.04)';
    ctx.lineWidth = 1;
    const tileSize = W * 0.12;
    for (let tx = 0; tx < W; tx += tileSize)     ctx.strokeRect(tx, 0, tileSize, H);
    for (let ty = -camTop % tileSize; ty < H; ty += tileSize) ctx.strokeRect(0, ty, W, tileSize);

    // Vapeur en fond (colonnes montantes)
    ctx.fillStyle = 'rgba(255,200,150,.03)';
    for (let i = 0; i < 5; i++) {
        const sx = (i * W/5 + fr * 0.3) % W;
        const sy = (fr * 0.5 + i * 40) % (H + 100) - 50;
        ctx.beginPath();
        ctx.ellipse(sx, sy, W*0.06, H*0.12, 0, 0, Math.PI*2);
        ctx.fill();
    }
}

// ── Lanternes chinoises ────────────────────────────────────────
function drawLanterns() {
    for (let l of LANTERNS) {
        const sy = l.worldY - camTop;
        if (sy < -60 || sy > H + 60) continue;
        const swing = Math.sin(fr * 0.018 + l.sw) * 6;
        const x = l.x + swing;
        ctx.save();
        ctx.translate(x, sy);
        // Corde
        ctx.strokeStyle = 'rgba(180,140,60,.6)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, -l.sz); ctx.lineTo(0, -l.sz * 1.5); ctx.stroke();
        // Corps lanterne
        const gL = ctx.createRadialGradient(-l.sz*.2, 0, 0, 0, 0, l.sz);
        gL.addColorStop(0, '#fff');
        gL.addColorStop(0.3, l.col);
        gL.addColorStop(1, shadeColor(l.col, -40));
        ctx.fillStyle = gL;
        ctx.beginPath();
        ctx.ellipse(0, 0, l.sz * 0.55, l.sz, 0, 0, Math.PI*2);
        ctx.fill();
        // Rayures
        ctx.strokeStyle = 'rgba(0,0,0,.15)';
        ctx.lineWidth = 0.8;
        for (let ri = -2; ri <= 2; ri++) {
            ctx.beginPath(); ctx.moveTo(-l.sz*.5, ri * l.sz*.22);
            ctx.lineTo(l.sz*.5, ri * l.sz*.22); ctx.stroke();
        }
        // Décor doré
        ctx.fillStyle = '#ffd93d';
        ctx.fillRect(-l.sz*.5, -l.sz*.08, l.sz, l.sz*.16);
        // Pompon
        ctx.fillStyle = '#ffd93d';
        ctx.beginPath(); ctx.arc(0, l.sz + 4, 4, 0, Math.PI*2); ctx.fill();
        const lines = 6;
        ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 1;
        for (let li = 0; li < lines; li++) {
            const a = (li / lines) * Math.PI * 2;
            ctx.beginPath(); ctx.moveTo(0, l.sz + 4);
            ctx.lineTo(Math.cos(a)*7, l.sz + 4 + Math.sin(a)*7); ctx.stroke();
        }
        ctx.restore();
    }
}

// ── Plateformes ────────────────────────────────────────────────
function drawPlats() {
    for (let p of plats) {
        if (p.broken) continue;
        const sy = p.worldY - camTop;
        if (sy > H + 20 || sy < -20) continue;
        ctx.globalAlpha = p.alpha;
        ctx.save();

        if (p.type === T_NORM) {
            // Bambou – vert-brun avec nœuds
            const g = ctx.createLinearGradient(p.x, sy, p.x, sy + p.h);
            g.addColorStop(0, '#8B6914'); g.addColorStop(1, '#5D4307');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.roundRect(p.x, sy, p.w, p.h, 5); ctx.fill();
            // Nœuds bambou
            ctx.fillStyle = '#6B4F0E';
            const knots = Math.floor(p.w / 22);
            for (let k = 0; k < knots; k++) {
                ctx.fillRect(p.x + k * (p.w / knots) + p.w/knots/2 - 2, sy - 1, 4, p.h + 2);
            }
            // Brillance
            ctx.fillStyle = 'rgba(255,220,100,.2)';
            ctx.beginPath(); ctx.roundRect(p.x + 2, sy + 1, p.w - 4, p.h * 0.4, 3); ctx.fill();
        }
        else if (p.type === T_MOVE) {
            // Noodle ondulante – beige/doré avec vagues
            const g = ctx.createLinearGradient(p.x, sy, p.x, sy + p.h);
            g.addColorStop(0, '#f5d79e'); g.addColorStop(1, '#d4a84b');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.roundRect(p.x, sy, p.w, p.h, 6); ctx.fill();
            // Vagues (noodles)
            ctx.strokeStyle = 'rgba(180,120,20,.5)'; ctx.lineWidth = 1.5;
            for (let ni = 0; ni < 3; ni++) {
                ctx.beginPath();
                for (let nx = p.x; nx <= p.x + p.w; nx += 3) {
                    const ny = sy + p.h*0.4 + ni*3 + Math.sin((nx + fr*2 + ni*30) * 0.2) * 2;
                    ni === 0 && nx === p.x ? ctx.moveTo(nx, ny) : ctx.lineTo(nx, ny);
                }
                ctx.stroke();
            }
        }
        else if (p.type === T_BREAK) {
            // Fortune cookie – orange avec fissures si touchée
            const g = ctx.createLinearGradient(p.x, sy, p.x, sy + p.h);
            g.addColorStop(0, '#f39c12'); g.addColorStop(1, '#e67e22');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.roundRect(p.x, sy, p.w, p.h, 5); ctx.fill();
            if (p.bounced) {
                ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(p.x + p.w*0.3, sy); ctx.lineTo(p.x + p.w*0.4, sy + p.h);
                ctx.moveTo(p.x + p.w*0.6, sy); ctx.lineTo(p.x + p.w*0.55, sy + p.h);
                ctx.stroke();
            }
            ctx.fillStyle = 'rgba(255,255,255,.25)';
            ctx.beginPath(); ctx.roundRect(p.x+2, sy+2, p.w-4, p.h*0.35, 3); ctx.fill();
        }
        else if (p.type === T_SPRING) {
            // Spring roll – vert brillant avec ressort
            const g = ctx.createLinearGradient(p.x, sy, p.x, sy + p.h);
            g.addColorStop(0, '#27ae60'); g.addColorStop(1, '#1a7a44');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.roundRect(p.x, sy, p.w, p.h, 5); ctx.fill();
            // Petits cercles = texture rouleau
            ctx.fillStyle = 'rgba(255,255,255,.15)';
            for (let ci = 0; ci < Math.floor(p.w/14); ci++)
                { ctx.beginPath(); ctx.arc(p.x+8+ci*14, sy+p.h/2, 4, 0, Math.PI*2); ctx.fill(); }
            // Ressort visuel
            ctx.strokeStyle = '#6bff8e'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p.x + p.w/2 - 10, sy);
            for (let si = 0; si <= 20; si++) {
                const sx2 = p.x + p.w/2 - 10 + si;
                ctx.lineTo(sx2, sy + (si%2===0 ? 0 : -5));
            }
            ctx.stroke();
        }
        else if (p.type === T_VANISH) {
            // Bun vapeur – blanc nuageux
            ctx.fillStyle = `rgba(240,240,240,${p.alpha})`;
            ctx.beginPath(); ctx.roundRect(p.x, sy, p.w, p.h, 7); ctx.fill();
            ctx.fillStyle = `rgba(200,200,200,${p.alpha * 0.5})`;
            for (let pi = 0; pi < 3; pi++)
                { ctx.beginPath(); ctx.ellipse(p.x + p.w*0.25 + pi*p.w*0.25, sy+p.h/2, p.w*0.12, p.h*0.35, 0, 0, Math.PI*2); ctx.fill(); }
        }

        // Power-up posé sur la plateforme
        if (p.pup !== null) drawPup(p.x + p.w/2, sy - 22, p.pup);
        ctx.restore();
        ctx.globalAlpha = 1;
    }
}

function drawPup(x, sy, type) {
    const bob = Math.sin(fr * 0.06 + x) * 3;
    ctx.save();
    ctx.translate(x, sy + bob);
    // Halo
    ctx.fillStyle = type === PU_ROCKET ? 'rgba(255,107,0,.2)' :
                    type === PU_SPRING ? 'rgba(255,50,50,.2)' : 'rgba(107,255,142,.2)';
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();

    if (type === PU_ROCKET) {
        // Baguettes-fusée
        ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(2, -8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8, 8); ctx.lineTo(-2, -8); ctx.stroke();
        ctx.fillStyle = '#ff6b00';
        ctx.beginPath(); ctx.moveTo(-5, -8); ctx.lineTo(5, -8); ctx.lineTo(0, -16); ctx.closePath(); ctx.fill();
    } else if (type === PU_SPRING) {
        // Piment chili
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.ellipse(0, 3, 5, 10, -0.3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#27ae60';
        ctx.beginPath(); ctx.moveTo(0, -7); ctx.quadraticCurveTo(8, -12, 6, -6); ctx.stroke();
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(-1, -10, 2, 5);
    } else {
        // Gyoza bouclier
        ctx.fillStyle = '#f5f5dc';
        ctx.beginPath(); ctx.ellipse(0, 2, 11, 8, 0, 0, Math.PI); ctx.fill();
        ctx.fillStyle = '#ddd';
        ctx.beginPath(); ctx.ellipse(0, 2, 11, 8, 0, Math.PI, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(107,255,142,.8)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
}

// ── Ennemis (crevettes) ─────────────────────────────────────────
function drawEnems() {
    for (let e of enems) {
        if (!e.alive) continue;
        const sy = e.worldY - camTop;
        if (sy < -40 || sy > H + 40) continue;
        ctx.save();
        ctx.translate(e.x + e.w/2, sy + e.h/2);
        if (e.vx < 0) ctx.scale(-1, 1);

        // Corps crevette – courbe orange
        const g = ctx.createLinearGradient(-e.w/2, 0, e.w/2, 0);
        g.addColorStop(0, '#e74c3c'); g.addColorStop(1, '#f39c12');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(-e.w/2, 0);
        ctx.quadraticCurveTo(0, -e.h*0.8, e.w/2, 0);
        ctx.quadraticCurveTo(e.w*0.3, e.h*0.5, 0, e.h*0.3);
        ctx.quadraticCurveTo(-e.w*0.3, e.h*0.5, -e.w/2, 0);
        ctx.fill();
        // Œil
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(e.w*0.3, -e.h*0.1, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(e.w*0.32, -e.h*0.1, 2, 0, Math.PI*2); ctx.fill();
        // Pattes animées
        ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.2;
        for (let li = 0; li < 4; li++) {
            const la = Math.sin(e.anim + li * 0.8) * 0.4;
            ctx.save(); ctx.translate(-e.w*0.1 + li * e.w*0.1, e.h*0.2);
            ctx.rotate(la); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, 8); ctx.stroke();
            ctx.restore();
        }
        ctx.restore();
    }
}

// ── Joueur : bol de nouilles ────────────────────────────────────
function drawPlayer() {
    const sy = P.worldY - camTop;
    if (sy > H + 80 || sy < -100) return;
    ctx.save();
    ctx.translate(P.x, sy + PH/2);
    ctx.scale(P.facing, 1);
    ctx.scale(P.squish < 1 ? 1 + (1 - P.squish)*0.5 : 1, P.squish);

    // Fusée active → flammes
    if (P.pup === PU_ROCKET) {
        const fl = 8 + Math.sin(fr * 0.5) * 4;
        ctx.fillStyle = '#ff6b00';
        ctx.beginPath(); ctx.moveTo(-10, PH*0.4); ctx.lineTo(0, PH*0.4+fl); ctx.lineTo(10, PH*0.4); ctx.fill();
        ctx.fillStyle = '#ffd93d';
        ctx.beginPath(); ctx.moveTo(-5, PH*0.4); ctx.lineTo(0, PH*0.4+fl*0.6); ctx.lineTo(5, PH*0.4); ctx.fill();
        // Baguettes sur les côtés
        ctx.strokeStyle = '#5D2E0C'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-PW*0.5, -PH*0.1); ctx.lineTo(-PW*0.75, -PH*0.5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo( PW*0.5, -PH*0.1); ctx.lineTo( PW*0.75, -PH*0.5); ctx.stroke();
    }

    // Bouclier actif
    if (P.shield) {
        ctx.strokeStyle = `rgba(107,255,142,${0.5 + Math.sin(fr*0.15)*0.4})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(0, 0, PW*0.7, PH*0.7, 0, 0, Math.PI*2); ctx.stroke();
    }

    // ── Bol ──
    const bowl_y = PH * 0.12;
    // Fond du bol (ellipse de base)
    ctx.fillStyle = '#b5651d';
    ctx.beginPath(); ctx.ellipse(0, bowl_y + PH*0.35, PW*0.48, PH*0.14, 0, 0, Math.PI*2); ctx.fill();
    // Corps du bol (trapèze arrondi)
    const gBowl = ctx.createLinearGradient(-PW*0.5, bowl_y - PH*0.2, PW*0.5, bowl_y + PH*0.3);
    gBowl.addColorStop(0, '#e8a87c'); gBowl.addColorStop(1, '#c27a3a');
    ctx.fillStyle = gBowl;
    ctx.beginPath();
    ctx.moveTo(-PW*0.5, bowl_y + PH*0.3);
    ctx.bezierCurveTo(-PW*0.5, bowl_y + PH*0.42, -PW*0.42, bowl_y + PH*0.45, 0, bowl_y + PH*0.45);
    ctx.bezierCurveTo( PW*0.42, bowl_y + PH*0.45, PW*0.5, bowl_y + PH*0.42, PW*0.5, bowl_y + PH*0.3);
    ctx.lineTo(PW*0.38, bowl_y - PH*0.2);
    ctx.bezierCurveTo(PW*0.38, bowl_y - PH*0.25, -PW*0.38, bowl_y - PH*0.25, -PW*0.38, bowl_y - PH*0.2);
    ctx.closePath();
    ctx.fill();
    // Bord supérieur du bol
    ctx.fillStyle = '#d4956a';
    ctx.beginPath(); ctx.ellipse(0, bowl_y - PH*0.2, PW*0.38, PH*0.09, 0, 0, Math.PI*2); ctx.fill();
    // Motif déco sur le bol
    ctx.strokeStyle = 'rgba(180,80,20,.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-PW*0.38, bowl_y + PH*0.05); ctx.lineTo(PW*0.38, bowl_y + PH*0.05); ctx.stroke();
    // Reflet
    ctx.fillStyle = 'rgba(255,220,180,.25)';
    ctx.beginPath(); ctx.ellipse(-PW*0.12, bowl_y + PH*0.05, PW*0.1, PH*0.2, -0.4, 0, Math.PI*2); ctx.fill();

    // ── Bouillon / fond rouge ──
    ctx.fillStyle = '#c0392b';
    ctx.beginPath(); ctx.ellipse(0, bowl_y - PH*0.18, PW*0.32, PH*0.08, 0, 0, Math.PI*2); ctx.fill();

    // ── Nouilles animées ──
    ctx.lineWidth = 2.8; ctx.lineCap = 'round';
    const noodleColors = ['#f5d89a','#f0c060','#e8b040','#fff5cc'];
    for (let ni = 0; ni < 5; ni++) {
        ctx.strokeStyle = noodleColors[ni % 4];
        const baseX = (ni - 2) * PW * 0.13;
        const baseY = bowl_y - PH * 0.18;
        const ht    = PH * (0.22 + ni * 0.04);
        const wave  = Math.sin(fr * 0.08 + ni * 1.2) * 3;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.quadraticCurveTo(baseX + wave, baseY - ht*0.5, baseX + wave*0.5, baseY - ht);
        ctx.stroke();
    }

    // ── Yeux ──
    const eyeY = bowl_y - PH * 0.08;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-PW*0.14, eyeY, PW*0.1, PH*0.1, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( PW*0.14, eyeY, PW*0.1, PH*0.1, 0, 0, Math.PI*2); ctx.fill();
    // Pupilles (regardent dans la direction de vy)
    const pd = P.vy < 0 ? -2 : 2;
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(-PW*0.14+1, eyeY+pd, PW*0.05, PH*0.06, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( PW*0.14+1, eyeY+pd, PW*0.05, PH*0.06, 0, 0, Math.PI*2); ctx.fill();
    // Reflets
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-PW*0.12, eyeY+pd-2, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( PW*0.16, eyeY+pd-2, 2, 0, Math.PI*2); ctx.fill();
    // Joues roses
    ctx.fillStyle = 'rgba(255,120,120,.35)';
    ctx.beginPath(); ctx.ellipse(-PW*0.24, eyeY+PH*0.06, PW*0.1, PH*0.07, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( PW*0.24, eyeY+PH*0.06, PW*0.1, PH*0.07, 0, 0, Math.PI*2); ctx.fill();
    // Bouche
    ctx.strokeStyle = '#8B3A0A'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, eyeY + PH*0.12, PW*0.08, 0.2, Math.PI - 0.2);
    ctx.stroke();

    ctx.restore();
}

// ── Eau bouillante ─────────────────────────────────────────────
function drawWater() {
    const wy = waterY - camTop;
    if (wy > H + 40) return;

    // Avertissement si eau proche
    const dist = wy - (P.worldY - camTop + PH);
    if (dist < H * 0.35 && dist > 0) {
        const alpha = (1 - dist / (H * 0.35)) * 0.4;
        ctx.fillStyle = `rgba(200,30,0,${alpha})`;
        ctx.fillRect(0, 0, W, H);
        // Texte avertissement
        if (Math.floor(fr / 20) % 2 === 0) {
            ctx.fillStyle = `rgba(255,100,0,${alpha * 2})`;
            ctx.font = `bold ${W*0.06}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('💧 L\'EAU MONTE !', W/2, H - 60);
        }
    }

    // Eau sous la surface
    const gWater = ctx.createLinearGradient(0, wy, 0, H);
    gWater.addColorStop(0,   'rgba(200,30,0,.92)');
    gWater.addColorStop(0.3, 'rgba(180,20,0,.95)');
    gWater.addColorStop(1,   'rgba(120,10,0,1)');
    ctx.fillStyle = gWater;
    ctx.fillRect(0, wy, W, H - wy);

    // Surface ondulée
    ctx.fillStyle = 'rgba(255,80,20,.85)';
    ctx.beginPath();
    ctx.moveTo(0, wy);
    const steps = 20;
    for (let i = 0; i <= steps; i++) {
        const wx = i * W / steps;
        const wh = Math.sin(wx * 0.04 + waveOff) * 5 + Math.sin(wx * 0.07 - waveOff * 1.3) * 3;
        ctx.lineTo(wx, wy + wh);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

    // Bulles dans l'eau
    ctx.fillStyle = 'rgba(255,150,50,.6)';
    for (let b of bubbls) {
        const bsy = b.y - camTop;
        if (bsy < wy || bsy > H) continue;
        ctx.globalAlpha = b.alpha * 0.7;
        ctx.beginPath(); ctx.arc(b.x, bsy, b.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Bulles à la surface
    for (let i = 0; i < 8; i++) {
        const bx = (i * W/8 + fr * 1.5 + i * 40) % W;
        const ba = 0.4 + Math.sin(fr * 0.1 + i) * 0.3;
        ctx.globalAlpha = ba;
        ctx.fillStyle = '#ff8c00';
        ctx.beginPath(); ctx.arc(bx, wy + 4, 3 + Math.sin(fr*0.15+i)*2, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Vapeur au dessus de l'eau
    for (let i = 0; i < 5; i++) {
        const vx = (i * W/5 + fr * 0.8 + i * 30) % W;
        const vy2 = wy - 20 - (fr * 0.5 + i * 15) % 60;
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(vx, vy2, 15, 20, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ── Particules ──────────────────────────────────────────────────
function drawParts() {
    for (let p2 of parts) {
        const sy = p2.y - camTop;
        ctx.globalAlpha = p2.alpha;
        ctx.fillStyle = p2.col;
        ctx.beginPath(); ctx.arc(p2.x, sy, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ── HUD ─────────────────────────────────────────────────────────
function drawHUD() {
    // Score
    ctx.textAlign = 'right';
    ctx.font = `bold ${W*0.058}px 'Segoe UI', Arial`;
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4;
    ctx.strokeText(`🍜 ${score}m`, W - 12, 38);
    ctx.fillStyle = '#ffd93d';
    ctx.fillText(`🍜 ${score}m`, W - 12, 38);

    // Best
    ctx.font = `${W*0.038}px Arial`;
    ctx.fillStyle = 'rgba(255,217,61,.7)';
    ctx.strokeText(`🏆 ${best}m`, W - 12, 60);
    ctx.fillText(`🏆 ${best}m`, W - 12, 60);

    // Power-up actif
    if (P.pup !== null) {
        const icons = ['🥢','🌶️','🥟'];
        const pct = P.pup === PU_ROCKET ? P.pupTimer/140 :
                    P.pup === PU_SPRING ? P.springLeft/5 : P.pupTimer/500;
        ctx.textAlign = 'left';
        ctx.font = `${W*0.07}px Arial`;
        ctx.fillText(icons[P.pup], 12, 42);
        // Barre de durée
        ctx.fillStyle = 'rgba(0,0,0,.4)';
        ctx.beginPath(); ctx.roundRect(12, 48, 50, 6, 3); ctx.fill();
        ctx.fillStyle = ['#ff6b00','#e74c3c','#6bff8e'][P.pup];
        ctx.beginPath(); ctx.roundRect(12, 48, 50 * pct, 6, 3); ctx.fill();
    }

    // Boutons gauche/droite
    drawBtn(0,     H - 100, W*0.35, 90, '◀', inputL);
    drawBtn(W*0.65, H - 100, W*0.35, 90, '▶', inputR);
}

function drawBtn(x, y, w, h, label, active) {
    ctx.fillStyle = active ? 'rgba(255,180,50,.35)' : 'rgba(255,255,255,.1)';
    ctx.beginPath(); ctx.roundRect(x+4, y+4, w-8, h-8, 16); ctx.fill();
    ctx.strokeStyle = active ? 'rgba(255,180,50,.6)' : 'rgba(255,255,255,.15)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(x+4, y+4, w-8, h-8, 16); ctx.stroke();
    ctx.fillStyle = active ? '#ffd93d' : 'rgba(255,255,255,.4)';
    ctx.font = `bold ${W*0.07}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(label, x + w/2, y + h/2 + 8);
}

// ── Menu ────────────────────────────────────────────────────────
function drawMenu() {
    // Fond
    const gM = ctx.createLinearGradient(0, 0, 0, H);
    gM.addColorStop(0, '#1a0800'); gM.addColorStop(1, '#3a1200');
    ctx.fillStyle = gM; ctx.fillRect(0, 0, W, H);
    drawLanterns();

    // Titre
    ctx.textAlign = 'center';
    ctx.font = `bold ${W*0.13}px 'Segoe UI', Arial`;
    ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 6;
    ctx.strokeText('🍜', W/2, H * 0.18);
    ctx.fillStyle = '#ffd93d';
    ctx.fillText('🍜', W/2, H * 0.18);

    ctx.font = `bold ${W*0.095}px 'Segoe UI', Arial`;
    ctx.strokeStyle = '#7B1A00'; ctx.lineWidth = 5;
    ctx.strokeText('NOODLE JUMP', W/2, H * 0.28);
    ctx.fillStyle = '#ffd93d';
    ctx.fillText('NOODLE JUMP', W/2, H * 0.28);

    ctx.fillStyle = '#ff8c00';
    ctx.font = `${W*0.05}px Arial`;
    ctx.fillText('Saute pour ne pas finir dans l\'eau !', W/2, H * 0.36);

    // Tableau des contrôles
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.roundRect(W*0.08, H*0.40, W*0.84, H*0.22, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,50,.3)'; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${W*0.042}px Arial`;
    ctx.fillText('🍜 Atterris sur les plateformes', W/2, H * 0.455);
    ctx.fillStyle = '#f0c060';
    ctx.fillText('🥢 Baguettes = fusée', W/2, H * 0.498);
    ctx.fillText('🌶️ Chili = superrebonds', W/2, H * 0.534);
    ctx.fillText('🥟 Gyoza = bouclier eau', W/2, H * 0.570);

    // Best
    if (best > 0) {
        ctx.fillStyle = 'rgba(255,217,61,.85)';
        ctx.font = `bold ${W*0.05}px Arial`;
        ctx.fillText(`🏆 Meilleur : ${best}m`, W/2, H*0.65);
    }

    // Bouton jouer (pulse)
    const pulse = 1 + Math.sin(fr * 0.07) * 0.04;
    ctx.save(); ctx.translate(W/2, H * 0.76); ctx.scale(pulse, pulse);
    ctx.fillStyle = 'rgba(200,30,0,.8)';
    ctx.beginPath(); ctx.roundRect(-W*0.32, -H*0.038, W*0.64, H*0.074, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,50,.7)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${W*0.065}px Arial`;
    ctx.fillText('▶ JOUER', 0, H*0.024);
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.font = `${W*0.035}px Arial`;
    ctx.fillText('◀ ▶ Boutons ou flèches / inclinaison', W/2, H*0.92);
}

// ── Game over ────────────────────────────────────────────────────
function drawDead() {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.roundRect(W*0.07, H*0.24, W*0.86, H*0.42, 20); ctx.fill();
    ctx.strokeStyle = 'rgba(200,30,0,.5)'; ctx.lineWidth = 2.5; ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = `bold ${W*0.1}px Arial`;
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 5;
    ctx.strokeText('TROP CHAUD !', W/2, H*0.33);
    ctx.fillStyle = '#ff6b6b';
    ctx.fillText('TROP CHAUD !', W/2, H*0.33);

    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 3;
    ctx.fillStyle = '#ffd93d'; ctx.font = `bold ${W*0.075}px Arial`;
    ctx.strokeText(`${score}m`, W/2, H*0.42);
    ctx.fillText(`${score}m`, W/2, H*0.42);

    const isRec = score >= best && score > 0;
    if (isRec) {
        ctx.fillStyle = '#6bff8e'; ctx.font = `bold ${W*0.05}px Arial`;
        ctx.fillText('🎉 Nouveau record !', W/2, H*0.49);
    } else {
        ctx.fillStyle = '#aaa'; ctx.font = `${W*0.044}px Arial`;
        ctx.fillText(`🏆 Meilleur : ${best}m`, W/2, H*0.49);
    }

    ctx.fillStyle = '#ff8c00'; ctx.font = `${W*0.04}px Arial`;
    ctx.fillText('Les nouilles ont été cuites… 🍜', W/2, H*0.57);

    const p = 1 + Math.sin(fr * 0.1) * 0.04;
    ctx.save(); ctx.translate(W/2, H*0.65); ctx.scale(p, p);
    ctx.fillStyle = 'rgba(200,30,0,.7)';
    ctx.beginPath(); ctx.roundRect(-W*0.3, -H*0.032, W*0.6, H*0.058, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,50,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${W*0.05}px Arial`;
    ctx.fillText('↩ REJOUER', 0, H*0.019);
    ctx.restore();
}

// ══════════════════════════════════════════════════
//  INPUT
// ══════════════════════════════════════════════════
function handleTap(rx, ry) {
    if (gs === 'menu') {
        gs = 'play'; initGame(); return;
    }
    if (gs === 'dead') {
        gs = 'menu'; return;
    }
    if (gs === 'play') {
        if (rx < W * 0.4)  inputL = true;
        if (rx > W * 0.6)  inputR = true;
    }
}
function handleRelease(rx) {
    if (rx < W * 0.4)  inputL = false;
    if (rx > W * 0.6)  inputR = false;
}

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        const r = canvas.getBoundingClientRect();
        handleTap(t.clientX - r.left, t.clientY - r.top);
    }
}, { passive: false });

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        const r = canvas.getBoundingClientRect();
        handleRelease(t.clientX - r.left);
    }
}, { passive: false });

canvas.addEventListener('mousedown', e => {
    const r = canvas.getBoundingClientRect();
    handleTap(e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener('mouseup', e => {
    const r = canvas.getBoundingClientRect();
    handleRelease(e.clientX - r.left);
});

document.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft'  || e.code === 'KeyA') inputL = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') inputR = true;
    if ((e.code === 'Space' || e.code === 'Enter') && gs !== 'play') {
        if (gs === 'menu') { gs = 'play'; initGame(); }
        else { gs = 'menu'; }
    }
});
document.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft'  || e.code === 'KeyA') inputL = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') inputR = false;
});

// Tilt
window.addEventListener('deviceorientation', e => {
    tiltX = e.gamma || 0; // -90 à +90
}, { passive: true });

// ══════════════════════════════════════════════════
//  HELPER
// ══════════════════════════════════════════════════
function shadeColor(col, amt) {
    const n = parseInt(col.replace('#',''), 16);
    const r = Math.min(255, Math.max(0, (n>>16) + amt));
    const g = Math.min(255, Math.max(0, ((n>>8)&0xff) + amt));
    const b = Math.min(255, Math.max(0, (n&0xff) + amt));
    return `rgb(${r},${g},${b})`;
}

// ══════════════════════════════════════════════════
//  BOUCLE
// ══════════════════════════════════════════════════
function loop() {
    fr++;
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
