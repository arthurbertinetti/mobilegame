<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#faf8ef;width:100%;height:100%;height:100dvh;overflow:hidden;font-family:'Segoe UI',sans-serif;user-select:none;-webkit-user-select:none}
#home-btn{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:5px 12px;color:#fff;font-size:13px;text-decoration:none;z-index:60}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;height:100dvh;padding:16px;touch-action:none}
#hdr{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
#hdr h1{font-size:2.2rem;color:#776e65;font-weight:bold;letter-spacing:2px}
.score-box{background:#bbada0;border-radius:6px;padding:6px 16px;text-align:center;min-width:70px}
.score-box .lbl{font-size:.6rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px}
.score-box .val{font-size:1.2rem;color:#fff;font-weight:bold}
#board{position:relative;background:#bbada0;border-radius:8px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{background:rgba(238,228,218,0.35);border-radius:5px;aspect-ratio:1;position:relative;overflow:visible}
.tile{position:absolute;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:bold;transition:left .12s ease,top .12s ease;z-index:2}
.tile.pop{animation:pop .2s ease}
.tile.appear{animation:appear .2s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes appear{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
#msg{position:absolute;inset:0;background:rgba(250,248,239,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;z-index:10;opacity:0;pointer-events:none;transition:opacity .3s}
#msg.show{opacity:1;pointer-events:all}
#msg h2{font-size:1.8rem;color:#776e65;margin-bottom:8px}
#msg p{color:#776e65;font-size:.9rem;margin-bottom:12px}
#msg button{padding:10px 28px;font-size:1rem;font-weight:bold;background:#8f7a66;color:#fff;border:none;border-radius:8px;cursor:pointer}
#btns{margin-top:12px;display:flex;gap:10px}
#btns button{padding:8px 20px;font-size:.85rem;font-weight:bold;background:#8f7a66;color:#fff;border:none;border-radius:6px;cursor:pointer}
.float-score{position:absolute;font-size:.9rem;font-weight:bold;color:#776e65;pointer-events:none;z-index:20;animation:floatup .6s forwards}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
</style>
</head>
<body>
<a id="home-btn" href="index.html">&#8592; Accueil</a>
<div id="wrap">
  <div id="hdr">
    <h1>2048</h1>
    <div class="score-box"><div class="lbl">Score</div><div class="val" id="sc">0</div></div>
    <div class="score-box"><div class="lbl">Record</div><div class="val" id="hi">0</div></div>
  </div>
  <div id="board">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div id="msg"><h2 id="msg-title">Game Over</h2><p id="msg-text"></p><button onclick="newGame()">Nouvelle Partie</button></div>
  </div>
  <div id="btns"><button onclick="newGame()">Nouvelle Partie</button><button onclick="undoMove()">Annuler</button></div>
</div>

<script>
var N=4;
var grid=[], prevGrid=[], prevScore=0;
var score=0, hiScore=parseInt(localStorage.getItem('2048_best')||'0');
var won=false, over=false;
var boardEl=document.getElementById('board');
var cellSize=0, gap=6, pad=6;
var floats=[];

function calcSize(){
  var maxW=Math.min(window.innerWidth-32, 420);
  var maxH=window.innerHeight*0.6;
  var sz=Math.min(maxW,maxH);
  boardEl.style.width=sz+'px';boardEl.style.height=sz+'px';
  cellSize=(sz-pad*2-gap*(N-1))/N;
}
calcSize();window.addEventListener('resize',calcSize);

var COLORS={
  2:{bg:'#eee4da',fg:'#776e65'},4:{bg:'#ede0c8',fg:'#776e65'},8:{bg:'#f2b179',fg:'#f9f6f2'},
  16:{bg:'#f59563',fg:'#f9f6f2'},32:{bg:'#f67c5f',fg:'#f9f6f2'},64:{bg:'#f65e3b',fg:'#f9f6f2'},
  128:{bg:'#edcf72',fg:'#f9f6f2'},256:{bg:'#edcc61',fg:'#f9f6f2'},512:{bg:'#edc850',fg:'#f9f6f2'},
  1024:{bg:'#edc53f',fg:'#f9f6f2'},2048:{bg:'#edc22e',fg:'#f9f6f2'},4096:{bg:'#3c3a32',fg:'#f9f6f2'},
  8192:{bg:'#3c3a32',fg:'#f9f6f2'}
};

function newGame(){
  grid=[];for(var i=0;i<N*N;i++)grid[i]=0;
  score=0;won=false;over=false;prevGrid=[];
  addRandom();addRandom();
  render();
  document.getElementById('msg').classList.remove('show');
}

function addRandom(){
  var empty=[];for(var i=0;i<N*N;i++)if(grid[i]===0)empty.push(i);
  if(empty.length===0)return;
  var idx=empty[Math.floor(Math.random()*empty.length)];
  grid[idx]=Math.random()<0.9?2:4;
  return idx;
}

function render(mergedCells, newIdx){
  // Clear old tiles
  var oldTiles=boardEl.querySelectorAll('.tile,.float-score');
  oldTiles.forEach(function(t){t.remove();});

  document.getElementById('sc').textContent=score;
  if(score>hiScore){hiScore=score;localStorage.setItem('2048_best',String(hiScore));}
  document.getElementById('hi').textContent=hiScore;

  for(var i=0;i<N*N;i++){
    if(grid[i]===0)continue;
    var r=Math.floor(i/N), c=i%N;
    var tile=document.createElement('div');
    tile.className='tile';
    var val=grid[i];
    var col=COLORS[val]||{bg:'#3c3a32',fg:'#f9f6f2'};
    var fs=val>=1000?Math.round(cellSize*0.32):val>=100?Math.round(cellSize*0.38):Math.round(cellSize*0.48);
    tile.style.cssText='left:'+(pad+c*(cellSize+gap))+'px;top:'+(pad+r*(cellSize+gap))+'px;width:'+cellSize+'px;height:'+cellSize+'px;background:'+col.bg+';color:'+col.fg+';font-size:'+fs+'px;';
    tile.textContent=val;
    if(mergedCells&&mergedCells.indexOf(i)>=0) tile.classList.add('pop');
    if(newIdx!==undefined&&i===newIdx) tile.classList.add('appear');
    boardEl.appendChild(tile);
  }

  // Float scores
  floats.forEach(function(f){
    var el=document.createElement('div');
    el.className='float-score';
    el.textContent='+'+f.pts;
    el.style.left=(pad+f.c*(cellSize+gap)+cellSize/2)+'px';
    el.style.top=(pad+f.r*(cellSize+gap))+'px';
    boardEl.appendChild(el);
  });
  floats=[];
}

function move(dir){
  if(over)return;
  // Save for undo
  prevGrid=grid.slice();prevScore=score;

  var moved=false, merged=[];
  // dir: 0=up,1=right,2=down,3=left
  for(var pass=0;pass<N;pass++){
    for(var i=0;i<N;i++){
      var line=[];
      for(var j=0;j<N;j++){
        var idx;
        if(dir===0) idx=j*N+pass;       // column top to bottom
        if(dir===2) idx=(N-1-j)*N+pass;  // column bottom to top
        if(dir===3) idx=pass*N+j;        // row left to right
        if(dir===1) idx=pass*N+(N-1-j);  // row right to left
        line.push({val:grid[idx],idx:idx});
      }
      // Remove zeros
      var vals=line.filter(function(c){return c.val!==0;});
      // Merge
      var newLine=[];
      var k=0;
      while(k<vals.length){
        if(k+1<vals.length&&vals[k].val===vals[k+1].val){
          var mv=vals[k].val*2;
          newLine.push(mv);score+=mv;
          floats.push({pts:mv,r:Math.floor(vals[k].idx/N),c:vals[k].idx%N});
          if(mv===2048&&!won){won=true;}
          k+=2;
        } else {
          newLine.push(vals[k].val);k++;
        }
      }
      while(newLine.length<N) newLine.push(0);
      // Write back
      for(var j2=0;j2<N;j2++){
        var idx2;
        if(dir===0) idx2=j2*N+pass;
        if(dir===2) idx2=(N-1-j2)*N+pass;
        if(dir===3) idx2=pass*N+j2;
        if(dir===1) idx2=pass*N+(N-1-j2);
        if(grid[idx2]!==newLine[j2]) moved=true;
        if(newLine[j2]!==0&&grid[idx2]!==newLine[j2]&&grid[idx2]!==0) merged.push(idx2);
        grid[idx2]=newLine[j2];
      }
    }
  }

  if(!moved){prevGrid=[];return;}

  var ni=addRandom();
  render(merged,ni);

  // Check game over
  if(!canMove()){
    over=true;
    document.getElementById('msg-title').textContent=won?'Bravo !':'Game Over';
    document.getElementById('msg-text').textContent='Score : '+score;
    document.getElementById('msg').classList.add('show');
  }
}

function canMove(){
  for(var i=0;i<N*N;i++){if(grid[i]===0)return true;}
  for(var r=0;r<N;r++){
    for(var c=0;c<N;c++){
      var v=grid[r*N+c];
      if(c<N-1&&grid[r*N+c+1]===v)return true;
      if(r<N-1&&grid[(r+1)*N+c]===v)return true;
    }
  }
  return false;
}

function undoMove(){
  if(prevGrid.length===0)return;
  grid=prevGrid.slice();score=prevScore;prevGrid=[];
  over=false;won=false;
  document.getElementById('msg').classList.remove('show');
  render();
}

// ── INPUT ────────────────────────────────────────────────────
var tx0=null,ty0=null;
document.addEventListener('touchstart',function(e){
  tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(tx0===null)return;
  var dx=e.changedTouches[0].clientX-tx0;
  var dy=e.changedTouches[0].clientY-ty0;
  tx0=null;ty0=null;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)){
    move(dx>0?1:3);
  } else {
    move(dy>0?2:0);
  }
},{passive:true});

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'){e.preventDefault();move(0);}
  if(e.key==='ArrowRight'){e.preventDefault();move(1);}
  if(e.key==='ArrowDown'){e.preventDefault();move(2);}
  if(e.key==='ArrowLeft'){e.preventDefault();move(3);}
});

newGame();
</script>
</body>
</html>
