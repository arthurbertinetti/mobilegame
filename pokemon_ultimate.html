<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Monster World - Ultimate Edition</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Press Start 2P', monospace, 'Courier New', monospace;
    -webkit-user-select: none;
    user-select: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}
canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    background: #000;
}
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    color: #fff;
    overflow-y: auto;
    padding: 20px;
}
.overlay h1 {
    font-size: 1.8rem;
    margin-bottom: 20px;
    color: #ffcc00;
    text-shadow: 3px 3px 0 #000;
}

.menu-btn {
    padding: 15px 40px;
    font-size: 0.9rem;
    background: #e74c3c;
    color: #fff;
    border: 3px solid #000;
    cursor: pointer;
    margin: 10px;
    font-family: inherit;
    box-shadow: 4px 4px 0 #000;
}
.menu-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #000;
}

#hud {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,.75);
    color: #fff;
    padding: 10px;
    border: 2px solid #fff;
    font-size: 0.7rem;
    z-index: 500;
    max-width: 250px;
}
#hud div { margin: 5px 0; }
.modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1a1a1a;
    border: 4px solid #fff;
    padding: 20px;
    z-index: 2000;
    color: #fff;
    max-width: 90%;
    max-height: 80%;
    overflow-y: auto;
    display: none;
}
.modal h2 {
    margin-bottom: 20px;
    color: #ffcc00;
    font-size: 1.4rem;
    text-shadow: 2px 2px 0 #000;
}
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 1999;
    display: none;
    backdrop-filter: blur(8px);
}
.grid {
    display: grid;
    gap: 15px;
    margin: 20px 0;
}
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.card {
    background: #2c3e50;
    border: 2px solid #3498db;
    padding: 10px;
    cursor: pointer;
    text-align: center;
}
.card:hover {
    background: #34495e;
    border-color: #2ecc71;
}
.notification {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #2ecc71;
    color: #fff;
    padding: 15px 25px;
    border: 3px solid #fff;
    font-size: 0.8rem;
    z-index: 3000;
    box-shadow: 4px 4px 0 #000;
}

.hp-bar {
    background: #333;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 5px;
}
.hp-fill {
    height: 100%;
    transition: width 0.3s, background 0.3s;
}
.hp-high { background: #2ecc71; }
.hp-medium { background: #f39c12; }
.hp-low { background: #e74c3c; }
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}
.tab {
    padding: 12px 25px;
    background: #555;
    border: 2px solid #777;
    cursor: pointer;
    font-size: 0.7rem;
    font-family: inherit;
    color: #fff;
}
.tab.active {
    background: #3498db;
    border-color: #fff;
}
.rules-section {
    background: rgba(44,62,80,0.5);
    padding: 15px;
    margin: 10px 0;
    border-left: 4px solid #3498db;
}
.rules-section h3 {
    font-size: 0.9rem;
    margin-bottom: 10px;
    color: #f1c40f;
}
.rules-section p, .rules-section ul {
    font-size: 0.65rem;
    line-height: 1.8;
    color: #ecf0f1;
}
.rules-section ul {
    margin-left: 20px;
}
.controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    z-index: 600;
    align-items: center;
}
.dpad {
    display: grid;
    grid-template-columns: repeat(3, 70px);
    grid-template-rows: repeat(3, 70px);
    gap: 5px;
}
.dpad-btn {
    background: rgba(40,40,40,.85);
    border: 3px solid rgba(255,255,255,.3);
    color: #fff;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(5px);
}
.dpad-btn:active {
    background: rgba(80,80,80,.85);
}
.action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
}
.action-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(231,76,60,.85);
    border: 3px solid rgba(255,255,255,.3);
    color: #fff;
    font-size: 0.7rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(5px);
    font-weight: bold;
}
.action-btn:active {
    background: rgba(192,57,43,.85);
}
.action-btn.pokedex {
    /* Styles removed - using simple background */
}
.action-btn.bag {
    /* Styles removed - using simple background */
}
.action-btn.monsters {
    /* Styles removed - using simple background */
}
.action-btn.menu {
    /* Styles removed - using simple background */
}
.action-btn .icon {
    font-size: 1.3rem;
}

</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="overlay" class="overlay">
    <h1>🌟 MONSTER WORLD 🌟</h1>
    <div id="mainMenu">
        <button class="menu-btn" onclick="startNewGame()">▶️ NOUVELLE PARTIE</button>
        <button class="menu-btn secondary" onclick="continueGame()" id="continueBtn" style="display: none;">💾 CONTINUER</button>
        <button class="menu-btn success" onclick="showRules()">📋 RÈGLES</button>
    </div>
</div>

<div id="hud" style="display: none;">
    <div style="font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; color: #ffcc00; text-shadow: 2px 2px 0 #000;">
        🌍 MONSTER WORLD
    </div>
    <div style="background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px; margin: 5px 0;">
        <div style="margin: 3px 0;">📍 <span id="hudPos">0, 0</span></div>
        <div style="margin: 3px 0;">💰 <span id="hudMoney" style="color: #f1c40f;">1000</span>$</div>
        <div style="margin: 3px 0;">👾 <span id="hudMonsters" style="color: #3498db;">0/20</span> monstres</div>
        <div style="margin: 3px 0;">🏆 <span id="hudBadges" style="color: #e74c3c;">0/17</span> badges</div>
    </div>
</div>

<div class="controls" id="controls" style="display: none;">
    <div class="dpad">
        <div></div>
        <div class="dpad-btn" data-dir="up">▲</div>
        <div></div>
        <div class="dpad-btn" data-dir="left">◄</div>
        <div style="background: rgba(0,0,0,0.3); border-radius: 50%;"></div>
        <div class="dpad-btn" data-dir="right">►</div>
        <div></div>
        <div class="dpad-btn" data-dir="down">▼</div>
        <div></div>
    </div>
    
    <div class="action-buttons">
        <div class="action-btn pokedex" onclick="openPokedex()">
            <div class="icon">📖</div>
            <div>DEX</div>
        </div>
        <div class="action-btn bag" onclick="openBag()">
            <div class="icon">🎒</div>
            <div>SAC</div>
        </div>
        <div class="action-btn monsters" onclick="openMonsters()">
            <div class="icon">👾</div>
            <div>TEAM</div>
        </div>
        <div class="action-btn menu" onclick="openModal('menuModal')">
            <div class="icon">☰</div>
            <div>MENU</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay"></div>

<div id="starterModal" class="modal">
    <h2>🎯 CHOISIS TON STARTER!</h2>
    <div class="grid grid-3" id="starterGrid"></div>
</div>

<div id="rulesModal" class="modal" style="max-width: 900px;">
    <h2>📋 RÈGLES DU JEU</h2>
    <div id="rulesContent"></div>
    <button class="menu-btn" onclick="closeModal('rulesModal')" style="margin-top: 20px; width: 100%;">← RETOUR</button>
</div>

<div id="menuModal" class="modal">
    <h2>📱 MENU</h2>
    <div class="grid grid-2">
        <button class="menu-btn" onclick="openPokedex()">📖 POKÉDEX</button>
        <button class="menu-btn" onclick="openMonsters()">📋 MONSTRES</button>
        <button class="menu-btn" onclick="openBag()">🎒 SAC</button>
        <button class="menu-btn" onclick="openShop()">🏪 BOUTIQUE</button>
    </div>
    <button class="menu-btn secondary" onclick="closeModal('menuModal')" style="margin-top: 20px; width: 100%;">❌ ANNULER</button>
</div>

<div id="pokedexModal" class="modal" style="max-width: 1200px;">
    <h2>📖 POKÉDEX - <span id="pokedexCount">0/54</span> vus</h2>
    <div class="grid grid-3" id="pokedexContent"></div>
    <button class="menu-btn" onclick="closeModal('pokedexModal')" style="margin-top: 20px; width: 100%;">← RETOUR</button>
</div>

<div id="monstersModal" class="modal" style="max-width: 1000px;">
    <h2>📋 MES MONSTRES (<span id="monsterCount">0/20</span>)</h2>
    <div><strong>👥 ÉQUIPE ACTIVE (<span id="activeCount">0/3</span>)</strong></div>
    <div id="monstersContent" style="margin-top: 15px;"></div>
    <button class="menu-btn" onclick="closeModal('monstersModal')" style="margin-top: 20px; width: 100%;">← RETOUR</button>
</div>

<div id="bagModal" class="modal">
    <h2>🎒 SAC</h2>
    <div id="bagContent"></div>
    <button class="menu-btn" onclick="closeModal('bagModal')" style="margin-top: 20px; width: 100%;">← RETOUR</button>
</div>

<div id="shopModal" class="modal">
    <h2>🏪 BOUTIQUE</h2>
    <div class="tabs">
        <button class="tab active" onclick="switchShopTab('buy')">ACHETER</button>
        <button class="tab" onclick="switchShopTab('sell')">VENDRE</button>
    </div>
    <div id="shopContent"></div>
    <button class="menu-btn" onclick="closeModal('shopModal')" style="margin-top: 20px; width: 100%;">← RETOUR</button>
</div>

<div id="battleModal" class="modal" style="max-width: 95%;">
    <div id="battleContent"></div>
</div>

<div id="dialogModal" class="modal">
    <div id="dialogContent"></div>
    <button class="menu-btn" onclick="closeModal('dialogModal')" style="margin-top: 15px; width: 100%;">OK</button>
</div>

function getTypeMultiplier(attackType, defenderType) {
    const data = TYPE_EFFECTIVENESS[attackType];
    if (!data) return 1;
    if (data.effective.includes(defenderType)) return 1.5;
    if (data.weak.includes(defenderType)) return 0.67;
    return 1;
}

function generateWorld() {
    const world = [];
    for (let y = 0; y < MAP_SIZE; y++) {
        world[y] = [];
        for (let x = 0; x < MAP_SIZE; x++) {
            const rand = Math.random();
            if (rand < 0.05) world[y][x] = 'forest';
            else if (rand < 0.10) world[y][x] = 'mountain';
            else if (rand < 0.15) world[y][x] = 'water';
            else if (rand < 0.30) world[y][x] = 'tallgrass';
            else if (rand < 0.40) world[y][x] = 'field';
            else world[y][x] = 'grass';
        }
    }
    
    // 5 VILLES
    const cityPositions = [
        { x: 75, y: 75, name: 'Ville Départ' },
        { x: 30, y: 30, name: 'Ville Roche' },
        { x: 120, y: 40, name: 'Ville Aqua' },
        { x: 40, y: 120, name: 'Ville Forêt' },
        { x: 110, y: 110, name: 'Ville Éclair' }
    ];
    
    game.cities = cityPositions;
    
    // PASSAGES ENTRE ZONES (gates)
    const gates = [
        // Entre Zone Départ et Plaine Est
        { x: 85, y: 75 },
        // Entre Zone Départ et Forêt Nord  
        { x: 75, y: 65 },
        // Entre Zone Départ et Marais Sud
        { x: 75, y: 85 },
        // Entre Zone Départ et Montagne Ouest
        { x: 65, y: 75 }
    ];
    
    gates.forEach(gate => {
        if (world[gate.y] && world[gate.y][gate.x]) {
            world[gate.y][gate.x] = 'gate';
        }
    });
    
    cityPositions.forEach(city => {
        for (let dy = -3; dy <= 3; dy++) {
            for (let dx = -3; dx <= 3; dx++) {
                const nx = city.x + dx;
                const ny = city.y + dy;
                if (nx >= 0 && nx < MAP_SIZE && ny >= 0 && ny < MAP_SIZE) {
                    if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) {
                        world[ny][nx] = 'town';
                    } else {
                        world[ny][nx] = 'path';
                    }
                }
            }
        }
        
        // CENTRE POKÉMON
        game.pokemonCenters.push({
            x: city.x,
            y: city.y,
            name: city.name,
            npc: { emoji: '🏥', message: 'Bienvenue ! Je soigne vos monstres gratuitement.' }
        });
        
        // BÂTIMENTS
        world[city.y - 1][city.x - 1] = 'building';
        world[city.y - 1][city.x + 1] = 'building';
        world[city.y + 1][city.x - 1] = 'building';
        world[city.y + 1][city.x + 1] = 'building';
    });
    
    // CHEMINS ENTRE VILLES
    for (let i = 0; i < cityPositions.length - 1; i++) {
        const from = cityPositions[i];
        const to = cityPositions[i + 1];
        let x = from.x;
        let y = from.y;
        while (x !== to.x || y !== to.y) {
            if (x < to.x) x++;
            else if (x > to.x) x--;
            if (y < to.y) y++;
            else if (y > to.y) y--;
            if (x >= 0 && x < MAP_SIZE && y >= 0 && y < MAP_SIZE) {
                if (world[y][x] !== 'town' && world[y][x] !== 'building') {
                    world[y][x] = world[y][x] === 'water' ? 'bridge' : 'path';
                }
            }
        }
    }
    
    // OBSTACLES (50)
    for (let i = 0; i < 50; i++) {
        const x = Math.floor(Math.random() * MAP_SIZE);
        const y = Math.floor(Math.random() * MAP_SIZE);
        const tile = world[y][x];
        if (tile === 'grass' || tile === 'field' || tile === 'path') {
            const types = ['🌳', '🪨', '🌲'];
            game.obstacles.push({
                x, y,
                type: types[Math.floor(Math.random() * types.length)],
                id: `obstacle_${x}_${y}`
            });
        }
    }
    
    game.world = world;
}

function createMonster(species, level) {
    const data = MONSTER_DATA[species];
    const stats = {
        hp: Math.floor(data.hp + (level * 2)),
        atk: Math.floor(data.atk + (level * 1.5))
    };
    
    // ATTAQUES ALÉATOIRES (60% pour 2, 40% pour 1)
    const possibleMoves = MOVES_BY_TYPE[data.type] || [];
    const numMoves = Math.random() < 0.6 ? 2 : 1;
    const moves = [];
    const shuffled = [...possibleMoves].sort(() => Math.random() - 0.5);
    for (let i = 0; i < numMoves && i < shuffled.length; i++) {
        moves.push(shuffled[i]);
    }
    
    return {
        species,
        level,
        type: data.type,
        emoji: data.emoji,
        stats,
        maxHp: stats.hp,
        currentHp: stats.hp,
        exp: 0,
        expToNext: level * level * 10,
        evolution: data.evolution,
        moves,
        rarity: data.rarity
    };
}

function checkEvolution(monster) {
    if (monster.evolution && monster.level >= monster.evolution.level) {
        const oldSpecies = monster.species;
        const newSpecies = monster.evolution.into;
        const newData = MONSTER_DATA[newSpecies];
        
        monster.species = newSpecies;
        monster.emoji = newData.emoji;
        monster.type = newData.type;
        monster.evolution = newData.evolution;
        
        // Recalculer stats
        monster.stats.hp = Math.floor(newData.hp + (monster.level * 2));
        monster.stats.atk = Math.floor(newData.atk + (monster.level * 1.5));
        const oldMaxHp = monster.maxHp;
        monster.maxHp = monster.stats.hp;
        monster.currentHp = Math.floor((monster.currentHp / oldMaxHp) * monster.maxHp);
        
        showNotification(`🎉 ${oldSpecies} évolue en ${newSpecies}!`);
        return true;
    }
    return false;
}

function getCurrentZone() {
    for (const zone of WORLD_ZONES) {
        if (game.player.x >= zone.minX && game.player.x <= zone.maxX &&
            game.player.y >= zone.minY && game.player.y <= zone.maxY) {
            return zone;
        }
    }
    return WORLD_ZONES[0]; // Zone par défaut
}

function getWildMonster() {
    const zone = getCurrentZone();
    const allSpecies = Object.keys(MONSTER_DATA).filter(s => MONSTER_DATA[s].rarity !== 'starter');
    const rarityWeights = { common: 0.6, uncommon: 0.3, rare: 0.08, legendary: 0.015, mythical: 0.005 };
    
    let rarity = 'common';
    const rand = Math.random();
    if (rand < 0.005) rarity = 'mythical';
    else if (rand < 0.02) rarity = 'legendary';
    else if (rand < 0.10) rarity = 'rare';
    else if (rand < 0.40) rarity = 'uncommon';
    
    const filtered = allSpecies.filter(s => MONSTER_DATA[s].rarity === rarity);
    const species = filtered.length > 0 ? filtered[Math.floor(Math.random() * filtered.length)] : allSpecies[0];
    
    // Niveau basé sur la zone
    const level = zone.wildLevelMin + Math.floor(Math.random() * (zone.wildLevelMax - zone.wildLevelMin + 1));
    
    return createMonster(species, level);
}

function saveGame() {
    try {
        const saveData = {
            player: game.player,
            money: game.money,
            monsters: game.monsters,
            activeTeam: game.activeTeam,
            bag: game.bag,
            loot: game.loot,
            badges: game.badges,
            pokedex: Array.from(game.pokedex),
            unlockedObstacles: Array.from(game.unlockedObstacles)
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
        return true;
    } catch (e) {
        console.error('Save error:', e);
        return false;
    }
}

function loadGame() {
    try {
        const data = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (!data) return false;
        
        game.player = data.player;
        game.money = data.money || 1000;
        game.monsters = data.monsters || [];
        game.activeTeam = data.activeTeam || [];
        game.bag = data.bag || { monsterball: 5, superball: 2, ultraball: 1, potion: 3, superpotion: 1, hyperpotion: 0 };
        game.loot = data.loot || {};
        game.badges = data.badges || 0;
        game.pokedex = new Set(data.pokedex || []);
        game.unlockedObstacles = new Set(data.unlockedObstacles || []);
        
        return true;
    } catch (e) {
        console.error('Load error:', e);
        return false;
    }
}

function startWildEncounter() {
    const wild = getWildMonster();
    game.pokedex.add(wild.species);
    
    const playerMonster = game.monsters[0];
    if (!playerMonster || playerMonster.currentHp <= 0) {
        showNotification('❌ Pas de monstre actif!', '#e74c3c');
        return;
    }
    
    runBattle(playerMonster, wild, true);
}

function runBattle(player, enemy, isWild) {
    game.inBattle = true;
    let battleLog = '';
    let turn = 'player';
    let battleEnded = false;
    
    function updateBattle() {
        const content = document.getElementById('battleContent');
        const playerHpPercent = (player.currentHp / player.maxHp) * 100;
        const enemyHpPercent = (enemy.currentHp / enemy.maxHp) * 100;
        
        content.innerHTML = `
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <h3>Ennemi ${enemy.species}</h3>
                    <div>Lv ${enemy.level}</div>
                    <div style="background: #555; height: 20px; margin: 10px 0; position: relative;">
                        <div style="background: ${enemyHpPercent > 50 ? '#2ecc71' : enemyHpPercent > 20 ? '#f39c12' : '#e74c3c'}; height: 100%; width: ${enemyHpPercent}%;"></div>
                    </div>
                    <div>${enemy.currentHp}/${enemy.maxHp} HP</div>
                </div>
                <div>
                    <h3>Votre ${player.species}</h3>
                    <div>Lv ${player.level}</div>
                    <div style="background: #555; height: 20px; margin: 10px 0; position: relative;">
                        <div style="background: ${playerHpPercent > 50 ? '#2ecc71' : playerHpPercent > 20 ? '#f39c12' : '#e74c3c'}; height: 100%; width: ${playerHpPercent}%;"></div>
                    </div>
                    <div>${player.currentHp}/${player.maxHp} HP</div>
                    <div style="font-size: 0.6rem; color: #f1c40f; margin-top: 5px;">
                        EXP: ${player.exp}/${player.expToNext}
                    </div>
                </div>
            </div>
            
            <div style="background: #2c3e50; padding: 15px; margin: 20px 0; min-height: 100px; max-height: 200px; overflow-y: auto;">
                ${battleLog}
            </div>
            
            ${turn === 'player' && !battleEnded ? `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    ${player.moves.map((move, i) => `
                        <button class="menu-btn" onclick="playerAttack(${i})" ${player.currentHp <= 0 ? 'disabled' : ''}>
                            ${move.emoji} ${move.name}
                            <div style="font-size: 0.6rem; margin-top: 3px;">⚡${move.power}</div>
                        </button>
                    `).join('')}
                </div>
                ${isWild ? `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                        <button class="menu-btn" onclick="tryCapture()" ${game.bag.monsterball <= 0 ? 'disabled' : ''} 
                                style="${game.bag.monsterball <= 0 ? 'opacity: 0.5;' : ''}">
                            🎾 CAPTURER (${game.bag.monsterball})
                        </button>
                        <button class="menu-btn" onclick="tryRun()">
                            🏃 FUIR
                        </button>
                    </div>
                ` : ''}
            ` : ''}
        `;
    }
    
    window.playerAttack = function(moveIndex) {
        if (battleEnded || turn !== 'player') return;
        
        const move = player.moves[moveIndex];
        const typeMultiplier = getTypeMultiplier(player.type, enemy.type);
        const damage = Math.max(1, Math.floor((move.power * player.stats.atk) / enemy.stats.def * 0.4 * typeMultiplier));
        
        enemy.currentHp = Math.max(0, enemy.currentHp - damage);
        
        battleLog += `<div>${player.species} utilise ${move.name}! -${damage} HP</div>`;
        if (typeMultiplier > 1) battleLog += `<div style="color: #2ecc71;">C'est super efficace!</div>`;
        else if (typeMultiplier < 1) battleLog += `<div style="color: #e67e22;">Ce n'est pas très efficace...</div>`;
        
        updateBattle();
        
        if (enemy.currentHp <= 0) {
            setTimeout(() => {
                battleLog += `<div style="color: #e74c3c;">💀 ${enemy.species} est K.O.!</div>`;
                const expGain = Math.floor(enemy.level * 50);
                player.exp += expGain;
                battleLog += `<div style="color: #f1c40f;">+${expGain} EXP</div>`;
                
                while (player.exp >= player.expToNext) {
                    player.level++;
                    player.exp -= player.expToNext;
                    player.expToNext = player.level * player.level * 10;
                    
                    // Augmentation des stats
                    player.stats.hp = Math.floor(player.stats.hp * 1.1);
                    player.stats.atk = Math.floor(player.stats.atk * 1.1);
                    player.stats.def = Math.floor(player.stats.def * 1.1);
                    player.maxHp = player.stats.hp;
                    player.currentHp = player.maxHp;
                    
                    battleLog += `<div style="color: #2ecc71;">🎉 ${player.species} monte au niveau ${player.level}!</div>`;
                    
                    checkEvolution(player);
                }
                
                game.money += Math.floor(enemy.level * 20);
                battleEnded = true;
                updateBattle();
                updateHUD();
                
                setTimeout(() => {
                    closeModal('battleModal');
                    game.inBattle = false;
                }, 2000);
            }, 1000);
        } else {
            setTimeout(enemyTurn, 1500);
        }
    };
    
    function enemyTurn() {
        if (battleEnded) return;
        turn = 'enemy';
        
        setTimeout(() => {
            const move = enemy.moves[Math.floor(Math.random() * enemy.moves.length)];
            const typeMultiplier = getTypeMultiplier(enemy.type, player.type);
            const damage = Math.max(1, Math.floor((move.power * enemy.stats.atk) / player.stats.def * 0.4 * typeMultiplier));
            
            player.currentHp = Math.max(0, player.currentHp - damage);
            
            battleLog += `<div>${enemy.species} utilise ${move.name}! -${damage} HP</div>`;
            if (typeMultiplier > 1) battleLog += `<div style="color: #2ecc71;">C'est super efficace!</div>`;
            else if (typeMultiplier < 1) battleLog += `<div style="color: #e67e22;">Ce n'est pas très efficace...</div>`;
            
            updateBattle();
            
            if (player.currentHp <= 0) {
                setTimeout(() => {
                    battleLog += `<div style="color: #e74c3c;">💀 ${player.species} est K.O.!</div>`;
                    battleEnded = true;
                    updateBattle();
                    
                    setTimeout(() => {
                        closeModal('battleModal');
                        game.inBattle = false;
                        showNotification('😢 Défaite...', '#e74c3c');
                    }, 2000);
                }, 1000);
            } else {
                turn = 'player';
                setTimeout(updateBattle, 1000);
            }
        }, 1000);
    }
    
    window.tryCapture = function() {
        if (battleEnded || !isWild) return;
        
        if (game.bag.monsterball <= 0) {
            battleLog += `<div style="color: #e74c3c;">❌ Pas de Monsterball!</div>`;
            updateBattle();
            return;
        }
        
        game.bag.monsterball--;
        
        // Capture plus facile si HP < 30%
        const hpPercent = enemy.currentHp / enemy.maxHp;
        let catchRate = ((enemy.maxHp - enemy.currentHp) / enemy.maxHp) * 50 + (100 - enemy.level * 2);
        catchRate = Math.max(0, Math.min(100, catchRate));
        
        battleLog += `<div>🎯 Lancer de Monsterball...</div>`;
        updateBattle();
        
        setTimeout(() => {
            const success = Math.random() * 100 < catchRate;
            
            if (success) {
                if (game.monsters.length >= 20) {
                    battleLog += `<div style="color: #e74c3c;">❌ Équipe pleine! (Max 20 monstres)</div>`;
                    updateBattle();
                    setTimeout(enemyTurn, 1500);
                } else {
                    battleLog += `<div style="color: #2ecc71;">🎉 ${enemy.species} capturé!</div>`;
                    game.monsters.push(enemy);
                    game.pokedex.add(enemy.species);
                    battleEnded = true;
                    updateBattle();
                    updateHUD();
                    
                    setTimeout(() => {
                        closeModal('battleModal');
                        game.inBattle = false;
                    }, 2000);
                }
            } else {
                battleLog += `<div style="color: #e74c3c;">❌ ${enemy.species} s'est libéré!</div>`;
                updateBattle();
                setTimeout(enemyTurn, 1500);
            }
        }, 2000);
    };
    
    window.tryRun = function() {
        if (battleEnded) return;
        
        const runChance = Math.random();
        if (runChance > 0.5) {
            battleLog += `<div style="color: #2ecc71;">🏃 Vous avez fui en toute sécurité!</div>`;
            battleEnded = true;
            updateBattle();
            setTimeout(() => {
                closeModal('battleModal');
                game.inBattle = false;
            }, 1500);
        } else {
            battleLog += `<div style="color: #e74c3c;">❌ Impossible de fuir!</div>`;
            updateBattle();
            setTimeout(enemyTurn, 1500);
        }
    };
    
    openModal('battleModal');
    updateBattle();
}

// ========== CONTRÔLES ==========
const keys = {};

function initTouchControls() {
    // D-pad buttons
    document.querySelectorAll('.dpad-btn').forEach(btn => {
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const dir = btn.dataset.dir;
            if (dir) {
                handleMove(dir);
            }
        });
        
        btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const dir = btn.dataset.dir;
            if (dir) {
                handleMove(dir);
            }
        });
    });
}

function handleMove(direction) {
    if (game.running && !game.inBattle) {
        const speed = 1;
        let dx = 0, dy = 0;
        
        switch(direction) {
            case 'up': dy = -speed; break;
            case 'down': dy = speed; break;
            case 'left': dx = -speed; break;
            case 'right': dx = speed; break;
        }
        
        if (dx !== 0 || dy !== 0) {
            movePlayer(dx, dy);
        }
    }
}

window.addEventListener('keydown', e => {
    keys[e.key] = true;
    
    if (e.key === 'Escape') {
        if (document.getElementById('menuModal').style.display === 'block') {
            closeModal('menuModal');
        } else {
            openModal('menuModal');
        }
    }
    if (e.key === 'p' || e.key === 'P') openPokedex();
    if (e.key === 'b' || e.key === 'B') openBag();
    if (e.key === 'm' || e.key === 'M') openMonsters();
});
window.addEventListener('keyup', e => keys[e.key] = false);

function movePlayer(dx, dy) {
    if (game.player.moving) return; // Bloquer si déjà en mouvement
    
    const newX = game.player.x + dx;
    const newY = game.player.y + dy;
    
    if (newX >= 0 && newX < MAP_SIZE && newY >= 0 && newY < MAP_SIZE) {
        const tile = game.world[newY][newX];
        const biome = BIOMES[tile];
        
        // Vérifier obstacles
        const obstacle = game.obstacles.find(o => o.x === newX && o.y === newY);
        if (obstacle && !game.unlockedObstacles.has(obstacle.id)) {
            // Vérifier si équipe peut débloquer
            const requiredFields = {
                '🌳': ['burn', 'cut', 'poison'],
                '🪨': ['break', 'push'],
                '🌲': ['cut', 'burn']
            };
            
            const fields = requiredFields[obstacle.type] || [];
            const hasField = game.activeTeam.some(idx => {
                const monster = game.monsters[idx];
                return monster && monster.moves.some(m => fields.includes(m.field));
            });
            
            if (hasField) {
                game.unlockedObstacles.add(obstacle.id);
                showNotification(`✅ Obstacle ${obstacle.type} débloqué!`);
            } else {
                showNotification(`❌ Besoin: ${fields.join('/')}`, '#e74c3c');
                return;
            }
        }
        
        if (biome && biome.walkable) {
            // Vérifier l'accès à la zone
            const newZone = WORLD_ZONES.find(z => 
                newX >= z.minX && newX <= z.maxX && 
                newY >= z.minY && newY <= z.maxY
            );
            
            if (newZone && game.badges < newZone.requiredBadges) {
                showNotification(`🚫 ${newZone.name} nécessite ${newZone.requiredBadges} badges!`, '#e74c3c');
                return;
            }
            
            // Définir direction
            if (dx < 0) game.player.direction = 'left';
            else if (dx > 0) game.player.direction = 'right';
            else if (dy < 0) game.player.direction = 'up';
            else if (dy > 0) game.player.direction = 'down';
            
            // Démarrer animation de mouvement fluide
            game.player.moving = true;
            game.player.moveProgress = 0;
            game.player.x = newX;
            game.player.y = newY;
            game.player.targetX = newX * TILE_SIZE;
            game.player.targetY = newY * TILE_SIZE;
            
            updateHUD();
            
            // Centre Pokémon
            const center = game.pokemonCenters.find(c => c.x === newX && c.y === newY);
            if (center) {
                game.monsters.forEach(m => m.currentHp = m.maxHp);
                showNotification(`🏥 Monstres soignés à ${center.name}!`);
            }
            
            // Rencontre aléatoire (hautes herbes = 25%)
            const encounterRate = tile === 'tallgrass' ? 0.25 : biome.encounter;
            if (encounterRate > 0 && Math.random() < encounterRate) {
                setTimeout(() => startWildEncounter(), 300);
            }
        }
    }
}

function updatePlayerMovement() {
    if (game.player.moving) {
        game.player.moveProgress += 0.25; // Vitesse du mouvement
        
        if (game.player.moveProgress >= 1) {
            game.player.moveProgress = 1;
            game.player.moving = false;
            game.player.worldX = game.player.targetX;
            game.player.worldY = game.player.targetY;
        } else {
            // Interpolation smooth (easing)
            const t = easeInOutQuad(game.player.moveProgress);
            const startX = game.player.targetX - (game.player.x - (game.player.targetX / TILE_SIZE)) * TILE_SIZE;
            const startY = game.player.targetY - (game.player.y - (game.player.targetY / TILE_SIZE)) * TILE_SIZE;
            
            game.player.worldX = startX + (game.player.targetX - startX) * t;
            game.player.worldY = startY + (game.player.targetY - startY) * t;
        }
    }
}

function easeInOutQuad(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

function handleInput() {
    if (game.player.moving || !game.running || game.inBattle) return;
    
    const speed = 1;
    let dx = 0, dy = 0;
    
    if (keys['z'] || keys['Z'] || keys['ArrowUp']) dy = -speed;
    if (keys['s'] || keys['S'] || keys['ArrowDown']) dy = speed;
    if (keys['q'] || keys['Q'] || keys['ArrowLeft']) dx = -speed;
    if (keys['d'] || keys['D'] || keys['ArrowRight']) dx = speed;
    
    if (dx !== 0 || dy !== 0) {
        movePlayer(dx, dy);
    }
}

// ========== RENDU ==========
function updateCamera() {
    // Caméra fluide qui suit le joueur
    game.camera.targetX = canvas.width / 2 - game.player.worldX - TILE_SIZE / 2;
    game.camera.targetY = canvas.height / 2 - game.player.worldY - TILE_SIZE / 2;
    
    // Interpolation smooth de la caméra
    game.camera.x += (game.camera.targetX - game.camera.x) * 0.15;
    game.camera.y += (game.camera.targetY - game.camera.y) * 0.15;
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    updateCamera();
    
    ctx.save();
    ctx.translate(game.camera.x, game.camera.y);
    
    // Dessiner monde
    const startX = Math.max(0, Math.floor(game.player.x - canvas.width / TILE_SIZE / 2) - 2);
    const endX = Math.min(MAP_SIZE, Math.ceil(game.player.x + canvas.width / TILE_SIZE / 2) + 2);
    const startY = Math.max(0, Math.floor(game.player.y - canvas.height / TILE_SIZE / 2) - 2);
    const endY = Math.min(MAP_SIZE, Math.ceil(game.player.y + canvas.height / TILE_SIZE / 2) + 2);
    
    for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
            const tile = game.world[y][x];
            const biome = BIOMES[tile];
            if (biome) {
                // Fond de tuile simple
                ctx.fillStyle = biome.color;
                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                
                // Emoji centré
                ctx.font = `${TILE_SIZE - 6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(biome.emoji, x * TILE_SIZE + TILE_SIZE / 2, y * TILE_SIZE + TILE_SIZE / 2);
            }
        }
    }
    
    // Obstacles
    game.obstacles.forEach(obstacle => {
        if (!game.unlockedObstacles.has(obstacle.id)) {
            ctx.font = `${TILE_SIZE}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(obstacle.type, obstacle.x * TILE_SIZE + TILE_SIZE / 2, obstacle.y * TILE_SIZE + TILE_SIZE / 2);
        }
    });
    
    // Équipe active (following player)
    game.activeTeam.forEach((idx, i) => {
        const monster = game.monsters[idx];
        if (monster) {
            const offset = (i + 1) * TILE_SIZE * 0.8;
            let followX = game.player.worldX;
            let followY = game.player.worldY;
            
            if (game.player.direction === 'right') followX -= offset;
            else if (game.player.direction === 'left') followX += offset;
            else if (game.player.direction === 'down') followY -= offset;
            else if (game.player.direction === 'up') followY += offset;
            
            ctx.font = `${TILE_SIZE * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(monster.emoji, followX + TILE_SIZE / 2, followY + TILE_SIZE / 2);
        }
    });
    
    // Joueur
    const playerEmojis = { up: '🧍', down: '🧑', left: '🧍', right: '🧍' };
    ctx.font = `${TILE_SIZE}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(playerEmojis[game.player.direction], 
        game.player.worldX + TILE_SIZE / 2, 
        game.player.worldY + TILE_SIZE / 2);
    
    ctx.restore();
}

function gameLoop() {
    if (!game.running) return;
    
    updatePlayerMovement();
    handleInput();
    render();
    
    requestAnimationFrame(gameLoop);
}

// ========== INITIALISATION ==========
window.addEventListener('load', () => {
    generateWorld();
    
    if (checkSaveExists()) {
        document.getElementById('continueBtn').style.display = 'block';
    }
});

function checkSaveExists() {
    return localStorage.getItem(SAVE_KEY) !== null;
}
</script>
