<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Fruit Ninja</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a00;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',Arial,sans-serif;height:100dvh}
#top-bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(26,10,0,0.9);z-index:10}
.top-btn{width:40px;height:40px;background:rgba(255,107,129,0.15);border:2px solid #ff6b81;border-radius:10px;color:#ff6b81;font-size:1.3rem;display:flex;align-items:center;justify-content:center;text-decoration:none;-webkit-tap-highlight-color:transparent}
#score-disp{color:#ffd93d;font-size:1.3rem;font-weight:bold}
#combo-disp{color:#ff6b81;font-size:0.9rem;font-weight:bold}
#lives-disp{color:#e74c3c;font-size:1.1rem}
canvas{display:block;width:100%;height:100%}
#overlay{position:fixed;inset:0;background:rgba(26,10,0,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
#overlay.hidden{display:none}
#overlay h2{font-size:2rem;color:#ff6b81;margin-bottom:10px}
#overlay p{color:#f0a060;font-size:1rem;margin-bottom:5px;line-height:1.5}
.ov-score{font-size:2rem;color:#ffd93d;margin:12px 0}
#overlay button{margin-top:14px;padding:14px 40px;font-size:1.2rem;background:rgba(255,107,129,0.15);border:2px solid #ff6b81;border-radius:12px;color:#ff6b81;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent}
#overlay a{display:inline-block;margin-top:14px;color:#f0a060;font-size:0.95rem;text-decoration:none}
</style>
</head>
<body>
<div id="top-bar">
    <a href="index.html" class="top-btn">🏠</a>
    <span id="score-disp">0</span>
    <span id="combo-disp"></span>
    <span id="lives-disp">❌❌❌</span>
</div>
<canvas id="c"></canvas>
<div id="overlay">
    <h2 id="ovTitle">🍉 Fruit Ninja</h2>
    <p id="ovMsg">Glisse pour trancher les fruits !<br>Évite les bombes 💣<br>Coupe plusieurs fruits d'un coup pour des combos !</p>
    <div class="ov-score" id="ovScore"></div>
    <button id="ovBtn">Jouer !</button>
    <a href="index.html">← Menu</a>
</div>
<script src="leaderboard.js"></script>
<script>
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('score-disp'),comboEl=document.getElementById('combo-disp'),livesEl=document.getElementById('lives-disp');
var overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovMsg=document.getElementById('ovMsg'),ovScore=document.getElementById('ovScore'),ovBtn=document.getElementById('ovBtn');

var W,H;
var FRUITS=[
    {emoji:'🍎',color:'#e74c3c',pts:10},{emoji:'🍊',color:'#f39c12',pts:10},
    {emoji:'🍋',color:'#f1c40f',pts:10},{emoji:'🍇',color:'#8e44ad',pts:15},
    {emoji:'🍉',color:'#27ae60',pts:15},{emoji:'🍌',color:'#ffd93d',pts:10},
    {emoji:'🥝',color:'#2ecc71',pts:12},{emoji:'🍑',color:'#e91e63',pts:12},
    {emoji:'🥥',color:'#ecf0f1',pts:20}
];
var fruits,slices,trail,particles;
var score,lives,maxLives,running,animId,frameCount,spawnCd;
var slicing=false,sliceX,sliceY,sliceTrail,comboCount,comboTimer;
var slicedCount=0;

function resize(){
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=W;canvas.height=H;
}

function startGame(){
    resize();fruits=[];slices=[];trail=[];particles=[];
    score=0;lives=3;maxLives=3;running=true;frameCount=0;spawnCd=0;
    comboCount=0;comboTimer=0;sliceTrail=[];slicedCount=0;
    overlay.classList.add('hidden');updateHUD();
    if(animId)cancelAnimationFrame(animId);loop();
}

function updateHUD(){
    scoreEl.textContent=score;
    livesEl.textContent='❌'.repeat(lives);
    comboEl.textContent=comboCount>1?'x'+comboCount+' COMBO !':'';
}

function getDifficulty(){
    // tier 0: 0-49 sliced, tier 1: 50-99, tier 2: 100-149, etc.
    var tier=Math.floor(slicedCount/50);
    return {
        bombChance: Math.min(0.01+tier*0.01, 0.15),   // 1%→15%
        minBatch: 1,
        maxBatch: Math.min(1+tier, 6),                 // 1→6
        spawnDelay: Math.max(35, 80-tier*8),            // 80→35 frames
        launchMin: 0.008+tier*0.0015,                   // slower→faster
        launchMax: 0.003+tier*0.001,
        gravity: Math.min(0.05+tier*0.01, 0.15),        // 0.05→0.15
        hSpeed: 0.6+tier*0.25                            // horizontal
    };
}

function spawnFruit(){
    var d=getDifficulty();
    var isBomb=Math.random()<d.bombChance;
    var f=isBomb?null:FRUITS[Math.floor(Math.random()*FRUITS.length)];
    var sz=W*0.09+Math.random()*W*0.04;
    var x=W*0.15+Math.random()*W*0.7;
    var vx=(Math.random()-0.5)*d.hSpeed;
    var vy=-(H*d.launchMin+Math.random()*H*d.launchMax);
    fruits.push({x:x,y:H+sz,vx:vx,vy:vy,grav:d.gravity,size:sz,type:f,bomb:isBomb,sliced:false,rotation:Math.random()*6.28,rotSpeed:(Math.random()-0.5)*0.12});
}

function spawnSliceParts(f){
    var col=f.bomb?'#333':f.type.color;
    for(var i=0;i<8;i++){
        particles.push({x:f.x,y:f.y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8-2,
            size:f.size*0.15+Math.random()*f.size*0.15,color:col,life:25+Math.random()*10});
    }
    // Two halves
    if(!f.bomb){
        slices.push({x:f.x-f.size*0.15,y:f.y,vx:-2-Math.random()*2,vy:-3,size:f.size*0.45,emoji:f.type.emoji,rot:0,rotS:-0.1,life:30});
        slices.push({x:f.x+f.size*0.15,y:f.y,vx:2+Math.random()*2,vy:-3,size:f.size*0.45,emoji:f.type.emoji,rot:0,rotS:0.1,life:30});
    }
}

function update(){
    frameCount++;
    // Spawn
    spawnCd--;
    if(spawnCd<=0){
        var d=getDifficulty();
        var batch=d.minBatch+Math.floor(Math.random()*(d.maxBatch-d.minBatch+1));
        for(var i=0;i<batch;i++)setTimeout(spawnFruit,i*150);
        spawnCd=d.spawnDelay+Math.floor(Math.random()*20);
    }
    // Update fruits
    for(var i=fruits.length-1;i>=0;i--){
        var f=fruits[i];
        f.x+=f.vx;f.y+=f.vy;f.vy+=f.grav;f.rotation+=f.rotSpeed;
        if(f.y>H+f.size*2){
            fruits.splice(i,1);
        }
    }
    // Slices
    for(var i=slices.length-1;i>=0;i--){
        var s=slices[i];s.x+=s.vx;s.y+=s.vy;s.vy+=0.4;s.rot+=s.rotS;
        if(--s.life<=0)slices.splice(i,1);
    }
    // Particles
    for(var i=particles.length-1;i>=0;i--){
        var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.vx*=0.97;
        if(--p.life<=0)particles.splice(i,1);
    }
    // Trail fade
    for(var i=trail.length-1;i>=0;i--){if(--trail[i].life<=0)trail.splice(i,1);}
    // Combo timer
    if(comboTimer>0){comboTimer--;if(comboTimer===0){comboCount=0;updateHUD();}}
}

function checkSlice(x,y){
    if(!running)return;
    var hit=0;
    for(var i=0;i<fruits.length;i++){
        var f=fruits[i];if(f.sliced)continue;
        var dx=x-f.x,dy=y-f.y;
        if(Math.sqrt(dx*dx+dy*dy)<f.size*0.6){
            f.sliced=true;
            if(f.bomb){lives=0;spawnSliceParts(f);updateHUD();gameOver();return;}
            hit++;
            slicedCount++;
            spawnSliceParts(f);
        }
    }
    if(hit>0){
        comboCount+=hit;comboTimer=20;
        var pts=hit*10;
        if(hit>=3)pts+=hit*15;
        if(comboCount>=5)pts*=2;
        score+=pts;
        updateHUD();
    }
}

function gameOver(){
    running=false;
    ovTitle.textContent='🍉 Game Over !';
    ovMsg.textContent='Tu as raté trop de fruits !';
    ovScore.textContent=score+' pts';
    ovBtn.textContent='Rejouer';
    overlay.classList.remove('hidden');
    if(score>0){var n=Leaderboard.promptName();if(n)Leaderboard.add('fruitninja',score,n);}
}

function draw(){
    ctx.fillStyle='#1a0a00';ctx.fillRect(0,0,W,H);
    // Background gradient
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0500');g.addColorStop(1,'#1a0a00');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // Trail
    for(var i=0;i<trail.length;i++){
        var t=trail[i];
        ctx.strokeStyle='rgba(255,255,255,'+(t.life/12)+')';
        ctx.lineWidth=3;ctx.lineCap='round';
        if(t.px!==undefined){ctx.beginPath();ctx.moveTo(t.px,t.py);ctx.lineTo(t.x,t.y);ctx.stroke();}
    }
    // Slice halves
    for(var i=0;i<slices.length;i++){
        var s=slices[i];
        ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
        ctx.globalAlpha=s.life/30;
        ctx.font=Math.floor(s.size)+'px sans-serif';ctx.textAlign='center';
        ctx.fillText(s.emoji,0,s.size*0.3);
        ctx.restore();ctx.globalAlpha=1;
    }
    // Fruits
    for(var i=0;i<fruits.length;i++){
        var f=fruits[i];if(f.sliced)continue;
        ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rotation);
        ctx.font=Math.floor(f.size)+'px sans-serif';ctx.textAlign='center';
        ctx.fillText(f.bomb?'💣':f.type.emoji,0,f.size*0.3);
        ctx.restore();
    }
    // Particles
    for(var i=0;i<particles.length;i++){
        var p=particles[i];
        ctx.globalAlpha=p.life/35;ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

function loop(){if(!running)return;update();draw();animId=requestAnimationFrame(loop);}

var lastTx,lastTy;
canvas.addEventListener('touchstart',function(e){e.preventDefault();
    slicing=true;var t=e.touches[0];lastTx=t.clientX;lastTy=t.clientY;
},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();
    if(!slicing)return;var t=e.touches[0];
    trail.push({x:t.clientX,y:t.clientY,px:lastTx,py:lastTy,life:10});
    checkSlice(t.clientX,t.clientY);
    lastTx=t.clientX;lastTy=t.clientY;
},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();slicing=false;},{passive:false});

// Mouse
var mouseDown=false;
canvas.addEventListener('mousedown',function(e){mouseDown=true;lastTx=e.clientX;lastTy=e.clientY;});
canvas.addEventListener('mousemove',function(e){
    if(!mouseDown)return;
    trail.push({x:e.clientX,y:e.clientY,px:lastTx,py:lastTy,life:10});
    checkSlice(e.clientX,e.clientY);lastTx=e.clientX;lastTy=e.clientY;
});
canvas.addEventListener('mouseup',function(){mouseDown=false;});

ovBtn.addEventListener('click',startGame);
window.addEventListener('resize',resize);
resize();
</script>
</body>
</html>
