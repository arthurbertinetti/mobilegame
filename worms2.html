function drawWeaponMenu(ctx) {
    // Now handled by HTML weapon menu UI
    return;

    ctx.save();
    // Draw in screen space
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    const cols = 4;
    const cellW = 110, cellH = 44;
    const rows = Math.ceil(WEAPONS.length / cols);
    const totalW = cols * cellW + 20;
    const totalH = rows * cellH + 20;
    const sx = (canvas.width - totalW) / 2;
    const sy = (canvas.height - totalH) / 2;

    // Background
    ctx.fillStyle = 'rgba(0,0,0,.85)';
    ctx.beginPath();
    ctx.roundRect(sx, sy, totalW, totalH, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Items
    WEAPONS.forEach((w, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const bx = sx + 10 + col * cellW;
        const by = sy + 10 + row * cellH;

        const isSelected = i === currentWeaponIdx;
        ctx.fillStyle = isSelected ? 'rgba(255,217,61,.25)' : 'rgba(255,255,255,.05)';
        ctx.beginPath();
        ctx.roundRect(bx, by, cellW - 6, cellH - 6, 6);
        ctx.fill();
        if (isSelected) {
            ctx.strokeStyle = '#ffd93d';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.fillStyle = '#fff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(`${w.icon} ${w.name}`, bx + 6, by + cellH / 2 + 1);
    });

    ctx.restore();
}

// ============================================================
//  GAME LOGIC
// ============================================================
function initGame(vsAI) {
    isAI = vsAI;
    generateTerrain();
    generateDecorations();
    teams = [[], []];
    const names0 = ['Alpha', 'Bravo', 'Charlie', 'Delta'];
    const names1 = ['Echo', 'Foxtrot', 'Golf', 'Hotel'];
    for (let i = 0; i < WORMS_PER_TEAM; i++) {
        const x0 = 200 + i * 160 + Math.random() * 80;
        teams[0].push(new Worm(0, names0[i], x0));
    }
    for (let i = 0; i < WORMS_PER_TEAM; i++) {
        const x1 = WORLD_W - 200 - i * 160 - Math.random() * 80;
        teams[1].push(new Worm(1, names1[i], x1));
    }
    currentTeam = 0;
    currentWormIdx = [0, 0];
    currentWeaponIdx = 0;
    wind = (Math.random() - 0.5) * 10;
    projectiles = [];
    droppedItems = [];
    particles = [];
    showWeaponMenu = false;
    teleportMode = false;
    airstrikeTargetMode = false;
    targetMode = false;
    gameState = 'playing';
    startTurn();
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('weapon-menu').style.display = 'none';
}

function startTurn() {
    turnTimer = TURN_TIME;
    turnTimerFrames = TURN_TIME * 60;
    charging = false;
    chargeAmount = 0;
    moveDir = 0;
    aimDir = 0;
    showWeaponMenu = false;
    teleportMode = false;
    airstrikeTargetMode = false;
    targetMode = false;

    const worm = getCurrentWorm();
    if (worm) {
        camera.follow(worm.x, worm.y);
    }

    updateHUD();
    exitTargetMode();

    if (isAI && currentTeam === 1) {
        aiThinkTimer = 60; // AI waits 1 second before acting
    }

    showMessage(`${currentTeam === 0 ? 'Team Red' : 'Team Blue'} — ${worm ? worm.name : '???'}`, 90);
}

function endTurn() {
    gameState = 'turnTransition';
    transitionTimer = 90;
}

function switchTeam() {
    currentTeam = 1 - currentTeam;
    // Advance to next alive worm
    const team = teams[currentTeam];
    let idx = (currentWormIdx[currentTeam] + 1) % team.length;
    let tries = 0;
    while (!team[idx].alive && tries < team.length) {
        idx = (idx + 1) % team.length;
        tries++;
    }
    currentWormIdx[currentTeam] = idx;

    // New wind
    wind += (Math.random() - 0.5) * 4;
    wind = Math.max(-10, Math.min(10, wind));

    startTurn();
}

function checkWinCondition() {
    const alive0 = teams[0].filter(w => w.alive).length;
    const alive1 = teams[1].filter(w => w.alive).length;
    if (alive0 === 0 && alive1 === 0) {
        showMessage('🤝 DRAW!', 300);
        gameState = 'gameOver';
        return true;
    }
    if (alive0 === 0) {
        showMessage('🔵 Team Blue Wins!', 300);
        gameState = 'gameOver';
        return true;
    }
    if (alive1 === 0) {
        showMessage('🔴 Team Red Wins!', 300);
        gameState = 'gameOver';
        return true;
    }
    return false;
}

function showMessage(text, frames) {
    msgText = text;
    msgTimer = frames;
    document.getElementById('game-msg').textContent = text;
    document.getElementById('game-msg').style.display = 'block';
}

function updateHUD() {
    // Team boxes
    for (let t = 0; t < 2; t++) {
        const box = document.getElementById(`team${t}-box`);
        box.classList.toggle('active', t === currentTeam);
        const totalHp = teams[t].reduce((s, w) => s + w.hp, 0);
        const maxTotal = teams[t].length * MAX_HP;
        document.getElementById(`team${t}-hp`).style.width = (totalHp / maxTotal * 100) + '%';
    }
    // Wind
    const windEl = document.getElementById('wind-val');
    const absW = Math.abs(wind).toFixed(1);
    windEl.textContent = (wind > 0 ? '→ ' : wind < 0 ? '← ' : '') + absW;
    // Weapon
    const wn = document.getElementById('weapon-name');
    wn.textContent = WEAPONS[currentWeaponIdx].icon + ' ' + WEAPONS[currentWeaponIdx].name;
    wn.style.display = gameState === 'playing' ? 'block' : 'none';
}

// ============================================================
//  AI
// ============================================================
function aiTurn() {
    const worm = getCurrentWorm();
    if (!worm || !worm.alive) { endTurn(); return; }

    const target = findClosestEnemy(worm.x, worm.y, 1);
    if (!target) { endTurn(); return; }

    const dx = target.x - worm.x;
    const dy = (target.y + WORM_H / 2) - (worm.y + 6);
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Choose weapon
    if (dist < 50) {
        const meleeWeapons = ['Baseball Bat', 'Fire Punch', 'Prod', 'Dynamite'];
        const pick = meleeWeapons[Math.floor(Math.random() * meleeWeapons.length)];
        currentWeaponIdx = WEAPONS.findIndex(w => w.name === pick);
        if (currentWeaponIdx < 0) currentWeaponIdx = 0;
    } else if (dist > 500) {
        const longRange = ['Homing Missile', 'Air Strike', 'Mortar', 'Carpet Bomb'];
        const pick = longRange[Math.floor(Math.random() * longRange.length)];
        currentWeaponIdx = WEAPONS.findIndex(w => w.name === pick);
        if (currentWeaponIdx < 0) currentWeaponIdx = 0;
    } else {
        const midRange = ['Bazooka', 'Grenade', 'Cluster Bomb', 'Shotgun', 'Banana Bomb', 'Dragon Ball', 'Sheep Launcher'];
        const pick = midRange[Math.floor(Math.random() * midRange.length)];
        currentWeaponIdx = WEAPONS.findIndex(w => w.name === pick);
        if (currentWeaponIdx < 0) currentWeaponIdx = 0;
    }

    const weapon = WEAPONS[currentWeaponIdx];
    worm.facing = dx > 0 ? 1 : -1;

    // Melee
    if (weapon.type === 'melee') {
        if (dist < weapon.range) {
            applyExplosionDamage(target.x, target.y + WORM_H / 2, weapon.range, weapon.damage);
            // Knockback
            const kbAngle = Math.atan2(dy, dx);
            target.vx += Math.cos(kbAngle) * (weapon.knockback || 8);
            target.vy += Math.sin(kbAngle) * (weapon.knockback || 8) - 4;
            camera.addShake(6);
            particles.push(...createExplosionParticles(target.x, target.y + WORM_H / 2, 10));
        }
        endTurn();
        return;
    }

    // Aim
    let angle = Math.atan2(dy, Math.abs(dx));
    // Adjust for gravity (rough compensation)
    angle -= 0.15 + dist * 0.0003;
    worm.aimAngle = angle;

    const power = Math.min(1, 0.4 + dist * 0.001);
    const speed = weapon.speed * power;

    fireWeapon(worm, speed);
}

// ============================================================
//  FIRE WEAPON
// ============================================================
function fireWeapon(worm, speed) {
    const weapon = WEAPONS[currentWeaponIdx];
    const ox = worm.x;
    const oy = worm.y + 6;
    const angle = worm.aimAngle;

    if (weapon.type === 'hitscan') {
        // Shotgun: raycast
        for (let s = 0; s < (weapon.shots || 1); s++) {
            const spread = (Math.random() - 0.5) * 0.15;
            const a = angle + spread;
            const dirX = Math.cos(a) * worm.facing;
            const dirY = Math.sin(a);
            let hit = false;
            for (let d = 0; d < (weapon.range || 200); d += 2) {
                const px = ox + dirX * d;
                const py = oy + dirY * d;
                if (isTerrainSolid(Math.floor(px), Math.floor(py))) {
                    destroyTerrain(px, py, weapon.radius);
                    applyExplosionDamage(px, py, weapon.radius * 2, weapon.damage);
                    particles.push(...createExplosionParticles(px, py, 8));
                    hit = true;
                    break;
                }
                // Check worms
                for (const team of teams) {
                    for (const w of team) {
                        if (w === worm || !w.alive) continue;
                        if (Math.abs(w.x - px) < 10 && Math.abs(w.y + WORM_H / 2 - py) < 14) {
                            w.takeDamage(weapon.damage);
                            w.vx += dirX * 5;
                            w.vy += dirY * 5 - 3;
                            particles.push(...createExplosionParticles(px, py, 6));
                            hit = true;
                            break;
                        }
                    }
                    if (hit) break;
                }
                if (hit) break;
            }
        }
        camera.addShake(4);
        endTurn();
        return;
    }

    if (weapon.type === 'melee') {
        // Baseball bat / fire punch
        const reach = weapon.range || 40;
        const hitX = ox + worm.facing * reach;
        const hitY = oy;
        for (const team of teams) {
            for (const w of team) {
                if (w === worm || !w.alive) continue;
                const dx = w.x - hitX, dy = (w.y + WORM_H / 2) - hitY;
                if (Math.sqrt(dx * dx + dy * dy) < reach) {
                    w.takeDamage(weapon.damage);
                    w.vx += worm.facing * (weapon.knockback || 10);
                    w.vy -= 6;
                }
            }
        }
        particles.push(...createExplosionParticles(hitX, hitY, 10));
        camera.addShake(6);
        endTurn();
        return;
    }

    if (weapon.type === 'drop') {
        // Dynamite — drop at feet
        droppedItems.push({
            type: 'dynamite',
            x: worm.x,
            y: worm.y + WORM_H - 8,
            weapon: weapon,
            timerFrames: (weapon.timer || 4) * 60,
            alive: true
        });
        gameState = 'firing';
        return;
    }

    if (weapon.type === 'airstrike') {
        // Fire 5 rockets from the sky at target area
        const targetX = mouseWorldX;
        for (let i = 0; i < (weapon.count || 5); i++) {
            setTimeout(() => {
                const px = targetX - 80 + i * 40 + (Math.random() - 0.5) * 20;
                const proj = new Projectile(px, camera.y - 50, 0, 8, {
                    name: 'AirStrike', type: 'projectile', damage: weapon.damage,
                    radius: weapon.radius, gravity: false
                }, currentTeam);
                projectiles.push(proj);
            }, i * 150);
        }
        airstrikeTargetMode = false;
        gameState = 'firing';
        return;
    }

    if (weapon.type === 'teleport') {
        // Already handled by click
        return;
    }

    // Kamikaze — worm charges forward and explodes
    if (weapon.type === 'kamikaze') {
        worm.kamikazeDir = worm.facing;
        worm.kamikazeTimer = 90; // 1.5 seconds
        gameState = 'firing';
        return;
    }

    // Rope — simplified: teleport forward in arc
    if (weapon.type === 'rope') {
        const dist = 200;
        const newX = worm.x + worm.facing * dist;
        const gy = findGround(Math.floor(Math.max(0, Math.min(WORLD_W - 1, newX))));
        worm.x = Math.max(10, Math.min(WORLD_W - 10, newX));
        worm.y = gy - WORM_H;
        worm.vx = 0; worm.vy = 0;
        particles.push(...createExplosionParticles(worm.x, worm.y + WORM_H / 2, 8, '#9b59b6'));
        endTurn();
        return;
    }

    // Earthquake — shake all worms, random damage + displacement
    if (weapon.type === 'earthquake') {
        camera.addShake(25);
        for (const team of teams) {
            for (const w of team) {
                if (!w.alive) continue;
                const dmg = 5 + Math.floor(Math.random() * 15);
                w.takeDamage(dmg);
                w.vy -= 3 + Math.random() * 5;
                w.vx += (Math.random() - 0.5) * 8;
                w.onGround = false;
            }
        }
        showMessage('🌋 EARTHQUAKE!', 60);
        endTurn();
        return;
    }

    // Girder — place a terrain bridge
    if (weapon.type === 'girder') {
        const gx = Math.floor(mouseWorldX);
        const gy = Math.floor(mouseWorldY);
        const gw = 100, gh = 12;
        const imgData = terrainData;
        for (let yy = gy - gh / 2; yy < gy + gh / 2; yy++) {
            for (let xx = gx - gw / 2; xx < gx + gw / 2; xx++) {
                const ix = Math.floor(xx), iy = Math.floor(yy);
                if (ix < 0 || ix >= WORLD_W || iy < 0 || iy >= WORLD_H) continue;
                const idx = (iy * WORLD_W + ix) * 4;
                imgData.data[idx] = 140;
                imgData.data[idx + 1] = 120;
                imgData.data[idx + 2] = 100;
                imgData.data[idx + 3] = 255;
            }
        }
        terrainCtx.putImageData(terrainData, 0, 0);
        rebuildDepthCanvas();
        endTurn();
        return;
    }

    // Guided (Super Sheep) — player controls with touch/mouse
    if (weapon.type === 'guided') {
        const vx = Math.cos(angle) * weapon.speed * worm.facing;
        const vy = Math.sin(angle) * weapon.speed;
        const proj = new Projectile(ox + Math.cos(angle) * 15 * worm.facing, oy + Math.sin(angle) * 15, vx, vy, weapon, currentTeam);
        proj.guided = true;
        projectiles.push(proj);
        gameState = 'firing';
        return;
    }

    // Standard projectile / grenade / homing
    const vx = Math.cos(angle) * speed * worm.facing;
    const vy = Math.sin(angle) * speed;
    const proj = new Projectile(ox + Math.cos(angle) * 15 * worm.facing, oy + Math.sin(angle) * 15, vx, vy, weapon, currentTeam);
    projectiles.push(proj);
    gameState = 'firing';
}

// ============================================================
//  MAIN LOOP
// ============================================================
function update() {
    if (gameState === 'menu' || gameState === 'gameOver') return;

    const worm = getCurrentWorm();

    // Turn transition
    if (gameState === 'turnTransition') {
        transitionTimer--;
        // Wait for all worms to settle (or timeout after 4 seconds)
        let allSettled = true;
        for (const team of teams) {
            for (const w of team) {
                if (w.alive && (Math.abs(w.vx) > 0.3 || Math.abs(w.vy) > 0.3 || !w.onGround)) {
                    allSettled = false;
                }
            }
        }
        // Force transition after extra wait if worms won't settle
        const forceTransition = transitionTimer <= -150;
        if ((transitionTimer <= 0 && allSettled) || forceTransition) {
            if (!checkWinCondition()) {
                switchTeam();
                gameState = 'playing';
            }
        }
    }

    // Playing
    if (gameState === 'playing' && worm && worm.alive) {
        // Timer
        turnTimerFrames--;
        turnTimer = Math.ceil(turnTimerFrames / 60);
        document.getElementById('turn-timer').textContent = turnTimer;
        if (turnTimerFrames <= 0) {
            endTurn();
        }

        // Movement
        if (moveDir !== 0 && !charging && !showWeaponMenu) {
            worm.vx += moveDir * 0.5;
            if (Math.abs(worm.vx) > MOVE_SPEED) worm.vx = moveDir * MOVE_SPEED;
            worm.facing = moveDir;
        }

        // Aim
        if (aimDir !== 0) {
            worm.aimAngle += aimDir * 0.03;
            worm.aimAngle = Math.max(-Math.PI * 0.85, Math.min(Math.PI * 0.15, worm.aimAngle));
        }

        // Charge
        if (charging) {
            chargeAmount = Math.min(chargeAmount + 1.5, 100);
            document.getElementById('power-bar-wrap').style.display = 'block';
            document.getElementById('power-bar-fill').style.width = chargeAmount + '%';
        }

        // Camera follow (disabled during target mode so user can pan freely)
        if (!targetMode) {
            camera.follow(worm.x, worm.y);
        }

        // AI
        if (isAI && currentTeam === 1) {
            if (aiThinkTimer > 0) {
                aiThinkTimer--;
                if (aiThinkTimer === 0) {
                    aiTurn();
                }
            }
        }
    }

    // Firing state — wait for projectiles to finish
    if (gameState === 'firing') {
        // Kamikaze movement
        if (worm && worm.kamikazeTimer > 0) {
            worm.kamikazeTimer--;
            worm.vx = worm.kamikazeDir * 6;
            worm.onGround = false;
            if (worm.kamikazeTimer <= 0 || isTerrainSolid(Math.floor(worm.x + worm.kamikazeDir * 12), Math.floor(worm.y + WORM_H / 2))) {
                const kw = WEAPONS[currentWeaponIdx];
                destroyTerrain(worm.x, worm.y + WORM_H / 2, kw.radius || 45);
                applyExplosionDamage(worm.x, worm.y + WORM_H / 2, kw.radius || 45, kw.damage || 50);
                particles.push(...createExplosionParticles(worm.x, worm.y + WORM_H / 2, 30));
                camera.addShake(12);
                worm.die();
                worm.kamikazeTimer = 0;
                endTurn();
            }
        }

        // Guided projectile steering toward mouse
        for (const p of projectiles) {
            if (p.alive && p.guided) {
                const dx = mouseWorldX - p.x;
                const dy = mouseWorldY - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 5) {
                    p.vx += (dx / dist) * 0.3;
                    p.vy += (dy / dist) * 0.3;
                    const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    if (spd > p.weapon.speed * 1.5) {
                        p.vx = (p.vx / spd) * p.weapon.speed * 1.5;
                        p.vy = (p.vy / spd) * p.weapon.speed * 1.5;
                    }
                }
            }
        }

        const anyActive = projectiles.some(p => p.alive) || droppedItems.some(d => d.alive) || (worm && worm.kamikazeTimer > 0);
        if (!anyActive) {
            endTurn();
        }
        // Follow first active projectile
        const active = projectiles.find(p => p.alive);
        if (active) camera.follow(active.x, active.y);
    }

    // Update all worms
    for (const team of teams) {
        for (const w of team) {
            w.update();
        }
    }

    // Update projectiles
    for (const p of projectiles) {
        p.update();
    }
    projectiles = projectiles.filter(p => p.alive || p.trail.length > 0);

    // Update dropped items (dynamite)
    for (const item of droppedItems) {
        if (!item.alive) continue;
        item.timerFrames--;
        if (item.timerFrames <= 0) {
            item.alive = false;
            destroyTerrain(item.x, item.y, item.weapon.radius);
            applyExplosionDamage(item.x, item.y, item.weapon.radius, item.weapon.damage);
            particles.push(...createExplosionParticles(item.x, item.y, 40));
            camera.addShake(item.weapon.radius / 2.5);
        }
    }
    droppedItems = droppedItems.filter(d => d.alive);

    // Update particles
    updateParticles();

    // Camera
    camera.update();

    // Message timer
    if (msgTimer > 0) {
        msgTimer--;
        if (msgTimer <= 0) {
            document.getElementById('game-msg').style.display = 'none';
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background (screen space)
    drawBackground(ctx);

    // World space
    camera.apply(ctx);

    // Terrain depth edge (2.5D extrusion — dark layer behind, shifted)
    ctx.globalAlpha = 0.5;
    ctx.drawImage(terrainDepthCanvas, 5, 7);
    ctx.globalAlpha = 1;

    // Main terrain
    ctx.drawImage(terrainCanvas, 0, 0);

    // Terrain surface highlight (top edge glow for light illusion)
    if (heightMap.length > 0) {
        // Bright rim
        ctx.strokeStyle = 'rgba(180,255,140,0.25)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        let started = false;
        for (let x = 0; x < WORLD_W; x += 3) {
            const top = Math.floor(heightMap[x]);
            if (top < WATER_LEVEL - 5 && isTerrainSolid(x, top + 1)) {
                if (!started) { ctx.moveTo(x, top); started = true; }
                else ctx.lineTo(x, top);
            } else { started = false; }
        }
        ctx.stroke();
        // Softer wider glow
        ctx.strokeStyle = 'rgba(255,255,200,0.08)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        started = false;
        for (let x = 0; x < WORLD_W; x += 4) {
            const top = Math.floor(heightMap[x]);
            if (top < WATER_LEVEL - 5 && isTerrainSolid(x, top + 1)) {
                if (!started) { ctx.moveTo(x, top - 1); started = true; }
                else ctx.lineTo(x, top - 1);
            } else { started = false; }
        }
        ctx.stroke();
    }

    // Decorations
    drawDecorations(ctx);

    // Water
    drawWater(ctx);

    // Dropped items
    drawDroppedItems(ctx);

    // Worms
    for (const team of teams) {
        for (const w of team) {
            w.draw(ctx);
        }
    }

    // Aim indicator
    if (gameState === 'playing') {
        drawAimIndicator(ctx, getCurrentWorm());
    }

    // Projectiles
    for (const p of projectiles) {
        p.draw(ctx);
    }

    // Particles
    drawParticles(ctx);

    camera.restore(ctx);

    // Target mode crosshair (screen space — always centered)
    if (targetMode) {
        const scx = canvas.width / 2;
        const scy = canvas.height / 2;
        const t = Date.now() * 0.003;
        const pulse = 28 + Math.sin(t) * 6;
        const rot = t * 0.5;

        ctx.save();

        // Outer glow
        ctx.shadowColor = 'rgba(255,60,60,.5)';
        ctx.shadowBlur = 15;

        // Rotating outer ring
        ctx.strokeStyle = 'rgba(255,60,60,.75)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(scx, scy, pulse, rot, rot + Math.PI * 1.5);
        ctx.stroke();

        // Second ring (counter-rotate)
        ctx.strokeStyle = 'rgba(255,200,60,.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(scx, scy, pulse + 8, -rot, -rot + Math.PI * 1.2);
        ctx.stroke();

        // Inner dot
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,80,80,.9)';
        ctx.beginPath();
        ctx.arc(scx, scy, 4, 0, Math.PI * 2);
        ctx.fill();

        // Cross lines with gaps
        ctx.strokeStyle = 'rgba(255,255,255,.7)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        // Left
        ctx.moveTo(scx - pulse - 14, scy); ctx.lineTo(scx - 10, scy);
        // Right
        ctx.moveTo(scx + 10, scy); ctx.lineTo(scx + pulse + 14, scy);
        // Top
        ctx.moveTo(scx, scy - pulse - 14); ctx.lineTo(scx, scy - 10);
        // Bottom
        ctx.moveTo(scx, scy + 10); ctx.lineTo(scx, scy + pulse + 14);
        ctx.stroke();

        // Corner chevrons
        ctx.strokeStyle = 'rgba(255,200,60,.6)';
        ctx.lineWidth = 2;
        const cs = pulse + 18;
        const cl = 10;
        // Top-left
        ctx.beginPath();
        ctx.moveTo(scx - cs, scy - cs + cl); ctx.lineTo(scx - cs, scy - cs); ctx.lineTo(scx - cs + cl, scy - cs);
        ctx.stroke();
        // Top-right
        ctx.beginPath();
        ctx.moveTo(scx + cs - cl, scy - cs); ctx.lineTo(scx + cs, scy - cs); ctx.lineTo(scx + cs, scy - cs + cl);
        ctx.stroke();
        // Bottom-left
        ctx.beginPath();
        ctx.moveTo(scx - cs, scy + cs - cl); ctx.lineTo(scx - cs, scy + cs); ctx.lineTo(scx - cs + cl, scy + cs);
        ctx.stroke();
        // Bottom-right
        ctx.beginPath();
        ctx.moveTo(scx + cs - cl, scy + cs); ctx.lineTo(scx + cs, scy + cs); ctx.lineTo(scx + cs, scy + cs - cl);
        ctx.stroke();

        ctx.restore();
    }

    // Weapon menu (screen space)
    drawWeaponMenu(ctx);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// ============================================================
//  CONTROLS
// ============================================================
const keys = {};

document.addEventListener('keydown', e => {
    if (gameState !== 'playing') {
        if (gameState === 'gameOver' && e.key === 'Escape') {
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('weapon-name').style.display = 'none';
            document.getElementById('power-bar-wrap').style.display = 'none';
            document.getElementById('game-msg').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('weapon-menu').style.display = 'none';
            gameState = 'menu';
        }
        return;
    }
    if (isAI && currentTeam === 1) return;
    if (keys[e.key]) return;
    keys[e.key] = true;

    if (showWeaponMenu) {
        // Navigate weapon menu with number keys or arrows
        if (e.key === 'Escape' || e.key === 'e' || e.key === 'E') {
            closeWeaponMenu();
        }
        if (e.key >= '1' && e.key <= '9') {
            const idx = parseInt(e.key) - 1;
            if (idx < WEAPONS.length) {
                currentWeaponIdx = idx;
                closeWeaponMenu();
                updateHUD();
            }
        }
        if (e.key === 'ArrowRight') {
            currentWeaponIdx = (currentWeaponIdx + 1) % WEAPONS.length;
            updateHUD();
            buildWeaponGrid();
        }
        if (e.key === 'ArrowLeft') {
            currentWeaponIdx = (currentWeaponIdx - 1 + WEAPONS.length) % WEAPONS.length;
            updateHUD();
            buildWeaponGrid();
        }
        if (e.key === 'Enter') {
            closeWeaponMenu();
        }
        return;
    }

    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveDir = -1;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveDir = 1;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') aimDir = -1;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') aimDir = 1;

    if (e.key === ' ' || e.key === 'Space') {
        const worm = getCurrentWorm();
        if (worm && worm.onGround) {
            worm.vy = JUMP_FORCE;
            worm.onGround = false;
        }
    }

    if (e.key === 'e' || e.key === 'E') {
        toggleWeaponMenu();
    }

    if (e.key === 'Tab') {
        e.preventDefault();
        currentWeaponIdx = (currentWeaponIdx + 1) % WEAPONS.length;
        updateHUD();
    }
});

document.addEventListener('keyup', e => {
    keys[e.key] = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (moveDir === -1) moveDir = 0;
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (moveDir === 1) moveDir = 0;
    }
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        if (aimDir === -1) aimDir = 0;
    }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        if (aimDir === 1) aimDir = 0;
    }
});

// Mouse controls
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const world = camera.screenToWorld(sx, sy);
    mouseWorldX = world.x;
    mouseWorldY = world.y;

    // Update aim angle based on mouse
    if (gameState === 'playing' && !showWeaponMenu) {
        const worm = getCurrentWorm();
        if (worm && worm.alive && !(isAI && currentTeam === 1)) {
            const dx = mouseWorldX - worm.x;
            const dy = mouseWorldY - (worm.y + 6);
            worm.facing = dx > 0 ? 1 : -1;
            worm.aimAngle = Math.atan2(dy, Math.abs(dx));
            worm.aimAngle = Math.max(-Math.PI * 0.85, Math.min(Math.PI * 0.15, worm.aimAngle));
        }
    }
});

canvas.addEventListener('mousedown', e => {
    if (gameState !== 'playing') return;
    if (isAI && currentTeam === 1) return;
    if (showWeaponMenu) {
        // HTML weapon menu handles clicks, just close on canvas click
        closeWeaponMenu();
        return;
    }

    const weapon = WEAPONS[currentWeaponIdx];

    // Teleport
    if (weapon.type === 'teleport') {
        const worm = getCurrentWorm();
        if (worm) {
            const gy = findGround(Math.floor(mouseWorldX));
            worm.x = mouseWorldX;
            worm.y = gy - WORM_H;
            worm.vx = 0;
            worm.vy = 0;
            particles.push(...createExplosionParticles(worm.x, worm.y + WORM_H / 2, 12, '#9b59b6'));
            endTurn();
        }
        return;
    }

    // Airstrike
    if (weapon.type === 'airstrike') {
        const worm = getCurrentWorm();
        if (worm) {
            fireWeapon(worm, 0);
        }
        return;
    }

    // Start charging
    charging = true;
    chargeAmount = 0;
});

canvas.addEventListener('mouseup', e => {
    if (!charging) return;
    charging = false;
    document.getElementById('power-bar-wrap').style.display = 'none';
    if (gameState !== 'playing') return;

    const worm = getCurrentWorm();
    if (!worm || !worm.alive) return;

    const weapon = WEAPONS[currentWeaponIdx];
    const power = chargeAmount / 100;
    const speed = weapon.speed * (0.3 + power * 0.7);
    fireWeapon(worm, speed);
    chargeAmount = 0;
});

// Right click → weapon menu
canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (gameState === 'playing') {
        toggleWeaponMenu();
    }
});

// Touch support — panning the map only
let touchId = null;
let touchStartX = 0, touchStartY = 0;
let camStartX = 0, camStartY = 0;
let touchPanning = false;

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (showWeaponMenu) { closeWeaponMenu(); return; }
    const t = e.changedTouches[0];
    touchId = t.identifier;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    camStartX = camera.x;
    camStartY = camera.y;
    touchPanning = false;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier === touchId) {
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            // Only start panning after a small threshold
            if (!touchPanning && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                touchPanning = true;
            }
            if (touchPanning) {
                const nx = camStartX - dx;
                const ny = camStartY - dy;
                // Clamp to world bounds
                camera.x = Math.max(0, Math.min(WORLD_W - canvas.width, nx));
                camera.y = Math.max(0, Math.min(WORLD_H - canvas.height, ny));
                camera.targetX = camera.x;
                camera.targetY = camera.y;
            }
        }
    }
}, { passive: false });

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier === touchId) {
            // If it was a tap (not a pan) in target mode, update target position
            if (!touchPanning && targetMode) {
                const rect = canvas.getBoundingClientRect();
                const sx = t.clientX - rect.left;
                const sy = t.clientY - rect.top;
                const world = camera.screenToWorld(sx, sy);
                targetWorldX = world.x;
                targetWorldY = world.y;
            }
            touchId = null;
            touchPanning = false;
        }
    }
}, { passive: false });

// ============================================================
//  TOUCH CONTROL BUTTONS
// ============================================================
function holdButton(btnId, onDown, onUp) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const start = (e) => { e.preventDefault(); btn.classList.add('pressed'); onDown(); };
    const end = (e) => { e.preventDefault(); btn.classList.remove('pressed'); if (onUp) onUp(); };
    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', end, { passive: false });
    btn.addEventListener('touchcancel', end, { passive: false });
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
}

holdButton('btn-left', () => { moveDir = -1; }, () => { if (moveDir === -1) moveDir = 0; });
holdButton('btn-right', () => { moveDir = 1; }, () => { if (moveDir === 1) moveDir = 0; });
holdButton('btn-aim-up', () => { aimDir = -1; }, () => { if (aimDir === -1) aimDir = 0; });
holdButton('btn-aim-down', () => { aimDir = 1; }, () => { if (aimDir === 1) aimDir = 0; });

holdButton('btn-jump', () => {
    if (gameState !== 'playing') return;
    if (isAI && currentTeam === 1) return;
    const worm = getCurrentWorm();
    if (worm && worm.onGround) {
        worm.vy = JUMP_FORCE;
        worm.onGround = false;
    }
}, null);

// Fire button — hold to charge, release to fire
(function() {
    const btn = document.getElementById('btn-fire');
    if (!btn) return;
    const startFire = (e) => {
        e.preventDefault();
        btn.classList.add('pressed');
        if (gameState !== 'playing') return;
        if (isAI && currentTeam === 1) return;
        const weapon = WEAPONS[currentWeaponIdx];
        // Target-mode weapons: enter target mode instead
        if (isTargetWeapon(weapon)) {
            enterTargetMode();
            return;
        }
        if (weapon.type === 'teleport') {
            enterTargetMode();
            return;
        }
        charging = true;
        chargeAmount = 0;
    };
    const endFire = (e) => {
        e.preventDefault();
        btn.classList.remove('pressed');
        if (!charging) return;
        charging = false;
        document.getElementById('power-bar-wrap').style.display = 'none';
        if (gameState !== 'playing') return;
        const worm = getCurrentWorm();
        if (!worm || !worm.alive) return;
        const weapon = WEAPONS[currentWeaponIdx];
        const power = chargeAmount / 100;
        const speed = weapon.speed * (0.3 + power * 0.7);
        fireWeapon(worm, speed);
        chargeAmount = 0;
    };
    btn.addEventListener('touchstart', startFire, { passive: false });
    btn.addEventListener('touchend', endFire, { passive: false });
    btn.addEventListener('touchcancel', endFire, { passive: false });
    btn.addEventListener('mousedown', startFire);
    btn.addEventListener('mouseup', endFire);
    btn.addEventListener('mouseleave', endFire);
})();

// Confirm button — confirm target placement
document.getElementById('btn-confirm').addEventListener('click', (e) => {
    e.preventDefault();
    if (!targetMode) return;
    confirmTarget();
});

// ============================================================
//  TARGET MODE (airstrike, girder, teleport, etc.)
// ============================================================
function isTargetWeapon(weapon) {
    return weapon.type === 'airstrike' || weapon.type === 'girder' || weapon.type === 'teleport';
}

function enterTargetMode() {
    targetMode = true;
    // Center target on screen center initially
    const center = camera.screenToWorld(canvas.width / 2, canvas.height / 2);
    targetWorldX = center.x;
    targetWorldY = center.y;
    // Show confirm button, hide fire button
    document.getElementById('btn-fire').style.display = 'none';
    document.getElementById('btn-confirm').style.display = 'flex';
    const weapon = WEAPONS[currentWeaponIdx];
    const msg = document.getElementById('target-msg');
    if (weapon.type === 'teleport') {
        msg.textContent = '⚡ Glissez pour choisir, puis ✅ pour téléporter';
    } else if (weapon.type === 'girder') {
        msg.textContent = '🪵 Glissez pour placer la poutre, puis ✅';
    } else {
        msg.textContent = '💣 Glissez pour cibler, puis ✅ pour lancer';
    }
    msg.style.display = 'block';
}

function exitTargetMode() {
    targetMode = false;
    document.getElementById('btn-fire').style.display = 'flex';
    document.getElementById('btn-confirm').style.display = 'none';
    document.getElementById('target-msg').style.display = 'none';
}

function confirmTarget() {
    if (!targetMode) return;
    const worm = getCurrentWorm();
    if (!worm || !worm.alive) { exitTargetMode(); return; }
    const weapon = WEAPONS[currentWeaponIdx];

    // Use center of screen as target
    const center = camera.screenToWorld(canvas.width / 2, canvas.height / 2);
    mouseWorldX = center.x;
    mouseWorldY = center.y;

    if (weapon.type === 'teleport') {
        const gy = findGround(Math.floor(mouseWorldX));
        worm.x = mouseWorldX;
        worm.y = gy - WORM_H;
        worm.vx = 0;
        worm.vy = 0;
        particles.push(...createExplosionParticles(worm.x, worm.y + WORM_H / 2, 12, '#9b59b6'));
        exitTargetMode();
        endTurn();
        return;
    }

    // Airstrike / girder — fireWeapon uses mouseWorldX/Y
    exitTargetMode();
    fireWeapon(worm, 0);
}

// Weapon button — open weapon menu
document.getElementById('btn-weapon').addEventListener('click', (e) => {
    e.preventDefault();
    toggleWeaponMenu();
});

// ============================================================
//  WEAPON SELECTION UI
// ============================================================
function buildWeaponGrid() {
    const grid = document.getElementById('weapon-grid');
    grid.innerHTML = '';
    WEAPONS.forEach((w, i) => {
        const item = document.createElement('div');
        item.className = 'weapon-item' + (i === currentWeaponIdx ? ' selected' : '');
        item.innerHTML = `<span class="wicon">${w.icon}</span><span class="wname">${w.name}</span>`;
        item.addEventListener('click', (e) => {
            e.preventDefault();
            currentWeaponIdx = i;
            updateHUD();
            closeWeaponMenu();
        });
        grid.appendChild(item);
    });
}

function toggleWeaponMenu() {
    const menu = document.getElementById('weapon-menu');
    if (menu.style.display === 'flex') {
        closeWeaponMenu();
    } else {
        buildWeaponGrid();
        menu.style.display = 'flex';
        showWeaponMenu = true;
    }
}

function closeWeaponMenu() {
    document.getElementById('weapon-menu').style.display = 'none';
    showWeaponMenu = false;
    exitTargetMode();
    // Auto-enter target mode if target weapon selected
    const w = WEAPONS[currentWeaponIdx];
    if (isTargetWeapon(w)) {
        enterTargetMode();
    }
}

function buildRulesContent() {

    html += '<p><b>But du jeu :</b> Éliminer tous les vers de l\'équipe adverse.</p>';
    html += '<p><b>Tour par tour :</b> Chaque équipe joue alternativement. Vous avez 30 secondes par tour.</p>';

    html += '</div>';

    // Weapons
    html += '<div class="rules-section"><h3>🔫 Arsenal (' + WEAPONS.length + ' armes)</h3>';
    WEAPONS.forEach(w => {
        const desc = WEAPON_DESCRIPTIONS[w.name] || '';
        let stats = '';
        if (w.damage) stats += 'Dégâts: ' + w.damage;
        if (w.radius) stats += (stats ? ' · ' : '') + 'Rayon: ' + w.radius;
        if (w.range) stats += (stats ? ' · ' : '') + 'Portée: ' + w.range;
        if (w.shots) stats += (stats ? ' · ' : '') + 'Tirs: ' + w.shots;
        if (w.timer) stats += (stats ? ' · ' : '') + 'Timer: ' + w.timer + 's';
        if (w.cluster) stats += (stats ? ' · ' : '') + 'Fragments: ' + w.cluster;
        if (w.knockback) stats += (stats ? ' · ' : '') + 'Recul: ' + w.knockback;
        html += '<div class="weapon-rule">';

        if (stats) html += '<div class="wr-stats">' + stats + '</div>';

    });

    container.innerHTML = html;
}
