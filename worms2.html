<style>

html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}

<script>
'use strict';

// ============================================================
//  CONSTANTS
// ============================================================
const WORLD_W = 3200, WORLD_H = 1400;
const WATER_LEVEL = WORLD_H - 100;
const GRAVITY = 0.15;
const WORM_W = 18, WORM_H = 28;
const WORMS_PER_TEAM = 3;
const TURN_TIME = 30;
const MAX_HP = 100;
const MOVE_SPEED = 2;
const JUMP_FORCE = -6;

// ============================================================
//  TERRAIN (pixel-based via ImageData)
// ============================================================
const terrainCanvas = document.createElement('canvas');
terrainCanvas.width = WORLD_W;
terrainCanvas.height = WORLD_H;
const terrainCtx = terrainCanvas.getContext('2d');
let terrainData = null; // ImageData
let heightMap = [];
const terrainDepthCanvas = document.createElement('canvas');
terrainDepthCanvas.width = WORLD_W;
terrainDepthCanvas.height = WORLD_H;
const depthCtx = terrainDepthCanvas.getContext('2d');

function noise(x, seed) {
    let n = Math.sin(x * 127.1 + seed * 311.7) * 43758.5453;
    return n - Math.floor(n);
}

function smoothNoise(x, seed) {
    let ix = Math.floor(x);
    let fx = x - ix;
    fx = fx * fx * (3 - 2 * fx);
    return noise(ix, seed) * (1 - fx) + noise(ix + 1, seed) * fx;
}

function fractalNoise(x, octaves, seed) {
    let v = 0, amp = 1, freq = 1, max = 0;
    for (let i = 0; i < octaves; i++) {
        v += smoothNoise(x * freq, seed + i * 1000) * amp;
        max += amp;
        amp *= 0.5;
        freq *= 2;
    }
    return v / max;
}

function generateTerrain() {
    terrainCtx.clearRect(0, 0, WORLD_W, WORLD_H);
    const seed = Math.random() * 10000;
    heightMap = [];
    for (let x = 0; x < WORLD_W; x++) {
        let h = fractalNoise(x / 300, 6, seed) * 350 + 200;
        if (x < 100) h = h * (x / 100) + (WORLD_H * 0.55) * (1 - x / 100);
        if (x > WORLD_W - 100) {
            let f = (WORLD_W - x) / 100;
            h = h * f + (WORLD_H * 0.55) * (1 - f);
        }
        heightMap[x] = WORLD_H - h;
    }

    // Direct ImageData manipulation (much faster than fillRect per pixel)
    const imgData = terrainCtx.createImageData(WORLD_W, WORLD_H);
    const d = imgData.data;

    for (let x = 0; x < WORLD_W; x++) {
        const top = Math.floor(heightMap[x]);
        const totalDepth = Math.max(1, WATER_LEVEL - top);
        // Compute surface normal for directional lighting
        const prevH = heightMap[Math.max(0, x - 3)];
        const nextH = heightMap[Math.min(WORLD_W - 1, x + 3)];
        const slope = (nextH - prevH) / 6;
        // Light from upper-left: negative slope = facing light = brighter
        const lightFactor = Math.max(0.55, Math.min(1.3, 1.0 - slope * 0.7));

        for (let y = top; y < WATER_LEVEL; y++) {
            const idx = (y * WORLD_W + x) * 4;
            const depthRatio = (y - top) / totalDepth;
            const surfaceProx = 1 - Math.min(1, (y - top) / 25);
            const lMod = 1 + (lightFactor - 1) * surfaceProx * 0.7;
            let r, g, b;

            if (y - top < 4) {
                // Grass layer
                const gd = y - top;
                r = gd === 0 ? 100 : gd === 1 ? 82 : gd === 2 ? 68 : 58;
                g = gd === 0 ? 200 : gd === 1 ? 175 : gd === 2 ? 155 : 140;
                b = gd === 0 ? 45 : gd === 1 ? 38 : gd === 2 ? 32 : 28;
                r = Math.min(255, Math.floor(r * lMod));
                g = Math.min(255, Math.floor(g * lMod));
                b = Math.min(255, Math.floor(b * lMod));
            } else {
                // Dirt with depth + light
                r = Math.min(255, Math.floor((80 + 60 * (1 - depthRatio)) * lMod));
                g = Math.min(255, Math.floor((140 + 50 * (1 - depthRatio) - depthRatio * 40) * lMod));
                b = Math.min(255, Math.floor((40 + 20 * (1 - depthRatio)) * lMod));
            }
            d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = 255;
        }
    }
    terrainCtx.putImageData(imgData, 0, 0);
    terrainData = terrainCtx.getImageData(0, 0, WORLD_W, WORLD_H);
    rebuildDepthCanvas();
}

function rebuildDepthCanvas() {
    depthCtx.clearRect(0, 0, WORLD_W, WORLD_H);
    depthCtx.drawImage(terrainCanvas, 0, 0);
    depthCtx.globalCompositeOperation = 'source-atop';
    depthCtx.fillStyle = '#1a0e05';
    depthCtx.fillRect(0, 0, WORLD_W, WORLD_H);
    depthCtx.globalCompositeOperation = 'source-over';
}

function isTerrainSolid(x, y) {
    x = Math.floor(x);
    y = Math.floor(y);
    if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) return false;
    const idx = (y * WORLD_W + x) * 4;
    return terrainData.data[idx + 3] > 0;
}

function destroyTerrain(cx, cy, radius) {
    const r2 = radius * radius;
    const x0 = Math.max(0, Math.floor(cx - radius));
    const x1 = Math.min(WORLD_W - 1, Math.ceil(cx + radius));
    const y0 = Math.max(0, Math.floor(cy - radius));
    const y1 = Math.min(WORLD_H - 1, Math.ceil(cy + radius));
    for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
            const dx = x - cx, dy = y - cy;
            if (dx * dx + dy * dy <= r2) {
                const idx = (y * WORLD_W + x) * 4;
                terrainData.data[idx + 3] = 0;
            }
        }
    }
    terrainCtx.putImageData(terrainData, 0, 0);
    rebuildDepthCanvas();
}

function findGround(x) {
    x = Math.floor(Math.max(0, Math.min(WORLD_W - 1, x)));
    for (let y = 0; y < WORLD_H; y++) {
        if (isTerrainSolid(x, y)) return y;
    }
    return WATER_LEVEL;
}

// ============================================================
//  CAMERA
// ============================================================
const camera = {
    x: 0, y: 0, targetX: 0, targetY: 0,
    shake: 0, shakeDecay: 0.92,
    follow(x, y) {
        this.targetX = x - canvas.width / 2;
        this.targetY = y - canvas.height / 2;
    },
    update() {
        this.x += (this.targetX - this.x) * 0.08;
        this.y += (this.targetY - this.y) * 0.08;
        // Clamp
        this.x = Math.max(0, Math.min(WORLD_W - canvas.width, this.x));
        this.y = Math.max(0, Math.min(WORLD_H - canvas.height, this.y));
        this.shake *= this.shakeDecay;
        if (this.shake < 0.5) this.shake = 0;
    },
    apply(ctx) {
        let sx = 0, sy = 0;
        if (this.shake > 0) {
            sx = (Math.random() - 0.5) * this.shake;
            sy = (Math.random() - 0.5) * this.shake;
        }
        ctx.save();
        ctx.translate(-this.x + sx, -this.y + sy);
    },
    restore(ctx) { ctx.restore(); },
    addShake(amount) { this.shake = Math.min(this.shake + amount, 30); },
    screenToWorld(sx, sy) { return { x: sx + this.x, y: sy + this.y }; }
};

// ============================================================
//  WEAPONS
// ============================================================
const WEAPONS = [
    { name: 'Bazooka', type: 'projectile', damage: 45, radius: 40, speed: 20, gravity: true, icon: '🚀' },
    { name: 'Grenade', type: 'grenade', damage: 50, radius: 45, speed: 10, timer: 3, gravity: true, bounces: 3, icon: '💣' },
    { name: 'Cluster Bomb', type: 'grenade', damage: 30, radius: 30, speed: 10, timer: 3, gravity: true, bounces: 2, cluster: 5, icon: '🧨' },
    { name: 'Shotgun', type: 'hitscan', damage: 25, radius: 15, range: 200, shots: 2, icon: '🔫' },
    { name: 'Dynamite', type: 'drop', damage: 70, radius: 60, timer: 4, icon: '🧱' },
    { name: 'Air Strike', type: 'airstrike', damage: 30, radius: 35, count: 5, icon: '✈️' },
    { name: 'Teleport', type: 'teleport', icon: '⚡' },
    { name: 'Baseball Bat', type: 'melee', damage: 35, knockback: 14, range: 40, icon: '🏏' },
    { name: 'Fire Punch', type: 'melee', damage: 30, knockback: 10, range: 30, icon: '👊' },
    { name: 'Banana Bomb', type: 'grenade', damage: 40, radius: 35, speed: 10, timer: 3, gravity: true, bounces: 2, cluster: 6, icon: '🍌' },
    { name: 'Holy Grenade', type: 'grenade', damage: 80, radius: 70, speed: 9, timer: 4, gravity: true, bounces: 1, icon: '✝️' },
    { name: 'Mortar', type: 'projectile', damage: 35, radius: 30, speed: 14, gravity: true, cluster: 3, icon: '💥' },
    { name: 'Homing Missile', type: 'homing', damage: 50, radius: 40, speed: 6, icon: '🎯' },
    { name: 'Uzi', type: 'hitscan', damage: 8, radius: 8, range: 250, shots: 10, icon: '🔫' },
    { name: 'Minigun', type: 'hitscan', damage: 6, radius: 6, range: 300, shots: 20, icon: '⚙️' },
    { name: 'Super Sheep', type: 'guided', damage: 75, radius: 55, speed: 5, gravity: false, icon: '🐑' },
    { name: 'Concrete Donkey', type: 'airstrike', damage: 90, radius: 80, count: 1, icon: '🫏' },
    { name: 'Napalm Strike', type: 'airstrike', damage: 20, radius: 25, count: 8, icon: '🔥' },
    { name: 'Mine', type: 'mine', damage: 50, radius: 45, speed: 9, timer: 3, gravity: true, icon: '💎' },
    { name: 'Sheep Launcher', type: 'projectile', damage: 60, radius: 50, speed: 10, gravity: true, icon: '🐏' },
    { name: 'Petrol Bomb', type: 'grenade', damage: 35, radius: 40, speed: 9, timer: 2, gravity: true, bounces: 0, fire: true, icon: '🍶' },
    { name: 'Dragon Ball', type: 'projectile', damage: 55, radius: 45, speed: 15, gravity: true, fire: true, icon: '🐉' },
    { name: 'Kamikaze', type: 'kamikaze', damage: 50, radius: 45, speed: 8, icon: '💀' },
    { name: 'Prod', type: 'melee', damage: 1, knockback: 20, range: 25, icon: '👉' },
    { name: 'Ninja Rope', type: 'rope', icon: '🪢' },
    { name: 'Earthquake', type: 'earthquake', icon: '🌋' },
    { name: 'Girder', type: 'girder', icon: '🪵' },
    { name: 'Carpet Bomb', type: 'airstrike', damage: 25, radius: 30, count: 10, icon: '🛩️' },
];

let currentWeaponIdx = 0;

// ============================================================
//  WORM CLASS
// ============================================================
class Worm {
    constructor(team, name, x) {
        this.team = team;
        this.name = name;
        this.hp = MAX_HP;
        this.x = x;
        this.y = findGround(x) - WORM_H;
        this.vx = 0;
        this.vy = 0;
        this.onGround = false;
        this.facing = 1;
        this.alive = true;
        this.justHit = 0; // flash timer
        this.aimAngle = -Math.PI / 4;
    }

    update() {
        if (!this.alive) return;
        // Gravity
        this.vy += GRAVITY;
        // Move
        this.x += this.vx;
        this.y += this.vy;
        // Friction
        this.vx *= 0.92;
        // Terrain collision
        this.onGround = false;
        // Feet check
        const feetY = Math.floor(this.y + WORM_H);
        if (feetY >= WATER_LEVEL) {
            this.die();
            return;
        }
        // Vertical collision (falling)
        if (this.vy >= 0) {
            for (let fy = Math.floor(this.y + WORM_H - 4); fy <= feetY; fy++) {
                for (let fx = -6; fx <= 6; fx += 3) {
                    if (isTerrainSolid(Math.floor(this.x + fx), fy)) {
                        this.y = fy - WORM_H;
                        // Fall damage
                        if (this.vy > 8) {
                            const dmg = Math.floor((this.vy - 8) * 5);
                            this.takeDamage(dmg);
                        }
                        this.vy = 0;
                        this.onGround = true;
                        break;
                    }
                }
                if (this.onGround) break;
            }
        }
        // Head collision (jumping)
        if (this.vy < 0) {
            for (let fx = -6; fx <= 6; fx += 3) {
                if (isTerrainSolid(Math.floor(this.x + fx), Math.floor(this.y))) {
                    this.vy = 0;
                    this.y = Math.floor(this.y) + 1;
                    break;
                }
            }
        }
        // Side collision
        const dir = this.vx > 0.3 ? 1 : this.vx < -0.3 ? -1 : 0;
        if (dir !== 0) {
            const wallX = Math.floor(this.x + dir * 8);
            let blocked = false;
            for (let fy = Math.floor(this.y + 4); fy < Math.floor(this.y + WORM_H - 2); fy += 3) {
                if (isTerrainSolid(wallX, fy)) {
                    blocked = true;
                    break;
                }
            }
            if (blocked) {
                // Try climbing (step up 6px)
                let canStep = true;
                const stepY = Math.floor(this.y - 6);
                for (let fy = stepY; fy < stepY + 6; fy++) {
                    if (isTerrainSolid(wallX, fy)) { canStep = false; break; }
                }
                if (canStep && this.onGround) {
                    this.y -= 6;
                } else {
                    this.vx = 0;
                    this.x -= dir * 2;
                }
            }
        }
        // Settle on terrain
        if (this.onGround && Math.abs(this.vx) < 0.1) {
            this.vx = 0;
            // Gently sink into terrain if floating
            if (!isTerrainSolid(Math.floor(this.x), Math.floor(this.y + WORM_H + 1))) {
                this.onGround = false;
            }
        }
        if (this.justHit > 0) this.justHit--;
    }

    takeDamage(dmg) {
        if (!this.alive) return;
        this.hp -= dmg;
        this.justHit = 20;
        if (this.hp <= 0) {
            this.hp = 0;
            this.die();
        }
    }

    die() {
        this.alive = false;
        if (this.y + WORM_H >= WATER_LEVEL - 5) {
            particles.push(...createSplashParticles(this.x));
        } else {
            particles.push(...createExplosionParticles(this.x, this.y + WORM_H / 2, 15, this.team === 0 ? '#e74c3c' : '#3498db'));
        }
    }

    draw(ctx) {
        if (!this.alive) {
            // Gravestone shadow
            ctx.fillStyle = 'rgba(0,0,0,.15)';
            ctx.beginPath();
            ctx.ellipse(this.x + 3, this.y + WORM_H, 9, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            // Gravestone
            ctx.fillStyle = '#777';
            ctx.beginPath();
            ctx.moveTo(this.x - 7, this.y + WORM_H - 2);
            ctx.lineTo(this.x - 6, this.y + WORM_H - 18);
            ctx.quadraticCurveTo(this.x, this.y + WORM_H - 24, this.x + 6, this.y + WORM_H - 18);
            ctx.lineTo(this.x + 7, this.y + WORM_H - 2);
            ctx.fill();
            // Stone highlight
            ctx.fillStyle = 'rgba(255,255,255,.1)';
            ctx.beginPath();
            ctx.moveTo(this.x - 5, this.y + WORM_H - 3);
            ctx.lineTo(this.x - 4, this.y + WORM_H - 17);
            ctx.quadraticCurveTo(this.x - 1, this.y + WORM_H - 22, this.x + 1, this.y + WORM_H - 17);
            ctx.lineTo(this.x + 1, this.y + WORM_H - 3);
            ctx.fill();
            // Cross
            ctx.fillStyle = '#999';
            ctx.fillRect(this.x - 1.5, this.y + WORM_H - 17, 3, 10);
            ctx.fillRect(this.x - 4, this.y + WORM_H - 14, 8, 2.5);
            // RIP text
            ctx.fillStyle = 'rgba(200,200,200,.5)';
            ctx.font = '6px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('RIP', this.x, this.y + WORM_H - 4);
            return;
        }
        const flash = this.justHit > 0 && this.justHit % 4 < 2;
        const cx = this.x, cy = this.y;

        // Shadow (gradient for 2.5D depth)
        const shadowGrad = ctx.createRadialGradient(cx, cy + WORM_H + 2, 0, cx, cy + WORM_H + 2, 14);
        shadowGrad.addColorStop(0, 'rgba(0,0,0,.35)');
        shadowGrad.addColorStop(0.6, 'rgba(0,0,0,.15)');
        shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = shadowGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy + WORM_H + 2, 14, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body (segmented, worm-like)
        const baseColor = this.team === 0 ? '#e74c3c' : '#3498db';
        const lightColor = this.team === 0 ? '#f1948a' : '#85c1e9';
        const segments = 5;
        for (let i = segments - 1; i >= 0; i--) {
            const t = i / segments;
            const sy = cy + 6 + t * (WORM_H - 10);
            const r = 7 + Math.sin(t * Math.PI) * 3;
            const wobble = Math.sin(Date.now() / 200 + i * 0.8) * 0.8;
            ctx.fillStyle = flash ? '#fff' : (i % 2 === 0 ? baseColor : lightColor);
            ctx.beginPath();
            ctx.ellipse(cx + wobble, sy, r, 4.5, 0, 0, Math.PI * 2);
            ctx.fill();
            // Belly highlight
            ctx.fillStyle = 'rgba(255,255,255,.15)';
            ctx.beginPath();
            ctx.ellipse(cx + wobble - 1, sy - 1.5, r * 0.5, 2.5, -0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Head
        const headY = cy + 3;
        ctx.fillStyle = flash ? '#fff' : baseColor;
        ctx.beginPath();
        ctx.arc(cx, headY, 9, 0, Math.PI * 2);
        ctx.fill();
        // Cheek highlight
        ctx.fillStyle = 'rgba(255,255,255,.18)';
        ctx.beginPath();
        ctx.arc(cx - 2, headY - 2, 5, 0, Math.PI * 2);
        ctx.fill();

        // Bandana
        const bandColor = this.team === 0 ? '#c0392b' : '#2471a3';
        ctx.fillStyle = bandColor;
        ctx.fillRect(cx - 9, headY - 4, 18, 5);
        // Bandana tail
        ctx.beginPath();
        ctx.moveTo(cx - 9 * this.facing, headY - 4);
        ctx.lineTo(cx - 14 * this.facing, headY - 10 + Math.sin(Date.now() / 150) * 3);
        ctx.lineTo(cx - 10 * this.facing, headY - 1);
        ctx.fillStyle = bandColor;
        ctx.fill();

        // Eyes
        const eyeX = cx + this.facing * 3;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(eyeX, headY - 1, 3.5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(eyeX + this.facing * 1.2, headY - 0.5, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(eyeX + this.facing * 2, headY - 1.5, 0.7, 0, Math.PI * 2);
        ctx.fill();

        // Eyebrow
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(eyeX - 3, headY - 5);
        ctx.lineTo(eyeX + 3, headY - 6);
        ctx.stroke();

        // HP above head
        ctx.font = 'bold 11px Arial';
        ctx.textAlign = 'center';
        // HP bg
        const hpText = this.hp.toString();
        const tw = ctx.measureText(hpText).width;
        ctx.fillStyle = 'rgba(0,0,0,.6)';
        ctx.fillRect(cx - tw / 2 - 4, cy - 16, tw + 8, 14);
        ctx.fillStyle = this.hp > 50 ? '#2ecc71' : this.hp > 25 ? '#f1c40f' : '#e74c3c';
        ctx.fillText(hpText, cx, cy - 5);

        // Name
        ctx.font = '9px Arial';
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.fillText(this.name, cx, cy - 19);
    }
}

// ============================================================
//  PROJECTILE CLASS
// ============================================================
class Projectile {
    constructor(x, y, vx, vy, weapon, team) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.weapon = weapon;
        this.team = team;
        this.alive = true;
        this.timer = weapon.timer || 999;
        this.timerFrames = this.timer * 60;
        this.bounces = weapon.bounces || 0;
        this.trail = [];
        this.age = 0;
        // Homing target
        this.target = null;
        if (weapon.type === 'homing') {
            this.target = findClosestEnemy(x, y, team);
        }
    }

    update() {
        if (!this.alive) return;
        this.age++;

        // Trail
        if (this.age % 2 === 0) {
            this.trail.push({ x: this.x, y: this.y, life: 20 });
        }
        this.trail = this.trail.filter(t => { t.life--; return t.life > 0; });

        // Fire weapons leave fire particles
        if (this.weapon.fire && this.age % 3 === 0) {
            particles.push({
                x: this.x + (Math.random() - 0.5) * 6,
                y: this.y + (Math.random() - 0.5) * 6,
                vx: (Math.random() - 0.5) * 1.5,
                vy: -1 - Math.random() * 2,
                life: 15 + Math.random() * 10,
                size: 2 + Math.random() * 3,
                color: Math.random() > 0.5 ? '#ff6600' : '#ffcc00'
            });
        }

        // Homing
        if (this.weapon.type === 'homing' && this.target && this.target.alive) {
            const dx = this.target.x - this.x;
            const dy = (this.target.y + WORM_H / 2) - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 5) {
                const steer = 0.15;
                this.vx += (dx / dist) * steer;
                this.vy += (dy / dist) * steer;
                // Limit speed
                const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (spd > this.weapon.speed * 1.2) {
                    this.vx = (this.vx / spd) * this.weapon.speed * 1.2;
                    this.vy = (this.vy / spd) * this.weapon.speed * 1.2;
                }
            }
        }

        // Gravity
        if (this.weapon.gravity !== false) {
            this.vy += GRAVITY;
        }
        // Wind
        this.vx += wind * 0.003;

        this.x += this.vx;
        this.y += this.vy;

        // Out of bounds
        if (this.x < -50 || this.x > WORLD_W + 50 || this.y > WORLD_H + 50) {
            this.alive = false;
            return;
        }

        // Timer (grenade)
        if (this.weapon.timer) {
            this.timerFrames--;
            if (this.timerFrames <= 0) {
                this.explode();
                return;
            }
        }

        // Terrain collision
        if (isTerrainSolid(Math.floor(this.x), Math.floor(this.y))) {
            // Mine: land and start countdown
            if (this.weapon.type === 'mine') {
                this.alive = false;
                droppedItems.push({
                    type: 'mine',
                    x: this.x,
                    y: this.y - 4,
                    weapon: this.weapon,
                    timerFrames: (this.weapon.timer || 3) * 60,
                    alive: true
                });
                return;
            }
            if (this.bounces > 0) {
                this.bounces--;
                this.vy = -Math.abs(this.vy) * 0.6;
                this.vx *= 0.7;
                this.y -= 2;
            } else {
                this.explode();
            }
        }
    }

    explode() {
        this.alive = false;
        const w = this.weapon;
        destroyTerrain(this.x, this.y, w.radius);
        applyExplosionDamage(this.x, this.y, w.radius, w.damage);
        particles.push(...createExplosionParticles(this.x, this.y, 30));
        camera.addShake(w.radius / 3);

        // Sub-munitions (cluster / banana / mortar)
        if (w.cluster) {
            for (let i = 0; i < w.cluster; i++) {
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.8;
                const spd = 4 + Math.random() * 4;
                const sub = new Projectile(
                    this.x, this.y - 5,
                    Math.cos(angle) * spd,
                    Math.sin(angle) * spd,
                    { name: 'Sub', type: 'projectile', damage: Math.floor(w.damage * 0.5), radius: Math.floor(w.radius * 0.6), gravity: true },
                    this.team
                );
                projectiles.push(sub);
            }
        }
    }

    draw(ctx) {
        if (!this.alive) return;
        // Trail
        for (const t of this.trail) {
            const alpha = t.life / 20;
            ctx.fillStyle = `rgba(255,200,50,${alpha * 0.5})`;
            ctx.beginPath();
            ctx.arc(t.x, t.y, 2 + alpha * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        const w = this.weapon;
        ctx.save();
        ctx.translate(this.x, this.y);

        if (w.name === 'Bazooka' || w.name === 'Mortar') {
            // Rocket shape
            const angle = Math.atan2(this.vy, this.vx);
            ctx.rotate(angle);
            ctx.fillStyle = '#555';
            ctx.fillRect(-8, -3, 16, 6);
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(6, -3, 4, 6);
            // Flame
            ctx.fillStyle = `rgba(255,${100 + Math.random() * 100},0,${0.7 + Math.random() * 0.3})`;
            ctx.beginPath();
            ctx.moveTo(-8, 0);
            ctx.lineTo(-14 - Math.random() * 6, -3);
            ctx.lineTo(-14 - Math.random() * 6, 3);
            ctx.fill();
        } else if (w.name === 'Grenade' || w.name === 'Cluster Bomb' || w.name === 'Holy Grenade') {
            // Grenade sphere
            const r = w.name === 'Holy Grenade' ? 7 : 5;
            ctx.fillStyle = w.name === 'Holy Grenade' ? '#ffd700' : '#2c3e50';
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            // Glow for holy
            if (w.name === 'Holy Grenade') {
                ctx.fillStyle = `rgba(255,215,0,${0.2 + Math.sin(Date.now() / 100) * 0.15})`;
                ctx.beginPath();
                ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
                ctx.fill();
            }
            // Timer text
            const sec = Math.ceil(this.timerFrames / 60);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 9px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(sec, 0, 3);
        } else if (w.name === 'Banana Bomb') {
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.ellipse(0, 0, 4, 7, Math.atan2(this.vy, this.vx), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-1, -8, 2, 3);
        } else if (w.name === 'Homing Missile') {
            const angle = Math.atan2(this.vy, this.vx);
            ctx.rotate(angle);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(-7, -2.5, 14, 5);
            // Fins
            ctx.fillStyle = '#c0392b';
            ctx.beginPath();
            ctx.moveTo(-7, -2.5);
            ctx.lineTo(-10, -6);
            ctx.lineTo(-5, -2.5);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-7, 2.5);
            ctx.lineTo(-10, 6);
            ctx.lineTo(-5, 2.5);
            ctx.fill();
            // Flame
            ctx.fillStyle = `rgba(255,${150 + Math.random() * 100},0,0.8)`;
            ctx.beginPath();
            ctx.moveTo(-7, 0);
            ctx.lineTo(-13 - Math.random() * 5, -2);
            ctx.lineTo(-13 - Math.random() * 5, 2);
            ctx.fill();
        } else {
            // Default
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }
}

// ============================================================
//  PARTICLES
// ============================================================
let particles = [];

function createExplosionParticles(x, y, count, color) {
    const arr = [];
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 5;
        arr.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 30 + Math.random() * 30,
            maxLife: 60,
            color: color || ['#ff6b35', '#ffa500', '#ff4500', '#ffcc00', '#fff'][Math.floor(Math.random() * 5)],
            size: 2 + Math.random() * 4
        });
    }
    return arr;
}

function createSplashParticles(x) {
    const arr = [];
    for (let i = 0; i < 20; i++) {
        arr.push({
            x: x + (Math.random() - 0.5) * 30,
            y: WATER_LEVEL,
            vx: (Math.random() - 0.5) * 4,
            vy: -(2 + Math.random() * 6),
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color: ['#3498db', '#2eaadc', '#5dade2', '#85c1e9'][Math.floor(Math.random() * 4)],
            size: 2 + Math.random() * 3
        });
    }
    return arr;
}

function updateParticles() {
    particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.vx *= 0.98;
        p.life--;
        return p.life > 0;
    });
}

function drawParticles(ctx) {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ============================================================
//  GAME STATE
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'menu'; // menu | playing | turnTransition | firing | gameOver
let teams = [[], []]; // arrays of Worm
let currentTeam = 0;
let currentWormIdx = [0, 0];
let turnTimer = TURN_TIME;
let turnTimerFrames = 0;
let wind = 0;
let projectiles = [];
let isAI = false;
let moveDir = 0;
let aimDir = 0;
let charging = false;
let chargeAmount = 0;
let mouseWorldX = 0, mouseWorldY = 0;
let showWeaponMenu = false;
let transitionTimer = 0;
let msgTimer = 0;
let msgText = '';
let aiThinkTimer = 0;
let teleportMode = false;
let droppedItems = []; // dynamite, mines
let airstrikeTargetMode = false;
let targetMode = false; // true when selecting airstrike/girder/teleport target on map
let targetWorldX = 0, targetWorldY = 0;

function getCurrentWorm() {
    const team = teams[currentTeam];
    if (!team || team.length === 0) return null;
    let idx = currentWormIdx[currentTeam] % team.length;
    let tries = 0;
    while (!team[idx].alive && tries < team.length) {
        idx = (idx + 1) % team.length;
        tries++;
    }
    currentWormIdx[currentTeam] = idx;
    return team[idx].alive ? team[idx] : null;
}

function findClosestEnemy(x, y, team) {
    let best = null, bestDist = Infinity;
    const enemies = teams[1 - team];
    for (const w of enemies) {
        if (!w.alive) continue;
        const dx = w.x - x, dy = w.y - y;
        const dist = dx * dx + dy * dy;
        if (dist < bestDist) { bestDist = dist; best = w; }
    }
    return best;
}

function applyExplosionDamage(ex, ey, radius, maxDamage) {
    for (const team of teams) {
        for (const w of team) {
            if (!w.alive) continue;
            const dx = w.x - ex, dy = (w.y + WORM_H / 2) - ey;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < radius) {
                const factor = 1 - dist / radius;
                const dmg = Math.floor(maxDamage * factor);
                w.takeDamage(dmg);
                // Knockback
                const kb = factor * 8;
                const angle = Math.atan2(dy, dx);
                w.vx += Math.cos(angle) * kb;
                w.vy += Math.sin(angle) * kb - 3;
            }
        }
    }
}

// ============================================================
//  DECORATIONS
// ============================================================
let decorations = [];

function generateDecorations() {
    decorations = [];
    for (let x = 50; x < WORLD_W - 50; x += 30 + Math.random() * 60) {
        const groundY = findGround(Math.floor(x));
        if (groundY >= WATER_LEVEL - 5) continue;
        const type = Math.random();
        if (type < 0.3) {
            decorations.push({ type: 'tree', x, y: groundY });
        } else if (type < 0.6) {
            decorations.push({ type: 'flower', x, y: groundY, color: ['#e74c3c', '#f1c40f', '#e67e22', '#9b59b6', '#1abc9c'][Math.floor(Math.random() * 5)] });
        } else if (type < 0.75) {
            decorations.push({ type: 'rock', x, y: groundY, size: 3 + Math.random() * 5 });
        } else {
            decorations.push({ type: 'grass', x, y: groundY });
        }
    }
}

function drawDecorations(ctx) {
    for (const d of decorations) {
        // Check if terrain still exists below
        if (!isTerrainSolid(Math.floor(d.x), Math.floor(d.y + 2))) continue;
        if (d.type === 'tree') {
            // Tree shadow (2.5D)
            ctx.fillStyle = 'rgba(0,0,0,.15)';
            ctx.beginPath();
            ctx.ellipse(d.x + 5, d.y + 2, 12, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            // Trunk
            ctx.fillStyle = '#5a3520';
            ctx.fillRect(d.x - 3, d.y - 25, 6, 25);
            ctx.fillStyle = 'rgba(255,255,255,.08)';
            ctx.fillRect(d.x - 3, d.y - 25, 2, 25);
            // Canopy shadow layer
            ctx.fillStyle = '#1e8c4a';
            ctx.beginPath();
            ctx.arc(d.x + 3, d.y - 27, 13, 0, Math.PI * 2);
            ctx.fill();
            // Canopy
            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.arc(d.x, d.y - 30, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath();
            ctx.arc(d.x - 5, d.y - 28, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(d.x + 6, d.y - 27, 9, 0, Math.PI * 2);
            ctx.fill();
            // Canopy highlight
            ctx.fillStyle = 'rgba(255,255,200,.1)';
            ctx.beginPath();
            ctx.arc(d.x - 4, d.y - 33, 7, 0, Math.PI * 2);
            ctx.fill();
        } else if (d.type === 'flower') {
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(d.x, d.y - 8, 1.5, 8);
            ctx.fillStyle = d.color;
            ctx.beginPath();
            ctx.arc(d.x + 0.5, d.y - 10, 3, 0, Math.PI * 2);
            ctx.fill();
        } else if (d.type === 'rock') {
            // Rock shadow
            ctx.fillStyle = 'rgba(0,0,0,.12)';
            ctx.beginPath();
            ctx.ellipse(d.x + 3, d.y + 1, d.size * 1.1, d.size * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath();
            ctx.ellipse(d.x, d.y - d.size / 2, d.size, d.size * 0.7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,.18)';
            ctx.beginPath();
            ctx.ellipse(d.x - 1, d.y - d.size / 2 - 1, d.size * 0.5, d.size * 0.3, -0.3, 0, Math.PI * 2);
            ctx.fill();
        } else if (d.type === 'grass') {
            ctx.strokeStyle = '#27ae60';
            ctx.lineWidth = 1.5;
            for (let g = -4; g <= 4; g += 2.5) {
                const sway = Math.sin(Date.now() / 500 + d.x * 0.1 + g) * 2;
                ctx.beginPath();
                ctx.moveTo(d.x + g, d.y);
                ctx.quadraticCurveTo(d.x + g + sway, d.y - 10, d.x + g + sway * 1.5, d.y - 14 - Math.random() * 4);
                ctx.stroke();
            }
        }
    }
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function drawBackground(ctx) {
    // Sky gradient — richer, more atmospheric
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#0d0d2b');
    skyGrad.addColorStop(0.15, '#1a1a4e');
    skyGrad.addColorStop(0.35, '#2d4a8c');
    skyGrad.addColorStop(0.55, '#4a90d9');
    skyGrad.addColorStop(0.8, '#87ceeb');
    skyGrad.addColorStop(1, '#b5e8f7');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Sun with rays
    const sunX = canvas.width * 0.78;
    const sunY = canvas.height * 0.13;
    // Outer glow
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 180);
    sunGlow.addColorStop(0, 'rgba(255,245,180,0.4)');
    sunGlow.addColorStop(0.4, 'rgba(255,220,100,0.12)');
    sunGlow.addColorStop(1, 'rgba(255,200,50,0)');
    ctx.fillStyle = sunGlow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 180, 0, Math.PI * 2);
    ctx.fill();
    // Sun core
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 50);
    sunGrad.addColorStop(0, 'rgba(255,250,220,1)');
    sunGrad.addColorStop(0.5, 'rgba(255,230,130,.85)');
    sunGrad.addColorStop(1, 'rgba(255,200,50,0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 50, 0, Math.PI * 2);
    ctx.fill();
    // Light rays
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.translate(sunX, sunY);
    for (let r = 0; r < 12; r++) {
        ctx.rotate(Math.PI / 6);
        ctx.fillStyle = '#fffae0';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-15, -400);
        ctx.lineTo(15, -400);
        ctx.fill();
    }
    ctx.restore();

    // Clouds (behind mountains)
    const parallaxC = -camera.x * 0.03;
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    for (let i = 0; i < 10; i++) {
        const cx = ((i * 380 + 50 + parallaxC + Date.now() * 0.003) % (canvas.width + 300)) - 150;
        const cy = 30 + (i % 4) * 25 + Math.sin(i * 1.7) * 15;
        const sz = 50 + i * 7;
        ctx.beginPath();
        ctx.ellipse(cx, cy, sz, 16 + i * 1.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + sz * 0.4, cy - 6, sz * 0.7, 12 + i, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx - sz * 0.3, cy + 3, sz * 0.5, 10 + i, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Parallax layer 0 — very far mountains (barely visible, atmospheric)
    const p0 = -camera.x * 0.04;
    const mGrad0 = ctx.createLinearGradient(0, canvas.height * 0.4, 0, canvas.height);
    mGrad0.addColorStop(0, '#1a2540');
    mGrad0.addColorStop(1, '#253555');
    ctx.fillStyle = mGrad0;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let x = 0; x <= canvas.width + 80; x += 80) {
        const wx = x - p0;
        const h = 180 + Math.sin(wx * 0.0015) * 100 + Math.sin(wx * 0.004 + 2) * 50;
        ctx.lineTo(x, canvas.height - h - 120);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();

    // Parallax layer 1 — far mountains
    const p1 = -camera.x * 0.08;
    const mGrad1 = ctx.createLinearGradient(0, canvas.height * 0.5, 0, canvas.height);
    mGrad1.addColorStop(0, '#2c3e50');
    mGrad1.addColorStop(1, '#3a5268');
    ctx.fillStyle = mGrad1;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let x = 0; x <= canvas.width + 60; x += 50) {
        const wx = x - p1;
        const h = 130 + Math.sin(wx * 0.003) * 80 + Math.sin(wx * 0.007) * 40 + Math.sin(wx * 0.015) * 15;
        ctx.lineTo(x, canvas.height - h - 90);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();
    // Snow caps
    ctx.fillStyle = 'rgba(220,230,240,.12)';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let x = 0; x <= canvas.width + 60; x += 50) {
        const wx = x - p1;
        const h = 130 + Math.sin(wx * 0.003) * 80 + Math.sin(wx * 0.007) * 40 + Math.sin(wx * 0.015) * 15;
        const peakY = canvas.height - h - 90;
        ctx.lineTo(x, peakY);
    }
    ctx.lineTo(canvas.width, canvas.height - 140);
    ctx.lineTo(0, canvas.height - 140);
    ctx.fill();

    // Parallax layer 2 — mid hills
    const p2 = -camera.x * 0.18;
    const mGrad2 = ctx.createLinearGradient(0, canvas.height * 0.55, 0, canvas.height);
    mGrad2.addColorStop(0, '#34495e');
    mGrad2.addColorStop(1, '#446178');
    ctx.fillStyle = mGrad2;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let x = 0; x <= canvas.width + 40; x += 35) {
        const wx = x - p2;
        const h = 80 + Math.sin(wx * 0.005 + 1) * 55 + Math.sin(wx * 0.012) * 28 + Math.sin(wx * 0.025) * 10;
        ctx.lineTo(x, canvas.height - h - 30);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();

    // Parallax layer 3 — near treeline/foliage silhouette
    const p3 = -camera.x * 0.3;
    ctx.fillStyle = '#2d4a3a';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let x = 0; x <= canvas.width + 30; x += 20) {
        const wx = x - p3;
        const h = 40 + Math.sin(wx * 0.008 + 3) * 30 + Math.sin(wx * 0.02) * 15;
        // Tree-like bumps
        const tree = Math.max(0, Math.sin(wx * 0.04) * 20 + Math.sin(wx * 0.07) * 10);
        ctx.lineTo(x, canvas.height - h - tree - 5);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();

    // Atmospheric haze/fog between background and game world
    const hazeGrad = ctx.createLinearGradient(0, canvas.height * 0.5, 0, canvas.height);
    hazeGrad.addColorStop(0, 'rgba(135,206,235,0)');
    hazeGrad.addColorStop(0.6, 'rgba(180,220,240,0.08)');
    hazeGrad.addColorStop(1, 'rgba(200,230,245,0.15)');
    ctx.fillStyle = hazeGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawWater(ctx) {
    // Water body with depth gradient
    const wGrad = ctx.createLinearGradient(0, WATER_LEVEL, 0, WORLD_H);
    wGrad.addColorStop(0, 'rgba(41,128,185,.65)');
    wGrad.addColorStop(0.3, 'rgba(30,100,160,.75)');
    wGrad.addColorStop(1, 'rgba(15,45,80,.92)');
    ctx.fillStyle = wGrad;
    ctx.fillRect(0, WATER_LEVEL, WORLD_W, WORLD_H - WATER_LEVEL);

    // Light reflection on water surface
    const t = Date.now() * 0.001;
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    for (let i = 0; i < 15; i++) {
        const rx = (i * 230 + Math.sin(t + i * 0.7) * 40) % WORLD_W;
        const ry = WATER_LEVEL + 3 + Math.sin(t * 1.5 + i) * 2;
        ctx.beginPath();
        ctx.ellipse(rx, ry, 20 + Math.sin(t + i) * 8, 2, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Wave layer 1
    ctx.strokeStyle = 'rgba(100,200,255,.5)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let x = 0; x < WORLD_W; x += 3) {
        const wy = WATER_LEVEL + Math.sin(x * 0.02 + t * 2) * 3;
        if (x === 0) ctx.moveTo(x, wy);
        else ctx.lineTo(x, wy);
    }
    ctx.stroke();

    // Wave layer 2
    ctx.strokeStyle = 'rgba(150,220,255,.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = 0; x < WORLD_W; x += 3) {
        const wy = WATER_LEVEL + 5 + Math.sin(x * 0.015 - t * 1.5) * 2.5;
        if (x === 0) ctx.moveTo(x, wy);
        else ctx.lineTo(x, wy);
    }
    ctx.stroke();

    // Foam at water surface
    ctx.fillStyle = 'rgba(200,235,255,.12)';
    for (let x = 0; x < WORLD_W; x += 4) {
        const wy = WATER_LEVEL + Math.sin(x * 0.02 + t * 2) * 3;
        ctx.fillRect(x, wy - 1, 3, 2);
    }
}

function drawAimIndicator(ctx, worm) {
    if (!worm || !worm.alive) return;
    if (gameState === 'firing') return;

    const weapon = WEAPONS[currentWeaponIdx];
    if (weapon.type === 'teleport' || weapon.type === 'drop' || weapon.type === 'airstrike') return;

    const ox = worm.x;
    const oy = worm.y + 6;
    const angle = worm.aimAngle;
    const power = charging ? chargeAmount * 0.01 : 0.5;
    const maxLen = 80 + power * 50;

    // Aim line
    ctx.strokeStyle = 'rgba(255,255,100,.7)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + Math.cos(angle) * maxLen * worm.facing, oy + Math.sin(angle) * maxLen);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    const chX = ox + Math.cos(angle) * maxLen * worm.facing;
    const chY = oy + Math.sin(angle) * maxLen;
    const pulse = 6 + Math.sin(Date.now() / 200) * 2;
    ctx.strokeStyle = 'rgba(255,255,100,.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(chX, chY, pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(chX - pulse - 3, chY);
    ctx.lineTo(chX + pulse + 3, chY);
    ctx.moveTo(chX, chY - pulse - 3);
    ctx.lineTo(chX, chY + pulse + 3);
    ctx.stroke();

    // Trajectory preview for projectile weapons
    if (weapon.gravity && (weapon.type === 'projectile' || weapon.type === 'grenade' || weapon.type === 'homing')) {
        const speed = weapon.speed * power * 2;
        let pvx = Math.cos(angle) * speed * worm.facing;
        let pvy = Math.sin(angle) * speed;
        let px = ox, py = oy;
        ctx.fillStyle = 'rgba(255,255,200,.3)';
        for (let i = 0; i < 60; i++) {
            pvy += GRAVITY;
            pvx += wind * 0.003;
            px += pvx;
            py += pvy;
            if (py > WATER_LEVEL || isTerrainSolid(Math.floor(px), Math.floor(py))) break;
            if (i % 3 === 0) {
                ctx.beginPath();
                ctx.arc(px, py, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
}

function drawDroppedItems(ctx) {
    for (const item of droppedItems) {
        if (!item.alive) continue;
        ctx.save();
        ctx.translate(item.x, item.y);
        if (item.type === 'dynamite') {
            // Stick
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(-3, -12, 6, 12);
            // Fuse spark
            if (item.timerFrames > 0) {
                ctx.fillStyle = `rgba(255,${150 + Math.random() * 100},0,${0.8 + Math.random() * 0.2})`;
                ctx.beginPath();
                ctx.arc(0, -14, 3 + Math.random() * 2, 0, Math.PI * 2);
                ctx.fill();
            }
            // Timer
            const sec = Math.ceil(item.timerFrames / 60);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(sec, 0, -18);
        }
        ctx.restore();
    }
}
