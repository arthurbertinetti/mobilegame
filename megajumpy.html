<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mega Jumpy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;width:100%;height:100%;object-fit:contain}
#touch-controls{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:8px 12px 12px;pointer-events:none;z-index:10}
.touch-btn{pointer-events:auto;touch-action:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);display:flex;justify-content:center;align-items:center;font-size:20px;color:rgba(255,255,255,.7);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background .05s}
.touch-btn.pressed{background:rgba(255,255,255,.45);transform:scale(.9)}
.touch-group{display:flex;gap:8px;pointer-events:auto;touch-action:none}
#dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:4px;pointer-events:auto;touch-action:none}
#btn-up{grid-column:2;grid-row:1}
#btn-down{grid-column:2;grid-row:2}
#btn-dleft{grid-column:1;grid-row:2}
#btn-dright{grid-column:3;grid-row:2}
#btn-a{background:rgba(50,200,50,.25);border-color:rgba(50,200,50,.5);width:62px;height:62px;font-size:18px;font-weight:bold}
#btn-b{background:rgba(255,80,50,.25);border-color:rgba(255,80,50,.5);width:56px;height:56px;font-size:16px;font-weight:bold}
#btn-start{width:50px;height:28px;border-radius:14px;font-size:11px;font-weight:bold;pointer-events:auto;touch-action:none;background:rgba(200,200,200,.2);border:2px solid rgba(200,200,200,.35);color:rgba(255,255,255,.6);display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.right-side{display:flex;flex-direction:column;align-items:center;gap:8px}
.ab-btns{display:flex;gap:12px;align-items:flex-end}
#back-btn{position:fixed;top:8px;left:8px;z-index:20;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#fs-btn{position:fixed;top:8px;right:8px;z-index:20;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#fs-btn:active{background:rgba(255,255,255,.3)}
@media(pointer:coarse){#touch-controls{display:flex}}
@media(orientation:portrait) and (pointer:coarse){
  .touch-btn{width:46px;height:46px;font-size:16px}
  #dpad{grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px}
  #btn-a{width:56px;height:56px}
  #btn-b{width:50px;height:50px}
}
@media(orientation:landscape) and (pointer:coarse){
  #touch-controls{padding:4px 16px 8px}
  .touch-btn{width:50px;height:50px;font-size:18px}
  #dpad{grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px}
  #btn-a{width:60px;height:60px}
  #btn-b{width:54px;height:54px}
}
@media(min-width:1024px){
  canvas{max-width:100vw;max-height:100vh}
}
</style>
</head>
<body>
<button id="back-btn" onclick="location.href='index.html'">&#8592;</button>
<button id="fs-btn" onclick="toggleFS()">&#x26F6;</button>
<canvas id="c"></canvas>
<div id="touch-controls">
  <div id="dpad">
    <div class="touch-btn" id="btn-up">&#9650;</div>
    <div class="touch-btn" id="btn-dleft">&#9664;</div>
    <div class="touch-btn" id="btn-down">&#9660;</div>
    <div class="touch-btn" id="btn-dright">&#9654;</div>
  </div>
  <div class="right-side">
    <div id="btn-start">START</div>
    <div class="ab-btns">
      <div class="touch-btn" id="btn-b">B</div>
      <div class="touch-btn" id="btn-a">A</div>
    </div>
  </div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');

// ---- FULLSCREEN & RESIZE ----
function toggleFS(){
  const el=document.documentElement;
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
    try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
  }else{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}
}
window.toggleFS=toggleFS;
function resizeCanvas(){
  const dpr=window.devicePixelRatio||1;
  const vw=window.innerWidth,vh=window.innerHeight;
  // Keep 800x512 internal resolution but scale CSS to fill screen
  const ratio=CW_INIT/CH_INIT;
  let w,h;
  if(vw/vh>ratio){h=vh;w=h*ratio;}else{w=vw;h=w/ratio;}
  canvas.style.width=Math.floor(w)+'px';
  canvas.style.height=Math.floor(h)+'px';
  canvas.style.position='absolute';
  canvas.style.left=Math.floor((vw-w)/2)+'px';
  canvas.style.top=Math.floor((vh-h)/2)+'px';
}
const CW_INIT=800,CH_INIT=512;
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',()=>setTimeout(resizeCanvas,100));
document.addEventListener('fullscreenchange',()=>setTimeout(resizeCanvas,100));
document.addEventListener('webkitfullscreenchange',()=>setTimeout(resizeCanvas,100));

// ---- CONSTANTS ----
const T=32,CW=800,CH=512;
const GRAVITY=0.48,MAX_FALL=11;
const WALK_ACCEL=0.32,RUN_ACCEL=0.45,WALK_MAX=3.2,RUN_MAX=5.2,DECEL=0.84;
const JUMP_FORCE=-8.8,RUN_JUMP_FORCE=-9.6,JUMP_HOLD=-0.32,JUMP_HOLD_FRAMES=12;
const STAR_DUR=600,CAT_FLY_G=0.18,FB_SPEED=6;
const ROWS=15,GROUND_ROW=13;
canvas.width=CW;canvas.height=CH;
resizeCanvas();

// ---- STATE ----
let state='title';
let paused=false;
let prelevelTimer=0; // timer for pre-level screen
let deathScreenTimer=0; // timer for death/lives screen
let shakeTimer=0,shakeIntensity=0; // screen shake
let lives=3,score=0,coins=0,timer=400,timerCnt=0;
let cam={x:0};
let player,enemies,items,fireballs,particles,blocks,platforms;
let flagReached,deathTimer,winTimer;
let stompCombo=0; // consecutive stomps without touching ground
let checkpointX=-1; // checkpoint respawn position (-1 = none)
let currentWorld=0,currentLevel=0;
let worldsUnlocked=[];
let LEVEL,COLS;
let boss=null;
let waterZones=[];
let iceZones=[];
// Persistent power-up state across levels
let savedForm={big:false,fire:false,cat:false,fish:false};
let heldShell=null; // reference to carried shell enemy
let coyoteFrames=0; // frames since leaving ground (coyote time)
let pMeter=0; // P-meter: running speed gauge (0-100)
let bulletBills=[]; // active bullet bills
let cannonTimer=0; // global cannon fire timer
let warpState=null; // {phase:'enter'|'subzone'|'exit', savedX, savedY, savedCamX, timer, theme, platforms, coins, ...}
let warpPipes=[]; // positions of warp-enabled pipes
let enemyPipes=[]; // pipes that spawn enemies {x,y,timer,maxSpawned,spawned}
let vines=[]; // active vines: {x, baseY, topY, growing, maxH}
let vineBonus=null; // {phase:'rise'|'bonus'|'fall', timer, totalCoins, collected, returnX}
let flagSlideY=0; // flag Y position during pole slide
let irisTimer=0,irisDir=0,irisCallback=null; // iris transition: dir=1 closing, -1 opening
let springboards=[]; // {x, y, compressed, timer}
let fallingPlats=[]; // {x, y, w, h, shaking, fallTimer, vy, active}
let oneWayPlats=[]; // {x, y, w, h} — passable from below
let growTimer=0; // size transition animation timer
let levelCoins=0,levelEnemies=0; // per-level stats for clear screen
let redCoinsCollected=0,redCoinsTotal=0; // red coins per level
// Inventory for memory game rewards
let inventory={mushroom:0,fireflower:0,leaf:0,star:0,oneup:0,fish:0,coins:0};
// Memory game state
let memoryCards=[],memoryFlipped=[],memoryMatched=[],memoryFails=0,memoryMaxFails=2;
let memoryState='hidden'; // hidden,showing,checking,done
let memoryFirst=-1,memorySecond=-1,memoryTimer=0;
let memoryCompleted=false; // true when all cards matched
let memoryLevelCounter=0; // counts levels completed, bonus every 2
let showInventory=false,inventoryCursor=0;
let lavaZones=[];
let confirmResetShown=false;
let fireBars=[]; // {x, y, angle, speed, len}
let conveyors=[]; // {x, y, w, dir} — push player left or right
let starCoins=[]; // {x, y, collected, anim}
let starCoinsCollected=[]; // per-level tracking (3 bools)
let hammers=[]; // thrown hammers from MiniThor {x,y,vx,vy,life}
let cumuloSpawns=[]; // enemies spawned by Cumulo
let rouletteTimer=0,rouletteResult=null,rouletteSpeed=0;
// Per-level best collectibles: levelBests[w][l]={redCoins:X,redTotal:Y,starCoins:Z}
let levelBests=Array.from({length:8},()=>Array.from({length:4},()=>({redCoins:0,redTotal:5,starCoins:0})));
let kickFreeze=0; // brief freeze-frame on shell kick
let speedRunTimer=0,speedRunActive=false; // speed run timer in frames

function initUnlocked(){worldsUnlocked=[];for(let w=0;w<8;w++){worldsUnlocked.push([w===0,false,false,false]);}}
initUnlocked();

// ---- SAVE/LOAD ----
function saveLevelBests(){
  const lb=levelBests[currentWorld][currentLevel];
  const sc3=starCoinsCollected.filter(Boolean).length;
  lb.redCoins=Math.max(lb.redCoins,redCoinsCollected);
  lb.redTotal=Math.max(lb.redTotal,redCoinsTotal);
  lb.starCoins=Math.max(lb.starCoins,sc3);
  saveGame();
}
function saveGame(){
  try{const hi=Math.max(score||0,parseInt(localStorage.getItem('megajumpy_hi')||'0'));
  localStorage.setItem('megajumpy_save',JSON.stringify({worldsUnlocked,inventory,memoryLevelCounter,savedForm,levelBests}));
  localStorage.setItem('megajumpy_hi',String(hi));}catch(e){}
}
function loadGame(){
  try{const d=JSON.parse(localStorage.getItem('megajumpy_save'));
  if(d&&d.worldsUnlocked&&d.worldsUnlocked.length===8)worldsUnlocked=d.worldsUnlocked;
  if(d&&d.inventory)inventory=d.inventory;
  if(d&&d.memoryLevelCounter)memoryLevelCounter=d.memoryLevelCounter;
  if(d&&d.savedForm)savedForm=d.savedForm;
  if(d&&d.levelBests&&d.levelBests.length===8)levelBests=d.levelBests;}catch(e){}
}
loadGame();

// ---- INPUT ----
const K={};
document.addEventListener('keydown',e=>{K[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Escape'||e.code==='KeyP')togglePause();});
document.addEventListener('keyup',e=>{K[e.code]=false;});
function togglePause(){if(state==='playing'){paused=!paused;if(paused)stopMusic();else startMusic(currentLevel===3?'boss':WC[currentWorld].theme,musicSpeed);}}
function setupT(id,code){
  const el=document.getElementById(id);if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();K[code]=true;el.classList.add('pressed');},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();K[code]=false;el.classList.remove('pressed');},{passive:false});
  el.addEventListener('touchcancel',e=>{e.preventDefault();K[code]=false;el.classList.remove('pressed');},{passive:false});
  el.addEventListener('mousedown',()=>{K[code]=true;el.classList.add('pressed');});
  el.addEventListener('mouseup',()=>{K[code]=false;el.classList.remove('pressed');});
  el.addEventListener('mouseleave',()=>{K[code]=false;el.classList.remove('pressed');});
}
setupT('btn-dleft','ArrowLeft');setupT('btn-dright','ArrowRight');setupT('btn-up','ArrowUp');setupT('btn-down','ArrowDown');
setupT('btn-a','Space');setupT('btn-b','KeyX');
// B button also acts as RUN while held (like Mario B button)
(function(){
  const el=document.getElementById('btn-b');if(!el)return;
  el.addEventListener('touchstart',e=>{K['ShiftLeft']=true;},{passive:true});
  el.addEventListener('touchend',e=>{K['ShiftLeft']=false;},{passive:true});
  el.addEventListener('touchcancel',e=>{K['ShiftLeft']=false;},{passive:true});
})();
// Start button = pause
(function(){
  const el=document.getElementById('btn-start');if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();togglePause();},{passive:false});
  el.addEventListener('click',()=>togglePause());
})();

// ---- CANVAS TOUCH/CLICK (for menus, memory, inventory) ----
let canvasTap=null; // {x,y} in canvas coords
function getCanvasPos(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  return{x:(clientX-r.left)/r.width*CW,y:(clientY-r.top)/r.height*CH};
}
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];canvasTap=getCanvasPos(t.clientX,t.clientY);
  if(aC.state==='suspended')aC.resume();
},{passive:false});
canvas.addEventListener('click',e=>{
  canvasTap=getCanvasPos(e.clientX,e.clientY);
  if(aC.state==='suspended')aC.resume();
});

// ---- AUDIO ----
const aC=new(window.AudioContext||window.webkitAudioContext)();
function snd(f,d,t='square',v=0.07){try{const o=aC.createOscillator(),g=aC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(0.001,aC.currentTime+d);o.connect(g);g.connect(aC.destination);o.start();o.stop(aC.currentTime+d);}catch(e){}}

function sfxCoin(){snd(988,.06);setTimeout(()=>snd(1319,.1),60);}
function sfxStomp(){snd(180,.12,'triangle');haptic(30);}

function sfxSwitch(){snd(880,.05);setTimeout(()=>snd(1100,.05),50);setTimeout(()=>snd(1320,.08),100);}
function sfxSplash(){snd(200,.08,'triangle',.05);setTimeout(()=>snd(150,.06,'triangle',.04),40);setTimeout(()=>snd(100,.06,'triangle',.03),80);}
function sfxIceSlide(){snd(1200,.04,'sine',.02);setTimeout(()=>snd(1400,.03,'sine',.02),30);}
function sfxGameOver(){snd(262,.15,'sawtooth',.06);setTimeout(()=>snd(220,.15,'sawtooth',.06),200);setTimeout(()=>snd(196,.15,'sawtooth',.06),400);setTimeout(()=>snd(165,.3,'sawtooth',.06),600);}
function sfxPipe(){snd(200,.08,'square',.04);setTimeout(()=>snd(150,.12,'square',.04),60);}
function sfxBump(){snd(180,.06,'triangle',.05);}
function sfxTick(){snd(1200,.03,'square',.03);}
function haptic(ms){try{navigator.vibrate(ms);}catch(e){}}
function sfxSpring(){snd(330,.06);setTimeout(()=>snd(660,.06),40);setTimeout(()=>snd(990,.08),80);}
function screenShake(intensity,dur){shakeIntensity=intensity;shakeTimer=dur;}

function startMusic(theme,speed){
  stopMusic();musicPlaying=true;currentMusicTheme=theme;musicSpeed=speed||1;
  const m=MT[theme||'plains'];if(!m)return;
  const beat=60/m.bpm/musicSpeed;
  function playLoop(){
    if(!musicPlaying)return;
    const now=aC.currentTime;
    for(const[freq,dur,delay]of m.mel){
      if(freq===0)continue;
      try{const o=aC.createOscillator(),g=aC.createGain();o.type='square';o.frequency.value=freq;g.gain.value=0.04;g.gain.setValueAtTime(0.04,now+delay*beat);g.gain.exponentialRampToValueAtTime(0.001,now+(delay+dur)*beat);o.connect(g);g.connect(aC.destination);o.start(now+delay*beat);o.stop(now+(delay+dur)*beat+0.05);musicNodes.push(o);}catch(e){}
    }
    for(const[freq,dur,delay]of m.bas){
      try{const o=aC.createOscillator(),g=aC.createGain();o.type='triangle';o.frequency.value=freq;g.gain.value=0.05;g.gain.setValueAtTime(0.05,now+delay*beat);g.gain.exponentialRampToValueAtTime(0.001,now+(delay+dur)*beat);o.connect(g);g.connect(aC.destination);o.start(now+delay*beat);o.stop(now+(delay+dur)*beat+0.05);musicNodes.push(o);}catch(e){}
    }
    musicNodes=musicNodes.slice(-100);
    musicTimer=setTimeout(playLoop,m.len*beat*1000);
  }
  playLoop();
}
function stopMusic(){musicPlaying=false;for(const o of musicNodes)try{o.stop();}catch(e){}musicNodes=[];if(musicTimer)clearTimeout(musicTimer);musicTimer=null;}

// ---- PROCEDURAL LEVEL GENERATOR ----
function generateLevel(wi,li){
  const wc=WC[wi];
  const isBoss=li===3;
  const diff=wi*4+li;
  const cols=isBoss?80:Math.min(200,120+diff*3);
  const grid=[];
  for(let r=0;r<ROWS;r++){let row='';for(let c=0;c<cols;c++)row+='.';grid.push(row);}
  function set(c,r,ch){if(r>=0&&r<ROWS&&c>=0&&c<cols)grid[r]=grid[r].substring(0,c)+ch+grid[r].substring(c+1);}
  function get(c,r){return(r<0||r>=ROWS||c<0||c>=cols)?'.':grid[r][c];}

  // Ground
  for(let c=0;c<cols;c++){set(c,GROUND_ROW,'G');set(c,GROUND_ROW+1,'G');}

  // Seeded RNG
  let seed=wi*1000+li*100+42;
  function rng(){seed=(seed*1103515245+12345)&0x7fffffff;return(seed>>16)/32768;}
  function rngI(a,b){return Math.floor(rng()*(b-a+1))+a;}

  const safeEnd=8,learnEnd=Math.floor(cols*.25),comboEnd=Math.floor(cols*.55),challEnd=Math.floor(cols*.8),flagStart=cols-20;

  // Holes
  let c=safeEnd;
  while(c<flagStart-5){
    if(rng()<(isBoss?.02:.04+diff*.003)&&c>safeEnd+5){
      const hw=rngI(2,Math.min(3,2+Math.floor(diff/8)));
      for(let h=0;h<hw;h++){set(c+h,GROUND_ROW,'H');set(c+h,GROUND_ROW+1,'H');}
      c+=hw+4;
    }else c++;
  }

  // Pipes
  let firstPipeCol=-1;
  const pipeN=isBoss?1:rngI(2,4);
  for(let i=0;i<pipeN;i++){
    const zone=Math.floor((flagStart-safeEnd)/pipeN);
    const pc=rngI(safeEnd+5+i*zone,safeEnd+10+i*zone);
    if(pc<cols-15&&get(pc,GROUND_ROW)==='G'){set(pc,GROUND_ROW,'P');set(pc,GROUND_ROW+1,'P');set(pc,GROUND_ROW-1,'p');set(pc,GROUND_ROW-2,'P');if(firstPipeCol<0)firstPipeCol=pc;}
  }

  // Water zones
  waterZones=[];
  if(wc.mech.includes('water')){
    const n=isBoss?1:rngI(2,3);
    for(let i=0;i<n;i++){const ws=rngI(learnEnd+i*20,comboEnd-10);waterZones.push({sc:ws,ec:Math.min(ws+rngI(12,20),cols-25),tr:8,br:GROUND_ROW-1});}
  }

  // Ice zones
  iceZones=[];
  if(wc.mech.includes('ice'))iceZones.push({sc:0,ec:cols});

  // Lava zones
  lavaZones=[];
  if(wc.mech.includes('lava')){
    const n=isBoss?2:rngI(2,4);
    for(let i=0;i<n;i++){
      const ls=rngI(learnEnd+i*15,challEnd),le=Math.min(ls+rngI(4,8),cols-25);
      lavaZones.push({sc:ls,ec:le});
      for(let lc=ls;lc<le;lc++){if(get(lc,GROUND_ROW)==='G'){set(lc,GROUND_ROW,'A');set(lc,GROUND_ROW+1,'A');}}
    }
  }

  // Block templates (predefined patterns mixed with random)
  const templates=[
    // [rowOffset, colOffset, tile] — relative to anchor
    {name:'stairUp',tiles:[[0,0,'B'],[0,1,'?'],[0,2,'B'],[-1,1,'B']]},
    {name:'longRow',tiles:[[0,0,'B'],[0,1,'?'],[0,2,'B'],[0,3,'?'],[0,4,'B']]},
    {name:'questionTrio',tiles:[[0,0,'?'],[0,1,'B'],[0,2,'?']]},
    {name:'powerBlock',tiles:[[0,0,'B'],[0,1,'M'],[0,2,'B']]},
    {name:'hiddenGift',tiles:[[0,0,'B'],[0,1,'B'],[0,2,'B'],[-1,1,'I']]},
    {name:'coinRow',tiles:[[0,0,'?'],[0,1,'?'],[0,2,'?'],[0,3,'?']]},
    {name:'brickWall',tiles:[[0,0,'B'],[0,1,'B'],[0,2,'B'],[-1,0,'B'],[-1,1,'S'],[-1,2,'B']]},
  ];
  function randBlockTile(){const r=rng();if(r<.08)return'Q';if(r<.22)return'?';if(r<.30)return'M';if(r<.38)return'F';if(r<.44)return'S';if(r<.52)return'L';if(r<.60)return'N';return'B';}

  // Blocks (higher density, Mario-like) — mix templates + random
  for(let bc=safeEnd;bc<flagStart-5;){
    if(rng()<(isBoss?.02:.09+diff*.003)){
      const row=rngI(8,11);
      if(rng()<.45){
        // Use template
        const tmpl=templates[rngI(0,templates.length-1)];
        let ok=true;
        for(const t of tmpl.tiles){const tc=bc+t[1],tr=row+t[0];if(tc>=flagStart-5||tr<2||tr>=ROWS||get(tc,tr)!=='.'){ok=false;break;}}
        if(ok){for(const t of tmpl.tiles)set(bc+t[1],row+t[0],t[2]);bc+=tmpl.tiles.reduce((m,t)=>Math.max(m,t[1]),0)+4;}
        else bc++;
      }else{
        // Random row (original logic)
        const cnt=rngI(2,7);
        for(let bi=0;bi<cnt;bi++){const col=bc+bi;if(col>=flagStart-5)break;set(col,row,randBlockTile());}
        bc+=cnt+3;
      }
    }else bc++;
  }

  // Coins (scattered)
  for(let cc=safeEnd;cc<flagStart;cc++){if(rng()<.12){const cr=rngI(6,11);if(get(cc,cr)==='.')set(cc,cr,'C');}}

  // Red coins (5 per non-boss level, spread across level)
  if(!isBoss){
    let placed=0;
    const section=Math.floor((flagStart-safeEnd)/5);
    for(let ri=0;ri<5&&placed<5;ri++){
      const rc=rngI(safeEnd+ri*section+3,safeEnd+(ri+1)*section-2);
      const rr=rngI(5,GROUND_ROW-2);
      if(rc<flagStart-5&&get(rc,rr)==='.'){set(rc,rr,'O');placed++;}
    }
  }

  // Coin arcs over holes (Mario-style)
  for(let hc=safeEnd;hc<flagStart-5;hc++){
    if(get(hc,GROUND_ROW)==='H'&&hc>0&&get(hc-1,GROUND_ROW)==='G'){
      // Find hole width
      let hw=0;while(hc+hw<cols&&get(hc+hw,GROUND_ROW)==='H')hw++;
      if(hw>=2&&hw<=5){
        for(let ci=0;ci<hw;ci++){
          const arcH=Math.round(Math.sin((ci+1)/(hw+1)*Math.PI)*3)+1;
          const cr=GROUND_ROW-1-arcH;
          if(cr>=4&&get(hc+ci,cr)==='.')set(hc+ci,cr,'C');
        }
      }
      hc+=hw; // skip past this hole
    }
  }

  // Piranha plants in pipes (enemy that pops out)
  for(let pc2=0;pc2<cols;pc2++){
    if(get(pc2,GROUND_ROW)==='P'&&get(pc2,GROUND_ROW-2)==='P'&&rng()<.5){
      set(pc2,GROUND_ROW-3,'R'); // R = piranha plant
    }
  }

  // Enemies (ground + flying)
  for(let ec=safeEnd+3;ec<flagStart-3;){
    const dens=wc.mech.includes('dense')?.06:.03+diff*.002;
    if(rng()<dens&&get(ec,GROUND_ROW-1)==='.'){
      // Flying chance increases with difficulty
      const flyChance=Math.min(.4,.05+diff*.015);
      if(rng()<flyChance){
        // Flying enemy: place at elevated row
        const fr=rngI(4,8);
        set(ec,fr,rng()<.5?'Y':'V'); // Y=flying coyote, V=flying chameleon (lizard)
      }else{
        set(ec,GROUND_ROW-1,rng()<.6?'c':'k');
      }
      ec+=4;
    }else ec++;
  }

  // Jumping fish in water zones
  if(waterZones.length>0){
    for(const wz of waterZones){
      const fishCount=rngI(1,2+Math.floor(diff/6));
      for(let fi=0;fi<fishCount;fi++){
        const fc=rngI(wz.sc+2,wz.ec-2);
        if(get(fc,wz.br)==='.')set(fc,wz.br,'J'); // J=jumping fish
      }
    }
  }

  // Invisible blocks (secrets)
  if(!isBoss){for(let si=0;si<rngI(1,3);si++){const sc=rngI(learnEnd,challEnd),sr=rngI(5,8);if(get(sc,sr)==='.')set(sc,sr,'I');}}

  // New enemies: Caspy (ghost, world 2+), MiniThor (hammer bro, world 3+), Cumulo (lakitu, world 4+), Chien Enragé (chain chomp, world 5+), Menhir (thwomp, world 3+)
  if(wi>=1&&!isBoss){
    const caspyN=rngI(1,2);
    for(let ci=0;ci<caspyN;ci++){const cc3=rngI(comboEnd+ci*10,challEnd);const cr=rngI(6,10);if(get(cc3,cr)==='.')set(cc3,cr,'1');}
  }
  if(wi>=2&&!isBoss){
    const thorN=rngI(0,1+Math.floor(diff/10));
    for(let ti=0;ti<thorN;ti++){const tc2=rngI(learnEnd+ti*15,challEnd);if(get(tc2,GROUND_ROW-1)==='.')set(tc2,GROUND_ROW-1,'2');}
  }
  if(wi>=3&&!isBoss){
    if(rng()<.4+diff*.02){const cc4=rngI(learnEnd,comboEnd);set(cc4,3,'3');} // Cumulo high in sky
  }
  if(wi>=4&&!isBoss){
    const chienN=rngI(0,1);
    for(let ci=0;ci<chienN;ci++){const cc5=rngI(comboEnd,challEnd);if(get(cc5,GROUND_ROW-1)==='.')set(cc5,GROUND_ROW-1,'4');}
  }
  if(wi>=2&&!isBoss){
    const menN=rngI(0,1+Math.floor(diff/12));
    for(let mi=0;mi<menN;mi++){const mc=rngI(comboEnd+mi*8,challEnd);const mr=rngI(3,5);if(get(mc,mr)==='.')set(mc,mr,'5');}
  }

  // Fire bars (rotating fire obstacles, world 4+)
  if(wi>=3&&!isBoss){
    const fbN=rngI(0,2);
    for(let fi=0;fi<fbN;fi++){const fc2=rngI(learnEnd+fi*15,challEnd);const fr=GROUND_ROW-1;if(get(fc2,fr)==='.')set(fc2,fr,'#');} // #=fire bar pivot
  }

  // Conveyor belts (world 5+)
  if(wi>=4&&!isBoss){
    const cvN=rngI(0,2);
    for(let ci=0;ci<cvN;ci++){const cc6=rngI(learnEnd+ci*15,comboEnd);const cl=rngI(3,5);for(let cx=0;cx<cl&&cc6+cx<cols;cx++)if(get(cc6+cx,GROUND_ROW)==='G')set(cc6+cx,GROUND_ROW,'~');}
  }

  // Star coins (3 per non-boss level, increasingly hidden)
  if(!isBoss){
    const scSection=Math.floor((flagStart-safeEnd)/3);
    for(let si=0;si<3;si++){
      const sx=rngI(safeEnd+si*scSection+3,safeEnd+(si+1)*scSection-2);
      const sy=rngI(3,7); // high up = harder to reach
      if(get(sx,sy)==='.')set(sx,sy,'$'); // $=star coin
    }
  }

  // Bullet Bill cannons (from world 3+)
  if(wi>=2&&!isBoss){
    const nCannons=rngI(1,2+Math.floor(diff/8));
    for(let ci=0;ci<nCannons;ci++){
      const cc2=rngI(comboEnd+ci*8,challEnd-2);
      if(cc2<flagStart-8&&get(cc2,GROUND_ROW)==='G'&&get(cc2,GROUND_ROW-1)==='.')set(cc2,GROUND_ROW-1,'E'); // E=cannon
    }
  }

  // Checkpoint (midpoint flag)
  if(!isBoss){
    const cpC=Math.floor((learnEnd+challEnd)/2);
    if(get(cpC,GROUND_ROW)==='G'&&get(cpC,GROUND_ROW-1)==='.')set(cpC,GROUND_ROW-1,'K'); // K=checkpoint
  }

  // Moving platforms
  platforms=[];
  if(wc.mech.includes('platforms')||wi>=1){
    const n=isBoss?1:rngI(1,3+Math.floor(diff/6));
    for(let pi=0;pi<n;pi++){
      const px=rngI(learnEnd+pi*20,challEnd)*T,py=rngI(7,11)*T;
      const horiz=rng()<.6;
      platforms.push({x:px,y:py,w:T*3,h:T/2,mx:horiz?rngI(1,3)*(rng()<.5?1:-1):0,my:horiz?0:rngI(1,2)*(rng()<.5?1:-1),sx:px,sy:py,range:rngI(60,120)});
    }
  }

  // Vertical world: elevated platforms
  if(wc.mech.includes('vertical')){
    for(let vc=learnEnd;vc<challEnd;vc+=rngI(4,7)){
      const vr=rngI(4,9),vl=rngI(3,5);
      for(let vi=0;vi<vl&&vc+vi<cols;vi++)if(get(vc+vi,vr)==='.')set(vc+vi,vr,'D');
    }
  }

  // Narrow platforms (sky)
  if(wc.mech.includes('narrow')){
    for(let nc=learnEnd;nc<challEnd;nc+=rngI(5,8)){
      const nr=rngI(6,11),nl=rngI(2,3);
      for(let ni=0;ni<nl&&nc+ni<cols;ni++)if(get(nc+ni,nr)==='.')set(nc+ni,nr,'D');
    }
  }

  // One-way platforms (from world 2+, thin platforms player can jump through from below)
  if(wi>=1&&!isBoss){
    const owCount=rngI(1,3);
    for(let oi=0;oi<owCount;oi++){
      const ox=rngI(learnEnd+oi*15,challEnd)*T,oy=rngI(7,10)*T;
      oneWayPlats.push({x:ox,y:oy,w:T*3,h:T/4});
    }
  }

  // Springboards/trampolines (from world 2+)
  if(wi>=1&&!isBoss){
    const spCount=rngI(0,2);
    for(let si=0;si<spCount;si++){
      const sx=rngI(learnEnd+si*20,challEnd);
      if(get(sx,GROUND_ROW)!=='G'&&get(sx,GROUND_ROW)!=='g')continue; // skip if no ground
      const sy=(GROUND_ROW-1)*T;
      springboards.push({x:sx*T,y:sy,w:T,h:T,compressed:false,timer:0,baseY:sy});
    }
  }

  // Falling platforms (from world 3+)
  if(wi>=2&&!isBoss){
    const fpCount=rngI(0,2);
    for(let fi=0;fi<fpCount;fi++){
      const fx=rngI(learnEnd+fi*15,challEnd)*T,fy=rngI(7,10)*T;
      fallingPlats.push({x:fx,y:fy,w:T*3,h:T/2,shaking:false,fallTimer:0,vy:0,active:true,baseY:fy});
    }
  }

  // Flag or boss arena
  if(!isBoss){
    const fc=flagStart+10;
    for(let si=0;si<10;si++)for(let sj=0;sj<=si;sj++)set(fc-10+si,GROUND_ROW-1-sj,'D');
    set(fc,6,'T');
    for(let fr=7;fr<GROUND_ROW;fr++)set(fc,fr,'X');
  }else{
    const as=cols-35;
    // Ensure solid ground across arena
    for(let ac=as;ac<cols;ac++){set(ac,GROUND_ROW,'G');set(ac,GROUND_ROW+1,'G');}
    // Boss spawn
    set(as+20,GROUND_ROW-2,'Z');
    if(wi>=4){
      for(let bc=as+10;bc<as+25;bc++)set(bc,GROUND_ROW,'b');
      set(as+28,GROUND_ROW-1,'W');
    }
  }

  return grid;
}

// ---- LOAD LEVEL ----
function loadLevel(w,l){currentWorld=w;currentLevel=l;oneWayPlats=[];springboards=[];fallingPlats=[];LEVEL=generateLevel(w,l);COLS=LEVEL[0].length;}
function tileAt(c,r){return(r<0||r>=ROWS||c<0||c>=COLS)?'.':LEVEL[r][c];}
function isSolid(c,r){return'GgDdbE~Pp'.includes(tileAt(c,r));}
function isIce(px){for(const z of iceZones)if(px/T>=z.sc&&px/T<=z.ec)return true;return false;}
function inWater(px,py){for(const z of waterZones)if(px/T>=z.sc&&px/T<=z.ec&&py/T>=z.tr&&py/T<=z.br)return true;return false;}
function onLava(px,py){for(const z of lavaZones){const lc=Math.floor(px/T);if(lc>=z.sc&&lc<=z.ec&&Math.floor(py/T)>=GROUND_ROW)return true;}return false;}

// ---- INIT LEVEL ----
function initLevel(){
  blocks=[];enemies=[];items=[];fireballs=[];particles=[];boss=null;bulletBills=[];cannonTimer=0;warpState=null;warpPipes=[];enemyPipes=[];vines=[];vineBonus=null;fireBars=[];conveyors=[];starCoins=[];starCoinsCollected=[false,false,false];hammers=[];cumuloSpawns=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ch=LEVEL[r][c];
    if('?BMFSLINQ'.includes(ch)){
      let tp='brick',ct='none',coinCount=0;
      if(ch==='?'){tp='question';ct='coin';}
      if(ch==='Q'){tp='question';ct='multicoin';coinCount=5+Math.floor(Math.random()*6);} // 5-10 coins
      if(ch==='M'){tp='question';ct='mushroom';}
      if(ch==='F'){tp='question';ct='fireflower';}
      if(ch==='S'){tp='question';ct='star';}
      if(ch==='L'){tp='question';ct='leaf';}
      if(ch==='N'){tp='question';ct='fish';}
      if(ch==='I'){tp='invisible';const ir=Math.random();ct=ir<.25?'vine':ir<.45?'1up':ir<.95?'coin':'secretPipe';}
      blocks.push({x:c*T,y:r*T,w:T,h:T,type:tp,content:ct,hit:false,bumpY:0,bumpVel:0,destroyed:false,revealed:false,coinCount:coinCount});
    }
    if(ch==='C')items.push({type:'coin',x:c*T+8,y:r*T+8,w:16,h:16,vy:0,active:true,anim:0,floating:true});
    if(ch==='O'){items.push({type:'redcoin',x:c*T+8,y:r*T+8,w:16,h:16,vy:0,active:true,anim:0,floating:true});redCoinsTotal++;}
    if(ch==='$')starCoins.push({x:c*T+4,y:r*T+4,w:24,h:24,collected:false,anim:0});
    if(ch==='#')fireBars.push({x:c*T+T/2,y:r*T+T/2,angle:Math.random()*Math.PI*2,speed:.03+Math.random()*.02,len:3});
    if(ch==='c')enemies.push({type:'coyote',x:c*T,y:r*T,w:T,h:T,vx:-1,vy:0,alive:true,anim:0,stomped:false,stompTimer:0,flying:false});
    if(ch==='k')enemies.push({type:'chameleon',x:c*T,y:r*T,w:T,h:T,vx:-.8,vy:0,alive:true,anim:0,shell:false,shellVx:0,stomped:false,stompTimer:0,flying:false,shellTimer:0,held:false});

    if(ch==='R')enemies.push({type:'piranha',x:c*T,y:r*T,w:T,h:T,vx:0,vy:0,alive:true,anim:0,stomped:false,stompTimer:0,flying:false,baseY:r*T,hideY:r*T+T,popTimer:0,popPhase:'hidden'});
    if(ch==='1')enemies.push({type:'caspy',x:c*T,y:r*T,w:T,h:T,vx:1,vy:0,alive:true,anim:0,stomped:false,stompTimer:0,flying:false,baseX:c*T,chaseRange:T*5});
    if(ch==='2')enemies.push({type:'minithor',x:c*T,y:r*T,w:T,h:T,vx:-0.6,vy:0,alive:true,anim:0,stomped:false,stompTimer:0,flying:false,attackTimer:0,hammerCooldown:0});
    if(ch==='3')enemies.push({type:'cumulo',x:c*T,y:r*T,w:T,h:T,vx:0.8,vy:0,alive:true,anim:0,stomped:false,stompTimer:0,flying:true,flyBaseY:r*T,flyAmp:10,flySpeed:.01,spawnTimer:0});
    if(ch==='4')enemies.push({type:'chien',x:c*T,y:r*T,w:T,h:T,vx:0,vy:0,alive:true,anim:0,stomped:false,stompTimer:0,flying:false,anchorX:c*T,chainLen:T*3,chargeVx:0,chargePhase:'idle',chargeTimer:0});
    if(ch==='5')enemies.push({type:'menhir',x:c*T,y:r*T,w:T,h:T*2,vx:0,vy:0,alive:true,anim:0,stomped:false,stompTimer:0,flying:false,baseY:r*T,phase:'wait',waitTimer:0});
    if(ch==='K'){/* checkpoint marker — handled in player update */}
    if(ch==='W')blocks.push({x:c*T,y:r*T,w:T,h:T,type:'switch',hit:false,bumpY:0,bumpVel:0,destroyed:false,content:'none'});
    if(ch==='Z'){
      const bossHp=3+Math.floor(currentWorld/2);
      boss={x:c*T,y:r*T-T,w:T*2,h:T*2,vx:-2,vy:0,hp:bossHp,maxHp:bossHp,alive:true,anim:0,invuln:0,
        phase:currentWorld>=4?'bridge':'stomp',attackTimer:0,stunTimer:0,bridgeActive:currentWorld>=4};
    }
  }
  player={x:3*T,y:(GROUND_ROW-1)*T,w:22,h:30,vx:0,vy:0,onGround:false,jumpHeld:false,jumpFrames:0,
    big:savedForm.big,fire:savedForm.fire,cat:savedForm.cat,fish:savedForm.fish,star:false,starTimer:0,
    facing:1,anim:0,invulnTimer:0,dead:false,flying:false,flyFrames:0,running:false,inWater:false,tailSpin:false,tailSpinTimer:0,
    wallSlide:false,wallDir:0,groundPound:false,gpLock:0};
  if(player.big)player.h=52;
  cam.x=0;flagReached=false;deathTimer=0;winTimer=0;timer=400;timerCnt=0;stompCombo=0;checkpointX=-1;heldShell=null;coyoteFrames=0;pMeter=0;levelCoins=0;levelEnemies=0;redCoinsCollected=0;redCoinsTotal=0;flagSlideY=0;
  // Find first pipe as warp pipe (non-boss levels only)
  // Find warp pipes (up to 3) — must have solid ground 3 tiles on each side
  if(currentLevel!==3){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(tileAt(c,r)==='p'&&warpPipes.length<3){
    let safe=true;for(let dx=-3;dx<=3;dx++){if(!isSolid(c+dx,GROUND_ROW)){safe=false;break;}}
    if(safe)warpPipes.push({x:c*T,y:r*T,col:c,row:r});
  }}}
  // Setup enemy-spawning pipes (world 3+, non-warp pipes, non-boss)
  if(currentWorld>=2&&currentLevel!==3){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(tileAt(c,r)==='p'){
        const isWarp=warpPipes.some(wp=>wp.col===c&&wp.row===r);
        if(!isWarp&&Math.random()<0.4){enemyPipes.push({x:c*T,y:r*T,timer:0,maxSpawned:2,spawned:0});}
      }
    }
  }
  // Enemy speed scaling per world
  const espd=1+currentWorld*0.1;
  for(const e of enemies){if(e.vx!==0)e.vx*=espd;}
}

function rectOv(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function solidAt(px,py,pw,ph){
  const l=Math.floor(px/T),r=Math.floor((px+pw-1)/T),t=Math.floor(py/T),b=Math.floor((py+ph-1)/T);
  for(let row=t;row<=b;row++)for(let col=l;col<=r;col++)if(isSolid(col,row))return true;
  return false;
}

// ---- BLOCK LOGIC ----
function spawnItem(b){
  const bx=b.x,by=b.y;
  let content=b.content;
  // Adaptive: big player gets fireflower instead of mushroom
  if(content==='mushroom'&&(player.big||player.fire||player.cat))content='fireflower';
  if(content==='coin'){coins++;levelCoins++;if(coins>=100){coins-=100;lives++;sfx1up();particles.push({type:'pop',x:bx,y:by-24,text:'1UP!',life:50});}score+=200;sfxCoin();particles.push({type:'pop',x:bx,y:by-16,text:'+200',life:40});particles.push({type:'coinB',x:bx+16,y:by-16,vy:-8,life:30});}
  else if(content==='mushroom'){items.push({type:'mushroom',x:bx,y:by,w:T,h:T,vx:2,vy:0,active:true,anim:0,floating:false,emerging:true,emergeY:by});sfxPower();}
  else if(content==='fireflower'){items.push({type:'fireflower',x:bx,y:by,w:T,h:T,vx:0,vy:0,active:true,anim:0,floating:false,emerging:true,emergeY:by});sfxPower();}
  else if(content==='star'){items.push({type:'star',x:bx,y:by-T,w:T,h:T,vx:3,vy:-5,active:true,anim:0,floating:false});sfxPower();}
  else if(content==='leaf'){items.push({type:'leaf',x:bx,y:by-T*2,w:T,h:T,vx:1.5,vy:0,active:true,anim:0,floating:false,leafDrift:true});sfxPower();}
  else if(content==='fish'){items.push({type:'fish',x:bx,y:by,w:T,h:T,vx:2,vy:0,active:true,anim:0,floating:false,emerging:true,emergeY:by});sfxPower();}
  else if(content==='1up'){items.push({type:'1up',x:bx,y:by,w:T,h:T,vx:2,vy:0,active:true,anim:0,floating:false,emerging:true,emergeY:by});sfxPower();}
  else if(content==='vine'){vines.push({x:bx+T/2-4,baseY:by,topY:by,growing:true,maxH:T*7});sfxPower();}
  else if(content==='secretPipe'){
    // Secret pipe appears! Initiate secret bonus room
    particles.push({type:'pop',x:bx,y:by-20,text:'SECRET!',life:60});sfxPower();
    warpState={phase:'enter',timer:0,savedX:player.x,savedY:player.y,savedCamX:cam.x,secret:true};
  }
}

function hitBlock(b){
  if(b.type==='invisible'&&!b.revealed){b.revealed=true;b.hit=true;spawnItem(b);sfxBlock();b.bumpVel=-4;return;}
  if(b.type==='switch'&&!b.hit){
    b.hit=true;sfxSwitch();
    if(boss&&boss.bridgeActive){
      boss.bridgeActive=false;
      for(let r=0;r<ROWS;r++)for(let cc=0;cc<COLS;cc++){if(LEVEL[r][cc]==='b')LEVEL[r]=LEVEL[r].substring(0,cc)+'.'+LEVEL[r].substring(cc+1);}
      if(boss.alive){boss.vy=-3;boss.stunTimer=999;}
      screenShake(8,20);
    }
    return;
  }
  if(b.hit&&b.type==='question'){sfxBump();b.bumpVel=-4;
    for(const e of enemies)if(e.alive&&e.x+e.w>b.x&&e.x<b.x+b.w&&Math.abs((e.y+e.h)-b.y)<6){e.alive=false;e.deathFlip=true;e.vy=-5;e.stomped=true;e.stompTimer=0;score+=100;particles.push({type:'pop',x:e.x,y:e.y-16,text:'+100',life:40});}
    return;}
  sfxBlock();b.bumpVel=-4;
  for(const e of enemies)if(e.alive&&e.x+e.w>b.x&&e.x<b.x+b.w&&Math.abs((e.y+e.h)-b.y)<6){e.alive=false;e.deathFlip=true;e.vy=-5;e.stomped=true;e.stompTimer=0;score+=100;particles.push({type:'pop',x:e.x,y:e.y-16,text:'+100',life:40});}
  // Bump propagation: collect floating coins above block
  for(const it of items){if(it.active&&it.floating&&it.x+8>b.x&&it.x<b.x+b.w&&it.y+16>b.y-T&&it.y<b.y){it.active=false;coins++;if(coins>=100){coins-=100;lives++;sfx1up();}score+=200;sfxCoin();particles.push({type:'coinB',x:it.x,y:it.y,vy:-6,life:25});}}
  if(b.type==='question'&&!b.hit){
    if(b.content==='multicoin'){
      b.coinCount--;
      coins++;if(coins>=100){coins-=100;lives++;sfx1up();particles.push({type:'pop',x:b.x,y:b.y-24,text:'1UP!',life:50});}
      score+=200;sfxCoin();particles.push({type:'coinB',x:b.x+16,y:b.y-16,vy:-8,life:30});
      if(b.coinCount<=0)b.hit=true;
    }else{b.hit=true;spawnItem(b);}
  }
  else if(b.type==='brick'){
    if(player.big||player.fire||player.cat){
      b.destroyed=true;score+=50;
      for(let i=0;i<4;i++)particles.push({type:'brick',x:b.x+8+(i%2)*16,y:b.y+8+Math.floor(i/2)*16,vx:(i%2?2:-2)+Math.random(),vy:-5-Math.random()*3,life:40});
    }else{
      // Small player: brick gives a coin (bump only)
      coins++;if(coins>=100){coins-=100;lives++;sfx1up();}
      score+=200;sfxCoin();particles.push({type:'coinB',x:b.x+16,y:b.y-16,vy:-8,life:30});
    }
  }
}

function hitBlockAt(col,row){for(const b of blocks)if(!b.destroyed&&Math.floor(b.x/T)===col&&Math.floor(b.y/T)===row){hitBlock(b);return;}}

function killPlayer(){
  if(player.dead||player.invulnTimer>0||player.star)return;
  if(player.big||player.fire||player.cat||player.fish){player.big=false;player.fire=false;player.cat=false;player.fish=false;player.invulnTimer=90;sfxBlock();}
  else{player.dead=true;player.vy=0;deathTimer=-30;sfxDeath();stopMusic();} // freeze 30 frames before bounce
  if(heldShell){heldShell.held=false;heldShell.shellVx=0;heldShell=null;}
}

// ---- UPDATE PLAYER ----
function updatePlayer(){
  if(player.dead){
    deathTimer++;
    if(deathTimer<=0)return; // freeze-frame: everything paused
    if(deathTimer===1)player.vy=-8; // start bounce after freeze
    player.vy+=GRAVITY;player.y+=player.vy;
    if(deathTimer>90){lives--;if(lives<=0){state='gameover';sfxGameOver();}else if(checkpointX>0){
    // Respawn at checkpoint
    player.dead=false;player.x=checkpointX;player.y=(GROUND_ROW-1)*T;player.vx=0;player.vy=0;player.invulnTimer=90;
    cam.x=Math.max(0,checkpointX-CW*.4);flagReached=false;deathTimer=0;timer=Math.max(timer,200);
    startMusic(currentLevel===3?'boss':WC[currentWorld].theme);
  }else{state='deathscreen';deathScreenTimer=90;stopMusic();}}return;}
  if(flagReached){winTimer++;player.vx=0;if(heldShell){heldShell.held=false;heldShell.shellVx=0;heldShell=null;}
    if(winTimer<60){player.vy=3;player.y+=player.vy;flagSlideY=Math.min(flagSlideY+3,(GROUND_ROW-7)*T);if(player.y+player.h>=(GROUND_ROW)*T){player.y=GROUND_ROW*T-player.h;player.vy=0;}}
    else if(winTimer>=60&&winTimer<90){player.y=GROUND_ROW*T-player.h;player.x+=2;player.facing=1;player.anim+=.15;} // walk right on ground
    else if(winTimer>=90&&timer>0){
      // Timer countdown: drain timer fast (5 per tick, 10 ticks/sec)
      const drain=Math.min(timer,5);timer-=drain;score+=drain*50;
      if(winTimer%6===0)sfxTick();
    }else if(timer<=0&&winTimer>90){
      // Fireworks based on last digit of timer when flag was grabbed
      if(!player._fireworksDone){
        player._fireworksDone=true;
        const ld=winTimer%10;const fwCount=ld===1?1:ld===3?3:ld===6?6:0;
        for(let fi=0;fi<fwCount;fi++){
          setTimeout(()=>{
            const fx=player.x-cam.x+Math.random()*200-100,fy=50+Math.random()*150;
            for(let i=0;i<8;i++)particles.push({type:'pop',x:player.x+Math.random()*200-100,y:fy+Math.random()*40-20,text:'\u2605',life:40+Math.random()*20});
            sfxFlag();
          },fi*400);
        }
        setTimeout(()=>{stopMusic();saveLevelBests();state='win';},Math.max(500,fwCount*400+300));
      }
    }else if(timer<=0){stopMusic();saveLevelBests();state='win';}
    return;}

  const p=player;
  const run=K['ShiftLeft']||K['ShiftRight']||K['KeyC'];
  p.running=run;
  const wasInWater=p.inWater;
  p.inWater=inWater(p.x+p.w/2,p.y+p.h/2);
  if(p.inWater&&!wasInWater)sfxSplash();
  if(!p.inWater&&wasInWater)sfxSplash();
  const onI=isIce(p.x+p.w/2);
  const fishWater=p.fish&&p.inWater,fishLand=p.fish&&!p.inWater;
  const wGrav=p.inWater?(fishWater?.08:.15):GRAVITY;
  const wMax=p.inWater?(fishWater?3:2):MAX_FALL;
  const iA=onI?.15:1;
  const iD=onI?.97:DECEL;
  const fishSpd=fishLand?.6:(fishWater?1.5:1);
  const acc=(run?RUN_ACCEL:WALK_ACCEL)*iA*fishSpd*(p.onGround?1:0.55),mx=(run?RUN_MAX:WALK_MAX)*fishSpd;

  if(K['ArrowLeft']){p.vx-=acc;p.facing=-1;}
  else if(K['ArrowRight']){p.vx+=acc;p.facing=1;}
  else{p.vx*=iD;if(Math.abs(p.vx)<.1)p.vx=0;}
  p.vx=Math.max(-mx,Math.min(mx,p.vx));
  // Skid detection: moving fast in opposite direction of facing
  p.skidding=p.onGround&&((K['ArrowLeft']&&p.vx>2)||(K['ArrowRight']&&p.vx<-2));
  if(p.skidding&&p.anim%4<1){particles.push({type:'dust',x:p.x+p.w/2,y:p.y+p.h,vx:(p.vx>0?1:-1)*Math.random(),vy:-Math.random()*1.5,life:12});}
  // Running dust trail
  if(p.onGround&&Math.abs(p.vx)>WALK_MAX&&Math.floor(p.anim*4)%4===0){particles.push({type:'runDust',x:p.x+p.w/2-p.facing*8,y:p.y+p.h,vx:-p.facing*Math.random(),vy:-Math.random()*0.8,life:12});}
  // Star sparkle trail
  if(p.star&&Math.floor(p.anim*3)%3===0){particles.push({type:'starTrail',x:p.x+p.w/2+(Math.random()-.5)*10,y:p.y+p.h/2+(Math.random()-.5)*10,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:15});}
  if(!run&&Math.abs(p.vx)>WALK_MAX)p.vx*=.96;

  const jk=K['Space']||K['ArrowUp'];
  if(p.inWater){
    if(jk&&!p.jumpHeld){p.vy=-4;p.jumpHeld=true;sfxJump();}
    if(!jk)p.jumpHeld=false;
  }else{
    const canJump=p.onGround||coyoteFrames<4;
    if(jk&&canJump&&!p.jumpHeld){const pForce=pMeter>=100?RUN_JUMP_FORCE*1.15:(Math.abs(p.vx)>WALK_MAX)?RUN_JUMP_FORCE:JUMP_FORCE;p.vy=pForce;p.onGround=false;coyoteFrames=99;p.jumpHeld=true;p.jumpFrames=0;p.groundPound=false;sfxJump();}
    // Wall jump: jump off wall when sliding
    else if(jk&&!p.jumpHeld&&p.wallSlide){p.vy=JUMP_FORCE*.9;p.vx=-p.wallDir*4;p.jumpHeld=true;p.jumpFrames=0;p.wallSlide=false;p.facing=-p.wallDir;p.groundPound=false;sfxJump();}
    if(jk&&p.jumpHeld&&p.jumpFrames<JUMP_HOLD_FRAMES){p.vy+=JUMP_HOLD;p.jumpFrames++;}
    if(!jk){p.jumpHeld=false;p.jumpFrames=JUMP_HOLD_FRAMES;}
  }

  // Coyote time tracking
  if(p.onGround)coyoteFrames=0;else coyoteFrames++;

  // P-meter: fills when running at high speed, drains otherwise
  if(run&&Math.abs(p.vx)>WALK_MAX*0.9&&p.onGround)pMeter=Math.min(100,pMeter+2);
  else if(p.onGround)pMeter=Math.max(0,pMeter-3);
  // Don't drain in air (preserves meter for jump)

  // Cat glide: smooth hover, gentle float, limited upward
  if(p.cat&&!p.onGround&&jk&&!p.inWater&&p.vy>=0){
    p.flying=true;
    if(p.flyFrames<120){
      // Gentle slow fall instead of fighting gravity
      p.vy=Math.max(p.vy*0.7,-1.5);
      if(p.vy>1.2)p.vy=1.2; // cap downward speed while gliding
      p.flyFrames++;
    }
  }else if(p.cat&&!p.onGround&&jk&&!p.inWater&&p.vy<0){
    // While rising, just slow the rise slightly (no extra boost)
    p.flying=true;
    if(p.flyFrames<120)p.flyFrames++;
  }else{
    if(!p.onGround&&p.cat&&p.flying&&!jk)p.flying=false; // release stops glide
  }
  if(p.onGround){p.flying=false;p.flyFrames=0;stompCombo=0;
    // Dust particles on landing
    if(p.vy===0&&!p._wasOnGround){for(let i=0;i<3;i++)particles.push({type:'dust',x:p.x+p.w/2+(Math.random()-.5)*20,y:p.y+p.h,vx:(Math.random()-.5)*2,vy:-Math.random()*1.5,life:15});}
  }
  p._wasOnGround=p.onGround;

  // Apex float: reduced gravity near jump peak for hang time
  const apexMul=(!p.inWater&&!p.onGround&&Math.abs(p.vy)<1.8)?0.55:1;
  p.vy+=(!p.cat||!p.flying)?(wGrav*apexMul):(wGrav*0.35);
  if(p.vy>wMax)p.vy=wMax;
  // Crouching
  p.crouching=K['ArrowDown']&&p.big&&p.onGround&&!p.inWater;
  if(p.crouching){p.vx*=.9;if(Math.abs(p.vx)<.1)p.vx=0;}
  // Ground pound: press down while airborne
  if(K['ArrowDown']&&!p.onGround&&!p.groundPound&&!p.inWater&&p.gpLock<=0){p.groundPound=true;p.vy=0;p.vx=0;p.gpLock=6;/* brief pause at start */}
  if(p.gpLock>0){p.gpLock--;if(p.gpLock<=0&&p.groundPound)p.vy=12;}
  if(p.groundPound&&p.onGround){
    p.groundPound=false;screenShake(4,8);haptic([40,20,60]);sfxStomp();
    // Break bricks below
    const gc=Math.floor((p.x+p.w/2)/T),gr=Math.floor((p.y+p.h)/T);
    for(let dx=-1;dx<=1;dx++){const b=blocks.find(b2=>!b2.destroyed&&Math.floor(b2.x/T)===(gc+dx)&&Math.floor(b2.y/T)===gr);if(b&&b.type==='brick'&&p.big)hitBlock(b);}
    // Kill enemies nearby on ground
    for(const e of enemies){if(!e.alive||e.stomped)continue;if(Math.abs(e.x-p.x)<T*2&&Math.abs(e.y-(p.y+p.h))<T&&e.type!=='piranha'){
      e.alive=false;e.deathFlip=true;e.stomped=true;e.stompTimer=0;e.vy=-5;score+=100;levelEnemies++;
      particles.push({type:'pop',x:e.x,y:e.y-16,text:'+100',life:40});}}
    for(let i=0;i<5;i++)particles.push({type:'dust',x:p.x+p.w/2+(Math.random()-.5)*30,y:p.y+p.h,vx:(Math.random()-.5)*3,vy:-Math.random()*2,life:15});
  }
  p.h=p.crouching?30:(p.big?52:30);p.w=22;

  // Horizontal
  p.x+=p.vx;
  p.wallSlide=false;p.wallDir=0;
  if(solidAt(p.x,p.y,p.w,p.h)){
    if(p.vx>0){p.x=Math.floor((p.x+p.w)/T)*T-p.w;if(!p.onGround&&p.vy>0){p.wallSlide=true;p.wallDir=1;}}
    else{p.x=Math.floor(p.x/T)*T+T;if(!p.onGround&&p.vy>0){p.wallSlide=true;p.wallDir=-1;}}
    p.vx=0;
  }
  for(const b of blocks){if(b.destroyed||(b.type==='invisible'&&!b.revealed))continue;if(!rectOv({x:p.x,y:p.y,w:p.w,h:p.h},b))continue;if(p.vx>0)p.x=b.x-p.w;else if(p.vx<0)p.x=b.x+b.w;p.vx=0;}
  // Wall slide: slow fall when pressing into wall
  if(p.wallSlide&&!p.inWater){p.vy=Math.min(p.vy,2.5);}

  // Vertical
  p.onGround=false;
  p.y+=p.vy;
  if(solidAt(p.x,p.y,p.w,p.h)){
    if(p.vy>0){p.y=Math.floor((p.y+p.h)/T)*T-p.h;p.vy=0;p.onGround=true;}
    else{const hr=Math.floor(p.y/T);p.y=hr*T+T;p.vy=0;hitBlockAt(Math.floor((p.x+p.w/2)/T),hr);}
  }
  for(const b of blocks){
    if(b.destroyed)continue;
    if(b.type==='invisible'&&!b.revealed){if(p.vy<0&&rectOv({x:p.x,y:p.y,w:p.w,h:p.h},b)){p.y=b.y+b.h;p.vy=1;hitBlock(b);}continue;}
    if(!rectOv({x:p.x,y:p.y,w:p.w,h:p.h},b))continue;
    if(p.vy<0){p.y=b.y+b.h;p.vy=1;hitBlock(b);}
    else{p.y=b.y-p.h;p.vy=0;p.onGround=true;}
  }

  // Platform riding (after vertical resolution so onGround persists)
  for(const pl of platforms){
    if(p.vy>=0&&p.y+p.h>=pl.y-2&&p.y+p.h<=pl.y+8&&p.x+p.w>pl.x&&p.x<pl.x+pl.w){
      p.y=pl.y-p.h;p.vy=0;p.onGround=true;p.x+=pl.mx;
    }
  }

  // Conveyor belts: push player if standing on ~ tiles
  if(p.onGround){const cc=Math.floor((p.x+p.w/2)/T),cr=Math.floor((p.y+p.h+2)/T);
    if(cr<ROWS&&LEVEL[cr]&&LEVEL[cr][cc]==='~')p.vx+=1.5;}

  // One-way platforms (passable from below, solid from above)
  for(const ow of oneWayPlats){
    if(p.vy>=0&&p.y+p.h>=ow.y-2&&p.y+p.h<=ow.y+8&&p.x+p.w>ow.x&&p.x<ow.x+ow.w){
      p.y=ow.y-p.h;p.vy=0;p.onGround=true;
    }
  }

  // Springboards/trampolines
  for(const sp of springboards){
    if(p.vy>=0&&p.y+p.h>=sp.y&&p.y+p.h<=sp.y+10&&p.x+p.w>sp.x&&p.x<sp.x+sp.w){
      sp.compressed=true;sp.timer=12;
      const boost=K['Space']?JUMP_FORCE*1.8:JUMP_FORCE*1.4;
      p.vy=boost;p.onGround=false;sfxSpring();haptic(40);
      particles.push({type:'pop',x:sp.x+sp.w/2,y:sp.y-8,text:'BOING!',life:30});
    }
    if(sp.compressed){sp.timer--;if(sp.timer<=0){sp.compressed=false;sp.y=sp.baseY;}}
  }

  // Falling platforms
  for(const fp of fallingPlats){
    if(!fp.active)continue;
    if(!fp.shaking&&p.vy>=0&&p.y+p.h>=fp.y-2&&p.y+p.h<=fp.y+8&&p.x+p.w>fp.x&&p.x<fp.x+fp.w){
      p.y=fp.y-p.h;p.vy=0;p.onGround=true;
      fp.shaking=true;fp.fallTimer=45; // shake for 45 frames then fall
    }
    if(fp.shaking&&fp.fallTimer>0){
      fp.fallTimer--;
      if(fp.fallTimer<=0){fp.vy=3;} // start falling
      // still solid while shaking
      if(p.vy>=0&&p.y+p.h>=fp.y-2&&p.y+p.h<=fp.y+8&&p.x+p.w>fp.x&&p.x<fp.x+fp.w){
        p.y=fp.y-p.h;p.vy=0;p.onGround=true;
      }
    }
    if(fp.vy>0){
      fp.y+=fp.vy;fp.vy+=0.15;
      // Player can ride the falling platform
      if(p.vy>=0&&p.y+p.h>=fp.y-2&&p.y+p.h<=fp.y+10&&p.x+p.w>fp.x&&p.x<fp.x+fp.w){
        p.y=fp.y-p.h;p.vy=fp.vy;p.onGround=true;
      }
      if(fp.y>ROWS*T+100)fp.active=false;
    }
  }

  if(p.x<cam.x){p.x=cam.x;p.vx=0;}
  if(p.y>ROWS*T+64)killPlayer();
  if(onLava(p.x+p.w/2,p.y+p.h))killPlayer();
  if(p.star){p.starTimer--;if(p.starTimer<=0){p.star=false;startMusic(currentLevel===3?'boss':WC[currentWorld].theme,timer<100?1.5:1);}}
  if(p.invulnTimer>0)p.invulnTimer--;
  if(speedRunActive)speedRunTimer++;
  timerCnt++;const timerSpeed=timer<100?40:60;if(timerCnt>=timerSpeed){timerCnt=0;timer--;if(timer<=0)killPlayer();
    if(timer===99&&musicSpeed===1&&currentMusicTheme){startMusic(currentMusicTheme,1.5);}
  }
  if(Math.abs(p.vx)>.5)p.anim+=.15*(Math.abs(p.vx)/WALK_MAX);
  if(growTimer>0)growTimer--;

  const tc=p.x-CW*.4;if(tc>cam.x)cam.x+=(tc-cam.x)*.1;
  cam.x=Math.max(0,Math.min(cam.x,COLS*T-CW));

  if((K['KeyX']||K['KeyZ'])&&p.fire&&fireballs.length<2&&!heldShell){fireballs.push({x:p.x+(p.facing>0?p.w:0),y:p.y+p.h*.4,vx:FB_SPEED*p.facing,vy:0,life:120,anim:0});sfxFire();K['KeyX']=false;K['KeyZ']=false;}
  else if((K['KeyX']||K['KeyZ'])&&p.cat&&!p.fire&&!p.tailSpin&&p.tailSpinTimer<=0&&!heldShell){
    p.tailSpin=true;p.tailSpinTimer=30;sfxTailSpin();K['KeyX']=false;K['KeyZ']=false;
    // Tail spin hitbox: 1.5 tiles in facing direction
    try{
    const tx=p.facing>0?p.x+p.w:p.x-T*1.5,ty=p.y,tw=T*1.5,th=p.h;
    // Hit enemies
    for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(!e.alive||e.stomped)continue;
      if(e.x<tx+tw&&e.x+T>tx&&e.y<ty+th&&e.y+T>ty){
        e.alive=false;e.deathFlip=true;e.stomped=true;e.stompTimer=0;e.vy=-6;score+=100;levelEnemies++;
        particles.push({type:'pop',x:e.x,y:e.y-16,text:'+100',life:40});
        for(let si=0;si<6;si++){const ang=si*Math.PI/3;particles.push({type:'stompBurst',x:e.x+T/2,y:e.y+T/2,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3-2,life:18});}
        if(navigator.vibrate)navigator.vibrate(20);}}
    // Break bricks in range
    const bx1=Math.floor(tx/T),bx2=Math.floor((tx+tw)/T),by1=Math.floor(ty/T),by2=Math.floor((ty+th)/T);
    for(let gx=bx1;gx<=bx2;gx++)for(let gy=by1;gy<=by2;gy++){
      if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS&&tiles[gy]&&tiles[gy][gx]==='B'&&p.big){tiles[gy][gx]=' ';score+=50;
        for(let i=0;i<4;i++)particles.push({type:'brick',x:gx*T+8+(i%2)*16,y:gy*T+8+Math.floor(i/2)*16,vx:(i%2?2:-2)+Math.random(),vy:-5-Math.random()*3,life:40});}}
    }catch(ex){}
  }
  if(p.tailSpinTimer>0)p.tailSpinTimer--;if(p.tailSpinTimer<=0)p.tailSpin=false;

  // Shell throwing: fire button or release run while holding shell
  if(heldShell){
    const run=K['ShiftLeft']||K['ShiftRight']||K['KeyC'];
    const fire=K['KeyX']||K['KeyZ'];
    if(fire||!run){
      heldShell.held=false;heldShell.shellVx=p.facing*6;
      heldShell.x=p.x+(p.facing>0?p.w+2:-heldShell.w-2);heldShell.y=p.y+p.h-heldShell.h;
      heldShell=null;sfxKick();if(fire){K['KeyX']=false;K['KeyZ']=false;}
    }
  }

  // Checkpoint detection
  const cpCol=Math.floor((p.x+p.w/2)/T),cpRow=Math.floor((p.y+p.h)/T);

  // Warp pipe: press down while standing on warp pipe
  if(K['ArrowDown']&&p.onGround&&!warpState){
    for(const wp of warpPipes){
      if(Math.abs(p.x+p.w/2-wp.x-T/2)<T*.8&&Math.abs(p.y+p.h-wp.y)<T*2){
        warpState={phase:'enter',timer:0,savedX:p.x,savedY:p.y,savedCamX:cam.x,bonusCoins:0};
        sfxPipe();break;
      }
    }
  }
  if(checkpointX<0){
    for(let dr=-1;dr<=1;dr++){const tc=tileAt(cpCol,cpRow+dr);if(tc==='K'){checkpointX=cpCol*T;particles.push({type:'pop',x:p.x,y:p.y-20,text:'CHECKPOINT!',life:60});sfxSwitch();break;}}
  }

  // Flag — trigger when player reaches flag area (staircase zone or pole)
  if(!flagReached){
    for(let r=0;r<ROWS;r++)for(let cc=0;cc<COLS;cc++){
      if((tileAt(cc,r)==='T'||tileAt(cc,r)==='X')&&Math.abs(p.x+p.w/2-cc*T-T/2)<T*3){
        flagReached=true;sfxFlag();score+=Math.max(0,timer)*10;p.vx=0;
        // Flag height bonus: higher = more points
        const flagTop=6*T,flagBot=GROUND_ROW*T;const flagH=flagBot-flagTop;
        const heightPct=Math.max(0,Math.min(1,(flagBot-p.y)/flagH));
        const flagBonus=heightPct>.9?5000:heightPct>.7?4000:heightPct>.5?2000:heightPct>.3?800:400;
        score+=flagBonus;particles.push({type:'pop',x:p.x,y:p.y-30,text:'+'+flagBonus,life:60});
        // Snap player to pole for slide animation
        const poleX=cc*T-p.w/2+T/2;p.x=poleX;
        break;
      }
    }
  }
}

// ---- PLATFORMS ----
function updatePlatforms(){for(const pl of platforms){pl.x+=pl.mx;pl.y+=pl.my;if(Math.abs(pl.x-pl.sx)>pl.range)pl.mx=-pl.mx;if(Math.abs(pl.y-pl.sy)>pl.range)pl.my=-pl.my;}}

// ---- BOSS ----
function updateBoss(){
  if(!boss||!boss.alive)return;
  if(boss.stunTimer>0){boss.stunTimer--;if(boss.stunTimer===998)boss.vy=5;}
  if(boss.invuln>0)boss.invuln--;
  boss.anim+=.1;boss.attackTimer++;

  if(boss.stunTimer<=0){
    const dx=player.x-boss.x;
    if(Math.abs(dx)>T*2)boss.vx=dx>0?2:-2;else boss.vx=0;
    // Per-world boss attacks
    const atkInterval=Math.max(60,120-currentWorld*10);
    if(boss.attackTimer>atkInterval&&Math.abs(dx)<T*8){
      boss.attackTimer=0;sfxBoss();
      if(currentWorld<=1){// W1-2: charge attack
        boss.vx=dx>0?5:-5;
      }else if(currentWorld<=3){// W3-4: charge + jump slam
        if(Math.random()<0.5){boss.vx=dx>0?5:-5;}else{boss.vy=-10;boss.vx=dx>0?3:-3;}
      }else if(currentWorld<=5){// W5-6: throw hammers + jump
        hammers.push({x:boss.x+boss.w/2,y:boss.y,vx:dx>0?4:-4,vy:-6,life:90});
        if(Math.random()<.4)boss.vy=-8;
      }else{// W7-8: all attacks combined
        const r=Math.random();
        if(r<.3){boss.vx=dx>0?6:-6;}
        else if(r<.6){boss.vy=-10;boss.vx=dx>0?3:-3;}
        else{hammers.push({x:boss.x+boss.w/2,y:boss.y,vx:dx>0?4:-4,vy:-5,life:90});hammers.push({x:boss.x+boss.w/2,y:boss.y,vx:dx>0?3:-3,vy:-7,life:90});}
      }
    }
    boss.x+=boss.vx;
  }

  boss.vy+=GRAVITY;if(boss.vy>MAX_FALL)boss.vy=MAX_FALL;boss.y+=boss.vy;
  const bRow=Math.floor((boss.y+boss.h)/T),bCol=Math.floor((boss.x+boss.w/2)/T);
  if(isSolid(bCol,bRow)){boss.y=bRow*T-boss.h;boss.vy=0;}
  // Keep boss inside arena (cols-35 to cols-5)
  const arenaL=(COLS-35)*T,arenaR=(COLS-5)*T-boss.w;
  if(boss.x<arenaL){boss.x=arenaL;boss.vx=Math.abs(boss.vx);}
  if(boss.x>arenaR){boss.x=arenaR;boss.vx=-Math.abs(boss.vx);}

  if(boss.y>ROWS*T+100){
    boss.alive=false;score+=5000;particles.push({type:'pop',x:boss.x,y:ROWS*T-100,text:'+5000',life:60});screenShake(10,25);
    setTimeout(()=>{if(!flagReached){flagReached=true;sfxFlag();score+=Math.max(0,timer)*10;}},500);
    return;
  }

  if(!player.dead&&player.invulnTimer<=0&&boss.stunTimer<=0&&rectOv({x:player.x,y:player.y,w:player.w,h:player.h},{x:boss.x,y:boss.y,w:boss.w,h:boss.h})){
    if(player.vy>0&&player.y+player.h-boss.y<20&&boss.phase==='stomp'&&boss.invuln<=0){
      boss.hp--;boss.invuln=60;boss.stunTimer=45;player.vy=JUMP_FORCE*.7;sfxStomp();score+=1000;screenShake(6,15);
      particles.push({type:'pop',x:boss.x+boss.w/2,y:boss.y-20,text:'-1 HP',life:50});
      if(boss.hp<=0){boss.alive=false;score+=5000;particles.push({type:'pop',x:boss.x,y:boss.y-40,text:'+5000',life:60});screenShake(10,25);
        setTimeout(()=>{if(!flagReached){flagReached=true;sfxFlag();score+=Math.max(0,timer)*10;}},500);}
    }else if(player.star){
      boss.hp--;boss.invuln=30;score+=1000;sfxStomp();screenShake(4,10);
      particles.push({type:'pop',x:boss.x+boss.w/2,y:boss.y-20,text:'-1 HP',life:50});
      if(boss.hp<=0){boss.alive=false;score+=5000;screenShake(10,25);
        setTimeout(()=>{if(!flagReached){flagReached=true;sfxFlag();score+=Math.max(0,timer)*10;}},500);}
    }else killPlayer();
  }
}

// ---- ENEMIES ----
function updateEnemies(){
  for(const e of enemies){
    if(!e.alive){if(e.stomped){e.stompTimer++;if(e.deathFlip){e.vy+=GRAVITY;e.y+=e.vy;}if(e.stompTimer>30||e.y>ROWS*T+64)e.stomped=false;}continue;}
    if(e.x<cam.x-T*6||e.x>cam.x+CW+T*6)continue;

    // Jumping fish logic
    if(e.type==='fish_jump'){
      e.jumpTimer++;
      if(e.jumpPhase==='wait'&&e.jumpTimer>150){e.jumpPhase='jump';e.vy=-8;e.jumpTimer=0;}
      if(e.jumpPhase==='jump'){
        e.vy+=GRAVITY;e.y+=e.vy;
        if(e.y>=e.baseY){e.y=e.baseY;e.vy=0;e.jumpPhase='wait';e.jumpTimer=0;}
      }
      e.anim+=.15;
    }else if(e.type==='piranha'){
      // Piranha plant: pops up from pipe, hides when player is close
      e.popTimer++;e.anim+=.08;
      const distToPlayer=Math.abs(player.x-e.x);
      if(e.popPhase==='hidden'){
        e.y=e.hideY;
        if(e.popTimer>120&&distToPlayer>T*3){e.popPhase='rising';e.popTimer=0;}
      }else if(e.popPhase==='rising'){
        e.y-=.5;if(e.y<=e.baseY){e.y=e.baseY;e.popPhase='up';e.popTimer=0;}
      }else if(e.popPhase==='up'){
        if(e.popTimer>90){e.popPhase='sinking';e.popTimer=0;}
      }else if(e.popPhase==='sinking'){
        e.y+=.5;if(e.y>=e.hideY){e.y=e.hideY;e.popPhase='hidden';e.popTimer=0;}
      }
    }else if(e.type==='caspy'){
      // Ghost: moves toward player when player faces away, stops when facing it
      const facingGhost=(player.facing>0&&e.x>player.x)||(player.facing<0&&e.x<player.x);
      if(!facingGhost){e.x+=(player.x-e.x)*.015;e.y+=(player.y-e.y)*.01;}
      e.anim+=.1;
    }else if(e.type==='minithor'){
      // Hammer Bro: hops on platform, throws hammers in arcs
      e.x+=e.vx;e.anim+=.1;e.attackTimer++;
      if(e.attackTimer>90){e.attackTimer=0;e.vy=-6;// jump
        // Throw hammer toward player
        if(Math.abs(e.x-player.x)<T*8){
          const dir=player.x>e.x?1:-1;
          hammers.push({x:e.x+T/2,y:e.y,vx:dir*3,vy:-5,life:120});
        }
      }
    }else if(e.type==='cumulo'){
      // Lakitu-like: floats above player, drops mini-coyotes
      e.x+=(player.x-e.x)*.02;e.y=e.flyBaseY+Math.sin(e.anim*.02)*e.flyAmp;e.anim+=.1;
      e.spawnTimer++;
      if(e.spawnTimer>200&&enemies.filter(en=>en.alive&&en.type==='coyote').length<6){
        e.spawnTimer=0;
        enemies.push({type:'coyote',x:e.x,y:e.y+T,w:T,h:T,vx:player.x>e.x?1:-1,vy:0,alive:true,anim:0,stomped:false,stompTimer:0,flying:false});
      }
    }else if(e.type==='chien'){
      // Chain Chomp: lunges toward player, snaps back to anchor
      e.anim+=.15;e.chargeTimer++;
      const distP=player.x-e.anchorX;
      if(e.chargePhase==='idle'&&e.chargeTimer>60&&Math.abs(distP)<T*5){e.chargePhase='charge';e.chargeVx=(distP>0?5:-5);e.chargeTimer=0;}
      if(e.chargePhase==='charge'){e.x+=e.chargeVx;
        if(Math.abs(e.x-e.anchorX)>e.chainLen){e.chargePhase='snap';e.chargeTimer=0;}}
      if(e.chargePhase==='snap'){e.x+=(e.anchorX-e.x)*.15;if(Math.abs(e.x-e.anchorX)<2){e.x=e.anchorX;e.chargePhase='idle';e.chargeTimer=0;}}
    }else if(e.type==='menhir'){
      // Thwomp: waits, slams down when player is below, rises slowly
      const pBelow=Math.abs(player.x+player.w/2-(e.x+T/2))<T*2&&player.y>e.y;
      if(e.phase==='wait'){e.waitTimer++;if(pBelow&&e.waitTimer>30){e.phase='fall';e.waitTimer=0;}}
      if(e.phase==='fall'){e.vy+=1.2;e.y+=e.vy;
        const eb2=Math.floor((e.y+e.h)/T);if(isSolid(Math.floor((e.x+T/2)/T),eb2)){e.y=eb2*T-e.h;e.vy=0;e.phase='grounded';e.waitTimer=0;screenShake(3,6);}}
      if(e.phase==='grounded'){e.waitTimer++;if(e.waitTimer>60){e.phase='rise';}}
      if(e.phase==='rise'){e.y-=1;if(e.y<=e.baseY){e.y=e.baseY;e.phase='wait';e.waitTimer=0;}}
    }else if(e.flying){
      // Flying enemies: sinusoidal vertical movement, horizontal patrol
      e.x+=e.vx;e.anim+=.1;
      e.y=e.flyBaseY+Math.sin(e.anim*e.flySpeed*10)*e.flyAmp;
      // Reverse at walls
      const nc=e.vx>0?Math.floor((e.x+e.w)/T):Math.floor((e.x-1)/T);
      if(isSolid(nc,Math.floor((e.y+e.h/2)/T))||e.x<cam.x-T*4)e.vx=-e.vx;
    }else if(e.type==='chameleon'&&e.shell){
      if(e.held){
        // Shell is being carried by player
        e.x=player.x+(player.facing>0?player.w:-e.w);
        e.y=player.y+player.h-e.h;
        e.shellTimer=0; // don't revive while held
      }else{
        e.x+=e.shellVx;
        const eL=Math.floor(e.x/T),eR=Math.floor((e.x+e.w-1)/T),eRow=Math.floor((e.y+e.h/2)/T);
        if(isSolid(eL,eRow)||e.x<0)e.shellVx=Math.abs(e.shellVx);
        if(isSolid(eR,eRow))e.shellVx=-Math.abs(e.shellVx);
        for(const e2 of enemies)if(e2!==e&&e2.alive&&rectOv(e,e2)){
          e2.alive=false;e2.vy=-5;e2.deathFlip=true;
          e.shellKills=(e.shellKills||0)+1;
          const chainScores=[100,200,400,800,1000];const cs=e.shellKills<=5?chainScores[e.shellKills-1]:1000;
          score+=cs;particles.push({type:'pop',x:e2.x,y:e2.y-16,text:'+'+cs,life:40});
          if(e.shellKills>=5){lives++;sfx1up();particles.push({type:'pop',x:e2.x,y:e2.y-32,text:'1UP!',life:50});e.shellKills=0;}
        }
        for(const b of blocks)if(!b.destroyed&&b.type!=='invisible'&&rectOv(e,b)){if(b.type==='brick')hitBlock(b);e.shellVx=-e.shellVx;}
        // Revival timer: shell idle = chameleon comes back
        if(e.shellVx===0){
          e.shellTimer=(e.shellTimer||0)+1;
          if(e.shellTimer>480){// 8 seconds at 60fps
            e.shell=false;e.shellVx=0;e.shellTimer=0;e.vx=player.x>e.x?-0.8:0.8;
          }
        }else{e.shellTimer=0;}
      }
    }else e.x+=e.vx;

    if(!e.flying&&e.type!=='fish_jump'&&e.type!=='piranha'){
      e.vy+=GRAVITY;if(e.vy>MAX_FALL)e.vy=MAX_FALL;e.y+=e.vy;
      const eb=Math.floor((e.y+e.h)/T),ec=Math.floor((e.x+e.w/2)/T);
      if(isSolid(ec,eb)){e.y=eb*T-e.h;e.vy=0;}
    }
    if(!(e.type==='chameleon'&&e.shell)&&!e.flying&&e.type!=='fish_jump'&&e.type!=='piranha'){
      const nc=e.vx>0?Math.floor((e.x+e.w)/T):Math.floor((e.x-1)/T);
      if(isSolid(nc,Math.floor((e.y+e.h/2)/T)))e.vx=-e.vx;
      const fc=e.vx>0?Math.floor((e.x+e.w)/T):Math.floor(e.x/T);
      // World 5+: some coyotes are "dumb" and fall off edges
      const dumb=currentWorld>=4&&e.type==='coyote'&&(Math.floor(e.x)%3===0);
      if(!dumb&&!isSolid(fc,Math.floor((e.y+e.h+2)/T))&&e.vy===0)e.vx=-e.vx;
    }
    if(e.y>ROWS*T+64)e.alive=false;
    e.anim+=.1;
    // Piranha only dangerous when out of pipe (rising or up)
    if(e.type==='piranha'&&(e.popPhase==='hidden'||e.popPhase==='sinking'))continue;
    if(!player.dead&&!flagReached&&player.invulnTimer<=0&&rectOv({x:player.x,y:player.y,w:player.w,h:player.h},e)){
      if(player.star){e.alive=false;score+=200;levelEnemies++;sfxStomp();particles.push({type:'pop',x:e.x,y:e.y-16,text:'+200',life:40});}
      else if(player.vy>0&&player.y+player.h-e.y<14){
        const comboScores=[100,200,400,800,1000];
        const comboS=comboScores[Math.min(stompCombo,comboScores.length-1)];
        stompCombo++;
        const superBounce=(K['Space']||K['ArrowUp']);
        player.vy=superBounce?JUMP_FORCE*.9:JUMP_FORCE*.6;player.invulnTimer=Math.max(player.invulnTimer,15);score+=comboS;levelEnemies++;sfxStomp();
        if(superBounce){particles.push({type:'pop',x:player.x+player.w/2,y:player.y+player.h,text:'\u2191\u2191',life:20});}
        const comboText=stompCombo>1?comboS+' x'+stompCombo+'!':'+'+comboS;
        particles.push({type:'pop',x:e.x,y:e.y-16,text:comboText,life:40});
        // Stomp burst particles
        for(let si=0;si<6;si++){const ang=si*Math.PI/3;particles.push({type:'stompBurst',x:e.x+e.w/2,y:e.y+e.h/2,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3-2,life:18});}
        if(stompCombo>=5){lives++;sfx1up();particles.push({type:'pop',x:e.x,y:e.y-36,text:'1UP!',life:50});stompCombo=0;}
        if(e.type==='piranha'){killPlayer();} // piranhas can't be stomped
        else if(e.type==='caspy'){/* ghosts can't be stomped */killPlayer();}
        else if(e.type==='menhir'){killPlayer();} // menhirs can't be stomped
        else if(e.type==='chien'){killPlayer();} // chain chomp can't be stomped — hit the anchor by bump!
        else if(e.type==='minithor'){e.stomped=true;e.stompTimer=0;e.alive=false;e.deathFlip=true;e.vy=-5;}
        else if(e.type==='cumulo'){e.stomped=true;e.stompTimer=0;e.alive=false;e.deathFlip=true;e.vy=-5;}
        else if(e.type==='fish_jump'){e.stomped=true;e.stompTimer=0;e.alive=false;e.deathFlip=true;e.vy=-5;}
        else if(e.flying&&e.type==='coyote'){e.stomped=true;e.stompTimer=0;e.alive=false;e.flying=false;e.deathFlip=true;e.vy=-5;}
        else if(e.flying&&e.type==='chameleon'){e.flying=false;e.vy=0;} // lose wings, becomes ground chameleon
        else if(e.type==='coyote'){e.stomped=true;e.stompTimer=0;e.alive=false;e.deathFlip=true;e.vy=-5;}
        else if(e.type==='chameleon'){
          if(!e.shell){e.shell=true;e.shellVx=0;e.vx=0;e.shellTimer=0;sfxKick();}
          else if(e.shellVx===0){
            const run=K['ShiftLeft']||K['ShiftRight']||K['KeyC'];
            if(run&&!heldShell){e.held=true;heldShell=e;sfxKick();}
            else{e.shellVx=player.facing*6;sfxKick();}
          }else{e.shellVx=0;e.shellTimer=0;}
        }
      }else{
        if(e.type==='chameleon'&&e.shell&&e.shellVx===0&&!e.held){
          const run=K['ShiftLeft']||K['ShiftRight']||K['KeyC'];
          if(run&&!heldShell){e.held=true;heldShell=e;sfxKick();}
          else{e.shellVx=player.facing*6;sfxKick();}
        }
        else if(e.type==='chameleon'&&e.shell&&e.shellVx!==0)killPlayer();
        else killPlayer();
      }
    }
  }
}

// ---- HAMMERS & FIRE BARS & STAR COINS ----
function updateHammers(){
  for(let i=hammers.length-1;i>=0;i--){const h=hammers[i];h.x+=h.vx;h.y+=h.vy;h.vy+=.3;h.life--;
    if(h.life<=0||h.y>ROWS*T+32){hammers.splice(i,1);continue;}
    if(!player.dead&&!player.star&&player.invulnTimer<=0&&h.x+12>player.x&&h.x<player.x+player.w&&h.y+12>player.y&&h.y<player.y+player.h){killPlayer();hammers.splice(i,1);}
  }
}
function updateFireBars(){
  for(const fb of fireBars){fb.angle+=fb.speed;
    // Check collision with player for each ball in the bar
    for(let bi=1;bi<=fb.len;bi++){
      const bx=fb.x+Math.cos(fb.angle)*bi*T*.7,by=fb.y+Math.sin(fb.angle)*bi*T*.7;
      if(!player.dead&&!player.star&&player.invulnTimer<=0&&Math.abs(bx-(player.x+player.w/2))<12&&Math.abs(by-(player.y+player.h/2))<12){killPlayer();break;}
    }
  }
}
function updateStarCoins(){
  for(let i=0;i<starCoins.length;i++){const sc=starCoins[i];if(sc.collected)continue;sc.anim+=.1;
    if(!player.dead&&player.x+player.w>sc.x&&player.x<sc.x+sc.w&&player.y+player.h>sc.y&&player.y<sc.y+sc.h){
      sc.collected=true;starCoinsCollected[i]=true;score+=1000;sfxCoin();
      particles.push({type:'pop',x:sc.x,y:sc.y-16,text:'STAR COIN!',life:50});haptic(50);
    }
  }
}

function updateEnemyPipes(){
  for(const ep of enemyPipes){
    ep.timer++;
    if(ep.timer>300&&ep.spawned<ep.maxSpawned&&Math.abs(player.x-ep.x)>T*4){
      ep.timer=0;ep.spawned++;
      const espd=(1+currentWorld*0.1)*(Math.random()<0.5?1:-1)*0.8;
      enemies.push({type:'coyote',x:ep.x,y:ep.y-T*2,w:T,h:T,vx:espd,vy:-3,alive:true,anim:0,stomped:false,stompTimer:0,flying:false,deathFlip:false});
    }
  }
}

// ---- BULLET BILLS ----
function updateBulletBills(){
  // Update vines
  for(const v of vines){if(v.growing){v.topY-=1.5;if(v.baseY-v.topY>=v.maxH)v.growing=false;}}
  // Vine climbing: player can hold up while overlapping vine
  if(K['ArrowUp']&&!player.dead&&!vineBonus){
    for(const v of vines){
      if(player.x+player.w>v.x&&player.x<v.x+8&&player.y+player.h>v.topY&&player.y<v.baseY){
        player.vy=-3;player.onGround=false;player.vx*=.5;
        // Check if player reached top of vine → trigger bonus
        if(!v.growing&&player.y<=v.topY+T){
          const bonusCoins=50+Math.floor(Math.random()*51); // 50-100
          const returnX=Math.min(player.x+CW*0.6,COLS*T-CW);
          vineBonus={phase:'rise',timer:0,totalCoins:bonusCoins,collected:0,returnX:returnX};
          v.topY=-999; // disable this vine
          sfxPower();
        }
        break;
      }
    }
  }
  cannonTimer++;
  // Spawn bullets from cannons every ~180 frames
  if(cannonTimer>=180){
    cannonTimer=0;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(tileAt(c,r)==='E'){
        const cx=c*T,cy=r*T;
        if(cx>cam.x-T*2&&cx<cam.x+CW+T*2&&Math.abs(cx-player.x)>T*3){
          const dir=player.x>cx?1:-1;
          bulletBills.push({x:cx,y:cy+4,w:T,h:T-8,vx:dir*4,alive:true});
          sfxFire();
        }
      }
    }
  }
  // Update bullets
  for(let i=bulletBills.length-1;i>=0;i--){
    const b=bulletBills[i];if(!b.alive){bulletBills.splice(i,1);continue;}
    b.x+=b.vx;
    if(b.x<cam.x-T*4||b.x>cam.x+CW+T*4){bulletBills.splice(i,1);continue;}
    // Collision with player
    if(!player.dead&&player.invulnTimer<=0&&rectOv({x:player.x,y:player.y,w:player.w,h:player.h},b)){
      if(player.vy>0&&player.y+player.h-b.y<14){
        // Stomp bullet bill
        b.alive=false;player.vy=JUMP_FORCE*.7;score+=200;sfxStomp();
        particles.push({type:'pop',x:b.x,y:b.y-16,text:'+200',life:40});
        player.invulnTimer=15;
      }else if(player.star){
        b.alive=false;score+=200;
      }else{
        killPlayer();
      }
    }
  }
}

function drawBulletBills(){
  // Draw vines
  for(const v of vines){
    const x=Math.round(v.x-cam.x),topY=Math.round(v.topY),baseY=Math.round(v.baseY);
    if(x<-T||x>CW+T)continue;
    ctx.fillStyle='#228B22';ctx.fillRect(x,topY,8,baseY-topY);
    ctx.fillStyle='#32CD32';ctx.fillRect(x+2,topY,4,baseY-topY);
    // Leaves along vine
    for(let ly=topY+T;ly<baseY;ly+=T){
      const side=((ly/T|0)%2)*2-1;
      ctx.fillStyle='#2d8b2d';
      ctx.beginPath();ctx.ellipse(x+4+side*10,ly,8,5,side*.3,0,Math.PI*2);ctx.fill();
    }
    // Top flower/bulb
    ctx.fillStyle='#ff6699';ctx.beginPath();ctx.arc(x+4,topY,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(x+4,topY,3,0,Math.PI*2);ctx.fill();
  }
  for(const b of bulletBills){
    if(!b.alive)continue;
    const x=Math.round(b.x-cam.x),y=Math.round(b.y);
    ctx.save();ctx.translate(x+T/2,y+b.h/2);
    if(b.vx<0)ctx.scale(-1,1);
    // Bullet body
    ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(0,0,T/2,b.h/2-2,0,0,Math.PI*2);ctx.fill();
    // Nose
    ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(T/2-4,0,6,b.h/2-4,0,-Math.PI/2,Math.PI/2);ctx.fill();
    // Eye
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(4,-2,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c00';ctx.beginPath();ctx.arc(5,-2,2,0,Math.PI*2);ctx.fill();
    // Arms
    ctx.fillStyle='#222';ctx.fillRect(-8,b.h/2-6,6,4);ctx.fillRect(-8,-b.h/2+2,6,4);
    ctx.restore();
  }
}

function updateItems(){
  for(const it of items){
    if(!it.active)continue;it.anim+=.1;
    if(it.floating){if(!player.dead&&rectOv({x:player.x,y:player.y,w:player.w,h:player.h},it)){it.active=false;
      if(it.type==='redcoin'){redCoinsCollected++;sfxCoin();score+=500;particles.push({type:'pop',x:it.x,y:it.y-16,text:'RED '+redCoinsCollected+'/'+redCoinsTotal,life:50});
        if(redCoinsCollected>=redCoinsTotal&&redCoinsTotal>0){lives++;sfx1up();particles.push({type:'pop',x:player.x,y:player.y-40,text:'ALL RED COINS! 1UP!',life:60});}
      }else{coins++;levelCoins++;if(coins>=100){coins-=100;lives++;sfx1up();particles.push({type:'pop',x:player.x,y:player.y-24,text:'1UP!',life:50});}score+=200;sfxCoin();}}continue;}
    if(it.emerging){it.y-=1;if(it.y<=it.emergeY-T)it.emerging=false;continue;}
    if(it.leafDrift){it.vy+=.05;if(it.vy>1.5)it.vy=1.5;it.x+=it.vx;it.y+=it.vy;if(it.anim%3<1.5)it.vx=Math.abs(it.vx);else it.vx=-Math.abs(it.vx);}
    else if(it.type==='star'){it.vy+=GRAVITY;it.x+=it.vx;it.y+=it.vy;const br=Math.floor((it.y+it.h)/T),bc=Math.floor((it.x+it.w/2)/T);if(isSolid(bc,br)){it.y=br*T-it.h;it.vy=-7;}const wc=it.vx>0?Math.floor((it.x+it.w)/T):Math.floor(it.x/T);if(isSolid(wc,Math.floor((it.y+it.h/2)/T)))it.vx=-it.vx;}
    else if(it.type==='mushroom'||it.type==='fish'||it.type==='1up'){it.vy+=GRAVITY;it.x+=it.vx;it.y+=it.vy;if(it.vy>MAX_FALL)it.vy=MAX_FALL;const br=Math.floor((it.y+it.h)/T),bc=Math.floor((it.x+it.w/2)/T);if(isSolid(bc,br)){it.y=br*T-it.h;it.vy=0;}const wc=it.vx>0?Math.floor((it.x+it.w)/T):Math.floor(it.x/T);if(isSolid(wc,Math.floor((it.y+it.h/2)/T)))it.vx=-it.vx;}
    if(!player.dead&&rectOv({x:player.x,y:player.y,w:player.w,h:player.h},it)){
      it.active=false;sfxPower();
      if(it.type==='mushroom'){if(!player.big){player.big=true;growTimer=30;}score+=1000;}
      else if(it.type==='fireflower'){if(!player.big)growTimer=30;player.big=true;player.fire=true;player.cat=false;player.fish=false;score+=1000;}
      else if(it.type==='star'){player.star=true;player.starTimer=STAR_DUR;score+=1000;startMusic('star',1);}
      else if(it.type==='leaf'){if(!player.big)growTimer=30;player.big=true;player.cat=true;player.fire=false;player.fish=false;score+=1000;}
      else if(it.type==='fish'){if(!player.big)growTimer=30;player.big=true;player.fish=true;player.fire=false;player.cat=false;score+=1000;}
      else if(it.type==='1up'){lives++;sfx1up();score+=0;particles.push({type:'pop',x:player.x,y:player.y-24,text:'1UP!',life:60});}
    }
    if(it.y>ROWS*T+64)it.active=false;
  }
}

function updateFireballs(){
  for(let i=fireballs.length-1;i>=0;i--){
    const f=fireballs[i];f.x+=f.vx;f.vy+=GRAVITY;f.y+=f.vy;f.life--;f.anim+=.3;
    const br=Math.floor((f.y+8)/T),bc=Math.floor((f.x+4)/T);
    if(isSolid(bc,br)){f.y=br*T-8;f.vy=-5;}
    const wc=f.vx>0?Math.floor((f.x+8)/T):Math.floor(f.x/T);
    if(isSolid(wc,Math.floor(f.y/T))){fireballs.splice(i,1);continue;}
    if(f.life<=0){fireballs.splice(i,1);continue;}
    for(const e of enemies){if(e.alive&&rectOv({x:f.x-4,y:f.y-4,w:12,h:12},e)){e.alive=false;e.deathFlip=true;e.vy=-5;e.stomped=true;e.stompTimer=0;score+=200;sfxStomp();particles.push({type:'pop',x:e.x,y:e.y-16,text:'+200',life:40});fireballs.splice(i,1);break;}}
    // Fireball vs bullet bills
    if(fireballs[i]){for(let bi=bulletBills.length-1;bi>=0;bi--){const bb=bulletBills[bi];if(bb.alive&&rectOv({x:f.x-4,y:f.y-4,w:12,h:12},bb)){bb.alive=false;score+=200;particles.push({type:'pop',x:bb.x,y:bb.y-16,text:'+200',life:40});fireballs.splice(i,1);break;}}}
    if(boss&&boss.alive&&boss.invuln<=0&&fireballs[i]&&rectOv({x:f.x-4,y:f.y-4,w:12,h:12},{x:boss.x,y:boss.y,w:boss.w,h:boss.h})){
      boss.hp--;boss.invuln=30;sfxStomp();score+=500;fireballs.splice(i,1);
      particles.push({type:'pop',x:boss.x+boss.w/2,y:boss.y-20,text:'-1 HP',life:50});
      if(boss.hp<=0){boss.alive=false;score+=5000;
        setTimeout(()=>{if(!flagReached){flagReached=true;sfxFlag();score+=Math.max(0,timer)*10;}},500);}
    }
  }
}

function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life--;if(p.life<=0){particles.splice(i,1);continue;}if(p.type==='pop')p.y-=1;if(p.type==='brick'){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;}if(p.type==='coinB'){p.y+=p.vy;p.vy+=.5;}if(p.type==='dust'){p.x+=p.vx;p.y+=p.vy;p.vy+=.1;}if(p.type==='stompBurst'||p.type==='starTrail'||p.type==='runDust'){p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;}}}

function drawBg(){
  const w=WC[currentWorld];
  const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,w.sky1);g.addColorStop(1,w.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='rgba(255,255,255,0.6)';
  for(let i=0;i<12;i++){
    const cx=(i*350+80+currentWorld*100+Date.now()/80*(.3+i%3*.1))%(COLS*T+800),cy=30+((i*73)%80);
    const sx=cx-cam.x*.25;if(sx<-120||sx>CW+120)continue;
    ctx.save();ctx.translate(sx,cy);const s=.7+(i%3)*.2;ctx.scale(s,s);
    ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.arc(18,-8,20,0,Math.PI*2);ctx.arc(40,-4,16,0,Math.PI*2);ctx.arc(22,6,14,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  ctx.fillStyle=w.gnd||'#3a9a3a';
  for(let i=0;i<8;i++){const hx=(i*500+150)%(COLS*T),hs=40+(i*17)%40;const sx=hx-cam.x*.4;if(sx<-200||sx>CW+200)continue;ctx.beginPath();ctx.moveTo(sx-hs*1.3,CH-2*T);ctx.quadraticCurveTo(sx,CH-2*T-hs,sx+hs*1.3,CH-2*T);ctx.fill();}
  // Bushes (foreground parallax 0.6x)
  const bc=w.gndD||'#2a6a2a';ctx.fillStyle=bc;
  for(let i=0;i<10;i++){const bx=(i*320+70)%(COLS*T);const sx=bx-cam.x*.6;if(sx<-80||sx>CW+80)continue;const bw=20+(i*13)%25,bh=10+(i*7)%12;ctx.beginPath();ctx.ellipse(sx,CH-2*T+2,bw,bh,0,Math.PI,0);ctx.fill();}
  // Per-world atmospheric particles
  const t=Date.now();
  if(w.theme==='ice'){ctx.fillStyle='rgba(255,255,255,0.6)';for(let i=0;i<20;i++){const fx=(i*137+t/15)%CW,fy=(i*89+t/8)%CH;ctx.beginPath();ctx.arc(fx,fy,1.5,0,Math.PI*2);ctx.fill();}}
  if(w.theme==='lava'){ctx.fillStyle='rgba(255,100,0,0.4)';for(let i=0;i<12;i++){const fx=(i*167+t/20)%CW,fy=CH-(i*53+t/12)%(CH/2);ctx.beginPath();ctx.arc(fx,fy,2,0,Math.PI*2);ctx.fill();}}
  if(w.theme==='water'){ctx.fillStyle='rgba(150,220,255,0.3)';for(let i=0;i<15;i++){const fx=(i*200+t/25)%CW,fy=CH-(i*67+t/10)%(CH*.7);ctx.beginPath();ctx.arc(fx,fy,2+Math.sin(t/500+i)*.5,0,Math.PI*2);ctx.fill();}}
  if(w.theme==='dark'||w.theme==='sky'){ctx.fillStyle='rgba(255,255,200,0.5)';for(let i=0;i<25;i++){const fx=(i*131+t/50)%CW,fy=(i*97)%CH;const twinkle=Math.sin(t/300+i*2)*.5+.5;ctx.globalAlpha=twinkle*0.6;ctx.beginPath();ctx.arc(fx,fy,1,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
}

function drawTiles(){
  const sc=Math.floor(cam.x/T),ec=Math.min(COLS-1,sc+Math.ceil(CW/T)+1);
  const w=WC[currentWorld];
  for(let r=0;r<ROWS;r++)for(let c=sc;c<=ec;c++){
    const ch=tileAt(c,r),x=c*T-cam.x,y=r*T;
    if(ch==='G'||ch==='g'){
      if(r>0&&!isSolid(c,r-1)){ctx.fillStyle=w.gnd;ctx.fillRect(x,y,T,8);ctx.fillStyle=w.gndD;ctx.fillRect(x,y+8,T,T-8);}
      else{ctx.fillStyle=w.gndD;ctx.fillRect(x,y,T,T);}
      ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.strokeRect(x,y,T,T);
    }
    if(ch==='D'||ch==='d'){ctx.fillStyle='#9a9590';ctx.fillRect(x,y,T,T);ctx.fillStyle='#b0aca7';ctx.fillRect(x+1,y+1,T-2,T-2);ctx.fillStyle='#9a9590';ctx.fillRect(x+3,y+3,T-6,T-6);ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.strokeRect(x,y,T,T);}
    if(ch==='b'){ctx.fillStyle='#8B4513';ctx.fillRect(x,y,T,T/2);ctx.fillStyle='#A0522D';ctx.fillRect(x+2,y+2,T-4,T/2-4);ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.strokeRect(x,y,T,T/2);}
    if(ch==='A'){const ls=Math.sin(Date.now()/200+c*.5)*3;ctx.fillStyle='#ff4400';ctx.fillRect(x,y,T,T);ctx.fillStyle='#ff8800';ctx.fillRect(x,y+ls,T,T/2);ctx.fillStyle='#ffcc00';ctx.fillRect(x+4,y+4+ls,T-8,4);}
    if(ch==='P'){const pc=WC[currentWorld].pipeCol;ctx.fillStyle=pc;ctx.fillRect(x+2,y,T-4,T);const lg=ctx.createLinearGradient(x+2,0,x+T-2,0);lg.addColorStop(0,'rgba(255,255,255,0.25)');lg.addColorStop(0.4,'rgba(255,255,255,0.1)');lg.addColorStop(0.6,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(0,0,0,0.25)');ctx.fillStyle=lg;ctx.fillRect(x+2,y,T-4,T);ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(x+2,y,1,T);ctx.fillRect(x+T-3,y,1,T);}

function drawWater(){
  for(const wz of waterZones){
    const x1=wz.sc*T-cam.x,x2=wz.ec*T-cam.x,y1=wz.tr*T,y2=(wz.br+1)*T;
    // Water body with gradient
    const wg=ctx.createLinearGradient(0,y1,0,y2);wg.addColorStop(0,'rgba(30,100,200,0.3)');wg.addColorStop(1,'rgba(10,50,120,0.5)');
    ctx.fillStyle=wg;ctx.fillRect(x1,y1,x2-x1,y2-y1);
    // Animated surface wave
    ctx.strokeStyle='rgba(150,220,255,0.8)';ctx.lineWidth=3;ctx.beginPath();
    for(let wx=x1;wx<x2;wx+=3){const wy=y1+Math.sin(Date.now()/250+wx*.04)*3+Math.sin(Date.now()/400+wx*.07)*2;if(wx===x1)ctx.moveTo(wx,wy);else ctx.lineTo(wx,wy);}
    ctx.stroke();
    // Surface highlight
    ctx.strokeStyle='rgba(200,240,255,0.4)';ctx.lineWidth=1;ctx.beginPath();
    for(let wx=x1;wx<x2;wx+=3){const wy=y1-1+Math.sin(Date.now()/200+wx*.06)*2;if(wx===x1)ctx.moveTo(wx,wy);else ctx.lineTo(wx,wy);}
    ctx.stroke();
    // Subtle caustics
    for(let ci=0;ci<5;ci++){const cx2=x1+(Date.now()/20+ci*80)%(x2-x1),cy2=y1+20+ci*30+Math.sin(Date.now()/500+ci)*10;ctx.fillStyle='rgba(200,230,255,0.08)';ctx.beginPath();ctx.ellipse(cx2,cy2,15,8,Date.now()/1000+ci,0,Math.PI*2);ctx.fill();}
