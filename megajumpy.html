function drawPlatforms(){
  for(const pl of platforms){
    const x=pl.x-cam.x,y=pl.y;if(x<-pl.w||x>CW+pl.w)continue;
    ctx.fillStyle='#8B6914';ctx.fillRect(x,y,pl.w,pl.h);ctx.fillStyle='#A0801A';ctx.fillRect(x+2,y+2,pl.w-4,pl.h-4);ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.strokeRect(x,y,pl.w,pl.h);
  }
  // One-way platforms (thin, dashed look)
  for(const ow of oneWayPlats){
    const x=ow.x-cam.x,y=ow.y;if(x<-ow.w||x>CW+ow.w)continue;
    ctx.fillStyle='#5588cc';ctx.fillRect(x,y,ow.w,ow.h);
    ctx.fillStyle='#77aaee';ctx.fillRect(x+2,y+1,ow.w-4,ow.h-2);
    ctx.setLineDash([4,3]);ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.strokeRect(x,y,ow.w,ow.h);ctx.setLineDash([]);
    // Arrow indicators (up arrows to show passable from below)
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='8px Arial';ctx.textAlign='center';
    for(let ax=x+T/2;ax<x+ow.w;ax+=T)ctx.fillText('\u25B2',ax,y-2);
    ctx.textAlign='left';
  }
  // Springboards
  for(const sp of springboards){
    const x=sp.x-cam.x,y=sp.compressed?sp.baseY+sp.h/2:sp.y;
    const h=sp.compressed?sp.h/2:sp.h;
    if(x<-sp.w||x>CW+sp.w)continue;
    // Base
    ctx.fillStyle='#ffcc00';ctx.fillRect(x+4,y+h-6,sp.w-8,6);
    // Spring coils
    ctx.strokeStyle='#cc8800';ctx.lineWidth=2;
    const coils=4,coilH=h-8;
    for(let ci=0;ci<coils;ci++){
      const cy=y+2+ci*(coilH/coils);
      ctx.beginPath();ctx.moveTo(x+6,cy);ctx.lineTo(x+sp.w-6,cy+coilH/coils/2);ctx.stroke();
    }
    // Top plate
    ctx.fillStyle='#ff4444';ctx.fillRect(x+2,y,sp.w-4,4);ctx.fillStyle='#ff6666';ctx.fillRect(x+4,y+1,sp.w-8,2);
    ctx.lineWidth=1;
  }
  // Falling platforms
  for(const fp of fallingPlats){
    if(!fp.active)continue;
    const shakeOff=fp.shaking&&fp.fallTimer>0?(Math.random()*4-2):0;
    const x=fp.x-cam.x+shakeOff,y=fp.y;
    if(x<-fp.w||x>CW+fp.w)continue;
    const alpha=fp.shaking&&fp.fallTimer>0?(.5+Math.sin(Date.now()/50)*.3):1;
    ctx.globalAlpha=alpha;
    ctx.fillStyle='#aa5533';ctx.fillRect(x,y,fp.w,fp.h);ctx.fillStyle='#cc7755';ctx.fillRect(x+2,y+2,fp.w-4,fp.h-4);
    // Crack lines when shaking
    if(fp.shaking){
      ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x+fp.w*.3,y);ctx.lineTo(x+fp.w*.5,y+fp.h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+fp.w*.7,y);ctx.lineTo(x+fp.w*.6,y+fp.h);ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.strokeRect(x,y,fp.w,fp.h);
  }
}

function drawDark(){

function drawBlocks(){
  for(const b of blocks){

      continue;
    }
    const x=b.x-cam.x,bY=b.y;if(x<-T||x>CW+T)continue;
    if(b.bumpVel!==0){b.bumpY+=b.bumpVel;b.bumpVel+=.6;if(b.bumpY>=0){b.bumpY=0;b.bumpVel=0;}}
    const y=bY+b.bumpY;
    if(b.type==='switch'){
      ctx.fillStyle=b.hit?'#555':'#ff4444';ctx.fillRect(x,y,T,T);ctx.fillStyle=b.hit?'#444':'#cc0000';ctx.fillRect(x+4,y+4,T-8,T-8);
      ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(b.hit?'OFF':'ON',x+T/2,y+T/2+4);ctx.textAlign='left';continue;

      ctx.fillStyle='#5a2d0a';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText('?',x+T/2,by2+T-8);
      ctx.fillStyle='#b8860b';ctx.fillRect(x+3,by2+3,3,3);ctx.fillRect(x+T-6,by2+3,3,3);ctx.fillRect(x+3,by2+T-6,3,3);ctx.fillRect(x+T-6,by2+T-6,3,3);

    }else if(b.type==='brick'){

      ctx.fillStyle='rgba(255,200,100,0.15)';ctx.fillRect(x+1,y+1,T-2,2);ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.strokeRect(x,y,T,T);
    }
  }
}

function drawWings(x,y,anim){
  const wa=Math.sin(anim*6)*25;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(200,180,255,0.7)';ctx.strokeStyle='rgba(140,120,200,0.8)';ctx.lineWidth=1;

  ctx.save();ctx.rotate((-30+wa)*Math.PI/180);

  ctx.beginPath();ctx.ellipse(8,-4,12,6,.3,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();

function drawPiranha(x,y,e){
  if(e.popPhase==='hidden')return;
  ctx.save();ctx.translate(x+T/2,y+T/2);
  const bite=Math.sin(e.anim*4)*4;
  // Stem
  ctx.fillStyle='#228B22';ctx.fillRect(-3,4,6,T);
  // Head (venus flytrap)
  ctx.fillStyle='#cc0000';ctx.beginPath();ctx.ellipse(0,-2,12,8,0,0,Math.PI*2);ctx.fill();
  // Mouth opening
  ctx.fillStyle='#880000';ctx.beginPath();ctx.ellipse(0,-2+bite*.3,10,3+bite*.5,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#ff6666';ctx.beginPath();ctx.arc(-5,-6,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5,-4,2.5,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#228B22';ctx.beginPath();ctx.moveTo(-3,4);ctx.lineTo(-12,0);ctx.lineTo(-3,-2);ctx.fill();
  ctx.beginPath();ctx.moveTo(3,4);ctx.lineTo(12,0);ctx.lineTo(3,-2);ctx.fill();
  ctx.restore();
}

function drawJumpFish(x,y,e){

  ctx.fillStyle='rgba(255,100,70,0.6)';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(-4,-14);ctx.lineTo(4,-14);ctx.closePath();ctx.fill();

function drawCaspy(x,y,e){
  ctx.save();ctx.translate(x+T/2,y+T/2);ctx.globalAlpha=.7+Math.sin(e.anim*2)*.15;

  ctx.fillStyle='#e0e0f0';
  ctx.beginPath();ctx.moveTo(-8,0);ctx.quadraticCurveTo(-20,-8+wingAng*10,-18,4+wingAng*6);ctx.lineTo(-8,4);ctx.fill();
  ctx.beginPath();ctx.moveTo(8,0);ctx.quadraticCurveTo(20,-8-wingAng*10,18,4-wingAng*6);ctx.lineTo(8,4);ctx.fill();

  ctx.fillStyle='#f0f0ff';ctx.beginPath();ctx.moveTo(-5,-7);ctx.lineTo(-7,-14);ctx.lineTo(-2,-8);ctx.fill();

  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2.5,-1.5,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3.5,-1.5,1,0,Math.PI*2);ctx.fill();

function drawCumulo(x,y,e){

function drawChien(x,y,e){
  ctx.save();ctx.translate(x+T/2,y+T);
  // Chain from anchor
  ctx.strokeStyle='#777';ctx.lineWidth=2.5;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(0,-T/2);ctx.lineTo((e.anchorX-e.x)*.3,-T/2);ctx.stroke();ctx.setLineDash([]);
  // Dog head
  const shake=e.chargePhase==='charge'?Math.sin(Date.now()/15)*3:0;
  ctx.translate(shake,0);
  const dir=e.chargeVx>=0?1:-1;ctx.scale(dir,1);
  // Head shape (round with snout)
  ctx.fillStyle='#8B5E3C';ctx.beginPath();ctx.ellipse(0,-T/2,13,12,0,0,Math.PI*2);ctx.fill();
  // Snout
  ctx.fillStyle='#a0724a';ctx.beginPath();ctx.ellipse(10,-T/2+2,7,5,0,0,Math.PI*2);ctx.fill();
  // Nose
  ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(14,-T/2,3,2.5,0,0,Math.PI*2);ctx.fill();
  // Eyes (angry)
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,-T/2-3,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-1,-T/2-3,2.5,0,Math.PI*2);ctx.fill();
  // Angry eyebrow
  ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,-T/2-7);ctx.lineTo(1,-T/2-5);ctx.stroke();
  // Ears (floppy)
  ctx.fillStyle='#6a4a2a';ctx.beginPath();ctx.ellipse(-8,-T/2-8,4,7,-.3,0,Math.PI*2);ctx.fill();
  // Mouth open when charging
  if(e.chargePhase==='charge'){
    ctx.fillStyle='#600';ctx.beginPath();ctx.arc(10,-T/2+5,4,0,Math.PI);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(7,-T/2+5,2,3);ctx.fillRect(11,-T/2+5,2,3);
  }
  // Collar
  ctx.fillStyle='#c00';ctx.fillRect(-8,-T/2+10,16,4);
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(0,-T/2+12,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawMenhir(x,y,e){
  ctx.save();ctx.translate(x+T/2,y+T);
  // Stone block body (2 tiles tall)
  ctx.fillStyle=e.phase==='fall'?'#7a6a5a':'#9a8a7a';
  ctx.fillRect(-14,-T*2+4,28,T*2-4);

  ctx.fillStyle='#8a7a6a';ctx.beginPath();ctx.ellipse(0,-T*2+24,12,10,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#c8b89a';ctx.beginPath();ctx.moveTo(0,-T*2+12);ctx.lineTo(-4,-T*2+4);ctx.lineTo(4,-T*2+4);ctx.fill();

  ctx.fillStyle='#b0a080';ctx.beginPath();ctx.moveTo(0,-T*2+6);ctx.lineTo(-2,-T*2+1);ctx.lineTo(2,-T*2+1);ctx.fill();

  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-T*2+22,3,0,Math.PI*2);ctx.fill();

  ctx.beginPath();ctx.arc(7,-T*2+22,1.8,0,Math.PI*2);ctx.fill();
  // Angry eyebrows
  ctx.strokeStyle='#555';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-9,-T*2+18);ctx.lineTo(-4,-T*2+20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(9,-T*2+18);ctx.lineTo(4,-T*2+20);ctx.stroke();
  // Nostrils
  ctx.fillStyle='#555';ctx.beginPath();ctx.arc(-3,-T*2+28,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(3,-T*2+28,2,0,Math.PI*2);ctx.fill();
  // Ears (small rhino ears)
  ctx.fillStyle='#7a6a5a';ctx.beginPath();ctx.ellipse(-10,-T*2+14,3,5,-.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(10,-T*2+14,3,5,.3,0,Math.PI*2);ctx.fill();

function drawEnemies(){for(const e of enemies){if(!e.alive&&!e.stomped)continue;const x=Math.round(e.x-cam.x),y=Math.round(e.y);if(x<-T*2||x>CW+T*2)continue;if(e.deathFlip&&!e.alive){ctx.save();ctx.translate(x+T/2,y+T/2);ctx.scale(1,-1);ctx.translate(-x-T/2,-y-T/2);}
  if(e.type==='fish_jump'){drawJumpFish(x,y,e);}
  else if(e.type==='piranha'){drawPiranha(x,y,e);}
  else if(e.type==='caspy'){drawCaspy(x,y,e);}
  else if(e.type==='minithor'){drawMiniThor(x,y,e);}
  else if(e.type==='cumulo'){drawCumulo(x,y,e);}
  else if(e.type==='chien'){drawChien(x,y,e);}
  else if(e.type==='menhir'){drawMenhir(x,y,e);}
  else{if(e.type==='coyote')drawCoyote(x,y,e);else drawChameleon(x,y,e);if(e.flying)drawWings(x+T/2,y+4,e.anim);}
  if(e.deathFlip&&!e.alive)ctx.restore();}}

function drawItems(){
  for(const it of items){if(!it.active)continue;const x=Math.round(it.x-cam.x),y=Math.round(it.y);if(x<-T||x>CW+T)continue;
    if((it.type==='coin'||it.type==='redcoin')&&it.floating){const isRed=it.type==='redcoin';const sh=Math.sin(Date.now()/150+it.x)*.3+.7;ctx.fillStyle=isRed?`rgba(255,50,50,${sh})`:`rgba(255,215,0,${sh})`;const st=Math.max(Math.abs(Math.sin(Date.now()/200+it.x)),.15);ctx.beginPath();ctx.ellipse(x+8,y+8,6*st,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=isRed?'#cc0000':'#ffa500';ctx.beginPath();ctx.ellipse(x+8,y+8,3*st,5,0,0,Math.PI*2);ctx.fill();
      // Sparkle
      if(Math.sin(Date.now()/120+it.x*3)>.7){ctx.fillStyle='#fff';const sx=x+8+Math.cos(Date.now()/80+it.x)*5,sy=y+4+Math.sin(Date.now()/80+it.x)*3;ctx.fillRect(sx-1,sy-4,2,8);ctx.fillRect(sx-4,sy-1,8,2);}
      if(isRed){ctx.fillStyle='rgba(255,0,0,0.3)';ctx.beginPath();ctx.arc(x+8,y+8,12,0,Math.PI*2);ctx.fill();}}
    else if(it.type==='mushroom'||it.type==='1up'){const mc=it.type==='1up'?'#22cc22':'#ff2020';ctx.fillStyle='#ffe4c4';ctx.fillRect(x+10,y+18,12,14);ctx.fillStyle=mc;ctx.beginPath();ctx.ellipse(x+16,y+16,14,12,0,Math.PI,0);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+11,y+10,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+21,y+9,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(x+12,y+20,2,3);ctx.fillRect(x+18,y+20,2,3);if(it.type==='1up'){ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('1UP',x+16,y+14);ctx.textAlign='left';}}
    else if(it.type==='fireflower'){ctx.fillStyle='#228B22';ctx.fillRect(x+14,y+20,4,12);const pc=['#ff4444','#ff8800','#ffaa00','#ff4444','#ff8800'];for(let i=0;i<5;i++){ctx.fillStyle=pc[i];const a=(i/5)*Math.PI*2+Date.now()/300;ctx.beginPath();ctx.arc(x+16+Math.cos(a)*8,y+14+Math.sin(a)*8,5,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+16,y+14,5,0,Math.PI*2);ctx.fill();}
    else if(it.type==='star'){const gw=Math.sin(Date.now()/100)*3;ctx.fillStyle='#ffd700';ctx.beginPath();for(let i=0;i<5;i++){const a1=i*2*Math.PI/5-Math.PI/2,a2=a1+Math.PI/5;ctx.lineTo(x+16+Math.cos(a1)*(12+gw),y+16+Math.sin(a1)*(12+gw));ctx.lineTo(x+16+Math.cos(a2)*6,y+16+Math.sin(a2)*6);}ctx.closePath();ctx.fill();}
    else if(it.type==='leaf'){ctx.save();ctx.translate(x+16,y+16);ctx.rotate(Math.sin(Date.now()/200)*.3);ctx.fillStyle='#228B22';ctx.beginPath();ctx.ellipse(0,0,12,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#32CD32';ctx.beginPath();ctx.ellipse(0,0,8,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd700';ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(-2,-10);ctx.lineTo(0,-4);ctx.fill();ctx.beginPath();ctx.moveTo(2,-4);ctx.lineTo(4,-10);ctx.lineTo(6,-4);ctx.fill();ctx.restore();}
    else if(it.type==='fish'){ctx.save();ctx.translate(x+16,y+16);const fw=Math.sin(Date.now()/200)*0.2;ctx.rotate(fw);ctx.fillStyle='#1e90ff';ctx.beginPath();ctx.ellipse(0,0,14,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#87ceeb';ctx.beginPath();ctx.ellipse(-2,-2,8,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1e90ff';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(20,-6);ctx.lineTo(20,6);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-2,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-5,-2,1.5,0,Math.PI*2);ctx.fill();ctx.restore();}
  }
}

function drawFireballs(){for(const f of fireballs){const x=f.x-cam.x,y=f.y;ctx.save();ctx.translate(x,y);ctx.rotate(f.anim);ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(0,0,1.5,0,Math.PI*2);ctx.fill();ctx.restore();}}

let mapW=0,mapL=0;
function drawMap(){
  ctx.fillStyle='#1a3a6a';ctx.fillRect(0,0,CW,CH);
  ctx.strokeStyle='rgba(255,255,255,0.05)';
  for(let x=0;x<CW;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CH);ctx.stroke();}
  for(let y=0;y<CH;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CW,y);ctx.stroke();}
  ctx.fillStyle='#ffd700';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.fillText('SELECT WORLD & LEVEL',CW/2,40);
  // Global completion %
  let totalRed=0,totalStar=0,totalLevels=0,clearedLevels=0;
  for(let w=0;w<8;w++)for(let l=0;l<4;l++){if(l<3){totalRed+=5;totalStar+=3;totalRed-=(5-levelBests[w][l].redTotal);totalRed+=levelBests[w][l].redCoins>5?5:levelBests[w][l].redCoins;/* just count bests */}totalLevels++;if(worldsUnlocked[w][l])clearedLevels++;}
  let gotRed=0,gotStar=0;for(let w=0;w<8;w++)for(let l=0;l<3;l++){gotRed+=Math.min(levelBests[w][l].redCoins,5);gotStar+=Math.min(levelBests[w][l].starCoins,3);}
  const maxPts=24*5+24*3+32;const gotPts=gotRed+gotStar+clearedLevels;const pct=Math.min(100,Math.round(gotPts/maxPts*100));
  ctx.fillStyle='#aaa';ctx.font='bold 14px Arial';ctx.fillText(pct+'% Complete',CW-60,40);

  // World tabs
  const tw=90,th=36,tg=5,tsx=(CW-8*(tw+tg))/2;
  for(let w=0;w<8;w++){
    const tx=tsx+w*(tw+tg),ty=55;
    const ul=worldsUnlocked[w][0]||w===0;
    const sel=w===mapW;
    if(sel){ctx.fillStyle='#2a5a9a';ctx.fillRect(tx-2,ty-2,tw+4,th+4);ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.strokeRect(tx-2,ty-2,tw+4,th+4);}
    ctx.fillStyle=ul?(sel?'#1a4a80':'#1a3060'):'#111';ctx.fillRect(tx,ty,tw,th);
    ctx.fillStyle=ul?'#fff':'#555';ctx.font='bold 12px Arial';ctx.textAlign='center';
    ctx.fillText(ul?'W'+(w+1)+' '+WC[w].name.substring(0,5):'\u{1F512}',tx+tw/2,ty+th/2+4);
  }

  // Detail area
  const wc=WC[mapW],dy=100;
  const pg=ctx.createLinearGradient(50,dy,50,dy+120);pg.addColorStop(0,wc.sky1);pg.addColorStop(1,wc.sky2);
  ctx.fillStyle=pg;ctx.fillRect(50,dy,CW-100,120);
  ctx.fillStyle=wc.gnd;ctx.fillRect(50,dy+100,CW-100,20);
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(50,dy,CW-100,120);
  ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.fillText('World '+(mapW+1)+': '+wc.name,CW/2,dy+45);
  ctx.fillStyle='#ccc';ctx.font='16px Arial';
  const mechMap={platforms:'Plateformes Mobiles',water:'Nage/Eau',ice:'Glace',dark:'Obscurit\u00e9',lava:'Lave',dense:'Ennemis Denses',vertical:'Escalade',narrow:'Plateformes \u00c9troites'};
  ctx.fillText(wc.mech.length?wc.mech.map(m=>mechMap[m]||m).join(' | '):'Plateforme Classique',CW/2,dy+75);

  // 4 level cards
  const cw=150,ch=170,cg=20,csx=(CW-4*(cw+cg))/2+cg/2,cy=dy+140;
  for(let l=0;l<4;l++){
    const cx=csx+l*(cw+cg);
    const ul=worldsUnlocked[mapW][l]||(mapW===0&&l===0);
    const sel=l===mapL;
    if(sel){ctx.shadowColor='#ffd700';ctx.shadowBlur=15;ctx.fillStyle='#2a4a8a';ctx.fillRect(cx-3,cy-3,cw+6,ch+6);ctx.shadowBlur=0;ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.strokeRect(cx-3,cy-3,cw+6,ch+6);}
    ctx.fillStyle=ul?'#1a3060':'#111';ctx.fillRect(cx,cy,cw,ch);
    ctx.strokeStyle=ul?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.05)';ctx.lineWidth=1;ctx.strokeRect(cx,cy,cw,ch);
    if(ul){
      const lpg=ctx.createLinearGradient(cx,cy,cx,cy+60);lpg.addColorStop(0,wc.sky1);lpg.addColorStop(1,wc.sky2);
      ctx.fillStyle=lpg;ctx.fillRect(cx+4,cy+4,cw-8,56);ctx.fillStyle=wc.gnd;ctx.fillRect(cx+4,cy+50,cw-8,10);
      ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.fillText((mapW+1)+'-'+(l+1),cx+cw/2,cy+85);
      ctx.fillStyle='#ccc';ctx.font='13px Arial';ctx.fillText(l===3?'BOSS':'Niveau '+(l+1),cx+cw/2,cy+105);

      // Show collectibles progress

        ctx.font='bold 11px Arial';
        ctx.fillStyle=allR?'#00ff88':'#ff6666';ctx.fillText('\u25CF '+lb.redCoins+'/5',cx+cw/2-20,cy+145);
        ctx.fillStyle=allS?'#00ff88':'#ffaa00';ctx.fillText('\u2605 '+lb.starCoins+'/3',cx+cw/2+20,cy+145);
      }
      if(sel){const bn=Math.sin(Date.now()/200)*3;ctx.fillStyle='#ffd700';ctx.font='bold 14px Arial';ctx.fillText('\u25B6 JOUER',cx+cw/2,cy+ch-15+bn);}
    }else{
      ctx.fillStyle='#555';ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.fillText('\u{1F512}',cx+cw/2,cy+ch/2+5);
      ctx.fillStyle='#666';ctx.font='13px Arial';ctx.fillText('VERROUILL\u00c9',cx+cw/2,cy+ch/2+35);
    }
  }
  ctx.fillStyle='#aaa';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText('Tap monde/niveau pour jouer',CW/2,CH-15);
  // Touch buttons
  ctx.fillStyle='rgba(255,215,0,0.2)';ctx.fillRect(10,CH-45,130,35);ctx.strokeStyle='#ffd700';ctx.lineWidth=1;ctx.strokeRect(10,CH-45,130,35);
  ctx.fillStyle='#ffd700';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('\u{1F392} Inventaire',75,CH-22);
  ctx.fillStyle='rgba(255,80,80,0.2)';ctx.fillRect(CW-140,CH-45,130,35);ctx.strokeStyle='#ff4444';ctx.lineWidth=1;ctx.strokeRect(CW-140,CH-45,130,35);
  ctx.fillStyle='#ff4444';ctx.font='bold 14px Arial';ctx.fillText('\u21BA Reset',CW-75,CH-22);
  // Confirm reset overlay
  if(confirmResetShown){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText('Effacer toute la progression?',CW/2,CH/2-20);
    ctx.fillStyle='#ff4444';ctx.fillRect(CW/2-130,CH/2+20,120,40);
    ctx.fillStyle='#228B22';ctx.fillRect(CW/2+10,CH/2+20,120,40);
    ctx.fillStyle='#fff';ctx.font='bold 18px Arial';
    ctx.fillText('OUI',CW/2-70,CH/2+47);
    ctx.fillText('NON',CW/2+70,CH/2+47);
  }
}

// ============================================================
// MEMORY CARD BONUS GAME
// ============================================================
// Cards: 36 cards (6x6), 18 pairs
// Coins: 1,2,5,10,20,25,50,50 (8 pairs=16 cards)
// Power-ups: mushroom x3, fireflower x3, leaf x2, star x1, 1up x1 (10 pairs... wait)
// Actually: 18 pairs for 36 cards. Let's define:
// coin1,coin2,coin5,coin10,coin20,coin25,coin50a,coin50b = 8 coin pairs
// mushroom x3, fireflower x3, leaf x2, star x1, 1up x1 = 10 power pairs
// Total = 18 pairs = 36 cards

const MEMORY_CARD_TYPES=[
  {id:'coin1',label:'1',type:'coin',value:1,icon:'coin'},
  {id:'coin2',label:'2',type:'coin',value:2,icon:'coin'},
  {id:'coin5',label:'5',type:'coin',value:5,icon:'coin'},
  {id:'coin10',label:'10',type:'coin',value:10,icon:'coin'},
  {id:'coin20',label:'20',type:'coin',value:20,icon:'coin'},
  {id:'coin25',label:'25',type:'coin',value:25,icon:'coin'},
  {id:'coin50a',label:'50',type:'coin',value:50,icon:'coin'},
  {id:'coin50b',label:'50',type:'coin',value:50,icon:'coin'},
  {id:'mush1',label:'',type:'powerup',reward:'mushroom',icon:'mushroom'},
  {id:'mush2',label:'',type:'powerup',reward:'mushroom',icon:'mushroom'},
  {id:'fish1',label:'',type:'powerup',reward:'fish',icon:'fish'},
  {id:'fire1',label:'',type:'powerup',reward:'fireflower',icon:'fireflower'},
  {id:'fire2',label:'',type:'powerup',reward:'fireflower',icon:'fireflower'},
  {id:'fire3',label:'',type:'powerup',reward:'fireflower',icon:'fireflower'},
  {id:'leaf1',label:'',type:'powerup',reward:'leaf',icon:'leaf'},
  {id:'leaf2',label:'',type:'powerup',reward:'leaf',icon:'leaf'},
  {id:'star1',label:'',type:'powerup',reward:'star',icon:'star'},
  {id:'oneup1',label:'1UP',type:'powerup',reward:'oneup',icon:'oneup'}
];

let memoryCursor={x:0,y:0};
let memoryRewards=[];
let memoryShowTimer=0;

function initMemoryGame(){
  // Check if we have a saved ongoing memory game
  const saved=loadMemoryState();
  if(saved&&!saved.completed){
    memoryCards=saved.cards;memoryMatched=saved.matched;memoryFails=0;
    memoryFlipped=new Array(36).fill(false);memoryFirst=-1;memorySecond=-1;
    memoryState='hidden';memoryCompleted=false;memoryCursor={x:0,y:0};memoryRewards=[];memoryShowTimer=0;
    return;
  }
  // Fresh game: create pairs and shuffle
  const cards=[];
  for(const ct of MEMORY_CARD_TYPES){cards.push({...ct,pairIdx:0});cards.push({...ct,pairIdx:1});}
  // Fisher-Yates shuffle
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  memoryCards=cards;
  memoryFlipped=new Array(36).fill(false);
  memoryMatched=new Array(36).fill(false);
  memoryFirst=-1;memorySecond=-1;memoryFails=0;memoryState='hidden';
  memoryCompleted=false;memoryCursor={x:0,y:0};memoryRewards=[];memoryShowTimer=0;
  saveMemoryState();
}

function saveMemoryState(){
  try{localStorage.setItem('megajumpy_memory',JSON.stringify({
    cards:memoryCards,matched:memoryMatched,fails:memoryFails,completed:memoryCompleted
  }));}catch(e){}
}
function loadMemoryState(){
  try{return JSON.parse(localStorage.getItem('megajumpy_memory'));}catch(e){return null;}
}
function clearMemoryState(){
  try{localStorage.removeItem('megajumpy_memory');}catch(e){}
}

function updateMemory(){
  const now=Date.now();
  if(memoryState==='checking'){
    if(now-memoryShowTimer>800){
      const c1=memoryCards[memoryFirst],c2=memoryCards[memorySecond];
      if(c1.icon===c2.icon&&c1.label===c2.label){
        // Match! Reset fail counter
        memoryMatched[memoryFirst]=true;memoryMatched[memorySecond]=true;
        memoryFails=0;
        sfxCoin();
        // Award reward
        if(c1.type==='coin'){inventory.coins+=c1.value;memoryRewards.push('+'+c1.value+' pieces');}
        else if(c1.reward==='mushroom'){inventory.mushroom++;memoryRewards.push('+1 Champignon');}
        else if(c1.reward==='fireflower'){inventory.fireflower++;memoryRewards.push('+1 Fleur');}
        else if(c1.reward==='leaf'){inventory.leaf++;memoryRewards.push('+1 Feuille');}
        else if(c1.reward==='star'){inventory.star++;memoryRewards.push('+1 Etoile');}
        else if(c1.reward==='oneup'){inventory.oneup++;memoryRewards.push('+1 1UP');}
        else if(c1.reward==='fish'){inventory.fish++;memoryRewards.push('+1 Poisson');}
      }else{
        // No match
        memoryFails++;
        sfxBlock();
      }
      memoryFlipped[memoryFirst]=false;memoryFlipped[memorySecond]=false;
      memoryFirst=-1;memorySecond=-1;memoryState='hidden';
      // Check if all matched
      if(memoryMatched.every(m=>m)){
        memoryCompleted=true;memoryState='done';
        clearMemoryState();
        sfxFlag();
      }else if(memoryFails>=memoryMaxFails){
        // 2 fails = end of this bonus session, save progress for next time
        memoryState='done';
        saveMemoryState();
      }else{
        saveMemoryState();
      }
    }
    return;
  }
  if(memoryState==='done')return;

  // Navigation
  if(now-lastMK>150){
    if(K['ArrowRight']){memoryCursor.x=Math.min(5,memoryCursor.x+1);lastMK=now;}
    if(K['ArrowLeft']){memoryCursor.x=Math.max(0,memoryCursor.x-1);lastMK=now;}
    if(K['ArrowDown']){memoryCursor.y=Math.min(5,memoryCursor.y+1);lastMK=now;}
    if(K['ArrowUp']){memoryCursor.y=Math.max(0,memoryCursor.y-1);lastMK=now;}
  }
  if(K['Space']){
    K['Space']=false;
    const idx=memoryCursor.y*6+memoryCursor.x;
    if(memoryMatched[idx]||memoryFlipped[idx])return; // already matched or flipped
    memoryFlipped[idx]=true;sfxJump();
    if(memoryFirst===-1){memoryFirst=idx;}
    else{memorySecond=idx;memoryState='checking';memoryShowTimer=now;}
  }
  if(K['Escape']||K['KeyX']){K['Escape']=false;K['KeyX']=false;saveMemoryState();state='map';}
}

function drawMemory(){
  ctx.fillStyle='#1a1a3a';ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='#ffd700';ctx.font='bold 24px Arial';ctx.textAlign='center';
  ctx.fillText('MEMORY BONUS',CW/2,30);
  ctx.fillStyle='#fff';ctx.font='14px Arial';
  ctx.fillText('Erreurs: '+memoryFails+'/'+memoryMaxFails+'  |  \u{1F525} = Quitter & Sauvegarder',CW/2,50);

  // Draw 6x6 grid
  const cardW=72,cardH=68,gap=8;
  const gridW=6*(cardW+gap)-gap,gridH=6*(cardH+gap)-gap;
  const ox=(CW-gridW)/2,oy=65;

  for(let row=0;row<6;row++)for(let col=0;col<6;col++){
    const idx=row*6+col;
    const cx=ox+col*(cardW+gap),cy=oy+row*(cardH+gap);
    const sel=memoryCursor.x===col&&memoryCursor.y===row;
    const matched=memoryMatched[idx];
    const flipped=memoryFlipped[idx];

    if(matched){
      // Matched: dim card
      ctx.fillStyle='rgba(50,100,50,0.3)';ctx.fillRect(cx,cy,cardW,cardH);
      ctx.strokeStyle='rgba(100,200,100,0.3)';ctx.lineWidth=1;ctx.strokeRect(cx,cy,cardW,cardH);
      continue;
    }

    if(sel){ctx.shadowColor='#ffd700';ctx.shadowBlur=10;}
    if(flipped){
      // Show card face
      ctx.fillStyle='#fff';ctx.fillRect(cx,cy,cardW,cardH);
      ctx.strokeStyle=sel?'#ffd700':'#888';ctx.lineWidth=sel?3:1;ctx.strokeRect(cx,cy,cardW,cardH);
      // Draw card content
      const card=memoryCards[idx];
      drawCardFace(cx,cy,cardW,cardH,card);
    }else{
      // Card back
      ctx.fillStyle='#2244aa';ctx.fillRect(cx,cy,cardW,cardH);
      ctx.fillStyle='#3355cc';ctx.fillRect(cx+4,cy+4,cardW-8,cardH-8);
      ctx.fillStyle='#4466dd';ctx.font='bold 24px Arial';ctx.textAlign='center';
      ctx.fillText('?',cx+cardW/2,cy+cardH/2+8);
      ctx.strokeStyle=sel?'#ffd700':'#1133aa';ctx.lineWidth=sel?3:1;ctx.strokeRect(cx,cy,cardW,cardH);
    }
    ctx.shadowBlur=0;
  }

  // Rewards log
  if(memoryRewards.length){
    const ry=oy+gridH+10;
    ctx.fillStyle='#ffd700';ctx.font='bold 14px Arial';ctx.textAlign='center';
    const recent=memoryRewards.slice(-3);
    ctx.fillText(recent.join('  |  '),CW/2,ry+15);
  }

  if(memoryState==='done'){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='#ffd700';ctx.font='bold 36px Arial';ctx.textAlign='center';

      ctx.fillStyle='#fff';ctx.font='22px Arial';
      ctx.fillText('2 erreurs! Continue au prochain bonus.',CW/2,CH/2+20);

    if(Math.floor(Date.now()/500)%2){ctx.fillStyle='#ffd700';ctx.font='bold 20px Arial';ctx.fillText('SPACE = Continuer',CW/2,CH/2+70);}
  }
}

function drawCardFace(cx,cy,cw,ch,card){
  const mx=cx+cw/2,my=cy+ch/2;
  if(card.type==='coin'){
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(mx,my-5,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(mx,my-5,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8B6914';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(card.label,mx,my+1);
  }else if(card.icon==='mushroom'){
    ctx.fillStyle='#ff2020';ctx.beginPath();ctx.ellipse(mx,my-5,18,13,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#ffe4c4';ctx.fillRect(mx-7,my-5,14,14);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx-5,my-10,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(mx+5,my-12,3,0,Math.PI*2);ctx.fill();
  }else if(card.icon==='fireflower'){
    ctx.fillStyle='#228B22';ctx.fillRect(mx-2,my+2,4,12);
    const pc=['#ff4444','#ff8800','#ffaa00','#ff4444','#ff8800'];
    for(let i=0;i<5;i++){ctx.fillStyle=pc[i];const a=(i/5)*Math.PI*2-Math.PI/2;ctx.beginPath();ctx.arc(mx+Math.cos(a)*8,my-5+Math.sin(a)*8,5,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx,my-5,5,0,Math.PI*2);ctx.fill();
  }else if(card.icon==='leaf'){
    ctx.fillStyle='#228B22';ctx.beginPath();ctx.ellipse(mx,my-2,15,9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#32CD32';ctx.beginPath();ctx.ellipse(mx,my-2,10,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.moveTo(mx-3,my-10);ctx.lineTo(mx,my-20);ctx.lineTo(mx+3,my-10);ctx.fill();
    ctx.beginPath();ctx.moveTo(mx+3,my-10);ctx.lineTo(mx+6,my-20);ctx.lineTo(mx+9,my-10);ctx.fill();
  }else if(card.icon==='star'){
    ctx.fillStyle='#ffd700';ctx.beginPath();
    for(let i=0;i<5;i++){const a1=i*2*Math.PI/5-Math.PI/2,a2=a1+Math.PI/5;
      ctx.lineTo(mx+Math.cos(a1)*16,my-2+Math.sin(a1)*16);ctx.lineTo(mx+Math.cos(a2)*7,my-2+Math.sin(a2)*7);}
    ctx.closePath();ctx.fill();
  }else if(card.icon==='oneup'){
    ctx.fillStyle='#00cc00';ctx.beginPath();ctx.ellipse(mx,my-6,18,13,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#ffe4c4';ctx.fillRect(mx-7,my-6,14,14);
    ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('1UP',mx,my+3);
  }else if(card.icon==='fish'){
    ctx.fillStyle='#1e90ff';ctx.beginPath();ctx.ellipse(mx,my-2,16,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#87ceeb';ctx.beginPath();ctx.ellipse(mx-2,my-4,10,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1e90ff';ctx.beginPath();ctx.moveTo(mx+14,my-2);ctx.lineTo(mx+24,my-9);ctx.lineTo(mx+24,my+5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx-6,my-4,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(mx-5,my-4,1.8,0,Math.PI*2);ctx.fill();
  }
}

function updateInventory(){

  }
  if(K['Space']){

    const items=['mushroom','fireflower','leaf','star','oneup','fish','back'];

    if(sel==='mushroom'&&inventory.mushroom>0){inventory.mushroom--;savedForm.big=true;sfxPower();}
    else if(sel==='fireflower'&&inventory.fireflower>0){inventory.fireflower--;savedForm.big=true;savedForm.fire=true;savedForm.cat=false;savedForm.fish=false;sfxPower();}
    else if(sel==='leaf'&&inventory.leaf>0){inventory.leaf--;savedForm.big=true;savedForm.cat=true;savedForm.fire=false;savedForm.fish=false;sfxPower();}
    else if(sel==='star'&&inventory.star>0){inventory.star--;sfxPower();}
    else if(sel==='oneup'&&inventory.oneup>0){inventory.oneup--;lives++;sfx1up();}
    else if(sel==='fish'&&inventory.fish>0){inventory.fish--;savedForm.big=true;savedForm.fish=true;savedForm.fire=false;savedForm.cat=false;sfxPower();}
    saveGame();
  }
  if(K['Escape']||K['KeyX']){K['Escape']=false;K['KeyX']=false;state='map';}
}

let lastMK=0;
function update(){
  if(paused){
    // Handle inventory tap during pause
    if(canvasTap){
      const tp=canvasTap;canvasTap=null;
      // Speed run toggle
      if(tp.x>=CW/2-70&&tp.x<=CW/2+70&&tp.y>=CH-50&&tp.y<=CH-20){speedRunActive=!speedRunActive;if(speedRunActive)speedRunTimer=0;return;}
      // Inventory items
      const invItems=['mushroom','fireflower','star','leaf'];
      const iw=100,ig=12,isx=(CW-4*(iw+ig))/2;
      for(let ii=0;ii<4;ii++){const ix=isx+ii*(iw+ig),iy=170;
        if(tp.x>=ix&&tp.x<=ix+iw&&tp.y>=iy&&tp.y<=iy+70&&(inventory[invItems[ii]]||0)>0){
          inventory[invItems[ii]]--;
          if(invItems[ii]==='mushroom'&&!player.big){player.big=true;player.h=52;growTimer=30;sfxPower();}
          else if(invItems[ii]==='fireflower'){player.big=true;player.fire=true;player.h=52;growTimer=30;sfxPower();}
          else if(invItems[ii]==='star'){player.star=true;player.starTimer=600;sfxPower();}
          else if(invItems[ii]==='leaf'){player.big=true;player.cat=true;player.h=52;growTimer=30;sfxPower();}
          paused=false;startMusic(currentLevel===3?'boss':WC[currentWorld].theme,musicSpeed);break;
        }
      }
    }
    return;
  }
  if(kickFreeze>0){kickFreeze--;return;}
  if(state==='prelevel'){prelevelTimer--;if(prelevelTimer<=0){state='playing';startIris(-1,null);}return;}
  if(state==='deathscreen'){deathScreenTimer--;if(deathScreenTimer<=0){loadLevel(currentWorld,currentLevel);initLevel();state='prelevel';prelevelTimer=90;startMusic(currentLevel===3?'boss':WC[currentWorld].theme);}return;}
  if(state==='playing'){
    if(warpState){
      warpState.timer++;
      if(warpState.phase==='enter'){
        player.y+=2;player.vx=0;player.groundPound=false;player.crouching=false;player.gpLock=10;
        if(warpState.timer>30){warpState.phase='subzone';warpState.timer=0;
          // Setup playable sub-zone
          warpState.savedCamX2=cam.x;cam.x=0;
          warpState.timeLimit=900; // 15 seconds
          warpState.collected=0;
          warpState.exitPipe={x:11*T,y:9*T}; // exit pipe at right side
          // Pick theme based on world+level
          warpState.theme=(currentWorld*4+currentLevel)%6;
          // Generate platforms and coins for the sub-zone
          warpState.platforms=[];warpState.coins=[];
          const roomW=12*T,roomH=13*T;
          warpState.roomW=roomW;warpState.roomH=roomH;
          // 3-4 platforms

          for(let pi=0;pi<platCount;pi++){
            const px=T*2+Math.floor(Math.random()*(roomW-T*5));
            const py=T*4+Math.floor(pi*(roomH-T*6)/platCount);
            const pw=T*2+Math.floor(Math.random()*T*2);
            warpState.platforms.push({x:px,y:py,w:pw,h:T/2});
          }
          // Coins: on platforms + arc at top
          for(const pl of warpState.platforms){
            const nc=Math.floor(pl.w/20);
            for(let ci=0;ci<nc;ci++){warpState.coins.push({x:pl.x+12+ci*20,y:pl.y-18,collected:false,anim:Math.random()*6});}
          }
          // Arc of coins near top
          for(let ci=0;ci<7;ci++){const ang=Math.PI*(ci/6);warpState.coins.push({x:roomW/2-80+ci*26,y:T*2+Math.sin(ang)*-30+40,collected:false,anim:Math.random()*6});}
          // Extra scattered coins
          for(let ci=0;ci<5;ci++){warpState.coins.push({x:T+Math.random()*(roomW-T*3),y:T*3+Math.random()*(roomH-T*6),collected:false,anim:Math.random()*6});}
          // Secret rooms have 1-UPs instead of some coins
          if(warpState.secret){warpState.oneUps=[{x:3*T,y:6*T,collected:false},{x:6*T,y:4*T,collected:false},{x:9*T,y:7*T,collected:false}];warpState.theme=Math.floor(Math.random()*6);}
          player.x=T;player.y=roomH-T*2-player.h;player.vx=0;player.vy=0;player.onGround=true;
        }}
      else if(warpState.phase==='subzone'){
        warpState.timeLimit--;
        const p=player,jk=K['Space']||K['ArrowUp'];
        p.groundPound=false;p.crouching=false;p.gpLock=5;
        if(K['ArrowLeft']){p.vx-=.6;p.facing=-1;}else if(K['ArrowRight']){p.vx+=.6;p.facing=1;}else p.vx*=.82;
        p.vx=Math.max(-5,Math.min(5,p.vx));
        p.vy+=.45;if(p.vy>9)p.vy=9;
        if(jk&&p.onGround){p.vy=-10;p.onGround=false;p.jumpHeld=true;sfxJump();}
        if(!jk)p.jumpHeld=false;
        if(jk&&p.jumpHeld&&p.vy<0)p.vy-=.15; // variable jump height
        p.x+=p.vx;p.y+=p.vy;
        // Walls/floor/ceiling
        if(p.x<0){p.x=0;p.vx=0;}if(p.x+p.w>warpState.roomW){p.x=warpState.roomW-p.w;p.vx=0;}
        if(p.y+p.h>=warpState.roomH-T){p.y=warpState.roomH-T-p.h;p.vy=0;p.onGround=true;}
        else p.onGround=false;
        if(p.y<0){p.y=0;p.vy=0;}
        // Platform collision (one-way from top)
        for(const pl of warpState.platforms){
          if(p.vy>=0&&p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>=pl.y&&p.y+p.h<=pl.y+pl.h+6){
            p.y=pl.y-p.h;p.vy=0;p.onGround=true;
          }
        }
        p.anim+=Math.abs(p.vx)*.05;
        // Collect coins
        for(const vc of warpState.coins){if(vc.collected)continue;vc.anim+=.1;
          if(Math.abs(p.x+p.w/2-vc.x)<22&&Math.abs(p.y+p.h/2-vc.y)<22){
            vc.collected=true;warpState.collected++;coins++;score+=200;sfxCoin();levelCoins++;
            if(coins>=100){coins-=100;lives++;sfx1up();}
          }
        }
        // Collect 1-UPs in secret rooms
        if(warpState.oneUps){for(const ou of warpState.oneUps){if(ou.collected)continue;
          if(Math.abs(p.x+p.w/2-ou.x)<22&&Math.abs(p.y+p.h/2-ou.y)<22){ou.collected=true;lives++;sfx1up();particles.push({type:'pop',x:ou.x,y:ou.y-16,text:'1UP!',life:50});}
        }}
        // Exit pipe: press UP near exit pipe
        const ep=warpState.exitPipe;
        if(K['ArrowUp']&&Math.abs(p.x+p.w/2-ep.x-T/2)<T&&Math.abs(p.y+p.h-ep.y-T)<T*1.5){
          warpState.phase='exit';warpState.timer=0;
        }
        // Time up = forced exit
        if(warpState.timeLimit<=0){warpState.phase='exit';warpState.timer=0;}
      }
      else if(warpState.phase==='exit'){
        player.y-=2;if(warpState.timer>30){
          cam.x=warpState.savedCamX2||warpState.savedCamX||0;
          player.x=warpState.savedX;player.y=warpState.savedY;player.vx=0;player.vy=0;warpState=null;
        }}
      updateParticles();
    }else if(vineBonus){
      vineBonus.timer++;
      if(vineBonus.phase==='rise'){
        player.y-=4;player.vx=0;player.vy=0;
        if(vineBonus.timer>40){
          vineBonus.phase='bonus';vineBonus.timer=0;
          // Setup playable bonus room: scatter coins in a small area
          vineBonus.coins=[];vineBonus.roomX=0;vineBonus.roomW=CW;vineBonus.roomH=CH;
          vineBonus.timeLimit=600; // 10 seconds at 60fps
          vineBonus.savedCamX=cam.x;cam.x=0;
          player.x=CW/2-player.w/2;player.y=CH-80-player.h;player.vx=0;player.vy=0;player.onGround=true;
          for(let ci=0;ci<vineBonus.totalCoins;ci++){
            vineBonus.coins.push({x:40+Math.random()*(CW-80),y:CH-200+Math.random()*120,collected:false,anim:Math.random()*6});
          }
        }
      }else if(vineBonus.phase==='bonus'){
        vineBonus.timeLimit--;

        const p=player,jk=K['Space']||K['ArrowUp'];
        if(K['ArrowLeft']){p.vx-=.5;p.facing=-1;}else if(K['ArrowRight']){p.vx+=.5;p.facing=1;}else p.vx*=.85;
        p.vx=Math.max(-5,Math.min(5,p.vx));
        p.vy+=.4;if(p.vy>8)p.vy=8;
        if(jk&&p.onGround){p.vy=-9;p.onGround=false;p.jumpHeld=true;sfxJump();}
        if(!jk)p.jumpHeld=false;
        p.x+=p.vx;p.y+=p.vy;
        // Walls and floor of bonus room
        if(p.x<0){p.x=0;p.vx=0;}if(p.x+p.w>CW){p.x=CW-p.w;p.vx=0;}
        if(p.y+p.h>=CH-32){p.y=CH-32-p.h;p.vy=0;p.onGround=true;}
        if(p.y<0){p.y=0;p.vy=0;}
        p.anim+=Math.abs(p.vx)*.05;
        // Collect coins
        for(const vc of vineBonus.coins){if(vc.collected)continue;vc.anim+=.1;
          if(Math.abs(p.x+p.w/2-vc.x)<24&&Math.abs(p.y+p.h/2-vc.y)<24){
            vc.collected=true;vineBonus.collected++;coins++;score+=200;sfxCoin();levelCoins++;
            if(coins>=100){coins-=100;lives++;sfx1up();}
          }
        }
        // End: time up or all collected
        if(vineBonus.timeLimit<=0||vineBonus.collected>=vineBonus.totalCoins){
          vineBonus.phase='fall';vineBonus.timer=0;cam.x=vineBonus.savedCamX||0;
        }
      }else if(vineBonus.phase==='fall'){
        player.y+=4;
        if(vineBonus.timer>40){
          player.x=vineBonus.returnX;player.y=(GROUND_ROW-2)*T;player.vx=0;player.vy=0;
          cam.x=Math.max(cam.x,vineBonus.returnX-CW*0.3);
          vineBonus=null;
        }
      }
      updateParticles();
    }else{
      updatePlayer();
      if(!player.dead||deathTimer>0){updateEnemies();updateBulletBills();updateEnemyPipes();updateItems();updateFireballs();updatePlatforms();updateBoss();updateHammers();updateFireBars();updateStarCoins();}
      updateParticles();
    }
  }
  if(state==='title'){if(K['Space']||canvasTap){K['Space']=false;canvasTap=null;state='map';mapW=0;mapL=0;if(aC.state==='suspended')aC.resume();}}
  if(state==='map'){
    const now=Date.now();
    if(now-lastMK>180){
      if(K['ArrowRight']){if(mapL<3)mapL++;else if(mapW<7){mapW++;mapL=0;}lastMK=now;}
      if(K['ArrowLeft']){if(mapL>0)mapL--;else if(mapW>0){mapW--;mapL=3;}lastMK=now;}
      if(K['ArrowDown']&&mapW<7){mapW++;mapL=0;lastMK=now;}
      if(K['ArrowUp']&&mapW>0){mapW--;mapL=0;lastMK=now;}
    }
    // Confirm reset dialog (must be checked BEFORE map tap handling)
    if(confirmResetShown){
      if(canvasTap){
        const tp=canvasTap;canvasTap=null;
        // Yes button area
        if(tp.x>=CW/2-130&&tp.x<=CW/2-10&&tp.y>=CH/2+20&&tp.y<=CH/2+60){mapReset();confirmResetShown=false;}
        // No button area or anywhere else = cancel
        else{confirmResetShown=false;}
      }
      if(K['Space']||K['KeyY']){K['Space']=false;K['KeyY']=false;mapReset();confirmResetShown=false;}
      if(K['Escape']||K['KeyX']||K['KeyN']){K['Escape']=false;K['KeyX']=false;K['KeyN']=false;confirmResetShown=false;}
    }else{
    // Touch: tap on world tabs, level cards, buttons
    if(canvasTap){
      const tp=canvasTap;canvasTap=null;
      // World tabs
      const tw=90,tg=5,tsx=(CW-8*(tw+tg))/2;
      for(let w=0;w<8;w++){const tx=tsx+w*(tw+tg);if(tp.x>=tx&&tp.x<=tx+tw&&tp.y>=55&&tp.y<=91){if(worldsUnlocked[w][0]||w===0){mapW=w;mapL=0;}break;}}
      // Level cards
      const cw2=150,cg2=20,csx=(CW-4*(cw2+cg2))/2+cg2/2,cy2=240;
      for(let l=0;l<4;l++){const cx=csx+l*(cw2+cg2);if(tp.x>=cx&&tp.x<=cx+cw2&&tp.y>=cy2&&tp.y<=cy2+170){mapL=l;
        // Double tap = launch
        if(worldsUnlocked[mapW][mapL]||(mapW===0&&mapL===0)){mapStartLevel();}break;}}
      // Inventory button (bottom left area)
      if(tp.x<200&&tp.y>CH-50){state='inventory';inventoryCursor=0;}
      // Reset button (bottom right area)
      if(tp.x>CW-200&&tp.y>CH-50){confirmResetShown=true;}
    }
    if(K['Space']){K['Space']=false;mapStartLevel();}
    if(K['KeyI']){K['KeyI']=false;state='inventory';inventoryCursor=0;}
    if(K['KeyR']){K['KeyR']=false;confirmResetShown=true;}
    }
  }
  if(state==='gameover'){if(K['Space']||canvasTap){K['Space']=false;canvasTap=null;
    stopMusic();mapReset();mapW=0;mapL=0;state='map';
  }}
  if(state==='win'){
    if(K['Space']||canvasTap){K['Space']=false;canvasTap=null;
      if(player){savedForm={big:player.big,fire:player.fire,cat:player.cat,fish:player.fish};}
      if(currentLevel<3)worldsUnlocked[currentWorld][currentLevel+1]=true;
      else if(currentWorld<7)worldsUnlocked[currentWorld+1][0]=true;
      saveGame();
      // Go to roulette
      state='roulette';rouletteTimer=0;rouletteResult=null;rouletteSpeed=4;
    }
  }
  if(state==='roulette'){

      const items=['mushroom','fireflower','star','leaf','1up','coins'];
      const idx=Math.abs(Math.floor(rouletteTimer*rouletteSpeed))%items.length;
      rouletteSpeed=0;
      rouletteResult=items[idx];
      // Give reward
      if(rouletteResult==='mushroom')inventory.mushroom++;
      else if(rouletteResult==='fireflower')inventory.fireflower++;
      else if(rouletteResult==='star')inventory.star++;
      else if(rouletteResult==='leaf')inventory.leaf++;
      else if(rouletteResult==='1up'){lives++;sfx1up();}
      else if(rouletteResult==='coins'){coins+=10;score+=2000;}
      saveGame();
    }
    if(rouletteResult&&rouletteTimer>60){
      if(K['Space']||canvasTap){K['Space']=false;canvasTap=null;
        memoryLevelCounter++;
        if(memoryLevelCounter%2===0){state='memory_intro';}else{state='map';}

        else if(currentWorld<7){mapW=currentWorld+1;mapL=0;}
      }
    }
  }
  if(state==='memory_intro'){
    if(canvasTap){
      const tp=canvasTap;canvasTap=null;
      // Top half = play, bottom half = skip
      if(tp.y<CH/2+50){initMemoryGame();state='memory';}
      else{state='map';}
    }
    if(K['Space']){K['Space']=false;initMemoryGame();state='memory';}
    if(K['Escape']||K['KeyN']||K['KeyX']){K['Escape']=false;K['KeyN']=false;K['KeyX']=false;state='map';}
  }
  if(state==='memory'){
    if(memoryState==='done'&&(K['Space']||canvasTap)){K['Space']=false;canvasTap=null;saveGame();state='map';}
    else{
      // Touch: tap on cards
      if(canvasTap&&memoryState==='hidden'){

        const cardW=72,cardH=68,gap=8;
        const gridW=6*(cardW+gap)-gap;

          const idx=row*6+col;

            memoryCursor={x:col,y:row};
            memoryFlipped[idx]=true;sfxJump();

            else{memorySecond=idx;memoryState='checking';memoryShowTimer=Date.now();}

      updateMemory();
    }
  }
  if(state==='inventory'){
    if(canvasTap){
      const tp=canvasTap;canvasTap=null;
      const startY=120;
      for(let i=0;i<7;i++){if(tp.y>=startY+i*60-5&&tp.y<=startY+i*60+45){inventoryCursor=i;K['Space']=true;break;}}
    }
    updateInventory();
  }
  canvasTap=null; // clear any unhandled tap
}

      // Coins
      for(const vc of warpState.coins){if(vc.collected)continue;
        const spinW=Math.abs(Math.cos(vc.anim))*7;
        ctx.fillStyle='#ffd700';ctx.beginPath();ctx.ellipse(vc.x,vc.y,spinW,8,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.ellipse(vc.x,vc.y,spinW*.5,5,0,0,Math.PI*2);ctx.fill();
      }
      // Exit pipe
      const ep=warpState.exitPipe;
      ctx.fillStyle='#2a8a2a';ctx.fillRect(ep.x,ep.y,T,T*2);ctx.fillStyle='#3aba3a';ctx.fillRect(ep.x-4,ep.y,T+8,T/3);
      // Arrow indicator on exit pipe
      const arrowBob=Math.sin(Date.now()/300)*3;
      ctx.fillStyle='rgba(255,215,0,'+(0.5+Math.sin(Date.now()/200)*0.3)+')';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('\u25B2',ep.x+T/2,ep.y-8+arrowBob);ctx.textAlign='left';
      // 1-UPs in secret rooms
      if(warpState.oneUps){for(const ou of warpState.oneUps){if(ou.collected)continue;
        ctx.fillStyle='#22cc22';ctx.beginPath();ctx.arc(ou.x,ou.y,12,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#88ff88';ctx.beginPath();ctx.arc(ou.x-3,ou.y-3,5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('1UP',ou.x,ou.y+4);ctx.textAlign='left';
      }}
      // Player
      drawPlayer();
      // HUD
      ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
      ctx.fillText(th.name,CW/2,22);
      ctx.fillStyle='#ffd700';ctx.font='bold 14px Arial';
      ctx.fillText('Pi\u00e8ces: '+warpState.collected+'/'+warpState.coins.length,CW/2,42);
      ctx.fillStyle=warpState.timeLimit<180?'#ff4444':'#fff';ctx.font='bold 14px Arial';
      ctx.fillText('TIME: '+Math.ceil(warpState.timeLimit/60),CW/2,60);
      ctx.textAlign='left';
    }else if(warpState){
      // Draw pipe enter/exit: clip player sinking into pipe
      if(warpState.phase==='enter'){
        ctx.save();
        const pipeX=warpState.savedX-cam.x,pipeY=warpState.savedY;
        ctx.beginPath();ctx.rect(pipeX-5,pipeY,T+10,T*3);ctx.clip();
        drawPlayer();
        ctx.restore();
      }else{
        ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,CW,CH);ctx.fillStyle='#ffd700';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.fillText('Retour...',CW/2,CH/2);ctx.textAlign='left';
      }
    }
    if(vineBonus&&vineBonus.phase==='bonus'){
      // Draw playable bonus room
      ctx.fillStyle='#0a2a0a';ctx.fillRect(0,0,CW,CH);
      // Floor
      ctx.fillStyle='#2a5a2a';ctx.fillRect(0,CH-32,CW,32);
      // Walls
      ctx.fillStyle='#1a4a1a';ctx.fillRect(0,0,8,CH);ctx.fillRect(CW-8,0,8,CH);ctx.fillRect(0,0,CW,8);
      // Coins
      for(const vc of vineBonus.coins){if(vc.collected)continue;
        const spinW=Math.abs(Math.cos(vc.anim))*7;
        ctx.fillStyle='#ffd700';ctx.beginPath();ctx.ellipse(vc.x,vc.y,spinW,8,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.ellipse(vc.x,vc.y,spinW*.5,5,0,0,Math.PI*2);ctx.fill();
      }
      // Draw player
      drawPlayer();
      // HUD
      ctx.fillStyle='#00ff88';ctx.font='bold 20px Arial';ctx.textAlign='center';
      ctx.fillText('BONUS LIANE: '+vineBonus.collected+'/'+vineBonus.totalCoins,CW/2,30);
      ctx.fillStyle=vineBonus.timeLimit<180?'#ff4444':'#fff';ctx.font='bold 16px Arial';
      ctx.fillText('TIME: '+Math.ceil(vineBonus.timeLimit/60),CW/2,52);
      ctx.textAlign='left';
    }else if(vineBonus){ctx.fillStyle='rgba(0,50,0,0.7)';ctx.fillRect(0,0,CW,CH);ctx.fillStyle='#00ff88';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.fillText(vineBonus.phase==='rise'?'BONUS LIANE!':'Retour...',CW/2,CH/2);ctx.textAlign='left';}
    // Warp pipe indicator (down arrow on warp pipes)
    if(!warpState){for(const wp of warpPipes){const wx=wp.x-cam.x,wy=wp.y;if(wx>-T&&wx<CW+T){ctx.fillStyle='rgba(255,215,0,'+(.4+Math.sin(Date.now()/300)*.3)+')';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('\u25BC',wx+T/2,wy-4);ctx.textAlign='left';}}}
    if(state==='gameover')drawGameOver();
    if(state==='win')drawWin();
    if(paused){ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,CW,CH);ctx.fillStyle='#fff';ctx.font='bold 48px Arial';ctx.textAlign='center';ctx.fillText('PAUSE',CW/2,100);
      // Inventory in pause
      ctx.font='bold 16px Arial';ctx.fillStyle='#ffd700';ctx.fillText('INVENTAIRE (tap pour utiliser)',CW/2,150);
      const invItems=[{key:'mushroom',icon:'\u{1F344}',name:'Champignon'},{key:'fireflower',icon:'\u{1F525}',name:'Fleur Feu'},{key:'star',icon:'\u2B50',name:'\u00c9toile'},{key:'leaf',icon:'\u{1F343}',name:'Feuille'}];
      const iw=100,ig=12,isx=(CW-invItems.length*(iw+ig))/2;
      for(let ii=0;ii<invItems.length;ii++){const it=invItems[ii],ix=isx+ii*(iw+ig),iy=170,cnt=inventory[it.key]||0;
        ctx.fillStyle=cnt>0?'rgba(255,255,255,0.1)':'rgba(50,50,50,0.3)';ctx.fillRect(ix,iy,iw,70);ctx.strokeStyle=cnt>0?'#ffd700':'#555';ctx.lineWidth=1;ctx.strokeRect(ix,iy,iw,70);
        ctx.font='28px Arial';ctx.fillStyle=cnt>0?'#fff':'#555';ctx.fillText(it.icon,ix+iw/2,iy+35);
        ctx.font='11px Arial';ctx.fillText(it.name,ix+iw/2,iy+55);ctx.font='bold 12px Arial';ctx.fillStyle='#ffd700';ctx.fillText('x'+cnt,ix+iw/2,iy+68);
      }
      ctx.font='16px Arial';ctx.fillStyle='#aaa';ctx.fillText('START/ESC = reprendre',CW/2,CH-60);
      // Speed run toggle
      ctx.fillStyle=speedRunActive?'rgba(0,255,100,0.2)':'rgba(255,255,255,0.1)';ctx.fillRect(CW/2-70,CH-50,140,30);ctx.strokeStyle=speedRunActive?'#00ff88':'#666';ctx.lineWidth=1;ctx.strokeRect(CW/2-70,CH-50,140,30);
      ctx.fillStyle=speedRunActive?'#00ff88':'#aaa';ctx.font='bold 13px Arial';ctx.fillText('\u23F1 Speed Run: '+(speedRunActive?'ON':'OFF'),CW/2,CH-30);
      ctx.textAlign='left';
    }
    if(shakeTimer>0)ctx.restore();
  }
  // Iris wipe overlay
  if(irisTimer>0){
    const maxR=Math.sqrt(CW*CW+CH*CH)/2;
    const progress=irisDir>0?(irisTimer/30):(1-irisTimer/30);
    const radius=maxR*(1-progress);
    ctx.fillStyle='#000';ctx.beginPath();ctx.rect(0,0,CW,CH);
    ctx.arc(CW/2,CH/2,Math.max(0,radius),0,Math.PI*2,true);ctx.fill();
  }
}

function startIris(dir,cb){irisDir=dir;irisTimer=30;irisCallback=cb;}

function loop(){
  try{update();}catch(ex){console.error('update error',ex);}
  // Update iris
  if(irisTimer>0){irisTimer--;if(irisTimer<=0&&irisCallback){const cb=irisCallback;irisCallback=null;cb();startIris(-1,null);}}
  try{draw();}catch(ex){console.error('draw error',ex);}
  requestAnimationFrame(loop);
}
loadLevel(0,0);initLevel();loop();
</script>
</body>
</html>
