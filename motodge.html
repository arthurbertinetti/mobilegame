<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Moto Dodge - CBR650R</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a; color: #eee;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100dvh; overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none; user-select: none;
        }
        #top-bar {
            width: 100%; max-width: 420px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px 6px; font-size: 1rem;
            text-shadow: 0 0 12px rgba(255,50,50,.4);
        }
        #top-bar a { color: #ffd93d; text-decoration: none; font-size: 1.3rem; }
        #top-bar span { font-weight: bold; color: #ffd93d; }
        canvas {
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,.6), 0 0 60px rgba(255,50,50,.1);
        }
        #overlay {
            display: none; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.85));
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; border-radius: 10px; backdrop-filter: blur(3px);
        }
        #overlay.visible { display: flex; }
        #overlay h2 { font-size: 2.2rem; margin-bottom: 8px; color: #ff4757;
            text-shadow: 0 0 20px rgba(255,71,87,.6); }
        #overlay p { font-size: 1.2rem; margin-bottom: 20px; }
        button {
            background: linear-gradient(145deg, #1a3a5c, #0d2137); color: #eee;
            border: 1px solid rgba(255,255,255,.08); border-radius: 14px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 15px rgba(0,0,0,.4); transition: transform .1s;
        }
        button:active { background: linear-gradient(145deg, #e94560, #c0392b); transform: scale(.95); }
        #action-btn {
            padding: 14px 44px; font-size: 1.2rem; border-radius: 16px;
            background: linear-gradient(145deg, #c0392b, #e74c3c);
            border: 1px solid rgba(255,255,255,.12);
        }
        #controls {
            flex: 1; display: grid;
            grid-template-areas: ". up ." "left down right";
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px; width: 100%; max-width: 320px; max-height: 170px;
            padding: 8px 10px;
        }
        .ctrl-btn { width: 100%; height: 100%; min-height: 50px; font-size: 1.8rem;
            display: flex; align-items: center; justify-content: center; border-radius: 16px; }
        #btn-up { grid-area: up; }
        #btn-down { grid-area: down; }
        #btn-left { grid-area: left; }
        #btn-right { grid-area: right; }
    </style>
</head>
<body>
    <div id="top-bar">
        <a href="index.html">← Menu</a>
        <div>Score : <span id="score">0</span></div>
        <div>Vitesse : <span id="speed-display">1</span></div>
    </div>
    <div style="position:relative;">
        <canvas id="game-canvas"></canvas>
        <div id="overlay">
            <h2 id="overlay-title">Crash !</h2>
            <p id="overlay-msg"></p>
            <button id="action-btn">Recommencer</button>
        </div>
    </div>
    <div id="controls">
        <button class="ctrl-btn" id="btn-up">▲</button>
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-down">▼</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
    </div>

<script src="leaderboard.js"></script>
<script>
var canvas = document.getElementById('game-canvas');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('score');
var speedDisp = document.getElementById('speed-display');
var overlay = document.getElementById('overlay');
var overlayTitle = document.getElementById('overlay-title');
var overlayMsg = document.getElementById('overlay-msg');
var actionBtn = document.getElementById('action-btn');

var W, H;
function resize() {
    W = Math.min(window.innerWidth - 8, 420);
    H = Math.floor(window.innerHeight * 0.52);
    canvas.width = W; canvas.height = H;
}

var LANES = 4;
var laneW, roadLeft, roadRight;
function calcLanes() {
    var roadW = W * 0.75;
    roadLeft = (W - roadW) / 2;
    roadRight = roadLeft + roadW;
    laneW = roadW / LANES;
}
function laneX(lane) { return roadLeft + lane * laneW + laneW / 2; }

// Obstacle types
var OBS_TYPES = ['bicycle', 'scooter', 'pedestrian'];

var player, obstacles, roadLines, particles;
var score, dodged, baseSpeed, speedLevel, running, animId, frameCount;
var keys = {};

function startGame() {
    resize(); calcLanes();
    score = 0; dodged = 0; baseSpeed = 1.5; speedLevel = 1; frameCount = 0;
    scoreEl.textContent = 0; speedDisp.textContent = 1;
    overlay.classList.remove('visible');

    player = {
        lane: 1, x: laneX(1), targetX: laneX(1),
        y: H - 80, targetY: H - 80,
        w: laneW * 0.4, h: laneW * 0.9
    };
    obstacles = []; particles = [];
    roadLines = [];
    for (var y = -40; y < H + 40; y += 50) roadLines.push({ y: y });

    running = true;
    if (animId) cancelAnimationFrame(animId);
    loop();
}

function spawnObstacle() {
    var lane = Math.floor(Math.random() * LANES);
    var type = OBS_TYPES[Math.floor(Math.random() * OBS_TYPES.length)];
    var w, h;
    switch(type) {
        case 'bicycle':    w = laneW * 0.35; h = laneW * 0.8; break;
        case 'scooter':    w = laneW * 0.38; h = laneW * 0.85; break;
        case 'pedestrian': w = laneW * 0.25; h = laneW * 0.6; break;
    }
    obstacles.push({
        lane: lane, x: laneX(lane), y: -h - 20,
        w: w, h: h, type: type,
        speed: baseSpeed * (0.5 + Math.random() * 0.4),
        passed: false
    });
}

function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
        var a = Math.random() * Math.PI * 2;
        var s = 2 + Math.random() * 4;
        particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
            life: 1, size: 2 + Math.random() * 4, color: color });
    }
}

function loop() {
    if (!running) return;
    frameCount++;
    update();
    drawScene();
    animId = requestAnimationFrame(loop);
}

function update() {
    if (keys.left && player.lane > 0) { player.lane--; player.targetX = laneX(player.lane); keys.left = false; }
    if (keys.right && player.lane < LANES - 1) { player.lane++; player.targetX = laneX(player.lane); keys.right = false; }
    if (keys.up) player.targetY = Math.max(H * 0.3, player.targetY - 3);
    if (keys.down) player.targetY = Math.min(H - 60, player.targetY + 3);
    if (!keys.up && !keys.down) player.targetY += (H - 80 - player.targetY) * 0.02;
    player.x += (player.targetX - player.x) * 0.18;
    player.y += (player.targetY - player.y) * 0.12;

    // Distance-based scoring: gain points continuously
    score += Math.floor(baseSpeed * 0.5);
    scoreEl.textContent = score;

    // Gradual speed increase every 500 frames (very progressive)
    if (frameCount % 500 === 0 && frameCount > 0) {
        speedLevel++;
        baseSpeed += 0.25;
        speedDisp.textContent = speedLevel;
        spawnParticles(W/2, H/2, '#ffd93d', 10);
    }

    var spawnRate = Math.max(35, 75 - speedLevel * 3);
    if (frameCount % spawnRate === 0) spawnObstacle();

    for (var i = obstacles.length - 1; i >= 0; i--) {
        var o = obstacles[i];
        o.y += o.speed;
        if (!o.passed && o.y > player.y + player.h) {
            o.passed = true;
            dodged++;
            score += 15;
            scoreEl.textContent = score;
        }
        if (o.y > H + 100) { obstacles.splice(i, 1); continue; }
        var dx = Math.abs(o.x - player.x);
        var dy = Math.abs(o.y - player.y);
        if (dx < (o.w + player.w) * 0.42 && dy < (o.h + player.h) * 0.42) {
            spawnParticles(player.x, player.y, '#ff6b81', 25);
            spawnParticles(player.x, player.y, '#ffd93d', 15);
            gameOver();
            return;
        }
    }

    roadLines.forEach(function(l) { l.y += baseSpeed; if (l.y > H + 40) l.y -= roadLines.length * 50; });

    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.03; p.size *= 0.97; p.vy += 0.05;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawScene() {
    // City background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Buildings in background
    ctx.fillStyle = '#111122';
    for (var bx = 0; bx < roadLeft; bx += 25) {
        var bh = 40 + Math.sin(bx * 0.3) * 30;
        ctx.fillRect(bx, H * 0.2 - bh, 20, bh + H);
        // Windows
        ctx.fillStyle = 'rgba(255,230,100,0.3)';
        for (var wy = H * 0.2 - bh + 5; wy < H * 0.2; wy += 10)
            for (var wx = bx + 3; wx < bx + 18; wx += 7)
                if (Math.random() > 0.3) ctx.fillRect(wx, wy, 4, 5);
        ctx.fillStyle = '#111122';
    }
    for (var bx = roadRight + 5; bx < W; bx += 25) {
        var bh = 40 + Math.cos(bx * 0.3) * 30;
        ctx.fillRect(bx, H * 0.2 - bh, 20, bh + H);
        ctx.fillStyle = 'rgba(255,230,100,0.3)';
        for (var wy = H * 0.2 - bh + 5; wy < H * 0.2; wy += 10)
            for (var wx = bx + 3; wx < bx + 18; wx += 7)
                if (Math.random() > 0.3) ctx.fillRect(wx, wy, 4, 5);
        ctx.fillStyle = '#111122';
    }

    // Sidewalk
    ctx.fillStyle = '#555';
    ctx.fillRect(roadLeft - 15, 0, 15, H);
    ctx.fillRect(roadRight, 0, 15, H);

    // Road
    var roadGrad = ctx.createLinearGradient(roadLeft, 0, roadRight, 0);
    roadGrad.addColorStop(0, '#333'); roadGrad.addColorStop(0.5, '#444'); roadGrad.addColorStop(1, '#333');
    ctx.fillStyle = roadGrad;
    ctx.fillRect(roadLeft, 0, roadRight - roadLeft, H);

    // Road edges
    ctx.fillStyle = '#eee';
    ctx.fillRect(roadLeft - 2, 0, 2, H);
    ctx.fillRect(roadRight, 0, 2, H);

    // Dashed lines
    ctx.setLineDash([30, 25]);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    for (var i = 1; i < LANES; i++) {
        var lx = roadLeft + i * laneW;
        var offset = roadLines[0] ? roadLines[0].y % 55 : 0;
        ctx.beginPath();
        ctx.moveTo(lx, -30 + offset);
        ctx.lineTo(lx, H + 30);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    // Obstacles
    obstacles.forEach(function(o) { drawObstacle(o); });

    // Player CBR650R
    drawCBR650R(player.x, player.y, player.w, player.h);

    // Particles
    particles.forEach(function(p) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Vignette
    var vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
}

function drawCBR650R(cx, cy, w, h) {
    var x = cx - w/2, y = cy - h/2;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(cx + 1, cy + h*0.4, w*0.45, h*0.12, 0, 0, Math.PI*2);
    ctx.fill();

    // Rear wheel
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(cx, cy + h*0.35, w*0.28, h*0.13, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.ellipse(cx, cy + h*0.35, w*0.18, h*0.08, 0, 0, Math.PI*2); ctx.fill();

    // Front wheel
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(cx, cy - h*0.33, w*0.26, h*0.12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.ellipse(cx, cy - h*0.33, w*0.16, h*0.07, 0, 0, Math.PI*2); ctx.fill();

    // Body - CBR650R red/black
    var bodyGrad = ctx.createLinearGradient(x, y, x + w, y);
    bodyGrad.addColorStop(0, '#8b0000');
    bodyGrad.addColorStop(0.3, '#cc0000');
    bodyGrad.addColorStop(0.6, '#ff1a1a');
    bodyGrad.addColorStop(1, '#8b0000');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(cx - w*0.2, cy + h*0.25);
    ctx.lineTo(cx - w*0.3, cy - h*0.1);
    ctx.lineTo(cx - w*0.25, cy - h*0.25);
    ctx.lineTo(cx + w*0.25, cy - h*0.25);
    ctx.lineTo(cx + w*0.3, cy - h*0.1);
    ctx.lineTo(cx + w*0.2, cy + h*0.25);
    ctx.closePath();
    ctx.fill();

    // Tank
    ctx.fillStyle = '#cc0000';
    ctx.beginPath();
    ctx.ellipse(cx, cy - h*0.05, w*0.22, h*0.12, 0, 0, Math.PI*2);
    ctx.fill();

    // Honda stripe
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - w*0.15, cy - h*0.08, w*0.3, 2);

    // Seat
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(cx, cy + h*0.12, w*0.18, h*0.06, 0, 0, Math.PI*2);
    ctx.fill();

    // Rider - helmet
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.ellipse(cx, cy - h*0.32, w*0.18, h*0.1, 0, 0, Math.PI*2);
    ctx.fill();
    // Visor
    ctx.fillStyle = 'rgba(100,200,255,0.5)';
    ctx.fillRect(cx - w*0.12, cy - h*0.33, w*0.24, h*0.04);

    // Rider body
    ctx.fillStyle = '#111';
    ctx.fillRect(cx - w*0.15, cy - h*0.24, w*0.3, h*0.2);

    // Arms/handlebars
    ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - w*0.15, cy - h*0.15); ctx.lineTo(cx - w*0.35, cy - h*0.18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + w*0.15, cy - h*0.15); ctx.lineTo(cx + w*0.35, cy - h*0.18); ctx.stroke();

    // Headlight
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath(); ctx.ellipse(cx, cy - h*0.42, w*0.12, h*0.03, 0, 0, Math.PI*2); ctx.fill();
    // Light beam
    ctx.fillStyle = 'rgba(255,220,80,0.04)';
    ctx.beginPath();
    ctx.moveTo(cx - w*0.15, cy - h*0.42);
    ctx.lineTo(cx - w*0.4, cy - h*0.42 - 60);
    ctx.lineTo(cx + w*0.4, cy - h*0.42 - 60);
    ctx.lineTo(cx + w*0.15, cy - h*0.42);
    ctx.closePath(); ctx.fill();

    // Tail light
    ctx.fillStyle = '#ff3333';
    ctx.beginPath(); ctx.ellipse(cx, cy + h*0.27, w*0.1, h*0.02, 0, 0, Math.PI*2); ctx.fill();

    // Exhaust pipe
    ctx.fillStyle = '#888';
    ctx.fillRect(cx + w*0.2, cy + h*0.15, w*0.2, 3);
    ctx.fillStyle = '#666';
    ctx.beginPath(); ctx.ellipse(cx + w*0.4, cy + h*0.16, 4, 3, 0, 0, Math.PI*2); ctx.fill();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(cx - w*0.08, cy - h*0.22, w*0.16, h*0.35);
}

function drawObstacle(o) {
    var cx = o.x, cy = o.y, w = o.w, h = o.h;
    var x = cx - w/2, y = cy - h/2;

    if (o.type === 'bicycle') {
        // Wheels
        ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(cx, cy + h*0.3, w*0.35, h*0.12, 0, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(cx, cy - h*0.25, w*0.35, h*0.12, 0, 0, Math.PI*2); ctx.stroke();
        // Frame
        ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(cx, cy + h*0.3); ctx.lineTo(cx, cy - h*0.12);
        ctx.lineTo(cx + w*0.15, cy - h*0.25); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - h*0.12); ctx.lineTo(cx - w*0.1, cy + h*0.15); ctx.stroke();
        // Rider
        ctx.fillStyle = '#e67e22';
        ctx.beginPath(); ctx.ellipse(cx, cy - h*0.35, w*0.2, h*0.06, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#3498db';
        ctx.fillRect(cx - w*0.12, cy - h*0.28, w*0.24, h*0.15);
    }
    else if (o.type === 'scooter') {
        // Body
        ctx.fillStyle = '#2c3e50';
        roundRect(x + w*0.15, y + h*0.1, w*0.7, h*0.75, 5);
        // Wheels
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.ellipse(cx, cy + h*0.38, w*0.25, h*0.08, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx, cy - h*0.3, w*0.22, h*0.07, 0, 0, Math.PI*2); ctx.fill();
        // Seat
        ctx.fillStyle = '#8e44ad';
        roundRect(cx - w*0.2, cy - h*0.05, w*0.4, h*0.15, 3);
        // Handlebars
        ctx.fillStyle = '#555';
        ctx.fillRect(cx - w*0.35, cy - h*0.25, w*0.7, 3);
        // Rider
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.ellipse(cx, cy - h*0.35, w*0.2, h*0.07, 0, 0, Math.PI*2); ctx.fill();
    }
    else if (o.type === 'pothole') {
        // Pothole
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.ellipse(cx, cy, w*0.5, h*0.5, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.ellipse(cx, cy, w*0.35, h*0.35, 0, 0, Math.PI*2); ctx.fill();
        // Cracks
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
        for (var i = 0; i < 5; i++) {
            var a = Math.random() * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(a) * w*0.5, cy + Math.sin(a) * h*0.5);
            ctx.stroke();
        }
    }
    else if (o.type === 'escooter') {
        // Electric scooter / trottinette
        // Deck
        ctx.fillStyle = '#333';
        ctx.fillRect(cx - w*0.3, cy, w*0.6, h*0.08);
        // Handle post
        ctx.fillStyle = '#555';
        ctx.fillRect(cx - 2, cy - h*0.35, 4, h*0.4);
        // Handlebars
        ctx.fillStyle = '#444';
        ctx.fillRect(cx - w*0.3, cy - h*0.37, w*0.6, 3);
        // Wheels
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(cx, cy + h*0.35, w*0.25, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy - h*0.1, w*0.2, 0, Math.PI*2); ctx.fill();
        // LED
        ctx.fillStyle = '#00ff88';
        ctx.fillRect(cx - 1, cy - h*0.3, 2, h*0.05);
    }
    else if (o.type === 'pedestrian') {
        // Head
        ctx.fillStyle = '#f0c27a';
        ctx.beginPath(); ctx.arc(cx, cy - h*0.32, w*0.28, 0, Math.PI*2); ctx.fill();
        // Hair
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(cx, cy - h*0.38, w*0.28, Math.PI, Math.PI*2); ctx.fill();
        // Body
        var shirtColors = ['#e74c3c','#3498db','#27ae60','#f39c12','#9b59b6'];
        ctx.fillStyle = shirtColors[Math.floor((o.x * 3 + o.y * 7) % shirtColors.length)];
        roundRect(cx - w*0.3, cy - h*0.2, w*0.6, h*0.35, 3);
        // Legs
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(cx - w*0.2, cy + h*0.12, w*0.15, h*0.3);
        ctx.fillRect(cx + w*0.05, cy + h*0.12, w*0.15, h*0.3);
        // Feet
        ctx.fillStyle = '#111';
        ctx.fillRect(cx - w*0.25, cy + h*0.38, w*0.2, h*0.06);
        ctx.fillRect(cx + w*0.05, cy + h*0.38, w*0.2, h*0.06);
        // Walking animation
        if (frameCount % 20 < 10) {
            ctx.fillStyle = shirtColors[Math.floor((o.x * 3 + o.y * 7) % shirtColors.length)];
            ctx.fillRect(cx - w*0.4, cy - h*0.1, w*0.15, 4);
            ctx.fillRect(cx + w*0.25, cy - h*0.05, w*0.15, 4);
        }
    }
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath(); ctx.fill();
}

function gameOver() {
    running = false;
    cancelAnimationFrame(animId);
    Leaderboard.promptName(score, function(name) {
        if (name) Leaderboard.add('motodge', name, score);
        overlayTitle.textContent = 'Crash !';
        overlayMsg.textContent = 'Score : ' + score + ' — ' + dodged + ' obstacles évités';
        overlay.classList.add('visible');
    });
}

actionBtn.onclick = startGame;
actionBtn.addEventListener('touchstart', function(e) { e.preventDefault(); startGame(); }, { passive: false });

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft')  keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    if (e.key === 'ArrowUp')    keys.up = true;
    if (e.key === 'ArrowDown')  keys.down = true;
});
document.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowUp')    keys.up = false;
    if (e.key === 'ArrowDown')  keys.down = false;
});

function bindTap(id, key) {
    var btn = document.getElementById(id);
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); keys[key] = true; }, { passive: false });
    btn.addEventListener('touchend', function() { if (key !== 'left' && key !== 'right') keys[key] = false; });
    btn.addEventListener('touchcancel', function() { keys[key] = false; });
    btn.addEventListener('mousedown', function(e) { e.preventDefault(); keys[key] = true; });
    btn.addEventListener('mouseup', function() { if (key !== 'left' && key !== 'right') keys[key] = false; });
    btn.addEventListener('mouseleave', function() { keys[key] = false; });
}
bindTap('btn-left', 'left');
bindTap('btn-right', 'right');
bindTap('btn-up', 'up');
bindTap('btn-down', 'down');

window.addEventListener('resize', function() { resize(); calcLanes(); });
startGame();
</script>
</body>
</html>
