<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>TrouveMot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;}
body{background:#121213;display:flex;flex-direction:column;align-items:center;
     font-family:'Segoe UI',sans-serif;color:#fff;height:100vh;height:100dvh;overflow:hidden;user-select:none;padding-bottom:env(safe-area-inset-bottom,0px);}
#topbar{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;
        padding:8px 12px 4px;border-bottom:1px solid #333;flex-shrink:0;}
#home-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ccc;
          padding:5px 11px;border-radius:18px;font-size:12px;cursor:pointer;text-decoration:none;}
#topbar h1{font-size:20px;font-weight:800;letter-spacing:3px;}
#lang-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ccc;
          padding:5px 11px;border-radius:18px;font-size:12px;cursor:pointer;}

/* LANGUAGE SCREEN */
#lang-screen{position:fixed;inset:0;background:#121213;display:flex;flex-direction:column;
             align-items:center;justify-content:center;gap:24px;z-index:200;}
#lang-screen h2{font-size:28px;font-weight:800;letter-spacing:2px;}
#lang-screen p{color:#aaa;font-size:14px;}
.lang-choice{display:flex;gap:16px;}
.lang-btn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);
          border-radius:16px;padding:18px 32px;cursor:pointer;font-size:16px;font-weight:700;
          transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px;}
.lang-btn:hover{background:rgba(99,241,153,.15);border-color:#63f199;}
.lang-btn span{font-size:32px;}

/* GRID */
#grid-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 0;}
#grid{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;height:100%;max-height:340px;aspect-ratio:5/6;}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.tile{display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,26px);
      font-weight:800;border:2px solid #333;border-radius:4px;background:#121213;
      transition:border-color .1s;position:relative;overflow:hidden;}
.tile.filled{border-color:#555;animation:pop .1s ease;}
.tile.revealed{border:none;}
.tile .front,.tile .back{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  font-size:inherit;font-weight:inherit;border-radius:3px;
}
.tile .front{background:#121213;border:2px solid #555;}
.tile .back{transform:rotateX(180deg);}
.tile.flip{animation:flipTile .5s ease forwards;}
.tile.correct .back,.tile.correct .front{background:#538d4e;border-color:#538d4e;color:#fff;}
.tile.present .back,.tile.present .front{background:#b59f3b;border-color:#b59f3b;color:#fff;}
.tile.absent  .back,.tile.absent  .front{background:#3a3a3c;border-color:#3a3a3c;color:#fff;}

@keyframes flipTile{
  0%  {transform:rotateX(0);}
  49% {transform:rotateX(-90deg);}
  50% {transform:rotateX(90deg);}
  100%{transform:rotateX(0deg);}
}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.row.shake{animation:shake .4s ease;}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}60%{transform:translateY(-4px)}}
.tile.bounce{animation:bounce .6s ease;}

/* KEYBOARD */
#keyboard{width:100%;max-width:480px;padding:2px 4px 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));flex-shrink:0;}
.kb-row{display:flex;justify-content:center;gap:3px;margin-bottom:3px;}
.key{height:40px;min-width:0;flex:1;background:#818384;border:none;border-radius:6px;
     color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;
     display:flex;align-items:center;justify-content:center;padding:0 2px;}
.key.wide{flex:1.5;font-size:10px;}
.key.correct{background:#538d4e !important;}
.key.present{background:#b59f3b !important;}
.key.absent {background:#3a3a3c !important;}
.key:active{opacity:.7;}

/* TOAST */
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);
       background:#fff;color:#000;padding:10px 20px;border-radius:8px;
       font-weight:700;font-size:14px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;}
#toast.show{opacity:1;}

/* STATS */
#stats-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
               align-items:center;justify-content:center;z-index:100;}
#stats-overlay.show{display:flex;}
#stats-box{background:#1a1a1b;border:1px solid #333;border-radius:20px;padding:24px;
           width:90%;max-width:380px;text-align:center;}
#stats-box h2{font-size:16px;letter-spacing:2px;margin-bottom:16px;color:#aaa;}
.stats-row{display:flex;justify-content:center;gap:20px;margin-bottom:18px;}
.stat{text-align:center;}.stat .val{font-size:28px;font-weight:800;}.stat .lbl{font-size:11px;color:#aaa;}
.distrib{margin-bottom:16px;}
.dist-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13px;}
.dist-bar{height:20px;background:#538d4e;border-radius:3px;min-width:6px;
          display:flex;align-items:center;justify-content:flex-end;padding-right:6px;
          font-size:12px;font-weight:700;transition:width .5s;}
#stats-box button{background:#538d4e;color:#fff;border:none;border-radius:12px;
                  padding:10px 28px;font-size:14px;font-weight:700;cursor:pointer;margin:4px;}
#stats-box button.sec{background:#333;}</style>
</head>
<body>

<!-- Language selection -->
<div id="lang-screen">
  <h2>🟩 TROUVEMOT</h2>
  <p>Choisissez la langue des instructions :</p>
  <div class="lang-choice">
    <div class="lang-btn" onclick="setLang('fr')"><span>🇫🇷</span>Français</div>
    <div class="lang-btn" onclick="setLang('en')"><span>🇬🇧</span>English</div>
  </div>
  <a href="index.html" style="color:rgba(255,255,255,.4);font-size:12px;text-decoration:none;margin-top:8px;">← Accueil</a>
</div>

<div id="topbar">
  <a href="index.html" id="home-btn">← Accueil</a>
  <h1>TROUVEMOT</h1>
  <div style="display:flex;gap:5px;">

  </div>
</div>

<div id="grid-wrap">
  <div id="grid"></div>
</div>

<div id="keyboard">
  <div class="kb-row" id="kb-row-0"></div>
  <div class="kb-row" id="kb-row-1"></div>
  <div class="kb-row" id="kb-row-2"></div>
</div>

<div id="toast"></div>

<div id="stats-overlay">
  <div id="stats-box">
    <h2 id="stats-title">STATISTIQUES</h2>
    <div class="stats-row">
      <div class="stat"><div class="val" id="s-played">0</div><div class="lbl" id="s-played-lbl">Joués</div></div>
      <div class="stat"><div class="val" id="s-wins">0</div><div class="lbl" id="s-wins-lbl">Victoires</div></div>
      <div class="stat"><div class="val" id="s-streak">0</div><div class="lbl" id="s-streak-lbl">Série</div></div>
      <div class="stat"><div class="val" id="s-best">0</div><div class="lbl" id="s-best-lbl">Meilleure</div></div>
    </div>
    <div class="distrib" id="distrib"></div>
    <button onclick="newGame()">🔄 <span id="btn-new">Nouveau</span></button>
    <button class="sec" onclick="closeStats()">✕</button>
  </div>
</div>

// Normalise : supprime les accents, met en minuscule
function normalize(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

// Filtrer : uniquement les mots de exactement 5 lettres latines
const WORDS = [...new Set(
  WORDS_RAW.trim().split(/\s+/).filter(w=>{
    const n=normalize(w);
    return n.length===5 && /^[a-z]{5}$/.test(n);
  })
)];

// Index normalisé pour validation rapide
const WORDS_NORM = new Set(WORDS.map(normalize));



const LANG = {
  fr: {
    title:'TROUVEMOT', rule:'Trouvez le mot en 6 essais',
    notWord:'Mot non reconnu', win6:'Pas trop facile !',
    win:['Génial !','Excellent !','Bien joué !','Pas mal !','Ouf !','Sauvé !'],
    stats:'STATISTIQUES', played:'Joués', wins:'Victoires', streak:'Série', best:'Meilleure',
    newGame:'Nouveau mot', close:'Fermer', enterKey:'ENTRER', delKey:'⌫',
    rows:['AZERTYUIOP','QSDFGHJKLM','WXCVBN'],
  },
  en: {
    title:'TROUVEMOT', rule:'Find the 5-letter French word in 6 tries',
    notWord:'Unknown word', win6:'That was close!',
    win:['Genius!','Excellent!','Great!','Good!','Phew!','Lucky!'],
    stats:'STATISTICS', played:'Played', wins:'Wins', streak:'Streak', best:'Best',
    newGame:'New word', close:'Close', enterKey:'ENTER', delKey:'⌫',
    rows:['AZERTYUIOP','QSDFGHJKLM','WXCVBN'],
  }
};

let lang='fr', L=LANG.fr;
let secret='', guesses=[], current='', gameOver=false;
let stats={played:0,wins:0,streak:0,best:0,dist:[0,0,0,0,0,0]};

function setLang(l){
  lang=l; L=LANG[l];
  document.getElementById('lang-screen').style.display='none';
  loadStats(); newGame();
}
function openLangScreen(){
  document.getElementById('lang-screen').style.display='flex';
}

function loadStats(){
  try{ const s=JSON.parse(localStorage.getItem('trouvemot_stats')||'{}');
    if(s.played!==undefined) stats=s;
  }catch(e){}
}
function saveStats(){ localStorage.setItem('trouvemot_stats',JSON.stringify(stats)); }

function newGame(){
  closeStats();
  const word = WORDS[Math.floor(Math.random()*WORDS.length)];
  secret = normalize(word).toUpperCase(); // stored normalized, uppercase
  guesses=[]; current=''; gameOver=false;
  buildGrid(); buildKeyboard();
}

// ══ GRID ══
function buildGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  for(let r=0;r<6;r++){
    const row=document.createElement('div'); row.className='row'; row.id='row-'+r;
    for(let c=0;c<5;c++){
      const tile=document.createElement('div'); tile.className='tile'; tile.id=`t-${r}-${c}`;
      tile.innerHTML='<div class="front"></div><div class="back"></div>';
      row.appendChild(tile);
    }
    g.appendChild(row);
  }
}

function updateCurrentRow(){
  const row=guesses.length;
  for(let c=0;c<5;c++){
    const tile=document.getElementById(`t-${row}-${c}`);
    const front=tile.querySelector('.front');
    front.textContent = current[c]||'';
    tile.classList.toggle('filled', c<current.length);
  }
}

// ══ KEYBOARD ══
function buildKeyboard(){
  const rows=['AZERTYUIOP','QSDFGHJKLM','WXCVBN'];
  rows.forEach((row,ri)=>{
    const el=document.getElementById('kb-row-'+ri); el.innerHTML='';
    if(ri===2){
      const enter=document.createElement('button');
      enter.className='key wide'; enter.textContent=L.enterKey;
      enter.onclick=()=>submitGuess(); el.appendChild(enter);
    }
    [...row].forEach(ch=>{
      const btn=document.createElement('button');
      btn.className='key'; btn.textContent=ch; btn.id='key-'+ch;
      btn.onclick=()=>typeLetter(ch); el.appendChild(btn);
    });
    if(ri===2){
      const del=document.createElement('button');
      del.className='key wide'; del.textContent=L.delKey;
      del.onclick=()=>deleteLetter(); el.appendChild(del);
    }
  });
}

function typeLetter(ch){
  if(gameOver||current.length>=5) return;
  current+=ch; updateCurrentRow();
}
function deleteLetter(){
  if(gameOver||current.length===0) return;
  current=current.slice(0,-1); updateCurrentRow();
}

function submitGuess(){
  if(gameOver||current.length<5){ if(current.length<5) shakeRow(); return; }
  const normInput = normalize(current);
  if(!WORDS_NORM.has(normInput)){ toast(L.notWord); shakeRow(); return; }
  const row=guesses.length;
  const result=evaluate(current);
  guesses.push({word:current,result});
  revealRow(row,result,()=>{
    updateKeyboard(current,result);
    if(result.every(r=>r==='correct')){
      setTimeout(()=>{ bounceRow(row); toast(L.win[row]||L.win[5]); }, 300);
      gameOver=true; recordWin(row+1);
      setTimeout(showStats,2000);
    } else if(guesses.length===6){
      gameOver=true; recordLoss();
      setTimeout(()=>toast(secret,4000),500);
      setTimeout(showStats,3000);
    }
    current=''; updateCurrentRow();
  });
}

function evaluate(word){
  // Both word and secret are already normalized uppercase (no accents)
  const res=Array(5).fill('absent');
  const secArr=[...secret], wordArr=[...normalize(word).toUpperCase()];
  // Correct pass
  for(let i=0;i<5;i++) if(wordArr[i]===secArr[i]){ res[i]='correct'; secArr[i]=null; wordArr[i]=null; }
  // Present pass
  for(let i=0;i<5;i++){
    if(wordArr[i]===null) continue;
    const idx=secArr.indexOf(wordArr[i]);
    if(idx!==-1){ res[i]='present'; secArr[idx]=null; }
  }
  return res;
}

function revealRow(row,result,cb){
  for(let c=0;c<5;c++){
    const tile=document.getElementById(`t-${row}-${c}`);
    const back=tile.querySelector('.back');
    back.textContent=[...guesses[row].word][c];
    const delay=c*300;
    setTimeout(()=>{
      tile.classList.add('flip',result[c]);
      tile.classList.add('revealed');
    }, delay);
  }
  setTimeout(cb, 5*300+200);
}

function bounceRow(row){
  for(let c=0;c<5;c++){
    setTimeout(()=>{ const t=document.getElementById(`t-${row}-${c}`); t.classList.add('bounce'); setTimeout(()=>t.classList.remove('bounce'),700); }, c*80);
  }
}

function shakeRow(){
  const row=document.getElementById('row-'+guesses.length);
  row.classList.add('shake'); setTimeout(()=>row.classList.remove('shake'),500);
}

function updateKeyboard(word,result){
  const priority={correct:3,present:2,absent:1};
  for(let i=0;i<5;i++){
    const ch=word[i], btn=document.getElementById('key-'+ch);
    if(!btn) continue;
    const cur=btn.classList.contains('correct')?3:btn.classList.contains('present')?2:btn.classList.contains('absent')?1:0;
    if((priority[result[i]]||0)>cur){
      btn.classList.remove('correct','present','absent');
      btn.classList.add(result[i]);
    }
  }
}

let toastT=null;
function toast(msg,dur=1800){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),dur);
}

// ══ STATS ══
function recordWin(tries){
  stats.played++; stats.wins++; stats.streak++; stats.best=Math.max(stats.best,stats.streak);
  if(tries>=1&&tries<=6) stats.dist[tries-1]++;
  saveStats();
}
function recordLoss(){
  stats.played++; stats.streak=0; saveStats();
}

function showStats(){
  document.getElementById('s-played').textContent=stats.played;
  document.getElementById('s-wins').textContent=stats.wins;
  document.getElementById('s-streak').textContent=stats.streak;
  document.getElementById('s-best').textContent=stats.best;
  document.getElementById('stats-title').textContent=L.stats;
  document.getElementById('s-played-lbl').textContent=L.played;
  document.getElementById('s-wins-lbl').textContent=L.wins;
  document.getElementById('s-streak-lbl').textContent=L.streak;
  document.getElementById('s-best-lbl').textContent=L.best;
  document.getElementById('btn-new').textContent=L.newGame;
  const max=Math.max(1,...stats.dist);
  const d=document.getElementById('distrib'); d.innerHTML='';
  stats.dist.forEach((v,i)=>{
    const w=Math.round(v/max*180);
    d.innerHTML+=`<div class="dist-row"><span style="width:12px;text-align:right">${i+1}</span>
      <div class="dist-bar" style="width:${Math.max(6,w)}px">${v}</div></div>`;
  });
  document.getElementById('stats-overlay').classList.add('show');
}
function closeStats(){ document.getElementById('stats-overlay').classList.remove('show'); }

// ══ KEYBOARD INPUT ══
document.addEventListener('keydown',e=>{
  if(e.key==='Enter') submitGuess();
  else if(e.key==='Backspace') deleteLetter();
  else if(/^[a-zA-ZÀ-ÿ]$/.test(e.key)) typeLetter(e.key.toUpperCase());
});
</script>
