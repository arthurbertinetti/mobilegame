<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>F1 Top-Down</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#1a5c1a;width:100%;height:100%;height:100dvh;overflow:hidden;font-family:'Segoe UI',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;height:100dvh;touch-action:none}
#home-btn{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:12px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:5px 12px;color:#fff;font-size:13px;text-decoration:none;z-index:60}
#ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);color:#fff;text-align:center;padding:20px;overflow-y:auto}
#ov h1{font-size:2.4rem;letter-spacing:3px;color:#e10600;text-shadow:0 0 30px #e10600,0 2px 0 #900;margin-bottom:8px;font-style:italic}
#ov p{color:#aaa;font-size:.88rem;line-height:1.6;margin-bottom:4px}
#ov button.play{margin-top:18px;padding:14px 48px;font-size:1.15rem;font-weight:bold;background:linear-gradient(180deg,#e10600 0%,#b00500 100%);color:#fff;border:none;border-radius:14px;cursor:pointer;box-shadow:0 4px 20px rgba(225,6,0,.5);text-transform:uppercase;letter-spacing:2px}
#ov .diff-row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;justify-content:center}
#ov .diff-btn{padding:8px 20px;border-radius:20px;font-size:.88rem;cursor:pointer;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#aaa;transition:all .2s}
#ov .diff-btn.on{background:rgba(225,6,0,.18);border-color:#e10600;color:#e10600}
#ov.hidden{display:none}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<a id="home-btn" href="index.html">&#8592; Accueil</a>
<div id="ov">
  <h1>F1 TOP-DOWN</h1>
  <p style="color:#e10600;letter-spacing:3px;font-size:.75rem;text-transform:uppercase">Grand Prix Racing</p>
  <p>Evite les voitures, depasse pour marquer !</p>
  <p>Glisse gauche/droite pour diriger.</p>
  <p style="color:#e10600;font-weight:bold;margin-top:8px">&#127942; Record : <span id="rec">0</span></p>
  <div class="diff-row">
    <div class="diff-btn on" data-d="0">Facile</div>
    <div class="diff-btn" data-d="1">Normal</div>
    <div class="diff-btn" data-d="2">Difficile</div>
  </div>
  <button class="play" onclick="startGame()">START</button>
</div>
<script>
(function(){
var canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
var W,H,DPR;

function resize(){
  DPR=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  initRoad();
  if(player){
    player.y=H*0.78;
    player.w=laneW*0.48;player.h=laneW*1.15;
    player.x=clamp(player.x);player.tx=clamp(player.tx);
  }
}

/* ── helpers ── */
function clamp(v){
  if(v!==v)v=W/2; /* NaN check */
  return Math.max(roadL+24,Math.min(roadR-24,v));
}
function rgb(r,g,b){return 'rgb('+r+','+g+','+b+')';}
function hexRGB(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function lighter(hex,n){var c=hexRGB(hex);return rgb(Math.min(255,c[0]+n),Math.min(255,c[1]+n),Math.min(255,c[2]+n));}
function darker(hex,n){var c=hexRGB(hex);return rgb(Math.max(0,c[0]-n),Math.max(0,c[1]-n),Math.max(0,c[2]-n));}

/* ── state ── */
var diff=0,state='idle',score=0,hiScore=parseInt(localStorage.getItem('f1top_best')||'0');
document.getElementById('rec').textContent=hiScore;
var player=null,traffic=[],sparks=[];
var speed=0,dist=0,frame=0,kmh=0;
var laneCount=4,laneW=0,roadL=0,roadR=0,roadW=0;
var touchId=null,touchStartX=0,playerStartX=0;
var keys={};

document.querySelectorAll('.diff-btn').forEach(function(b){
  b.onclick=function(){document.querySelectorAll('.diff-btn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');diff=+b.dataset.d;};
});

function initRoad(){
  roadW=Math.min(W*0.74,400);
  roadL=(W-roadW)/2;roadR=roadL+roadW;
  laneW=roadW/laneCount;
}

/* ── F1 team palettes ── */
var TEAMS=[
  {b:'#0600ef',a:'#ffcc00'},{b:'#ff8700',a:'#0055ff'},
  {b:'#006f62',a:'#cedc00'},{b:'#0090ff',a:'#ff5588'},
  {b:'#00d2be',a:'#222222'},{b:'#b6babd',a:'#ff0000'},
  {b:'#900000',a:'#ffffff'},{b:'#2b4562',a:'#ffffff'},
];

window.startGame=function(){
  initRoad();score=0;dist=0;frame=0;kmh=0;
  speed=3+diff*0.8;
  player={x:W/2,tx:W/2,y:H*0.78,w:laneW*0.48,h:laneW*1.15,boost:0};
  traffic=[];sparks=[];state='playing';
  document.getElementById('ov').classList.add('hidden');
};

function spawnCar(){
  var lane=Math.floor(Math.random()*laneCount);
  for(var i=0;i<traffic.length;i++){if(traffic[i].lane===lane&&traffic[i].y<laneW*2.5)return;}
  var tm=TEAMS[Math.floor(Math.random()*TEAMS.length)];
  traffic.push({lane:lane,x:roadL+laneW*(lane+.5),y:-laneW*1.3,
    w:laneW*0.44,h:laneW*1.1,body:tm.b,acc:tm.a,
    spd:speed*(.4+Math.random()*.35),passed:false});
}

/* ── update ── */
function update(dt){
  if(state!=='playing')return;
  frame++;
  speed+=.0006*dt*(1+diff*.4);
  dist+=speed*dt;score=Math.floor(dist/10);
  kmh+=(speed*22-kmh)*.05*dt;
  player.boost=Math.min(1,(speed-3)/12);

  /* spawn */
  var rate=Math.max(8,50-speed*2-diff*6);
  if(frame%Math.max(1,Math.round(rate))===0)spawnCar();

  /* movement */
  player.x+=(player.tx-player.x)*.18*dt;
  var spk=W*.015*dt;
  if(keys.ArrowLeft||keys.a)player.tx-=spk*2.5;
  if(keys.ArrowRight||keys.d)player.tx+=spk*2.5;
  player.tx=clamp(player.tx);player.x=clamp(player.x);

  /* traffic */
  for(var i=traffic.length-1;i>=0;i--){
    var t=traffic[i];t.y+=(speed-t.spd)*dt;
    if(!t.passed&&t.y>player.y+player.h*.5){
      t.passed=true;score+=Math.floor(10+speed*2);
      for(var p=0;p<6;p++){var an=Math.random()*6.28;
        sparks.push({x:t.x,y:t.y,vx:Math.cos(an)*2,vy:-2-Math.random()*3,l:1,d:.04,r:2+Math.random()*2,c:'#ffd700'});}
    }
    if(Math.abs(t.x-player.x)<(t.w+player.w)*.38&&Math.abs(t.y-player.y)<(t.h+player.h)*.38){die();return;}
    if(t.y>H+150)traffic.splice(i,1);
  }
  /* sparks */
  for(var j=sparks.length-1;j>=0;j--){
    var s=sparks[j];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=s.d*dt;s.r*=.98;
    if(s.l<=0)sparks.splice(j,1);
  }
}

function die(){
  state='dead';
  if(score>hiScore){hiScore=score;localStorage.setItem('f1top_best',''+hiScore);}
  for(var i=0;i<30;i++){var a=Math.random()*6.28,sp=2+Math.random()*7;
    sparks.push({x:player.x,y:player.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,d:.015,r:3+Math.random()*5,c:['#ff4444','#ffaa00','#fff'][i%3]});}
  setTimeout(showEnd,1100);
}
function showEnd(){
  var ov=document.getElementById('ov');
  ov.innerHTML='<h1>F1 TOP-DOWN</h1>'+
    '<p style="font-size:1.3rem;color:#e10600;font-weight:bold;margin:6px 0">CRASH !</p>'+
    '<p style="font-size:1.4rem;margin:6px 0">Score : <strong style="color:#e10600">'+score+'</strong></p>'+
    '<p style="color:#aaa;font-size:.85rem">Vitesse max : '+Math.floor(kmh)+' km/h</p>'+
    (score>=hiScore?'<p style="color:#ffd700;font-weight:bold">Nouveau record !</p>':'<p style="color:#888">Record : '+hiScore+'</p>')+
    '<div class="diff-row"><div class="diff-btn'+(diff===0?' on':'')+'" data-d="0">Facile</div><div class="diff-btn'+(diff===1?' on':'')+'" data-d="1">Normal</div><div class="diff-btn'+(diff===2?' on':'')+'" data-d="2">Difficile</div></div>'+
    '<button class="play" onclick="startGame()">RESTART</button>';
  ov.classList.remove('hidden');
  ov.querySelectorAll('.diff-btn').forEach(function(b){b.onclick=function(){ov.querySelectorAll('.diff-btn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');diff=+b.dataset.d;};});
}

/* ── draw ── */
function draw(){
  ctx.globalAlpha=1;
  ctx.fillStyle='#1a5c1a';ctx.fillRect(0,0,W,H);

  /* grass stripes */
  var gOff=(dist*2.5)%50;
  ctx.fillStyle='rgba(0,50,0,.18)';
  for(var g=-1;g<H/25+2;g++){
    ctx.fillRect(0,g*25+gOff,roadL-8,12);
    ctx.fillRect(roadR+8,g*25+gOff+12,W-roadR-8,12);
  }

  /* gravel */
  ctx.fillStyle='#c4a666';
  ctx.fillRect(roadL-8,0,8,H);ctx.fillRect(roadR,0,8,H);

  /* road */
  ctx.fillStyle='#3a3a3a';ctx.fillRect(roadL,0,roadW,H);

  /* curbs */
  var cseg=laneW*.5,coff=(dist*3)%cseg;
  for(var c=0;c<H/cseg+2;c++){
    var cy=c*cseg+coff-cseg;
    ctx.fillStyle=c%2?'#fff':'#e10600';
    ctx.fillRect(roadL-7,cy,7,cseg);ctx.fillRect(roadR,cy,7,cseg);
  }

  /* lane dashes */
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;
  ctx.setLineDash([laneW*.55,laneW*.45]);
  ctx.lineDashOffset=-(dist*3)%laneW;
  for(var l=1;l<laneCount;l++){var lx=roadL+l*laneW;ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,H);ctx.stroke();}
  ctx.setLineDash([]);

  /* start/finish */
  var sfY=((3000-(dist%3000))/speed)*3;
  if(sfY>-10&&sfY<H+10){
    var sq=laneW/4;
    for(var sx=0;sx<roadW/sq;sx++)for(var sy2=0;sy2<2;sy2++){
      ctx.fillStyle=(sx+sy2)%2?'#222':'#fff';ctx.fillRect(roadL+sx*sq,sfY+sy2*sq,sq,sq);}
  }

  /* traffic */
  for(var i=0;i<traffic.length;i++) drawF1(traffic[i].x,traffic[i].y,traffic[i].w,traffic[i].h,traffic[i].body,traffic[i].acc,false);

  /* player – ALWAYS draw if player exists */
  if(player&&state!=='idle'){
    /* exhaust glow */
    if(player.boost>.3){
      ctx.globalAlpha=player.boost*.5;
      ctx.fillStyle='#ff6600';
      ctx.beginPath();ctx.arc(player.x-player.w*.12,player.y+player.h*.52,3+Math.random()*3,0,6.28);ctx.fill();
      ctx.beginPath();ctx.arc(player.x+player.w*.12,player.y+player.h*.52,3+Math.random()*3,0,6.28);ctx.fill();
      ctx.globalAlpha=1;
    }
    drawF1(player.x,player.y,player.w,player.h,'#e10600','#fff',true);
  }

  /* sparks */
  for(var j=0;j<sparks.length;j++){
    var sp=sparks[j];ctx.globalAlpha=Math.max(0,sp.l);
    ctx.fillStyle=sp.c;ctx.beginPath();ctx.arc(sp.x,sp.y,Math.max(.5,sp.r),0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;

  /* speed lines */
  if(state==='playing'&&player.boost>.4){
    ctx.globalAlpha=player.boost*.1;ctx.strokeStyle='#fff';ctx.lineWidth=1;
    for(var sl=0;sl<6;sl++){var slx=roadL+Math.random()*roadW,sly=Math.random()*H;
      ctx.beginPath();ctx.moveTo(slx,sly);ctx.lineTo(slx,sly+20+player.boost*35);ctx.stroke();}
    ctx.globalAlpha=1;
  }

  /* HUD */
  var hudH=Math.max(46,H*.065);
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,hudH);
  ctx.fillStyle='#e10600';ctx.fillRect(0,hudH-2,W,2);
  var fs=Math.round(hudH*.4);
  ctx.textBaseline='middle';
  ctx.textAlign='left';ctx.font='bold '+fs+'px monospace';ctx.fillStyle='#fff';
  ctx.fillText(''+score,60,hudH/2);
  ctx.textAlign='center';ctx.font=Math.round(fs*.55)+'px monospace';
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillText('HI '+hiScore,W/2,hudH/2);
  ctx.textAlign='right';ctx.font='bold '+fs+'px monospace';ctx.fillStyle='#e10600';
  ctx.fillText(Math.floor(kmh)+'',W-48,hudH/2);
  ctx.font=Math.round(fs*.45)+'px sans-serif';ctx.fillStyle='#888';ctx.fillText('km/h',W-8,hudH/2);
  ctx.textAlign='left';ctx.font=Math.round(fs*.42)+'px sans-serif';ctx.fillStyle='#aaa';
  ctx.fillText('LAP '+(Math.floor(dist/3000)+1),10,hudH/2-fs*.22);
  ctx.font='bold '+Math.round(fs*.48)+'px sans-serif';ctx.fillStyle='#e10600';ctx.fillText('P1',10,hudH/2+fs*.25);
}

/* ── draw F1 car (NO gradients - solid colors only for reliability) ── */
function drawF1(x,y,w,h,col,acc,isP){
  var dk=darker(col,40),lt=lighter(col,40);

  /* shadow */
  ctx.fillStyle='rgba(0,0,0,.25)';
  fillBody(x+3,y+3,w,h);

  /* rear wing */
  ctx.fillStyle=acc;ctx.fillRect(x-w*.46,y+h*.36,w*.92,h*.05);
  ctx.fillStyle=dk;ctx.fillRect(x-w*.4,y+h*.32,w*.04,h*.1);ctx.fillRect(x+w*.36,y+h*.32,w*.04,h*.1);

  /* wheels */
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(x-w*.54,y+h*.1,w*.14,h*.24);ctx.fillRect(x+w*.4,y+h*.1,w*.14,h*.24);
  ctx.fillRect(x-w*.5,y-h*.34,w*.12,h*.2);ctx.fillRect(x+w*.38,y-h*.34,w*.12,h*.2);
  /* tire treads */
  ctx.fillStyle='#333';
  ctx.fillRect(x-w*.52,y+h*.17,w*.1,h*.03);ctx.fillRect(x+w*.42,y+h*.17,w*.1,h*.03);
  ctx.fillRect(x-w*.52,y+h*.27,w*.1,h*.03);ctx.fillRect(x+w*.42,y+h*.27,w*.1,h*.03);

  /* body */
  ctx.fillStyle=col;fillBody(x,y,w,h);

  /* body left highlight */
  ctx.fillStyle=lt;
  ctx.fillRect(x-w*.3,y-h*.35,w*.18,h*.65);

  /* cockpit */
  ctx.fillStyle='#333';
  ctx.beginPath();
  ctx.moveTo(x,y-h*.2);ctx.lineTo(x+w*.14,y-h*.06);
  ctx.lineTo(x+w*.12,y+h*.1);ctx.lineTo(x-w*.12,y+h*.1);
  ctx.lineTo(x-w*.14,y-h*.06);ctx.closePath();ctx.fill();

  /* halo */
  ctx.strokeStyle='#666';ctx.lineWidth=Math.max(1.5,w*.035);
  ctx.beginPath();ctx.moveTo(x-w*.1,y+h*.08);ctx.quadraticCurveTo(x,y-h*.17,x+w*.1,y+h*.08);ctx.stroke();

  /* helmet */
  ctx.fillStyle=isP?'#fff':acc;
  ctx.beginPath();ctx.arc(x,y-h*.02,w*.1,0,6.28);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x-w*.08,y-h*.04,w*.16,w*.05);

  /* front wing */
  ctx.fillStyle=acc;ctx.fillRect(x-w*.44,y-h*.43,w*.88,h*.04);
  ctx.fillStyle=col;ctx.fillRect(x-w*.46,y-h*.45,w*.06,h*.08);ctx.fillRect(x+w*.4,y-h*.45,w*.06,h*.08);

  /* nose stripe */
  ctx.fillStyle=acc;ctx.fillRect(x-w*.04,y-h*.46,w*.08,h*.24);

  /* air intakes */
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.fillRect(x-w*.34,y-h*.1,w*.07,h*.07);ctx.fillRect(x+w*.27,y-h*.1,w*.07,h*.07);

  /* number */
  if(isP){ctx.fillStyle='#fff';ctx.font='bold '+Math.round(w*.2)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('1',x,y+h*.22);}

  /* rear light */
  ctx.fillStyle='#ff2222';ctx.fillRect(x-w*.12,y+h*.4,w*.24,h*.025);
  /* rear light glow */
  ctx.fillStyle='rgba(255,0,0,.15)';ctx.beginPath();ctx.arc(x,y+h*.44,w*.2,0,6.28);ctx.fill();
}

function fillBody(x,y,w,h){
  ctx.beginPath();
  ctx.moveTo(x,y-h*.48);
  ctx.lineTo(x+w*.16,y-h*.38);ctx.lineTo(x+w*.22,y-h*.18);
  ctx.lineTo(x+w*.38,y-h*.06);ctx.lineTo(x+w*.38,y+h*.3);
  ctx.lineTo(x+w*.15,y+h*.42);ctx.lineTo(x-w*.15,y+h*.42);
  ctx.lineTo(x-w*.38,y+h*.3);ctx.lineTo(x-w*.38,y-h*.06);
  ctx.lineTo(x-w*.22,y-h*.18);ctx.lineTo(x-w*.16,y-h*.38);
  ctx.closePath();ctx.fill();
}

/* ── input: absolute touch position mapped to road ── */
document.addEventListener('touchstart',function(e){
  if(state!=='playing'||!player)return;
  var t=e.changedTouches[0];
  touchId=t.identifier;touchStartX=t.clientX;playerStartX=player.tx;
  e.preventDefault();
},{passive:false});

document.addEventListener('touchmove',function(e){
  if(touchId===null||!player)return;
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===touchId){
      player.tx=playerStartX+(e.changedTouches[i].clientX-touchStartX);
      player.tx=clamp(player.tx);
    }
  }
  e.preventDefault();
},{passive:false});

document.addEventListener('touchend',function(e){
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===touchId) touchId=null;
  }
},{passive:false});
document.addEventListener('touchcancel',function(){touchId=null;},{passive:false});

document.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key.indexOf('Arrow')===0)e.preventDefault();});
document.addEventListener('keyup',function(e){keys[e.key]=false;});

/* ── loop ── */
resize();window.addEventListener('resize',resize);
var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=Math.min((ts-last)/16.667,3);last=ts;
  update(dt);draw();
}
requestAnimationFrame(function(ts){last=ts;loop(ts);});
})();
</script>
</body>
</html>
