<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Croissant Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;height:100dvh;overflow:hidden;font-family:'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none}
#top-bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#0a1628;color:#fff;z-index:10;flex-shrink:0}
.top-btn{width:36px;height:36px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;font-size:1.2rem;display:flex;align-items:center;justify-content:center;text-decoration:none}
#hud{font-size:.85rem;display:flex;gap:14px}
canvas{flex:1;width:100%;display:block;touch-action:none}
#action-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 16px;flex-shrink:0;gap:10px}
.act-btn{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.3);color:#fff;font-size:1.6rem;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.act-btn span{font-size:.6rem;margin-top:2px}
#btn-jump{background:radial-gradient(circle,#27ae60,#1e8449);box-shadow:0 4px 12px rgba(39,174,96,.4)}
#btn-jump:active{transform:scale(.9)}
#btn-dash{background:radial-gradient(circle,#2196F3,#1565C0);box-shadow:0 4px 12px rgba(33,150,243,.4)}
#btn-dash:active{transform:scale(.9)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:20px}
#overlay.hidden{display:none}
#overlay h2{font-size:2rem;color:#ffd93d;margin-bottom:8px}
#overlay p{color:#ddd;margin-bottom:16px;font-size:.95rem;line-height:1.5}
#overlay button{padding:14px 40px;font-size:1.2rem;background:#2196F3;border:none;border-radius:12px;color:#fff;font-weight:bold;cursor:pointer;margin:4px}
</style>
</head>
<body>
<div id="top-bar">
  <a href="index.html" class="top-btn">🏠</a>
  <div id="hud">
    <span>💎 <b id="rings">0</b></span>
    <span>📏 <b id="dist">0</b>m</span>
    <span>❤️ <b id="lives">3</b></span>
  </div>
</div>
<canvas id="c"></canvas>
<div id="action-bar">
  <button class="act-btn" id="btn-jump">⬆️<span>SAUT</span></button>
  <button class="act-btn" id="btn-dash">💨<span>DASH</span></button>
</div>
<div id="overlay">
  <h2>🦔 Croissant Runner</h2>
  <p>Cours, saute et dash à travers les zones !<br>
  ⬆️ Swipe haut = Saut · ➡️ Tap = Dash<br>
  Collecte les anneaux, évite les piques !</p>
  <button id="btn-start">▶️ Jouer</button>
</div>
<script src="leaderboard.js"></script>
<script>
var C=document.getElementById('c'),X=C.getContext('2d');
var W,H,dpr;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;
  var topH=document.getElementById('top-bar').offsetHeight;
  var actH=document.getElementById('action-bar').offsetHeight;
  H=window.innerHeight-topH-actH-4;
  C.width=W*dpr;C.height=H*dpr;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(dpr,0,0,dpr,0,0)}
resize();window.addEventListener('resize',resize);

var GROUND_H,CROISSANT_W,CROISSANT_H,GRAVITY,JUMP_VEL,DASH_SPEED,BASE_SPEED;
function initSizes(){
  GROUND_H=H*0.18;CROISSANT_W=36;CROISSANT_H=42;GRAVITY=0.65;JUMP_VEL=-14;
  DASH_SPEED=12;BASE_SPEED=5;
}

var state='menu',score=0,rings=0,lives=3,dist=0,speed=0;
var croissant={x:0,y:0,vy:0,grounded:true,dashing:false,dashTimer:0,spinning:false,spinAngle:0,invincible:0,frame:0};
var platforms=[],obstacles=[],ringItems=[],springs=[],particles=[];
var camX=0,spawnX=0,groundY=0;
var bgStars=[];for(var i=0;i<100;i++)bgStars.push({x:Math.random()*2000,y:Math.random()*500,s:Math.random()*2+1,b:Math.random()});

function reset(){
  score=0;rings=0;lives=3;dist=0;speed=BASE_SPEED;
  initSizes();groundY=H-GROUND_H;
  croissant={x:80,y:groundY-CROISSANT_H,vy:0,grounded:true,dashing:false,dashTimer:0,spinning:false,spinAngle:0,invincible:0,frame:0};
  platforms=[];obstacles=[];ringItems=[];springs=[];particles=[];camX=0;spawnX=W+200;
  // Initial ground platforms
  for(var i=0;i<8;i++)spawnContent();
  updateHUD();
}

function spawnContent(){
  var px=spawnX,py=groundY;
  // Platform sometimes elevated
  if(Math.random()<0.35){
    var ph=Math.random()*80+40;py=groundY-ph;
    platforms.push({x:px,y:py,w:Math.random()*120+80,h:16});
  }
  // Obstacles
  if(Math.random()<0.4){
    var oy=groundY-30;
    var kind=Math.random();
    if(kind<0.5)obstacles.push({x:px+Math.random()*60,y:oy,w:20,h:30,type:'spike'});
    else obstacles.push({x:px+Math.random()*60,y:oy-10,w:28,h:28,type:'enemy'});
  }
  // Rings
  var rc=Math.floor(Math.random()*5)+1;
  for(var r=0;r<rc;r++){
    ringItems.push({x:px+r*28+Math.random()*20,y:groundY-60-Math.random()*80,collected:false});
  }
  // Springs
  if(Math.random()<0.15){
    springs.push({x:px+40,y:groundY-20,w:20,h:20,bounced:false});
  }
  spawnX+=Math.random()*200+180;
}

function jump(){
  if(croissant.grounded){croissant.vy=JUMP_VEL;croissant.grounded=false;croissant.spinning=true;croissant.spinAngle=0}
  else if(croissant.spinning){/* double jump */croissant.vy=JUMP_VEL*0.8;croissant.spinning=false}
}
function dash(){
  if(!croissant.dashing){croissant.dashing=true;croissant.dashTimer=15;croissant.spinning=true;croissant.spinAngle=0;
    for(var i=0;i<8;i++)particles.push({x:croissant.x,y:croissant.y+CROISSANT_H/2,vx:-Math.random()*4-2,vy:(Math.random()-0.5)*3,life:20,color:'#2196F3'})}
}

function hitCroissant(){
  if(croissant.invincible>0)return;
  if(rings>0){
    // Lose rings
    var lost=Math.min(rings,20);
    for(var i=0;i<lost;i++){
      particles.push({x:croissant.x+CROISSANT_W/2,y:croissant.y,vx:(Math.random()-0.5)*8,vy:-Math.random()*10-3,life:40,color:'#ffd93d',ring:true});
    }
    rings=0;croissant.invincible=90;
  }else{
    lives--;croissant.invincible=90;
    if(lives<=0)gameOver();
  }
  updateHUD();
}

function gameOver(){
  state='over';score=dist+rings*10;
  var name=Leaderboard.promptName();
  if(name)Leaderboard.add('croissant',score,name);
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('overlay').querySelector('h2').textContent='💀 Game Over';
  document.getElementById('overlay').querySelector('p').innerHTML='Distance: '+dist+'m<br>Anneaux: '+rings+'<br>Score: <b>'+score+'</b>';
  document.getElementById('overlay').querySelector('button').textContent='🔄 Rejouer';
}

// ===== INPUT =====
// Action buttons
document.getElementById('btn-jump').addEventListener('touchstart',function(e){e.preventDefault();if(state==='play')jump()},{passive:false});
document.getElementById('btn-dash').addEventListener('touchstart',function(e){e.preventDefault();if(state==='play')dash()},{passive:false});
// Canvas tap also jumps
C.addEventListener('touchstart',function(e){e.preventDefault();if(state==='play')jump()},{passive:false});
document.addEventListener('keydown',function(e){
  if(state!=='play')return;
  if(e.key==='ArrowUp'||e.key===' ')jump();
  if(e.key==='ArrowRight'||e.key==='d')dash();
});

// ===== UPDATE =====
function update(){
  if(state!=='play')return;
  speed=BASE_SPEED+dist*0.002;if(speed>16)speed=16;
  
  // Croissant physics
  if(croissant.dashing){croissant.dashTimer--;if(croissant.dashTimer<=0)croissant.dashing=false}
  var moveSpeed=croissant.dashing?speed+DASH_SPEED:speed;
  camX+=moveSpeed;dist=Math.floor(camX/10);
  
  croissant.vy+=GRAVITY;croissant.y+=croissant.vy;
  
  // Ground collision
  if(croissant.y>=groundY-CROISSANT_H){croissant.y=groundY-CROISSANT_H;croissant.vy=0;croissant.grounded=true;croissant.spinning=false}
  
  // Platform collision
  platforms.forEach(function(p){
    if(croissant.vy>0&&croissant.x+CROISSANT_W>p.x-camX&&croissant.x<p.x-camX+p.w&&
       croissant.y+CROISSANT_H>=p.y&&croissant.y+CROISSANT_H<=p.y+16+croissant.vy){
      croissant.y=p.y-CROISSANT_H;croissant.vy=0;croissant.grounded=true;croissant.spinning=false;
    }
  });
  
  // Springs
  springs.forEach(function(s){
    var sx=s.x-camX;
    if(!s.bounced&&croissant.x+CROISSANT_W>sx&&croissant.x<sx+s.w&&croissant.y+CROISSANT_H>=s.y&&croissant.y+CROISSANT_H<=s.y+20){
      croissant.vy=JUMP_VEL*1.5;croissant.grounded=false;croissant.spinning=true;s.bounced=true;
      setTimeout(function(){s.bounced=false},500);
    }
  });
  
  // Ring collection
  ringItems.forEach(function(r){
    if(r.collected)return;
    var rx=r.x-camX;
    if(Math.abs(croissant.x+CROISSANT_W/2-rx)<22&&Math.abs(croissant.y+CROISSANT_H/2-r.y)<22){
      r.collected=true;rings++;
      particles.push({x:rx,y:r.y,vx:0,vy:-2,life:15,color:'#ffd93d'});
    }
  });
  
  // Obstacle collision
  if(croissant.invincible<=0){
    obstacles.forEach(function(o){
      var ox=o.x-camX;
      if(croissant.x+CROISSANT_W-6>ox&&croissant.x+6<ox+o.w&&croissant.y+CROISSANT_H-4>o.y&&croissant.y+4<o.y+o.h){
        if((croissant.spinning||croissant.dashing)&&o.type==='enemy'){
          o.type='dead';
          for(var i=0;i<10;i++)particles.push({x:ox+o.w/2,y:o.y,vx:(Math.random()-0.5)*6,vy:-Math.random()*6,life:25,color:'#e74c3c'});
          score+=50;
        }else if(croissant.dashing&&o.type==='spike'){
          o.type='dead';
          for(var i=0;i<6;i++)particles.push({x:ox+o.w/2,y:o.y+o.h/2,vx:(Math.random()-0.5)*5,vy:-Math.random()*5,life:20,color:'#ccc'});
          score+=30;
        }else if(o.type!=='dead'){hitCroissant()}
      }
    });
  }
  if(croissant.invincible>0)croissant.invincible--;
  
  // Spawn new stuff
  while(spawnX-camX<W+400)spawnContent();
  
  // Clean up old stuff
  platforms=platforms.filter(function(p){return p.x-camX>-200});
  obstacles=obstacles.filter(function(o){return o.x-camX>-100});
  ringItems=ringItems.filter(function(r){return r.x-camX>-100&&!r.collected});
  springs=springs.filter(function(s){return s.x-camX>-100});
  
  // Particles
  particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;if(p.ring)p.vy+=0.3});
  particles=particles.filter(function(p){return p.life>0});
  
  croissant.frame++;
  updateHUD();
}

// ===== DRAW =====
function draw(){
  // Sky gradient
  var grad=X.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a1628');grad.addColorStop(0.6,'#1a3a6a');grad.addColorStop(1,'#2d6b3f');
  X.fillStyle=grad;X.fillRect(0,0,W,H);
  
  // Parallax stars
  bgStars.forEach(function(s){
    var sx=(s.x-camX*0.1)%W;if(sx<0)sx+=W;
    X.globalAlpha=0.4+s.b*0.5;X.fillStyle='#fff';X.fillRect(sx,s.y*H/500,s.s,s.s);
  });
  X.globalAlpha=1;
  
  // Ground
  X.fillStyle='#2d6b3f';X.fillRect(0,groundY,W,GROUND_H);
  X.fillStyle='#3a8a4f';X.fillRect(0,groundY,W,4);
  // Ground pattern
  for(var gx=-(camX*0.5)%40;gx<W;gx+=40){
    X.fillStyle='#246638';X.fillRect(gx,groundY+8,20,3);
  }
  
  // Platforms
  X.fillStyle='#8B4513';
  platforms.forEach(function(p){
    var px=p.x-camX;X.fillRect(px,p.y,p.w,p.h);
    X.fillStyle='#A0522D';X.fillRect(px,p.y,p.w,4);X.fillStyle='#8B4513';
  });
  
  // Springs
  springs.forEach(function(s){
    var sx=s.x-camX;
    X.fillStyle='#ff0';X.fillRect(sx,s.y,s.w,s.h);
    X.fillStyle='#f90';X.fillRect(sx+4,s.y+2,s.w-8,s.h-4);
  });
  
  // Rings
  ringItems.forEach(function(r){
    if(r.collected)return;
    var rx=r.x-camX;
    X.beginPath();X.arc(rx,r.y,9,0,Math.PI*2);X.fillStyle='#ffd93d';X.fill();
    X.beginPath();X.arc(rx,r.y,5,0,Math.PI*2);X.fillStyle='#f0c000';X.fill();
  });
  
  // Obstacles
  obstacles.forEach(function(o){
    var ox=o.x-camX;
    if(o.type==='spike'){
      X.fillStyle='#ccc';X.beginPath();X.moveTo(ox,o.y+o.h);X.lineTo(ox+o.w/2,o.y);X.lineTo(ox+o.w,o.y+o.h);X.fill();
    }else if(o.type==='enemy'){
      X.fillStyle='#e74c3c';X.fillRect(ox,o.y,o.w,o.h);
      X.fillStyle='#fff';X.fillRect(ox+5,o.y+6,6,6);X.fillRect(ox+17,o.y+6,6,6);
      X.fillStyle='#000';X.fillRect(ox+7,o.y+8,3,3);X.fillRect(ox+19,o.y+8,3,3);
    }
  });
  
  // Croissant
  if(croissant.invincible<=0||croissant.frame%4<2){
    var sx=croissant.x,sy=croissant.y;
    X.save();
    if(croissant.spinning){
      X.translate(sx+CROISSANT_W/2,sy+CROISSANT_H/2);
      croissant.spinAngle+=0.4;X.rotate(croissant.spinAngle);
      X.translate(-CROISSANT_W/2,-CROISSANT_H/2);
      // Spin ball
      X.fillStyle='#2196F3';X.beginPath();X.arc(CROISSANT_W/2,CROISSANT_H/2,CROISSANT_W/2,0,Math.PI*2);X.fill();
      X.fillStyle='#64B5F6';X.beginPath();X.arc(CROISSANT_W/2-4,CROISSANT_H/2-4,8,0,Math.PI*2);X.fill();
    }else{
      X.translate(sx,sy);
      // Body
      X.fillStyle='#2196F3';
      X.fillRect(8,10,20,24);
      // Head
      X.beginPath();X.arc(18,10,12,0,Math.PI*2);X.fill();
      // Spikes
      X.fillStyle='#1565C0';
      X.beginPath();X.moveTo(6,8);X.lineTo(-6,2);X.lineTo(10,14);X.fill();
      X.beginPath();X.moveTo(8,4);X.lineTo(-4,-6);X.lineTo(14,8);X.fill();
      X.beginPath();X.moveTo(12,0);X.lineTo(4,-10);X.lineTo(18,4);X.fill();
      // Eye
      X.fillStyle='#fff';X.beginPath();X.ellipse(22,7,5,6,0,0,Math.PI*2);X.fill();
      X.fillStyle='#000';X.beginPath();X.arc(24,7,2.5,0,Math.PI*2);X.fill();
      // Belly
      X.fillStyle='#FDD835';X.fillRect(12,18,12,10);
      // Shoes
      X.fillStyle='#e74c3c';
      var legOff=croissant.grounded?Math.sin(croissant.frame*0.3)*4:0;
      X.fillRect(8,34+legOff,12,8);X.fillRect(18,34-legOff,12,8);
    }
    X.restore();
    
    // Dash trail
    if(croissant.dashing){
      X.globalAlpha=0.3;X.fillStyle='#2196F3';
      for(var t=1;t<=3;t++){X.beginPath();X.arc(sx+CROISSANT_W/2-t*12,sy+CROISSANT_H/2,CROISSANT_W/2-t*3,0,Math.PI*2);X.fill()}
      X.globalAlpha=1;
    }
  }
  
  // Particles
  particles.forEach(function(p){
    X.globalAlpha=p.life/30;
    if(p.ring){X.fillStyle='#ffd93d';X.beginPath();X.arc(p.x,p.y,5,0,Math.PI*2);X.fill()}
    else{X.fillStyle=p.color;X.fillRect(p.x-2,p.y-2,4,4)}
  });
  X.globalAlpha=1;
}

function updateHUD(){
  document.getElementById('rings').textContent=rings;
  document.getElementById('dist').textContent=dist;
  document.getElementById('lives').textContent=lives;
}

function loop(){
  update();draw();requestAnimationFrame(loop);
}

document.getElementById('btn-start').addEventListener('click',function(){
  document.getElementById('overlay').classList.add('hidden');
  if(state==='over'||state==='menu'){reset();state='play'}
});
loop();
</script>
</body>
</html>
