<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="ge_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ge_jar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8e8f8"/>
      <stop offset="30%" stop-color="#f5fbff"/>
      <stop offset="70%" stop-color="#e0f0fa"/>
      <stop offset="100%" stop-color="#a8d0e8"/>
    </linearGradient>
    <linearGradient id="ge_jelly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c040"/>
      <stop offset="60%" stop-color="#d0a030"/>
      <stop offset="100%" stop-color="#906010"/>
    </linearGradient>
    <linearGradient id="ge_lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c050"/>
      <stop offset="100%" stop-color="#a07010"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="10" ry="2.5" fill="url(#ge_shadow)"/>
  <!-- Jar body - slightly wobble shape using path -->
  <path d="M8.5 13 Q7.5 14 7.5 20 Q7.8 27 16 28 Q24.2 27 24.5 20 Q24.5 14 23.5 13 Z" fill="url(#ge_jar)" stroke="#90b8d0" stroke-width="0.8"/>
  <!-- Jelly fill - translucent amber -->
  <path d="M9.5 17 Q9 22 9.5 26.5 Q12 28 16 28 Q20 28 22.5 26.5 Q23 22 22.5 17 Z" fill="url(#ge_jelly)" opacity="0.82"/>
  <!-- Jelly wobble highlight (light reflections) -->
  <ellipse cx="13" cy="20" rx="2" ry="3.5" fill="white" opacity="0.18" transform="rotate(-8,13,20)"/>
  <ellipse cx="12" cy="19" rx="0.8" ry="2" fill="white" opacity="0.28" transform="rotate(-5,12,19)"/>
  <!-- Jar shine -->
  <rect x="10" y="14" width="2" height="9" rx="1" fill="white" opacity="0.4"/>
  <!-- Neck ring -->
  <rect x="9" y="12" width="14" height="2" rx="1" fill="#b0cfe0" stroke="#90b0c8" stroke-width="0.5"/>
  <!-- Lid -->
  <rect x="9" y="8" width="14" height="5" rx="2" fill="url(#ge_lid)" stroke="#806000" stroke-width="0.6"/>
  <!-- Lid shine -->
  <rect x="11" y="9" width="3" height="2" rx="1" fill="white" opacity="0.3"/>
</svg>
