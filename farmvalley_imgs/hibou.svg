<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="ow_body" cx="48%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#c09848"/>
      <stop offset="50%" stop-color="#8a6020"/>
      <stop offset="100%" stop-color="#503808"/>
    </radialGradient>
    <radialGradient id="ow_disc" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f2ecd8"/>
      <stop offset="65%" stop-color="#d8c898"/>
      <stop offset="100%" stop-color="#b09060"/>
    </radialGradient>
    <radialGradient id="ow_eye" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f8e030"/>
      <stop offset="55%" stop-color="#d8a800"/>
      <stop offset="100%" stop-color="#906000"/>
    </radialGradient>
    <radialGradient id="ow_wing" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#b08030"/>
      <stop offset="55%" stop-color="#7a5010"/>
      <stop offset="100%" stop-color="#402808"/>
    </radialGradient>
  </defs>
  <!-- Wings (folded, behind body, showing barred feathers) -->
  <path d="M6.5,23 Q5.5,16 7.5,11 Q9.5,10 11,12 Q10,17 10,25 Z" fill="url(#ow_wing)"/>
  <path d="M25.5,23 Q26.5,16 24.5,11 Q22.5,10 21,12 Q22,17 22,25 Z" fill="url(#ow_wing)"/>
  <!-- Wing feather edge detail -->
  <path d="M7.5,11 Q9,9.5 11,11" stroke="#2a1808" stroke-width="0.6" fill="none" opacity="0.55"/>
  <path d="M24.5,11 Q23,9.5 21,11" stroke="#2a1808" stroke-width="0.6" fill="none" opacity="0.55"/>
  <!-- Body -->
  <path d="M8.5,22 Q8.5,14 16,12.5 Q23.5,14 23.5,22 Q23.5,30.5 16,31.5 Q8.5,30.5 8.5,22 Z" fill="url(#ow_body)"/>
  <!-- Feather barring on body -->
  <path d="M9.5,20 Q16,18.5 22.5,20" stroke="#2a1808" stroke-width="0.5" fill="none" opacity="0.35"/>
  <path d="M9,23 Q16,21.5 23,23" stroke="#2a1808" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M9.5,26 Q16,24.5 22.5,26" stroke="#2a1808" stroke-width="0.5" fill="none" opacity="0.25"/>
  <!-- Facial disc (heart-shaped, pale) -->
  <path d="M9,15.5 Q9.5,10.5 16,10 Q22.5,10.5 23,15.5 Q23,22 19.5,24 Q16,25 12.5,24 Q9,22 9,15.5 Z" fill="url(#ow_disc)"/>
  <!-- Disc darker border -->
  <path d="M9.5,15.5 Q10,11 16,10.5 Q22,11 22.5,15.5" stroke="#7a5018" stroke-width="0.8" fill="none" opacity="0.65"/>
  <!-- Ear tufts (prominent) -->
  <path d="M11.5,10.5 Q11,7.5 12.5,6 Q13.8,7 13.3,10 Q12.5,10.8 11.5,10.5 Z" fill="#684808"/>
  <path d="M20.5,10.5 Q21,7.5 19.5,6 Q18.2,7 18.7,10 Q19.5,10.8 20.5,10.5 Z" fill="#684808"/>
  <!-- Left eye (large amber disc) -->
  <circle cx="12.5" cy="17" r="3.2" fill="url(#ow_eye)"/>
  <circle cx="12.5" cy="17" r="1.9" fill="#0a0604"/>
  <circle cx="11.7" cy="16.2" r="0.62" fill="#ffffff40"/>
  <!-- Right eye -->
  <circle cx="19.5" cy="17" r="3.2" fill="url(#ow_eye)"/>
  <circle cx="19.5" cy="17" r="1.9" fill="#0a0604"/>
  <circle cx="18.7" cy="16.2" r="0.62" fill="#ffffff40"/>
  <!-- Hooked beak (short, down-curved) -->
  <path d="M14.5,21.5 Q16,20.5 17.5,21.5 Q17,23.5 16,24 Q15,23.5 14.5,21.5 Z" fill="#c0a018"/>
  <path d="M14.8,22.5 Q16,22 17.2,22.5" stroke="#a07810" stroke-width="0.4" fill="none"/>
  <!-- Talons -->
  <path d="M13,30.5 L12,32" stroke="#b08010" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M12,32 L10.5,32.5 M12,32 L12.5,32.5 M12,32 L13.5,32.5" stroke="#b08010" stroke-width="0.7" fill="none" stroke-linecap="round"/>
  <path d="M19,30.5 L20,32" stroke="#b08010" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M20,32 L18.5,32.5 M20,32 L20.5,32.5 M20,32 L21.5,32.5" stroke="#b08010" stroke-width="0.7" fill="none" stroke-linecap="round"/>
</svg>
