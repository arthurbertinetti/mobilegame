<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadow_la" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottle_la" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a0c0e0"/>
      <stop offset="40%" stop-color="#d8eef8"/>
      <stop offset="100%" stop-color="#80a8d0"/>
    </linearGradient>
    <linearGradient id="pump_la" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="neck_la" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90b8d8"/>
      <stop offset="50%" stop-color="#c8e0f0"/>
      <stop offset="100%" stop-color="#70a0c0"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="6.5" ry="1.8" fill="url(#shadow_la)"/>
  <!-- Bottle body -->
  <rect x="10" y="16" width="12" height="13" rx="4" fill="url(#bottle_la)"/>
  <!-- Bottle bottom ellipse -->
  <ellipse cx="16" cy="29" rx="6" ry="1.5" fill="#80a0c8" opacity="0.5"/>
  <!-- Bottle neck -->
  <rect x="13" y="11" width="6" height="6" rx="1.5" fill="url(#neck_la)"/>
  <!-- Pump collar -->
  <rect x="12" y="9.5" width="8" height="2.5" rx="1.2" fill="url(#pump_la)"/>
  <!-- Pump stem -->
  <rect x="15" y="4" width="2" height="7" rx="1" fill="url(#pump_la)"/>
  <!-- Pump head -->
  <path d="M12 4 Q16 2 20 4 L19 6 Q16 4.5 13 6 Z" fill="url(#pump_la)"/>
  <!-- Pump nozzle -->
  <rect x="18.5" y="3.5" width="3.5" height="1.5" rx="0.7" fill="#d0d0d0"/>
  <!-- Shine on bottle -->
  <rect x="11.5" y="17" width="2.5" height="10" rx="1.2" fill="#fff" opacity="0.4"/>
  <!-- Label area -->
  <rect x="11" y="20" width="10" height="6" rx="1.5" fill="#fff" opacity="0.15"/>
  <!-- Subtle wave decoration -->
  <path d="M12 22.5 Q14 21.5 16 22.5 Q18 23.5 20 22.5" stroke="#a0c8e8" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M12 24.5 Q14 23.5 16 24.5 Q18 25.5 20 24.5" stroke="#a0c8e8" stroke-width="0.8" fill="none" opacity="0.5"/>
</svg>
