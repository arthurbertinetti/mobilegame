<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="cp_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cp_bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e0d8"/>
      <stop offset="100%" stop-color="#d0c8bc"/>
    </linearGradient>
    <linearGradient id="cp_compote" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#600090"/>
      <stop offset="100%" stop-color="#400060"/>
    </linearGradient>
    <linearGradient id="cp_plum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7020a0"/>
      <stop offset="100%" stop-color="#500070"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30.5" rx="10" ry="2" fill="url(#cp_shadow)"/>
  <!-- Bowl body -->
  <path d="M6 18 Q6 28 16 29 Q26 28 26 18 Z" fill="url(#cp_bowl)" stroke="#b0a898" stroke-width="0.8"/>
  <!-- Compote fill -->
  <path d="M7.5 18 Q7.5 26.5 16 27.5 Q24.5 26.5 24.5 18 Z" fill="url(#cp_compote)" opacity="0.92"/>
  <!-- Compote shine -->
  <ellipse cx="12" cy="20" rx="2.5" ry="1" fill="white" opacity="0.2" transform="rotate(-15,12,20)"/>
  <!-- Bowl rim -->
  <ellipse cx="16" cy="18" rx="10" ry="2.5" fill="url(#cp_bowl)" stroke="#b0a898" stroke-width="0.8"/>
  <!-- Compote surface highlight -->
  <ellipse cx="16" cy="18" rx="8.5" ry="1.8" fill="url(#cp_compote)" opacity="0.85"/>
  <!-- Plum half on top -->
  <ellipse cx="16" cy="17" rx="4.5" ry="3" fill="url(#cp_plum)"/>
  <ellipse cx="14.5" cy="16.5" rx="3.5" ry="2.2" fill="#8030b8" opacity="0.6"/>
  <!-- Plum pit -->
  <ellipse cx="16" cy="17.5" rx="1.2" ry="1.8" fill="#c0a060" stroke="#a08040" stroke-width="0.5"/>
  <!-- Plum highlight -->
  <ellipse cx="14" cy="15.8" rx="1" ry="0.6" fill="white" opacity="0.3" transform="rotate(-20,14,15.8)"/>
</svg>
