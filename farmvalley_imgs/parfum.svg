<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="pf_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pf_bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8c8e0"/>
      <stop offset="25%" stop-color="#d8eef8"/>
      <stop offset="55%" stop-color="#e8f4fc"/>
      <stop offset="80%" stop-color="#c8e0f0"/>
      <stop offset="100%" stop-color="#90b8d8"/>
    </linearGradient>
    <linearGradient id="pf_stopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e880"/>
      <stop offset="100%" stop-color="#c8a820"/>
    </linearGradient>
    <linearGradient id="pf_neck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0d0e8"/>
      <stop offset="50%" stop-color="#d8eef8"/>
      <stop offset="100%" stop-color="#90b8d8"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31" rx="7" ry="1.5" fill="url(#pf_shadow)"/>
  <!-- Bottle body - tall rectangle -->
  <rect x="10" y="16" width="12" height="14" rx="2" fill="url(#pf_bottle)" stroke="#80a8c8" stroke-width="0.7"/>
  <!-- Bottle shine left -->
  <rect x="11.5" y="17" width="2" height="11" rx="1" fill="white" opacity="0.45"/>
  <!-- Bottle shine right thin -->
  <rect x="20" y="17" width="1" height="11" rx="0.5" fill="white" opacity="0.2"/>
  <!-- Label on bottle -->
  <rect x="11.5" y="20" width="9" height="7" rx="1" fill="white" opacity="0.75"/>
  <!-- Label decoration lines -->
  <line x1="12.5" y1="22" x2="19.5" y2="22" stroke="#80a8c8" stroke-width="0.5"/>
  <line x1="13" y1="23.5" x2="19" y2="23.5" stroke="#80a8c8" stroke-width="0.4"/>
  <line x1="13.5" y1="25" x2="18.5" y2="25" stroke="#80a8c8" stroke-width="0.4"/>
  <!-- Neck -->
  <rect x="13" y="12" width="6" height="5" rx="1.5" fill="url(#pf_neck)" stroke="#80a8c8" stroke-width="0.6"/>
  <!-- Neck shine -->
  <rect x="13.8" y="12.5" width="1.2" height="3.5" rx="0.6" fill="white" opacity="0.4"/>
  <!-- Gold stopper cap -->
  <rect x="12" y="8" width="8" height="5" rx="2" fill="url(#pf_stopper)" stroke="#a08010" stroke-width="0.6"/>
  <!-- Stopper shine -->
  <rect x="13" y="9" width="2.5" height="2" rx="1" fill="white" opacity="0.4"/>
  <!-- Stopper nub -->
  <ellipse cx="16" cy="8" rx="2" ry="1" fill="url(#pf_stopper)" stroke="#a08010" stroke-width="0.5"/>
</svg>
