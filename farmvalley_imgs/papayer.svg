<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sol -->
  <rect x="4" y="28" width="24" height="4" rx="2" fill="#6b4f2c"/>
  <!-- Tronc haut et mince (caractéristique du papayer) -->
  <rect x="14" y="8" width="4" height="20" rx="2" fill="#a5d6a7"/>
  <!-- Cicatrices foliaires sur le tronc -->
  <line x1="14" y1="12" x2="18" y2="12" stroke="#80cbc4" stroke-width="0.6"/>
  <line x1="14" y1="15" x2="18" y2="15" stroke="#80cbc4" stroke-width="0.6"/>
  <line x1="14" y1="18" x2="18" y2="18" stroke="#80cbc4" stroke-width="0.6"/>
  <!-- Grandes feuilles palmées seulement au sommet -->
  <path d="M16 8 Q8 4 4 7 Q7 10 16 10Z" fill="#2e7d32"/>
  <path d="M16 8 Q24 4 28 7 Q25 10 16 10Z" fill="#388e3c"/>
  <path d="M16 8 Q10 2 7 4 Q10 7 16 9Z" fill="#33691e"/>
  <path d="M16 8 Q22 2 25 4 Q22 7 16 9Z" fill="#2e7d32"/>
  <path d="M16 8 Q14 1 14 3 Q15 5 16 8Z" fill="#43a047"/>
  <path d="M16 8 Q18 1 18 3 Q17 5 16 8Z" fill="#388e3c"/>
  <!-- Nervures des feuilles -->
  <line x1="16" y1="8" x2="6" y2="7" stroke="#1b5e20" stroke-width="0.6"/>
  <line x1="16" y1="8" x2="26" y2="7" stroke="#1b5e20" stroke-width="0.6"/>
  <!-- Papayes (juste sous les feuilles) -->
  <defs>
    <radialGradient id="papg" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </radialGradient>
  </defs>
  <ellipse cx="12" cy="13" rx="3.5" ry="5" fill="url(#papg)"/>
  <ellipse cx="20" cy="12" rx="3.5" ry="5" fill="url(#papg)"/>
  <ellipse cx="16" cy="15" rx="3" ry="4.5" fill="url(#papg)"/>
  <!-- Reflets papayes -->
  <ellipse cx="11" cy="11.5" rx="1.2" ry="2" fill="rgba(255,255,255,0.25)"/>
  <ellipse cx="19" cy="10.5" rx="1.2" ry="2" fill="rgba(255,255,255,0.25)"/>
</svg>
