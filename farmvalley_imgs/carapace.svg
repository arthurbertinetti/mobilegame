<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="crg" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
  </defs>
  <!-- Dôme de la carapace -->
  <ellipse cx="16" cy="16" rx="13" ry="11" fill="url(#crg)"/>
  <!-- Motif hexagonal de la carapace -->
  <ellipse cx="16" cy="14" rx="5" ry="4" fill="#1b5e20"/>
  <ellipse cx="8" cy="13" rx="3.5" ry="3" fill="#1b5e20"/>
  <ellipse cx="24" cy="13" rx="3.5" ry="3" fill="#1b5e20"/>
  <ellipse cx="12" cy="20" rx="3.5" ry="3" fill="#1b5e20"/>
  <ellipse cx="20" cy="20" rx="3.5" ry="3" fill="#1b5e20"/>
  <ellipse cx="16" cy="10" rx="3" ry="2.5" fill="#1b5e20"/>
  <!-- Bordure -->
  <ellipse cx="16" cy="16" rx="13" ry="11" fill="none" stroke="#1b5e20" stroke-width="1.2"/>
  <!-- Rainures entre les plaques -->
  <line x1="11" y1="11" x2="13" y2="17" stroke="#4caf50" stroke-width="0.7"/>
  <line x1="21" y1="11" x2="19" y2="17" stroke="#4caf50" stroke-width="0.7"/>
  <line x1="8" y1="16" x2="12" y2="20" stroke="#4caf50" stroke-width="0.7"/>
  <line x1="24" y1="16" x2="20" y2="20" stroke="#4caf50" stroke-width="0.7"/>
  <!-- Reflet -->
  <ellipse cx="11" cy="11" rx="3" ry="2" fill="rgba(255,255,255,0.2)" transform="rotate(-25 11 11)"/>
</svg>
