<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crustG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d4a060"/>
      <stop offset="100%" stop-color="#8a5018"/>
    </radialGradient>
    <radialGradient id="sauceG" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e84030"/>
      <stop offset="100%" stop-color="#a01808"/>
    </radialGradient>
    <radialGradient id="cheeseG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f8d848"/>
      <stop offset="100%" stop-color="#d0a010"/>
    </radialGradient>
    <radialGradient id="tomatoG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f04030"/>
      <stop offset="100%" stop-color="#b02010"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="13" ry="2.5" fill="url(#shadowG)"/>
  <!-- Crust ring -->
  <circle cx="16" cy="16" r="13" fill="url(#crustG)"/>
  <!-- Tomato sauce base -->
  <circle cx="16" cy="16" r="11" fill="url(#sauceG)"/>
  <!-- Cheese layer -->
  <circle cx="16" cy="16" r="9.5" fill="url(#cheeseG)" opacity="0.9"/>
  <!-- Cheese melt blobs -->
  <ellipse cx="13" cy="14" rx="3.5" ry="2.5" fill="#f8e060" opacity="0.7" transform="rotate(-20,13,14)"/>
  <ellipse cx="20" cy="15" rx="3" ry="2" fill="#f0d040" opacity="0.7" transform="rotate(15,20,15)"/>
  <ellipse cx="15" cy="20" rx="3.5" ry="2" fill="#f8e060" opacity="0.7" transform="rotate(-10,15,20)"/>
  <!-- Tomato slices -->
  <circle cx="12" cy="13" r="2.5" fill="url(#tomatoG)"/>
  <line x1="9.8" y1="13" x2="14.2" y2="13" stroke="#c83020" stroke-width="0.4" opacity="0.6"/>
  <line x1="12" y1="10.8" x2="12" y2="15.2" stroke="#c83020" stroke-width="0.4" opacity="0.6"/>
  <circle cx="20" cy="19" r="2.2" fill="url(#tomatoG)"/>
  <line x1="18" y1="19" x2="22" y2="19" stroke="#c83020" stroke-width="0.4" opacity="0.6"/>
  <line x1="20" y1="17" x2="20" y2="21" stroke="#c83020" stroke-width="0.4" opacity="0.6"/>
</svg>
