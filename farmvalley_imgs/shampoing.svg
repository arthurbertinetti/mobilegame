<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadow_sh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottle_sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1050b0"/>
      <stop offset="40%" stop-color="#3090f0"/>
      <stop offset="100%" stop-color="#0840a0"/>
    </linearGradient>
    <linearGradient id="cap_sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="neck_sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1060c0"/>
      <stop offset="50%" stop-color="#2878e0"/>
      <stop offset="100%" stop-color="#0848a8"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="7.5" ry="1.8" fill="url(#shadow_sh)"/>
  <!-- Bottle body -->
  <path d="M9 16 Q8.5 23 9 27 Q9 29.5 16 29.5 Q23 29.5 23 27 Q23.5 23 23 16 Z" fill="url(#bottle_sh)"/>
  <!-- Neck -->
  <rect x="13" y="10" width="6" height="7" rx="2" fill="url(#neck_sh)"/>
  <!-- Cap -->
  <rect x="12.5" y="7" width="7" height="4" rx="2" fill="url(#cap_sh)"/>
  <ellipse cx="16" cy="7" rx="3.5" ry="1" fill="#f0f0f0"/>
  <!-- Cap shine -->
  <ellipse cx="14.5" cy="6.5" rx="2" ry="0.7" fill="#fff" opacity="0.6"/>
  <!-- Label area -->
  <rect x="10.5" y="18" width="11" height="7" rx="2" fill="#fff" opacity="0.12"/>
  <!-- Bubble decorations -->
  <circle cx="13" cy="20" r="1.2" fill="#fff" opacity="0.25"/>
  <circle cx="17" cy="19" r="0.9" fill="#fff" opacity="0.2"/>
  <circle cx="20" cy="21" r="1.4" fill="#fff" opacity="0.2"/>
  <circle cx="15" cy="22.5" r="1" fill="#fff" opacity="0.18"/>
  <circle cx="11.5" cy="23" r="0.7" fill="#fff" opacity="0.2"/>
  <circle cx="19" cy="23.5" r="0.8" fill="#fff" opacity="0.18"/>
  <!-- Foam cluster at top of label -->
  <circle cx="13.5" cy="17.5" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="16" cy="17" r="1.8" fill="#fff" opacity="0.28"/>
  <circle cx="18.5" cy="17.5" r="1.4" fill="#fff" opacity="0.25"/>
  <!-- Bottle shine -->
  <path d="M10.5 17 Q10 23 10.5 27" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.35"/>
</svg>
