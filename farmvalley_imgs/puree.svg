<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bowlG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ece4d8"/>
      <stop offset="100%" stop-color="#b8b0a4"/>
    </radialGradient>
    <radialGradient id="pureeG" cx="40%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#f0e8d0"/>
      <stop offset="100%" stop-color="#d4c8a0"/>
    </radialGradient>
    <radialGradient id="butterG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffec60"/>
      <stop offset="100%" stop-color="#e0a820"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="12" ry="2.5" fill="url(#shadowG)"/>
  <!-- Bowl outer -->
  <ellipse cx="16" cy="20" rx="13" ry="9" fill="url(#bowlG)" stroke="#a8a098" stroke-width="0.6"/>
  <!-- Puree mound -->
  <ellipse cx="16" cy="17" rx="10" ry="7" fill="url(#pureeG)"/>
  <!-- Swirl texture on puree -->
  <path d="M12 17 Q14 14 16 16 Q18 18 20 15" fill="none" stroke="#c8bc90" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  <path d="M13 19 Q15 17 17 18 Q19 19 21 17" fill="none" stroke="#c8bc90" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
  <!-- Butter pat melting -->
  <rect x="14" y="13" width="5" height="3" rx="1" fill="url(#butterG)" opacity="0.9"/>
  <!-- Melting butter drip -->
  <path d="M14.5 16 Q13 18 14 19" fill="none" stroke="#f0c030" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M18 16 Q19.5 17.5 19 19" fill="none" stroke="#f0c030" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
</svg>
