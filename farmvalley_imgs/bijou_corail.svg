<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="coral_grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f08040"/>
      <stop offset="100%" stop-color="#c04010"/>
    </radialGradient>
    <linearGradient id="clasp_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#c09020"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Gold clasp at top -->
  <rect x="14" y="5" width="4" height="3" rx="1" fill="url(#clasp_gold)"/>
  <circle cx="16" cy="5" r="1.2" fill="#f0d060" stroke="#c09020" stroke-width="0.5"/>
  <!-- Chain -->
  <line x1="16" y1="8" x2="16" y2="11" stroke="#c09020" stroke-width="1"/>
  <!-- Coral branch pendant -->
  <path d="M16 11 L16 22" stroke="url(#coral_grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Left branch -->
  <path d="M16 14 L12 11" stroke="#e06020" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M12 11 L10 8" stroke="#e07030" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M12 11 L13 8" stroke="#d05020" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Right branch -->
  <path d="M16 17 L20 14" stroke="#e06020" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M20 14 L22 11" stroke="#e07030" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M20 14 L19 11" stroke="#d05020" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Branch tips (polyps) -->
  <circle cx="10" cy="8" r="1.2" fill="#f09050"/>
  <circle cx="13" cy="8" r="1.2" fill="#e07040"/>
  <circle cx="22" cy="11" r="1.2" fill="#f09050"/>
  <circle cx="19" cy="11" r="1.2" fill="#e07040"/>
  <circle cx="16" cy="22" r="1.5" fill="#e06030"/>
</svg>
