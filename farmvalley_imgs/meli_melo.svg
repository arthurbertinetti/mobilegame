  <rect x="12" y="16" width="5.5" height="1.2" rx="0.6" fill="#38a028" transform="rotate(10,14.75,16.6)"/>
  <rect x="10" y="20" width="5" height="1.2" rx="0.6" fill="#40b030" transform="rotate(-5,12.5,20.6)"/>
  <!-- Red pepper pieces -->
  <path d="M19 13 Q21 12 22 14 Q21 15 19 14 Z" fill="#e83020"/>
  <path d="M20 18 Q22 17 23 19 Q22 20 20 19 Z" fill="#d02018"/>
  <!-- Yellow corn kernels -->
  <ellipse cx="15" cy="19" rx="1.2" ry="0.9" fill="#f0c020"/>
