  <ellipse cx="16" cy="20.5" rx="1.2" ry="0.9" fill="#f0c020"/>
  <!-- Orange carrot pieces -->
  <ellipse cx="13" cy="22" rx="2" ry="1.2" fill="#f07020" stroke="#c85010" stroke-width="0.3"/>
  <ellipse cx="19" cy="22" rx="2" ry="1.2" fill="#e86818" stroke="#c85010" stroke-width="0.3"/>
