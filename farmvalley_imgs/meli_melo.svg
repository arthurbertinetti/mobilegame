      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bowlG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0e8e0"/>
      <stop offset="100%" stop-color="#c0b8b0"/>
