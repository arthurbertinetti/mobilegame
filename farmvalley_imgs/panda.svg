<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pd_body" cx="42%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f5f2ee"/>
      <stop offset="65%" stop-color="#e0dcd6"/>
      <stop offset="100%" stop-color="#c0bcb4"/>
    </radialGradient>
    <radialGradient id="pd_head" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f8f5f0"/>
      <stop offset="70%" stop-color="#e8e4dc"/>
      <stop offset="100%" stop-color="#c8c4b8"/>
    </radialGradient>
    <radialGradient id="pd_patch" cx="45%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#3a3530"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
    <radialGradient id="pd_eye" cx="38%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#4a4540"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
  </defs>
  <!-- Black shoulders/arms -->
  <ellipse cx="9" cy="22.5" rx="5" ry="6" fill="url(#pd_patch)"/>
  <ellipse cx="23" cy="22.5" rx="5" ry="6" fill="url(#pd_patch)"/>
  <!-- Body (white) -->
  <path d="M9,23 Q9,18 16,17.5 Q23,18 23,23 Q23,29 16,30.5 Q9,29 9,23 Z" fill="url(#pd_body)"/>
  <!-- Belly fur texture -->
  <ellipse cx="16" cy="24" rx="5.5" ry="5" fill="#f8f5f0" opacity="0.5"/>
  <!-- Black legs -->
  <path d="M10,28 L9,32" stroke="#2a2520" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M22,28 L23,32" stroke="#2a2520" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Paws -->
  <ellipse cx="9" cy="32" rx="1.8" ry="1" fill="#1a1510"/>
  <ellipse cx="23" cy="32" rx="1.8" ry="1" fill="#1a1510"/>
  <!-- Head -->
  <ellipse cx="16" cy="12.5" rx="8.5" ry="7.5" fill="url(#pd_head)"/>
  <!-- Black ears -->
  <ellipse cx="9.5" cy="6.5" rx="3.5" ry="3.5" fill="url(#pd_patch)"/>
  <ellipse cx="22.5" cy="6.5" rx="3.5" ry="3.5" fill="url(#pd_patch)"/>
  <!-- Muzzle (pale) -->
  <ellipse cx="16" cy="16" rx="4.5" ry="3.2" fill="#e8e4d8"/>
  <!-- Nose -->
  <ellipse cx="16" cy="14.5" rx="1.2" ry="0.9" fill="#3a3530"/>
  <!-- Mouth -->
  <path d="M14,16.5 Q16,17.8 18,16.5" stroke="#a89880" stroke-width="0.6" fill="none"/>
  <path d="M16,14.8 L16,16.5" stroke="#a89880" stroke-width="0.4" fill="none"/>
  <!-- Black eye patches (distinctive panda) -->
  <ellipse cx="11.5" cy="11.5" rx="3.5" ry="3" fill="url(#pd_eye)" transform="rotate(-15 11.5 11.5)"/>
  <ellipse cx="20.5" cy="11.5" rx="3.5" ry="3" fill="url(#pd_eye)" transform="rotate(15 20.5 11.5)"/>
  <!-- Eyes (within patches) -->
  <circle cx="11.5" cy="11.5" r="1.5" fill="#0a0806"/>
  <circle cx="20.5" cy="11.5" r="1.5" fill="#0a0806"/>
  <!-- Eye highlights -->
  <circle cx="11" cy="10.8" r="0.55" fill="#ffffff60"/>
  <circle cx="20" cy="10.8" r="0.55" fill="#ffffff60"/>
  <!-- Small highlight shine -->
  <circle cx="12.3" cy="11.2" r="0.25" fill="#ffffff45"/>
  <circle cx="21.3" cy="11.2" r="0.25" fill="#ffffff45"/>
</svg>