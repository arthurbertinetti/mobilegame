<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="fc_dome" cx="38%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#f8f0c0"/>
      <stop offset="50%" stop-color="#f0e0a0"/>
      <stop offset="100%" stop-color="#d4b060"/>
    </radialGradient>
    <radialGradient id="fc_caramel" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d09030"/>
      <stop offset="100%" stop-color="#8a5010"/>
    </radialGradient>
    <linearGradient id="fc_sauce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c08020"/>
      <stop offset="100%" stop-color="#8a5010"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="12" ry="0.8" fill="#00000028"/>
  <!-- Plate -->
  <ellipse cx="16" cy="28" rx="13" ry="2.5" fill="#e8dcc8"/>
  <ellipse cx="16" cy="27.5" rx="13" ry="2.5" fill="#f0e8d8"/>
  <!-- Caramel sauce pool -->
  <ellipse cx="16" cy="27" rx="11" ry="2" fill="url(#fc_sauce)"/>
  <!-- Caramel drips on sides -->
  <path d="M9,24 Q8,26 9.5,27" stroke="#c08020" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M23,24 Q24,26 22.5,27" stroke="#c08020" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M16,22 Q15.5,25 16,27" stroke="#c08020" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Flan dome body -->
  <path d="M8,26 Q7,20 10,15 Q13,11 16,11 Q19,11 22,15 Q25,20 24,26 Q20,27.5 16,27.5 Q12,27.5 8,26 Z" fill="url(#fc_dome)"/>
  <!-- Caramel top glaze -->
  <path d="M10,17 Q13,12 16,12 Q19,12 22,17 Q19,15 16,15 Q13,15 10,17 Z" fill="url(#fc_caramel)" opacity="0.85"/>
  <!-- Highlight on dome -->
  <ellipse cx="13" cy="16" rx="3" ry="2" fill="rgba(255,255,240,0.5)" transform="rotate(-15,13,16)"/>
  <ellipse cx="15" cy="14" rx="1.5" ry="1" fill="rgba(255,255,255,0.4)"/>
</svg>
