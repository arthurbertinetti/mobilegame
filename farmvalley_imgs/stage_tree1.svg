  <!-- Small branch right -->
  <line x1="16.5" y1="24" x2="21" y2="20" stroke="#6d3c18" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left leaf cluster -->
  <ellipse cx="10" cy="19.5" rx="4" ry="3" fill="#40a028"/>
  <ellipse cx="10" cy="19" rx="3.2" ry="2.4" fill="#58c038"/>
