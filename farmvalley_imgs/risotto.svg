<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plateG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </radialGradient>
    <radialGradient id="riceG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff8d8"/>
      <stop offset="100%" stop-color="#d8c880"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="12" ry="2.5" fill="url(#shadowG)"/>
  <!-- Shallow plate -->
  <circle cx="16" cy="17" r="13" fill="url(#plateG)" stroke="#c8c8c8" stroke-width="0.5"/>
  <!-- Risotto mound -->
  <ellipse cx="16" cy="17" rx="10" ry="7" fill="url(#riceG)"/>
  <!-- Rice grain texture -->
  <ellipse cx="12" cy="15" rx="1" ry="0.5" fill="#e8d890" transform="rotate(20,12,15)"/>
  <ellipse cx="15" cy="14" rx="1" ry="0.5" fill="#e0d088" transform="rotate(-10,15,14)"/>
  <ellipse cx="18" cy="14.5" rx="1" ry="0.5" fill="#e8d890" transform="rotate(15,18,14.5)"/>
  <ellipse cx="13" cy="17" rx="1" ry="0.5" fill="#dcc880" transform="rotate(-25,13,17)"/>
  <ellipse cx="17" cy="17.5" rx="1" ry="0.5" fill="#e0d088" transform="rotate(30,17,17.5)"/>
  <ellipse cx="20" cy="16" rx="1" ry="0.5" fill="#e8d890" transform="rotate(-15,20,16)"/>
  <ellipse cx="14" cy="19" rx="1" ry="0.5" fill="#dcc880" transform="rotate(10,14,19)"/>
  <ellipse cx="19" cy="19" rx="1" ry="0.5" fill="#e0d088" transform="rotate(-20,19,19)"/>
  <!-- Parmesan shavings -->
  <ellipse cx="15" cy="13" rx="2.5" ry="0.8" fill="white" opacity="0.85" transform="rotate(15,15,13)"/>
  <ellipse cx="19" cy="12.5" rx="2" ry="0.7" fill="white" opacity="0.8" transform="rotate(-20,19,12.5)"/>
  <ellipse cx="12" cy="13.5" rx="1.8" ry="0.6" fill="white" opacity="0.75" transform="rotate(30,12,13.5)"/>
  <!-- Herb sprig -->
  <line x1="17" y1="12" x2="19" y2="10" stroke="#38803a" stroke-width="0.7" stroke-linecap="round"/>
  <ellipse cx="18" cy="11" rx="1" ry="0.5" fill="#40a040" transform="rotate(-40,18,11)"/>
  <ellipse cx="19.5" cy="10" rx="0.9" ry="0.5" fill="#38903a" transform="rotate(-50,19.5,10)"/>
</svg>
