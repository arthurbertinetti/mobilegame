<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="prng" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#9575cd"/>
      <stop offset="55%" stop-color="#512da8"/>
      <stop offset="100%" stop-color="#311b92"/>
    </radialGradient>
  </defs>
  <!-- Tige -->
  <line x1="16" y1="8" x2="17" y2="4" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Feuille -->
  <path d="M17 5 Q22 3 21 7 Q19 6 17 5Z" fill="#4caf50"/>
  <!-- Corps de la prune (ovale) -->
  <ellipse cx="16" cy="18" rx="9" ry="11" fill="url(#prng)"/>
  <!-- Sillon vertical caractéristique -->
  <path d="M16 8 Q15.5 13 15.5 18 Q15.5 23 16 27" fill="none" stroke="#4a148c" stroke-width="0.9" opacity="0.55"/>
  <!-- Creux du haut -->
  <path d="M14 9 Q16 7.5 18 9" fill="none" stroke="#4a148c" stroke-width="0.7"/>
  <!-- Reflet (légère teinte blueutée) -->
  <ellipse cx="11" cy="14" rx="2.5" ry="4" fill="rgba(255,255,255,0.2)" transform="rotate(-20 11 14)"/>
  <!-- Poudré (prune a un voile blanc naturel) -->
  <ellipse cx="16" cy="18" rx="9" ry="11" fill="rgba(255,255,255,0.07)"/>
</svg>
