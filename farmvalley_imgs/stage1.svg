<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sol -->
  <rect x="5" y="26" width="22" height="5" rx="2" fill="#6b4f2c"/>
  <ellipse cx="16" cy="26" rx="11" ry="2" fill="#7a5c38"/>
  <!-- Tige principale -->
  <line x1="16" y1="26" x2="16" y2="14" stroke="#558b2f" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Feuilles vraies (1ère paire) -->
  <ellipse cx="12" cy="21" rx="4.5" ry="2.5" fill="#66bb6a" transform="rotate(-25 12 21)"/>
  <ellipse cx="20" cy="21" rx="4.5" ry="2.5" fill="#4caf50" transform="rotate(25 20 21)"/>
  <!-- Feuille apex -->
  <ellipse cx="16" cy="14" rx="3.5" ry="2" fill="#81c784" transform="rotate(-5 16 14)"/>
  <!-- Nervure centrale -->
  <line x1="16" y1="14" x2="16" y2="18" stroke="#2e7d32" stroke-width="0.5"/>
</svg>
