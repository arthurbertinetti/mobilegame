<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadow_ba" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jar_ba" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0a898"/>
      <stop offset="40%" stop-color="#d8d0c0"/>
      <stop offset="100%" stop-color="#988878"/>
    </linearGradient>
    <radialGradient id="wax_ba" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f8e8c0"/>
      <stop offset="50%" stop-color="#e8c880"/>
      <stop offset="100%" stop-color="#c8a040"/>
    </radialGradient>
    <radialGradient id="glow_ba" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ffe080" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff9020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame_ba" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#fff8b0"/>
      <stop offset="40%" stop-color="#ffb030"/>
      <stop offset="100%" stop-color="#ff5010" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30.5" rx="8" ry="1.8" fill="url(#shadow_ba)"/>
  <!-- Glass jar body (short, wide) -->
  <ellipse cx="16" cy="28.5" rx="8" ry="2.2" fill="#888070" opacity="0.5"/>
  <rect x="8" y="19" width="16" height="9.5" rx="1.5" fill="url(#jar_ba)"/>
  <!-- Glass jar top rim -->
  <ellipse cx="16" cy="19" rx="8" ry="2.2" fill="#c8c0b0"/>
  <!-- Warm amber wax glow inside (seen through glass) -->
  <ellipse cx="16" cy="19.5" rx="6.5" ry="1.8" fill="url(#wax_ba)"/>
  <!-- Amber glow emanating upward -->
  <ellipse cx="16" cy="16" rx="5" ry="5.5" fill="url(#glow_ba)"/>
  <!-- Wick -->
  <line x1="16" y1="19" x2="16" y2="14.5" stroke="#504030" stroke-width="0.8"/>
  <!-- Flame -->
  <path d="M16 11 C14.5 12.5 13.8 14 14.8 15.5 C15.2 16.2 16.8 16.2 17.2 15.5 C18.2 14 17.5 12.5 16 11 Z" fill="url(#flame_ba)"/>
  <!-- Flame inner -->
  <path d="M16 12.5 C15.3 13.5 15.2 14.5 15.6 15.2 C15.8 15.7 16.2 15.7 16.4 15.2 C16.8 14.5 16.7 13.5 16 12.5 Z" fill="#fff8d0" opacity="0.85"/>
  <!-- Jar shine (glass effect) -->
  <rect x="9" y="19.5" width="2" height="7.5" rx="1" fill="#fff" opacity="0.25"/>
  <!-- Jar rim shine -->
  <ellipse cx="13" cy="18.3" rx="3" ry="0.9" fill="#fff" opacity="0.4"/>
</svg>
