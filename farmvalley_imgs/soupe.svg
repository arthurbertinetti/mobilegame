<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="so_bowl" cx="38%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e0d8cc"/>
      <stop offset="70%" stop-color="#c0b8ac"/>
      <stop offset="100%" stop-color="#a09888"/>
    </radialGradient>
    <radialGradient id="so_soup" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#e09040"/>
      <stop offset="55%" stop-color="#c06818"/>
      <stop offset="100%" stop-color="#904008"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="12" ry="0.7" fill="#00000018"/>
  <!-- Bowl -->
  <path d="M4,21 Q4,30 16,31 Q28,30 28,21 L27,19 Q16,18 5,19 Z" fill="url(#so_bowl)"/>
  <!-- Bowl rim -->
  <ellipse cx="16" cy="19" rx="12" ry="3.5" fill="#c8c0b4"/>
  <ellipse cx="16" cy="18.5" rx="11" ry="3" fill="#d8d0c4"/>
  <!-- Soup surface -->
  <ellipse cx="16" cy="18" rx="10" ry="2.5" fill="url(#so_soup)"/>
  <!-- Veggie bits in soup -->
  <ellipse cx="12" cy="17.5" rx="1.5" ry="0.9" fill="#609030" opacity="0.8"/>
  <ellipse cx="19" cy="17.2" rx="1.3" ry="0.8" fill="#e04020" opacity="0.75"/>
  <ellipse cx="16" cy="18.2" rx="1.2" ry="0.7" fill="#d08020" opacity="0.7"/>
  <ellipse cx="22" cy="17.5" rx="1" ry="0.6" fill="#709040" opacity="0.65"/>
  <!-- Steam wisps -->
  <path d="M11,16 Q10.5,13 11.5,10.5" stroke="rgba(255,255,255,.45)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M16,15.5 Q15.5,12.5 16.5,10" stroke="rgba(255,255,255,.4)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M21,16 Q21.5,13 20.5,10.5" stroke="rgba(255,255,255,.38)" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <!-- Shine on bowl -->
  <path d="M7,20 Q10,19 13,20" stroke="rgba(255,255,255,.3)" stroke-width="0.8" fill="none"/>
</svg>
