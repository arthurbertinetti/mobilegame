<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pastryG" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#e8c060"/>
      <stop offset="50%" stop-color="#c89040"/>
      <stop offset="100%" stop-color="#7a5010"/>
    </radialGradient>
    <linearGradient id="edgeG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a040"/>
      <stop offset="100%" stop-color="#8a6010"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="13" ry="2.5" fill="url(#shadowG)"/>
  <!-- Calzone half-moon body -->
  <path d="M4 18 Q4 6 16 5 Q28 6 28 18 Q24 26 16 27 Q8 26 4 18 Z" fill="url(#pastryG)"/>
  <!-- Golden sheen highlight -->
  <path d="M7 13 Q8 8 14 7 Q20 6 24 11" fill="none" stroke="#f0d870" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Baked darker patches -->
  <ellipse cx="11" cy="14" rx="3" ry="2" fill="#a06820" opacity="0.3" transform="rotate(-15,11,14)"/>
  <ellipse cx="21" cy="13" rx="2.5" ry="1.8" fill="#a06820" opacity="0.25" transform="rotate(10,21,13)"/>
  <ellipse cx="16" cy="20" rx="3" ry="1.5" fill="#906010" opacity="0.2"/>
  <!-- Sealed crimped edge marks along the bottom curve -->
  <path d="M7 22 Q16 27 25 22" fill="none" stroke="#8a6010" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Crimp marks -->
  <line x1="8" y1="24" x2="9.5" y2="22.5" stroke="#8a6010" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="11" y1="25.5" x2="12.5" y2="24" stroke="#8a6010" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="14" y1="26.5" x2="15.5" y2="25" stroke="#8a6010" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="17" y1="26.5" x2="18.5" y2="25" stroke="#8a6010" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="20" y1="25.5" x2="21.5" y2="24" stroke="#8a6010" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="23" y1="24" x2="24" y2="22.5" stroke="#8a6010" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Small steam hole on top -->
  <circle cx="16" cy="9" r="1.2" fill="#7a5010"/>
  <circle cx="16" cy="9" r="0.6" fill="#5a3808"/>
  <!-- Steam puff -->
  <path d="M16 8 Q15 6 16 5 Q17 4 16.5 3" fill="none" stroke="#c8c0b8" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  <path d="M15 7.5 Q13.5 6 14.5 4.5" fill="none" stroke="#c8c0b8" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
</svg>
