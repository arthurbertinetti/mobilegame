<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="dark_plate" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#504040"/>
      <stop offset="100%" stop-color="#201010"/>
    </radialGradient>
    <radialGradient id="steak_grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7a4020"/>
      <stop offset="60%" stop-color="#5a2810"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </radialGradient>
    <linearGradient id="sauce_drizzle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#803010"/>
      <stop offset="100%" stop-color="#a04020"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Dark ornate plate -->
  <ellipse cx="16" cy="23" rx="13" ry="7" fill="url(#dark_plate)"/>
  <ellipse cx="16" cy="23" rx="13" ry="7" fill="none" stroke="#604040" stroke-width="1.5"/>
  <ellipse cx="16" cy="23" rx="10" ry="5.5" fill="none" stroke="#503030" stroke-width="0.5"/>
  <!-- Steak -->
  <path d="M10 24 Q9 20 12 18 Q16 16 20 18 Q23 20 22 24 Q20 26 16 26 Q11 26 10 24 Z" fill="url(#steak_grad)"/>
  <!-- Steak sear marks (grill lines) -->
  <path d="M11 20 Q14 19 16 20" stroke="#2a1006" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M12 22 Q15 21 18 22" stroke="#2a1006" stroke-width="1.2" fill="none" opacity="0.7"/>
  <!-- Steak fat edge -->
  <path d="M10 24 Q9 20 12 18" stroke="#d0a060" stroke-width="1.5" fill="none"/>
  <!-- Sauce drizzle -->
  <path d="M7 25 Q10 22 13 23 Q16 24 18 22 Q21 20 24 22" stroke="url(#sauce_drizzle)" stroke-width="1" fill="none"/>
  <!-- Herb bouquet -->
  <path d="M22 21 L24 18 M22 21 L25 20 M22 21 L24 23" stroke="#208020" stroke-width="0.8" fill="none"/>
  <circle cx="24" cy="18" r="0.8" fill="#30a030"/>
  <circle cx="25" cy="20" r="0.8" fill="#40b040"/>
  <circle cx="24" cy="23" r="0.8" fill="#30a030"/>
  <!-- Sauce dots design -->
  <circle cx="8" cy="21" r="0.7" fill="#c04020"/>
  <circle cx="7" cy="23" r="0.5" fill="#a03010"/>
</svg>
