<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 3 tiges de blé -->
  <!-- Tige gauche -->
  <line x1="10" y1="30" x2="9" y2="8" stroke="#827717" stroke-width="1.5"/>
  <!-- Tige centrale -->
  <line x1="16" y1="30" x2="16" y2="6" stroke="#827717" stroke-width="1.8"/>
  <!-- Tige droite -->
  <line x1="22" y1="30" x2="23" y2="8" stroke="#827717" stroke-width="1.5"/>
  <!-- Feuilles (ligules) -->
  <path d="M10 22 Q5 20 4 18 Q7 18 10 21" fill="#9e9d24" opacity="0.8"/>
  <path d="M16 20 Q10 18 9 16 Q13 16 16 19" fill="#9e9d24" opacity="0.8"/>
  <path d="M22 22 Q27 20 28 18 Q25 18 22 21" fill="#9e9d24" opacity="0.8"/>
  <!-- Épis de blé gauche -->
  <ellipse cx="9.5" cy="18" rx="2" ry="1.2" fill="#f9a825"/>
  <ellipse cx="9" cy="15.5" rx="2" ry="1.2" fill="#fdd835"/>
  <ellipse cx="8.8" cy="13" rx="2" ry="1.2" fill="#fdd835"/>
  <ellipse cx="8.5" cy="10.5" rx="1.8" ry="1.1" fill="#fbc02d"/>
  <ellipse cx="8.3" cy="8.5" rx="1.5" ry="1" fill="#f9a825"/>
  <!-- Barbes gauche -->
  <line x1="7.5" y1="18" x2="5" y2="15" stroke="#f9a825" stroke-width="0.5"/>
  <line x1="11.5" y1="18" x2="13" y2="15.5" stroke="#f9a825" stroke-width="0.5"/>
  <line x1="7" y1="13" x2="5" y2="10" stroke="#fdd835" stroke-width="0.5"/>
  <!-- Épi central -->
  <ellipse cx="16" cy="16" rx="2.2" ry="1.3" fill="#f9a825"/>
  <ellipse cx="16" cy="13.5" rx="2.2" ry="1.3" fill="#fdd835"/>
  <ellipse cx="16" cy="11" rx="2.2" ry="1.3" fill="#fdd835"/>
  <ellipse cx="16" cy="8.5" rx="2" ry="1.2" fill="#fbc02d"/>
  <ellipse cx="16" cy="6.5" rx="1.7" ry="1" fill="#f9a825"/>
  <!-- Barbes centre -->
  <line x1="14" y1="16" x2="11" y2="13" stroke="#f9a825" stroke-width="0.6"/>
  <line x1="18" y1="16" x2="21" y2="13" stroke="#f9a825" stroke-width="0.6"/>
  <line x1="14" y1="11" x2="11" y2="8" stroke="#fdd835" stroke-width="0.5"/>
  <line x1="18" y1="11" x2="21" y2="8" stroke="#fdd835" stroke-width="0.5"/>
  <!-- Épi droit -->
  <ellipse cx="22.5" cy="18" rx="2" ry="1.2" fill="#f9a825"/>
  <ellipse cx="23" cy="15.5" rx="2" ry="1.2" fill="#fdd835"/>
  <ellipse cx="23.2" cy="13" rx="2" ry="1.2" fill="#fdd835"/>
  <ellipse cx="23.5" cy="10.5" rx="1.8" ry="1.1" fill="#fbc02d"/>
  <ellipse cx="23.7" cy="8.5" rx="1.5" ry="1" fill="#f9a825"/>
</svg>
