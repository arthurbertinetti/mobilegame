<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadow_she" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bag_she" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e8d090"/>
      <stop offset="60%" stop-color="#d4b870"/>
      <stop offset="100%" stop-color="#b09040"/>
    </radialGradient>
    <linearGradient id="side_she" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0a050"/>
      <stop offset="100%" stop-color="#a08030"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30.5" rx="7.5" ry="1.8" fill="url(#shadow_she)"/>
  <!-- Bag body -->
  <path d="M8 18 Q7 27 8 29 Q8.5 30.5 16 30.5 Q23.5 30.5 24 29 Q25 27 24 18 Q22 15.5 16 15.5 Q10 15.5 8 18 Z" fill="url(#bag_she)"/>
  <!-- Bag gathered/tied top -->
  <path d="M12 15.5 Q14 14 16 13.5 Q18 14 20 15.5 Q18.5 16.5 16 16.5 Q13.5 16.5 12 15.5 Z" fill="url(#side_she)" opacity="0.8"/>
  <!-- String tie -->
  <path d="M11.5 15 Q16 13 20.5 15" stroke="#4a8030" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- String bow -->
  <path d="M14 13 Q16 12 18 13" stroke="#4a8030" stroke-width="1" fill="none"/>
  <path d="M15 12 Q16 11 17 12" stroke="#4a8030" stroke-width="1" fill="none"/>
  <!-- Herb sprigs sticking out of top -->
  <!-- Sprig 1 (left) -->
  <line x1="13" y1="14" x2="11" y2="8" stroke="#3a7028" stroke-width="0.9" stroke-linecap="round"/>
  <ellipse cx="10.5" cy="7.5" rx="1.2" ry="0.7" fill="#50a038" transform="rotate(-30,10.5,7.5)"/>
  <ellipse cx="12" cy="10" rx="1.2" ry="0.6" fill="#50a038" transform="rotate(-20,12,10)"/>
  <!-- Sprig 2 (center) -->
  <line x1="16" y1="13.5" x2="15.5" y2="6" stroke="#3a7028" stroke-width="0.9" stroke-linecap="round"/>
  <ellipse cx="14.5" cy="8" rx="1.2" ry="0.6" fill="#60b040" transform="rotate(-35,14.5,8)"/>
  <ellipse cx="16.5" cy="8.5" rx="1.2" ry="0.6" fill="#60b040" transform="rotate(25,16.5,8.5)"/>
  <ellipse cx="15.5" cy="6.5" rx="1" ry="0.5" fill="#50a030"/>
  <!-- Sprig 3 (right) -->
  <line x1="19" y1="14" x2="21" y2="8" stroke="#3a7028" stroke-width="0.9" stroke-linecap="round"/>
  <ellipse cx="21.5" cy="7.5" rx="1.2" ry="0.7" fill="#50a038" transform="rotate(30,21.5,7.5)"/>
  <ellipse cx="20" cy="10" rx="1.2" ry="0.6" fill="#50a038" transform="rotate(20,20,10)"/>
  <!-- Bag fabric texture lines -->
  <path d="M10 20 Q16 19 22 20" stroke="#c0a050" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M9.5 23 Q16 22 22.5 23" stroke="#c0a050" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M9.5 26 Q16 25 22.5 26" stroke="#c0a050" stroke-width="0.5" fill="none" opacity="0.35"/>
  <!-- Bag shine -->
  <path d="M9.5 19 Q9 24 9.5 28" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.25"/>
</svg>
