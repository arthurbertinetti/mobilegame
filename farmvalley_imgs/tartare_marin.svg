<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plateG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </radialGradient>
    <radialGradient id="tartareG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f08070"/>
      <stop offset="100%" stop-color="#c05040"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="29" rx="12" ry="3" fill="url(#shadowG)"/>
  <!-- Plate -->
  <circle cx="16" cy="16" r="13" fill="url(#plateG)" stroke="#c8c8c8" stroke-width="0.5"/>
  <!-- Ring mold tartare mound -->
  <circle cx="16" cy="16" r="7" fill="url(#tartareG)"/>
  <circle cx="16" cy="16" r="3.5" fill="#c05040" opacity="0.5"/>
  <!-- Texture strokes -->
  <circle cx="13.5" cy="14" r="0.8" fill="#d06050" opacity="0.6"/>
  <circle cx="18" cy="14.5" r="0.7" fill="#c85040" opacity="0.6"/>
  <circle cx="16" cy="18" r="0.7" fill="#d06050" opacity="0.6"/>
  <circle cx="14" cy="18" r="0.6" fill="#c85040" opacity="0.6"/>
  <!-- Capers dots -->
  <circle cx="12" cy="13" r="0.9" fill="#405020"/>
  <circle cx="20" cy="13" r="0.9" fill="#405020"/>
  <circle cx="17" cy="20" r="0.9" fill="#405020"/>
  <circle cx="13" cy="20" r="0.8" fill="#405020"/>
  <circle cx="20" cy="19" r="0.8" fill="#405020"/>
  <!-- Chive on top -->
  <line x1="14" y1="10" x2="18" y2="9" stroke="#2d7a30" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="15" y1="9.5" x2="17" y2="8" stroke="#38903a" stroke-width="0.7" stroke-linecap="round"/>
</svg>
