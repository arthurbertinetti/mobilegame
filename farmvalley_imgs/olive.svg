<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="olvg" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="45%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </radialGradient>
  </defs>
  <!-- Tige -->
  <line x1="16" y1="8" x2="16" y2="5" stroke="#5d4037" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Petite feuille (feuille d'olive, étroite) -->
  <path d="M16 6 Q21 4 20 8 Q18 7 16 6Z" fill="#8d9e66"/>
  <line x1="16" y1="6" x2="19.5" y2="7" stroke="#6d8040" stroke-width="0.4"/>
