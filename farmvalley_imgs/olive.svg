  <!-- Petit point du sommet (résidu de fleur) -->
  <circle cx="16" cy="8" r="1.2" fill="#5d4037"/>
  <!-- Stries légères -->
  <path d="M16 8 Q15.5 13 15.5 18 Q15.8 23 16 28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <!-- Reflet -->
