  <path d="M13 22 L13 20 L14.5 21 L16 19 L17.5 21 L19 20 L19 22 Z" fill="url(#crown_gold)" stroke="#a07010" stroke-width="0.4"/>
  <rect x="13" y="22" width="6" height="1.5" rx="0.3" fill="#c09020"/>
