<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="sg_meat" cx="40%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#6a2808"/>
      <stop offset="55%" stop-color="#4a2010"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </radialGradient>
    <radialGradient id="sg_center" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c04030"/>
      <stop offset="70%" stop-color="#8a2818"/>
      <stop offset="100%" stop-color="#5a1a08"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="13" ry="0.8" fill="#00000030"/>
  <!-- Steak body organic shape -->
  <path d="M5,24 Q4,18 6,13 Q9,8 14,7 Q19,7 23,10 Q27,13 27,19 Q27,24 23,26 Q18,27.5 13,27 Q8,26 5,24 Z" fill="url(#sg_meat)"/>
  <!-- Red-pink center (medium-rare) -->
  <path d="M9,22 Q8,18 10,14 Q12,10 16,10 Q20,10 22,14 Q24,18 23,22 Q20,24 16,24 Q12,24 9,22 Z" fill="url(#sg_center)" opacity="0.6"/>
  <!-- Diagonal grill marks (dark char lines) -->
  <line x1="7" y1="10" x2="14" y2="22" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="13" y1="8" x2="20" y2="20" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="19" y1="8" x2="26" y2="19" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <!-- Fat edge (white rim) -->
  <path d="M5,19 Q5,15 7,12" stroke="#e8d8b8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Marbling -->
  <path d="M10,16 Q14,14 18,16 Q14,15 10,16 Z" fill="#c89858" opacity="0.35"/>
  <path d="M12,21 Q16,20 20,21 Q16,20.5 12,21 Z" fill="#c89858" opacity="0.3"/>
  <!-- Crust sheen -->
  <ellipse cx="12" cy="13" rx="4" ry="2.5" fill="rgba(140,60,20,0.3)" transform="rotate(-15,12,13)"/>
</svg>
