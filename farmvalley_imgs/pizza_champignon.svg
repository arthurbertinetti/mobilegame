  <ellipse cx="15" cy="20" rx="3.5" ry="2" fill="#f8e060" opacity="0.65" transform="rotate(-10,15,20)"/>
  <!-- Mushroom slices -->
  <path d="M11 12 Q13 9 15 12 L15 14 Q13 15 11 14 Z" fill="url(#mushG)"/>
  <line x1="13" y1="12.5" x2="13" y2="14.5" stroke="#302010" stroke-width="0.5" opacity="0.5"/>
  <path d="M18 18 Q20 15 22 18 L22 20 Q20 21 18 20 Z" fill="url(#mushG)"/>
