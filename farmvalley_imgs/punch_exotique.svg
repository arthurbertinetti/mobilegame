<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bowl_g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0c8c0"/>
      <stop offset="50%" stop-color="#f0ece8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <linearGradient id="punch_g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f08040"/>
      <stop offset="100%" stop-color="#c04020"/>
    </linearGradient>
  </defs>
  <ellipse cx="16" cy="31.5" rx="12" ry="0.7" fill="#00000020"/>
  <!-- wide punch bowl -->
  <path d="M4,28 Q4,32 16,32 Q28,32 28,28 L26,20 Q26,17 16,17 Q6,17 6,20 Z" fill="url(#punch_g)"/>
  <path d="M4,28 Q4,32 16,32 Q28,32 28,28 L26,20 Q26,17 16,17 Q6,17 6,20 Z" fill="url(#bowl_g)" fill-opacity="0.35" stroke="#b0a898" stroke-width="0.7"/>
  <!-- bowl rim -->
  <path d="M6,20 Q6,17 16,17 Q26,17 26,20" fill="none" stroke="#c0b8b0" stroke-width="1.2"/>
  <!-- orange slice floating -->
  <circle cx="11" cy="24" r="3" fill="#ff8800" opacity="0.9"/>
  <circle cx="11" cy="24" r="2.1" fill="#ffaa30" opacity="0.8"/>
  <line x1="11" y1="21" x2="11" y2="27" stroke="#e07000" stroke-width="0.5" opacity="0.6"/>
  <line x1="8" y1="24" x2="14" y2="24" stroke="#e07000" stroke-width="0.5" opacity="0.6"/>
  <line x1="9" y1="21.9" x2="13" y2="26.1" stroke="#e07000" stroke-width="0.4" opacity="0.5"/>
  <line x1="13" y1="21.9" x2="9" y2="26.1" stroke="#e07000" stroke-width="0.4" opacity="0.5"/>
  <!-- yellow lemon/pineapple slice floating -->
  <circle cx="21" cy="23" r="2.5" fill="#f0d020" opacity="0.9"/>
  <circle cx="21" cy="23" r="1.7" fill="#f8e840" opacity="0.8"/>
  <line x1="21" y1="20.5" x2="21" y2="25.5" stroke="#c0a000" stroke-width="0.5" opacity="0.6"/>
  <line x1="18.5" y1="23" x2="23.5" y2="23" stroke="#c0a000" stroke-width="0.5" opacity="0.6"/>
  <!-- ladle -->
  <line x1="23" y1="17" x2="28" y2="10" stroke="#a09088" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="23" cy="18" r="2.5" fill="url(#bowl_g)" stroke="#908880" stroke-width="0.6"/>
  <circle cx="23" cy="18" r="1.5" fill="#f08040" opacity="0.7"/>
  <!-- bowl highlight -->
  <path d="M7,21 Q8,19 16,19" fill="none" stroke="#f8f0e8" stroke-width="0.8" opacity="0.4"/>
</svg>
