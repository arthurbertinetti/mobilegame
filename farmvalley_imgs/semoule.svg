<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bowlG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ece4d8"/>
      <stop offset="100%" stop-color="#b8b0a4"/>
    </radialGradient>
    <radialGradient id="couscousG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0e0b0"/>
      <stop offset="100%" stop-color="#c8b070"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="12" ry="2.5" fill="url(#shadowG)"/>
  <!-- Bowl outer -->
  <ellipse cx="16" cy="20" rx="13" ry="9" fill="url(#bowlG)" stroke="#a8a098" stroke-width="0.6"/>
  <!-- Couscous mound -->
  <ellipse cx="16" cy="18" rx="10" ry="7" fill="url(#couscousG)"/>
  <!-- Couscous grain texture (tiny dots) -->
  <circle cx="12" cy="16" r="0.5" fill="#d8c888"/>
  <circle cx="14" cy="15" r="0.5" fill="#d0c080"/>
  <circle cx="16" cy="15.5" r="0.5" fill="#d8c888"/>
  <circle cx="18" cy="15" r="0.5" fill="#d0c080"/>
  <circle cx="20" cy="16" r="0.5" fill="#d8c888"/>
  <circle cx="13" cy="17.5" r="0.5" fill="#d0c080"/>
  <circle cx="15.5" cy="17" r="0.5" fill="#d8c888"/>
  <circle cx="18" cy="17.5" r="0.5" fill="#d0c080"/>
  <circle cx="11" cy="18" r="0.5" fill="#d8c888"/>
  <circle cx="21" cy="18" r="0.5" fill="#d0c080"/>
  <!-- Raisins (dark dots) -->
  <circle cx="13" cy="19" r="1.1" fill="#604820"/>
  <circle cx="17" cy="20" r="1.1" fill="#503818"/>
  <circle cx="21" cy="19.5" r="1.1" fill="#604820"/>
  <circle cx="10.5" cy="17" r="1" fill="#503818"/>
  <!-- Chickpeas (beige circles) -->
  <circle cx="15" cy="20" r="1.3" fill="#d4b060" stroke="#b89040" stroke-width="0.4"/>
  <circle cx="19" cy="18" r="1.3" fill="#c8a850" stroke="#a88030" stroke-width="0.4"/>
  <circle cx="12" cy="21" r="1.2" fill="#d4b060" stroke="#b89040" stroke-width="0.4"/>
</svg>
