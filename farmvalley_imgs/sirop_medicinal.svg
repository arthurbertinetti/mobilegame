<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="sm_body" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2030c0"/>
      <stop offset="55%" stop-color="#1020a0"/>
      <stop offset="100%" stop-color="#081060"/>
    </radialGradient>
    <radialGradient id="sm_label" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#d0d8f0"/>
    </radialGradient>
    <radialGradient id="sm_cork" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d0a060"/>
      <stop offset="100%" stop-color="#906030"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Bottle body -->
  <rect x="10" y="10" width="12" height="20" rx="3" fill="url(#sm_body)"/>
  <!-- Bottle neck -->
  <rect x="13" y="5" width="6" height="7" rx="2" fill="#0c18a0"/>
  <!-- Cork cap -->
  <ellipse cx="16" cy="4" rx="4" ry="2" fill="url(#sm_cork)"/>
  <rect x="13.5" y="3" width="5" height="2.5" rx="1.2" fill="#b08040"/>
  <!-- White label -->
  <rect x="11" y="14" width="10" height="11" rx="1.5" fill="url(#sm_label)" stroke="#c0c8e0" stroke-width="0.5"/>
  <!-- Cross symbol -->
  <rect x="15" y="15.5" width="2" height="6" rx="0.5" fill="#e02020"/>
  <rect x="13" y="17.5" width="6" height="2" rx="0.5" fill="#e02020"/>
  <!-- Bottle shine -->
  <rect x="11.5" y="11" width="1.5" height="10" rx="0.7" fill="rgba(255,255,255,0.25)"/>
  <!-- Liquid glow inside bottle -->
  <rect x="11" y="11" width="10" height="18" rx="2.5" fill="rgba(30,60,200,0.15)"/>
</svg>
