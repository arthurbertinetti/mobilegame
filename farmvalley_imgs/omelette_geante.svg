<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="og_egg" cx="40%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#f8e060"/>
      <stop offset="55%" stop-color="#f0d040"/>
      <stop offset="100%" stop-color="#c09020"/>
    </radialGradient>
    <radialGradient id="og_fold" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e8c840"/>
      <stop offset="100%" stop-color="#b08018"/>
    </radialGradient>
    <linearGradient id="og_plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e4dc"/>
      <stop offset="100%" stop-color="#c8c4bc"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="13" ry="0.8" fill="#00000028"/>
  <!-- Plate -->
  <ellipse cx="16" cy="29" rx="14" ry="2.5" fill="#b0aaa4"/>
  <ellipse cx="16" cy="28" rx="14" ry="2.5" fill="url(#og_plate)"/>
  <!-- Omelette folded base shape -->
  <path d="M4,26 Q3,22 5,18 Q7,14 12,12 Q16,11 20,12 Q25,14 27,18 Q29,22 28,26 Q22,28 16,28 Q10,28 4,26 Z" fill="url(#og_egg)"/>
  <!-- Fold line / top surface -->
  <path d="M6,20 Q8,15 16,14 Q24,15 26,20 Q22,17 16,17 Q10,17 6,20 Z" fill="url(#og_fold)" opacity="0.85"/>
  <!-- Folded edge highlight -->
  <path d="M6,21 Q10,16 16,15 Q22,16 26,21" stroke="#e0b828" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Green herb bits inside -->
  <circle cx="12" cy="20" r="0.8" fill="#5aaa28"/>
  <circle cx="14" cy="18.5" r="0.7" fill="#4a9820"/>
  <circle cx="17" cy="21" r="0.8" fill="#5aaa28"/>
  <circle cx="20" cy="19" r="0.7" fill="#4a9820"/>
  <circle cx="16" cy="23" r="0.8" fill="#5aaa28"/>
  <circle cx="10" cy="22" r="0.7" fill="#4a9820"/>
  <!-- Omelette edge color (slightly browned) -->
  <path d="M5,23 Q4,21 5.5,19" stroke="#b07818" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M27,23 Q28,21 26.5,19" stroke="#b07818" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Gloss highlight -->
  <ellipse cx="13" cy="18" rx="5" ry="2.5" fill="rgba(255,240,150,0.4)" transform="rotate(-5,13,18)"/>
  <ellipse cx="12" cy="16.5" rx="2.5" ry="1.2" fill="rgba(255,255,200,0.4)"/>
</svg>
