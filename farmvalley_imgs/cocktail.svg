<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glass_g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e8ee"/>
      <stop offset="50%" stop-color="#f4f8fc"/>
      <stop offset="100%" stop-color="#b8c8d8"/>
    </linearGradient>
    <linearGradient id="liq_g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20b0e0"/>
      <stop offset="100%" stop-color="#0080c0"/>
    </linearGradient>
    <clipPath id="glass_clip">
      <path d="M7,9 L16,22 L25,9 Z"/>
    </clipPath>
  </defs>
  <ellipse cx="16" cy="31.5" rx="8" ry="0.7" fill="#00000020"/>
  <!-- V-shaped martini glass liquid -->
  <path d="M7,9 L16,22 L25,9 Z" fill="url(#liq_g)" clip-path="url(#glass_clip)"/>
  <!-- V-shaped martini glass outline -->
  <path d="M7,9 L16,22 L25,9 Z" fill="url(#glass_g)" fill-opacity="0.4" stroke="#90b8d0" stroke-width="0.8"/>
  <!-- rim -->
  <line x1="7" y1="9" x2="25" y2="9" stroke="#a0c0d8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- stem -->
  <line x1="16" y1="22" x2="16" y2="29" stroke="#a0c0d8" stroke-width="1" stroke-linecap="round"/>
  <!-- base -->
  <line x1="12" y1="29" x2="20" y2="29" stroke="#a0c0d8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cocktail umbrella garnish -->
  <!-- umbrella stick -->
  <line x1="20" y1="5" x2="23" y2="11" stroke="#c08030" stroke-width="0.7" stroke-linecap="round"/>
  <!-- umbrella canopy -->
  <path d="M17,7 Q20,4 23,7" fill="#e03050" stroke="#c02040" stroke-width="0.3"/>
  <path d="M17,7 Q18.5,5.5 20,5.5 Q21.5,5.5 23,7" fill="#f0d020" opacity="0.8"/>
  <path d="M17,7 Q19,6.5 21,7" fill="#20a0e0" opacity="0.6"/>
  <!-- umbrella center -->
  <circle cx="20" cy="6" r="0.6" fill="#c08030"/>
</svg>
