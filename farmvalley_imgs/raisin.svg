<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="rsg" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="55%" stop-color="#7b1fa2"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </radialGradient>
  </defs>
  <!-- Tige de la grappe -->
  <line x1="16" y1="4" x2="16" y2="8" stroke="#5d4037" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Petite vrille -->
  <path d="M16 5 Q20 4 19 6" fill="none" stroke="#558b2f" stroke-width="0.8"/>
  <!-- Petite feuille -->
  <path d="M16 5 Q11 3 12 6 Q14 5.5 16 5Z" fill="#4caf50"/>
  <!-- Grappe triangulaire (rangées de raisins) -->
  <!-- Rangée 1 (haut) -->
  <circle cx="16" cy="10" r="3" fill="url(#rsg)"/>
  <!-- Rangée 2 -->
  <circle cx="12.5" cy="14.5" r="3" fill="url(#rsg)"/>
  <circle cx="19.5" cy="14.5" r="3" fill="url(#rsg)"/>
  <!-- Rangée 3 -->
  <circle cx="9.5" cy="19" r="3" fill="url(#rsg)"/>
  <circle cx="16" cy="19" r="3" fill="url(#rsg)"/>
  <circle cx="22.5" cy="19" r="3" fill="url(#rsg)"/>
  <!-- Rangée 4 (bas) -->
  <circle cx="12.5" cy="23.5" r="3" fill="url(#rsg)"/>
  <circle cx="19.5" cy="23.5" r="3" fill="url(#rsg)"/>
  <!-- Pointe bas -->
  <circle cx="16" cy="27.5" r="2.5" fill="url(#rsg)"/>
  <!-- Reflets -->
  <circle cx="14.8" cy="8.8" r="1.2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="11.3" cy="13.3" r="1.2" fill="rgba(255,255,255,0.25)"/>
  <circle cx="18.3" cy="13.3" r="1.2" fill="rgba(255,255,255,0.25)"/>
</svg>
