<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ho_bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a8030"/>
      <stop offset="40%" stop-color="#7aa840"/>
      <stop offset="100%" stop-color="#486020"/>
    </linearGradient>
    <linearGradient id="ho_oil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0b020"/>
      <stop offset="50%" stop-color="#e0d040"/>
      <stop offset="100%" stop-color="#a09010"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.2" rx="6" ry="0.7" fill="#00000020"/>
  <!-- Bottle body -->
  <path d="M11,15 Q10,14 10,26 Q10,29 13,30 L19,30 Q22,29 22,26 Q22,14 21,15 Z" fill="url(#ho_bottle)"/>
  <!-- Oil level inside (amber, lower part) -->
  <path d="M11,20 Q10,20 10,26 Q10,29 13,30 L19,30 Q22,29 22,26 Q22,20 21,20 Z" fill="url(#ho_oil)"/>
  <!-- Bottle neck -->
  <path d="M13,9 Q13,7 14,7 L18,7 Q19,7 19,9 L21,15 L11,15 Z" fill="url(#ho_bottle)"/>
  <!-- Cork/stopper -->
  <rect x="14" y="5" width="4" height="3" rx="1" fill="#c0a060"/>
  <rect x="13.5" y="6.5" width="5" height="1.5" rx="0.5" fill="#a08040"/>
  <!-- Glass shine on bottle -->
  <path d="M12,16 Q11.5,22 12,27" stroke="rgba(255,255,255,.35)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Oil surface line -->
  <path d="M11,20 Q16,19.5 21,20" stroke="rgba(255,240,100,.4)" stroke-width="0.7" fill="none"/>
  <!-- Olive decoration -->
  <ellipse cx="16" cy="17" rx="2.2" ry="1.4" fill="#405820" opacity="0.8"/>
  <ellipse cx="15.2" cy="16.7" rx="0.7" ry="0.5" fill="#f0d040" opacity="0.6"/>
</svg>
