<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="li_body" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eee8f8"/>
      <stop offset="100%" stop-color="#ccc0e8"/>
    </radialGradient>
    <radialGradient id="li_head" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddd4f0"/>
    </radialGradient>
    <linearGradient id="li_horn" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89000"/>
      <stop offset="50%" stop-color="#f8d840"/>
      <stop offset="100%" stop-color="#e0b820"/>
    </linearGradient>
  </defs>
  <!-- Magic sparkles -->
  <circle cx="3" cy="9" r="0.7" fill="#e8b0ff" opacity="0.9"/>
  <circle cx="5" cy="5" r="0.5" fill="#ffd0ff" opacity="0.8"/>
  <circle cx="29" cy="7" r="0.6" fill="#b0d8ff" opacity="0.85"/>
  <circle cx="28" cy="14" r="0.45" fill="#c8e8ff" opacity="0.75"/>
  <circle cx="2" cy="16" r="0.4" fill="#f0b0ff" opacity="0.7"/>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="11" ry="0.65" fill="#00000015"/>
  <!-- Tail (flowing, rainbow colors) -->
  <path d="M26,22 Q31,17 30.5,12 Q29,16 28.5,20.5" stroke="#f0a0d0" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M26,22 Q31.5,15 31,10 Q29,15.5 28,21" stroke="#a080f0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M25.5,21.5 Q30,14 29.5,10 Q27.5,15 27,20.5" stroke="#80c0ff" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Back legs -->
  <line x1="20" y1="26" x2="19.5" y2="31" stroke="#c8c0e0" stroke-width="2" stroke-linecap="round"/>
  <line x1="23" y1="25" x2="22.5" y2="30" stroke="#c8c0e0" stroke-width="2" stroke-linecap="round"/>
  <!-- Front legs -->
  <line x1="10" y1="26.5" x2="9.5" y2="31" stroke="#c8c0e0" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="27" x2="12.5" y2="31.5" stroke="#c8c0e0" stroke-width="2" stroke-linecap="round"/>
  <!-- Golden hooves -->
  <ellipse cx="9.5" cy="31.3" rx="1.3" ry="0.55" fill="#d4a820"/>
  <ellipse cx="12.5" cy="31.6" rx="1.3" ry="0.55" fill="#d4a820"/>
  <ellipse cx="19.5" cy="31.1" rx="1.3" ry="0.55" fill="#d4a820"/>
  <ellipse cx="22.5" cy="30.3" rx="1.3" ry="0.55" fill="#d4a820"/>
  <!-- Body -->
  <path d="M8,22.5 Q8,16 14,14.5 Q22,13 26.5,17 Q29,21 27.5,26.5 Q24,29.5 16,29.5 Q8,29 8,22.5 Z" fill="url(#li_body)"/>
  <!-- Pearl sheen on body -->
  <path d="M10,21 Q16,18.5 24,20" stroke="#d8c8ff" stroke-width="0.9" fill="none" opacity="0.4"/>
  <!-- Neck -->
  <path d="M11.5,17 Q9.5,12 10.5,9.5 Q13,10 13.5,16.5 Z" fill="url(#li_head)"/>
  <!-- Head -->
  <path d="M8.5,13.5 Q9,8.5 12,6.5 Q14.5,5.5 15.5,7 Q15.5,10 14,13 Q14,15 12.5,16.5 Q10,17 8.5,13.5 Z" fill="url(#li_head)"/>
  <!-- Mane — rainbow stripes along neck -->
  <path d="M12,7 Q9.5,8.5 9.5,11.5 Q11,11 12.5,8.5" fill="#f0a0d0" opacity="0.9"/>
  <path d="M11.5,9 Q9.2,11 9.5,14 Q10.5,13.5 12,10.5" fill="#b070f0" opacity="0.8"/>
  <path d="M11,11.5 Q9.3,13 10,15.5 Q11,15 12,12.5" fill="#70b0ff" opacity="0.7"/>
  <!-- Ear -->
  <path d="M13.5,6.5 Q14,4 15,3.8 Q15.5,5.2 14.5,6.5 Z" fill="#e8d8f8"/>
  <path d="M13.8,6.5 Q14.2,4.8 14.8,4.6 Q15.1,5.5 14.4,6.5 Z" fill="#c0a0e8" opacity="0.6"/>
  <!-- HORN — prominent golden spiral -->
  <path d="M14,7 L16.5,1" stroke="url(#li_horn)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Horn spiral lines -->
  <line x1="14.5" y1="6" x2="15.2" y2="4" stroke="#fff07060" stroke-width="0.8"/>
  <line x1="15" y1="4.5" x2="15.8" y2="2.5" stroke="#fff07050" stroke-width="0.8"/>
  <!-- Muzzle -->
  <ellipse cx="8.2" cy="14.5" rx="2.2" ry="1.6" fill="#f0eaf8"/>
  <!-- Nostril -->
  <ellipse cx="7.5" cy="14.8" rx="0.58" ry="0.62" fill="#c0a8e0"/>
  <!-- Eye — violet, luminous -->
  <ellipse cx="12.8" cy="8.8" rx="1.3" ry="1.15" fill="#c090e8"/>
  <ellipse cx="12.8" cy="8.8" rx="0.7" ry="0.65" fill="#6020a0"/>
  <circle cx="12.4" cy="8.3" r="0.32" fill="#ffffff70"/>
</svg>
