<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="wp_body" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eeeaf8"/>
      <stop offset="100%" stop-color="#d0cce8"/>
    </radialGradient>
    <radialGradient id="wp_head" cx="40%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dddaf0"/>
    </radialGradient>
    <radialGradient id="wp_ocellus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="40%" stop-color="#e8e4f0"/>
      <stop offset="70%" stop-color="#c8c4e0"/>
      <stop offset="100%" stop-color="#a8a4c0"/>
    </radialGradient>
    <linearGradient id="wp_tail" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#e8e4f8"/>
      <stop offset="50%" stop-color="#f0eef8"/>
      <stop offset="100%" stop-color="#e0ddf0"/>
    </linearGradient>
    <linearGradient id="wp_shim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e8f8a0"/>
      <stop offset="100%" stop-color="#f0e0f8a0"/>
    </linearGradient>
  </defs>
  <!-- Tail fan background -->
  <path d="M14,22 Q4,16 3,6 Q8,4 16,5 Q24,4 29,7 Q28,16 18,22 Z" fill="url(#wp_tail)" opacity="0.4"/>
  <!-- Tail feathers -->
  <path d="M13,22 Q6,17 4,9 Q6,8 7,9 Q8,15 14,20 Z" fill="#f0eef8" opacity="0.8"/>
  <circle cx="5.5" cy="7.5" r="2.8" fill="url(#wp_ocellus)"/>
  <path d="M13.5,21.5 Q8,14 8,7 Q10,6.5 11,7.5 Q11,13 14.5,19.5 Z" fill="#f8f6ff" opacity="0.85"/>
  <circle cx="9.5" cy="5.8" r="2.5" fill="url(#wp_ocellus)"/>
  <path d="M14,21 Q11,13 13,5.5 Q15,5 16,6.5 Q15,12 15.5,19 Z" fill="#f5f2ff" opacity="0.9"/>
  <circle cx="14" cy="4" r="2.3" fill="url(#wp_ocellus)"/>
  <path d="M15,21 Q15,12 16,4.5 Q17,4 18,5.5 Q17.5,12 17,20 Z" fill="#f0eeff" opacity="0.9"/>
  <circle cx="17" cy="3.5" r="2.3" fill="url(#wp_ocellus)"/>
  <path d="M16.5,21 Q19,13 21,5 Q22.5,5 23,6.5 Q21,12 18.5,20 Z" fill="#f5f2ff" opacity="0.9"/>
  <circle cx="22.5" cy="4" r="2.3" fill="url(#wp_ocellus)"/>
  <path d="M17,21.5 Q22,14 24.5,7 Q26,6.5 26.5,8 Q24,14 19,20.5 Z" fill="#f8f6ff" opacity="0.85"/>
  <circle cx="26.5" cy="6" r="2.5" fill="url(#wp_ocellus)"/>
  <path d="M18,22 Q26,17 28.5,9 Q30,8.5 30,10 Q27,16 19.5,21.5 Z" fill="#f0eef8" opacity="0.8"/>
  <circle cx="29.5" cy="8" r="2.8" fill="url(#wp_ocellus)"/>
  <!-- Iridescent shimmer on feathers -->
  <path d="M14,22 Q9,17 7,11" stroke="url(#wp_shim)" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M18,22 Q23,17 25,11" stroke="url(#wp_shim)" stroke-width="0.6" fill="none" opacity="0.5"/>
  <!-- Body -->
  <path d="M10,23.5 Q10,19 14,18 Q19,17.5 21,20 Q22,22.5 21,26 Q19,28.5 15,28.5 Q10,28 10,23.5 Z" fill="url(#wp_body)"/>
  <!-- Pearlescent body sheen -->
  <path d="M12,22.5 Q14.5,19.5 20,20.5" stroke="#c0c8f8" stroke-width="0.7" fill="none" opacity="0.5"/>
  <!-- Neck -->
  <path d="M12,20 Q11.5,17 12.5,14.5 Q14.5,15 14,20 Z" fill="url(#wp_head)"/>
  <!-- Head -->
  <ellipse cx="12.5" cy="13.5" rx="3.5" ry="3" fill="url(#wp_head)"/>
  <!-- Blue-green iridescent sheen on neck -->
  <path d="M12.5,19.5 Q12,17 12.8,15" stroke="#b0d8f8" stroke-width="1.2" fill="none" opacity="0.35" stroke-linecap="round"/>
  <!-- Crest feathers (white with pearl tips) -->
  <path d="M11.5,11 L10.5,8.5" stroke="#d8d4f0" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <circle cx="10.3" cy="8" r="0.9" fill="#e8e4f8"/>
  <path d="M12.5,10.5 L12,7.5" stroke="#d8d4f0" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <circle cx="11.9" cy="7" r="0.9" fill="#e8e4f8"/>
  <path d="M13.5,10.5 L13.5,7.5" stroke="#d8d4f0" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <circle cx="13.5" cy="7" r="0.9" fill="#e8e4f8"/>
  <path d="M14.5,11 L15,8.5" stroke="#d8d4f0" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <circle cx="15.2" cy="8" r="0.9" fill="#e8e4f8"/>
  <!-- Beak -->
  <path d="M10,13.5 L8,13 L7.8,14 L10,14 Z" fill="#d8c020"/>
  <!-- Eye (pale blue, iridescent) -->
  <circle cx="12" cy="12.8" r="1.1" fill="#90b8e0"/>
  <circle cx="12" cy="12.8" r="0.6" fill="#204870"/>
  <circle cx="11.7" cy="12.4" r="0.25" fill="#ffffff70"/>
  <!-- Legs -->
  <path d="M14.5,28 L14,31" stroke="#c0c0d0" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M14,31 L12.5,32 M14,31 L14.5,32 M14,31 L15.5,31.8" stroke="#c0c0d0" stroke-width="0.7" fill="none" stroke-linecap="round"/>
  <path d="M17,28 L16.5,31" stroke="#c0c0d0" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M16.5,31 L15,32 M16.5,31 L17,32 M16.5,31 L18,31.8" stroke="#c0c0d0" stroke-width="0.7" fill="none" stroke-linecap="round"/>
</svg>