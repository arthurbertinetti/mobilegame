<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="cro_main" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0c858"/>
      <stop offset="55%" stop-color="#d4a040"/>
      <stop offset="100%" stop-color="#8a5010"/>
    </radialGradient>
    <radialGradient id="cro_dark" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c08030"/>
      <stop offset="100%" stop-color="#704010"/>
    </radialGradient>
    <radialGradient id="cro_shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,240,180,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,200,80,0)"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Croissant crescent shape - main body -->
  <path d="M5,22 Q4,14 10,12 Q14,10 16,14 Q18,10 22,12 Q28,14 27,22 Q24,28 20,25 Q16,22 16,22 Q16,22 12,25 Q8,28 5,22 Z" fill="url(#cro_main)"/>
  <!-- Darker inner crescent shadow -->
  <path d="M8,22 Q8,16 12,14 Q14.5,13 16,16 Q17.5,13 20,14 Q24,16 24,22 Q22,26 20,24 Q18,22 16,22 Q14,22 12,24 Q10,26 8,22 Z" fill="url(#cro_dark)" opacity="0.6"/>
  <!-- Flaky texture lines -->
  <path d="M7,20 Q10,18 12,20 Q14,22 16,20 Q18,18 20,20 Q22,22 25,20" stroke="#b07020" stroke-width="0.6" fill="none" stroke-linecap="round"/>
  <path d="M8,23 Q11,21.5 13,23 Q15,24.5 16,23" stroke="#906010" stroke-width="0.5" fill="none" stroke-linecap="round"/>
  <path d="M19,23 Q21,21.5 24,23" stroke="#906010" stroke-width="0.5" fill="none" stroke-linecap="round"/>
  <!-- Shine spot -->
  <ellipse cx="11" cy="17" rx="3" ry="1.5" fill="url(#cro_shine)" transform="rotate(-20,11,17)"/>
  <ellipse cx="21" cy="17" rx="2.5" ry="1.2" fill="url(#cro_shine)" transform="rotate(20,21,17)"/>
  <!-- Tip darkening -->
  <circle cx="6" cy="22" r="2" fill="rgba(100,50,0,0.35)"/>
  <circle cx="26" cy="22" r="2" fill="rgba(100,50,0,0.35)"/>
</svg>
