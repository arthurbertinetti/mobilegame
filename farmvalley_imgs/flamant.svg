<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="fl_body" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f090a8"/>
      <stop offset="55%" stop-color="#d86888"/>
      <stop offset="100%" stop-color="#a83858"/>
    </radialGradient>
    <radialGradient id="fl_head" cx="40%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#f098a8"/>
      <stop offset="100%" stop-color="#c05878"/>
    </radialGradient>
    <linearGradient id="fl_neck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e07898"/>
      <stop offset="50%" stop-color="#f090a8"/>
      <stop offset="100%" stop-color="#d07088"/>
    </linearGradient>
    <linearGradient id="fl_wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8a8b8"/>
      <stop offset="100%" stop-color="#e07890"/>
    </linearGradient>
  </defs>
  <!-- Standing leg (one leg down) -->
  <path d="M16,28 L16.5,32" stroke="#e07890" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Foot on ground -->
  <path d="M16.5,32 L14.5,32.5 M16.5,32 L17,32.5 M16.5,32 L18,32" stroke="#e07890" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <!-- Raised leg (tucked, flamingo characteristic) -->
  <path d="M17.5,26.5 Q19,28 19.5,27" stroke="#e07890" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M10,22 Q10,17 15,16.5 Q21,16 23,19.5 Q24,22.5 22,26 Q19.5,28.5 15.5,28.5 Q10,28 10,22 Z" fill="url(#fl_body)"/>
  <!-- Wing fold detail -->
  <path d="M12,21 Q15.5,17.5 22,19.5 Q21,23.5 16.5,25.5 Q13,25.5 12,21 Z" fill="url(#fl_wing)" opacity="0.7"/>
  <!-- Wing feather lines -->
  <path d="M13,21.5 Q16.5,18.5 21,20" stroke="#c05878" stroke-width="0.4" fill="none" opacity="0.6"/>
  <path d="M13,22.5 Q16.5,19.5 21,21" stroke="#c05878" stroke-width="0.4" fill="none" opacity="0.5"/>
  <!-- Black wing tips -->
  <path d="M22,20 Q24,19 25,20 Q24.5,22 22,22 Z" fill="#2a1020"/>
  <!-- Kinked/bent neck (flamingo characteristic S-kink) -->
  <path d="M14.5,17.5 Q12,15 14,11 Q15.5,9 17,9.5" stroke="url(#fl_neck)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Neck highlight -->
  <path d="M15,17 Q13.2,14.5 15,11 Q16,9.5 17.5,10" stroke="#f8b0c0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Head (small) -->
  <ellipse cx="17.5" cy="9.5" rx="3" ry="2.5" fill="url(#fl_head)"/>
  <!-- Distinctive kinked beak -->
  <path d="M16,9.8 Q14,9.5 13,10.5 Q13.2,11.5 14,11.8 Q15.5,11.5 16.5,10.5 Z" fill="#e8b020"/>
  <!-- Beak kink (darker lower part) -->
  <path d="M13.2,11 Q13.5,11.8 14.5,12 Q15.5,11.8 16,11 Q15,11.5 13.2,11 Z" fill="#2a1a00"/>
  <!-- Eye (pale yellow) -->
  <ellipse cx="17.5" cy="9" rx="1" ry="0.9" fill="#f0d040"/>
  <ellipse cx="17.5" cy="9" rx="0.5" ry="0.45" fill="#1a0808"/>
  <circle cx="17.8" cy="8.7" r="0.2" fill="#ffffff60"/>
</svg>