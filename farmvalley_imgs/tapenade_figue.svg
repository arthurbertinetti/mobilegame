<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="tf_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tf_jar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8e8f8"/>
      <stop offset="30%" stop-color="#f0f8ff"/>
      <stop offset="70%" stop-color="#e0f0fa"/>
      <stop offset="100%" stop-color="#a8d0e8"/>
    </linearGradient>
    <linearGradient id="tf_spread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a2a40"/>
      <stop offset="100%" stop-color="#5a1a30"/>
    </linearGradient>
    <linearGradient id="tf_lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1820"/>
      <stop offset="100%" stop-color="#180808"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="9" ry="2" fill="url(#tf_shadow)"/>
  <!-- Small jar body -->
  <rect x="9" y="14" width="14" height="14" rx="3" ry="3" fill="url(#tf_jar)" stroke="#90b8d0" stroke-width="0.8"/>
  <!-- Spread fill -->
  <rect x="10" y="18" width="12" height="9" rx="2" ry="2" fill="url(#tf_spread)" opacity="0.95"/>
  <!-- Jar shine -->
  <rect x="10.5" y="15" width="2" height="7" rx="1" fill="white" opacity="0.4"/>
  <!-- Neck ring -->
  <rect x="10" y="13" width="12" height="2" rx="1" fill="#b0cfe0" stroke="#90b0c8" stroke-width="0.5"/>
  <!-- Lid -->
  <rect x="10" y="9" width="12" height="5" rx="2" fill="url(#tf_lid)" stroke="#100408" stroke-width="0.6"/>
  <!-- Lid shine -->
  <rect x="12" y="10" width="3" height="2" rx="1" fill="white" opacity="0.2"/>
  <!-- Fig quarter on top -->
  <!-- Fig body - quarter slice showing inside -->
  <path d="M16 5 Q13 5 12.5 7.5 Q12.2 9.5 16 9.5 Q19.8 9.5 19.5 7.5 Q19 5 16 5 Z" fill="#7a3040"/>
  <!-- Fig inside flesh -->
  <path d="M16 5.5 Q14 6 13.5 7.5 Q13.5 9 16 9 Q18.5 9 18.5 7.5 Q18 6 16 5.5 Z" fill="#e06080"/>
  <!-- Fig seeds -->
  <circle cx="15" cy="7.8" r="0.4" fill="#c03050"/>
  <circle cx="16.5" cy="7.2" r="0.4" fill="#c03050"/>
  <circle cx="17" cy="8.2" r="0.4" fill="#c03050"/>
  <circle cx="15.2" cy="8.6" r="0.35" fill="#c03050"/>
  <!-- Fig stem -->
  <line x1="16" y1="5" x2="16" y2="4.2" stroke="#50a020" stroke-width="0.8" stroke-linecap="round"/>
</svg>
