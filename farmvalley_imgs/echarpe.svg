<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadow_ec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scarf_ec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f06050"/>
      <stop offset="40%" stop-color="#f04040"/>
      <stop offset="100%" stop-color="#a01020"/>
    </linearGradient>
    <linearGradient id="fold_ec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c82020"/>
      <stop offset="50%" stop-color="#e03030"/>
      <stop offset="100%" stop-color="#b81818"/>
    </linearGradient>
    <linearGradient id="side_ec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d02828"/>
      <stop offset="100%" stop-color="#901010"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="11" ry="2" fill="url(#shadow_ec)"/>
  <!-- Scarf rolled/folded body - main roll -->
  <!-- Bottom of roll (slightly showing back) -->
  <ellipse cx="16" cy="27" rx="11" ry="3.5" fill="#901010" opacity="0.6"/>
  <!-- Main cylinder body (roll) -->
  <rect x="5" y="16" width="22" height="11" rx="3" fill="url(#scarf_ec)"/>
  <!-- Roll top face -->
  <ellipse cx="16" cy="16" rx="11" ry="3.5" fill="url(#fold_ec)"/>
  <!-- Stripe pattern (visible on roll surface) -->
  <rect x="5" y="17.5" width="22" height="1.5" fill="#fff" opacity="0.18"/>
  <rect x="5" y="20.5" width="22" height="1.5" fill="#fff" opacity="0.16"/>
  <rect x="5" y="23.5" width="22" height="1.5" fill="#fff" opacity="0.14"/>
  <!-- Top ellipse stripe pattern -->
  <ellipse cx="16" cy="16" rx="11" ry="3.5" fill="none" stroke="#fff" stroke-width="1" opacity="0.15"/>
  <!-- Fold visible at one end (showing layers) -->
  <path d="M5 16 Q5 20 5 24 Q3.5 24 3.5 20 Q3.5 16 5 16 Z" fill="url(#side_ec)" opacity="0.7"/>
  <!-- Fold highlight lines on top ellipse (depth) -->
  <path d="M6 14.5 Q10 13 14 14 Q18 15 22 13.5" stroke="#e85050" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M8 16 Q12 14.5 16 15.5 Q20 16.5 24 15" stroke="#e85050" stroke-width="0.7" fill="none" opacity="0.5"/>
  <!-- Soft fold/crease across body -->
  <path d="M5 19 Q16 18 27 19" stroke="#c02020" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Shine on front -->
  <path d="M6.5 17.5 Q6 21 6.5 25" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.25"/>
  <!-- Top ellipse shine -->
  <ellipse cx="12" cy="15" rx="4" ry="1.2" fill="#fff" opacity="0.2"/>
</svg>
