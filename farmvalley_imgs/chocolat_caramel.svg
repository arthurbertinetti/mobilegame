<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="chc_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chc_choc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1a08"/>
      <stop offset="100%" stop-color="#2a1208"/>
    </linearGradient>
    <linearGradient id="chc_caramel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b840"/>
      <stop offset="100%" stop-color="#c89020"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30.5" rx="9" ry="1.8" fill="url(#chc_shadow)"/>
  <!-- Main chocolate body - rounded square bonbon -->
  <rect x="7" y="12" width="18" height="17" rx="4" fill="url(#chc_choc)" stroke="#1a0a04" stroke-width="0.6"/>
  <!-- Chocolate gloss -->
  <ellipse cx="12" cy="15" rx="3" ry="1.8" fill="white" opacity="0.18" transform="rotate(-20,12,15)"/>
  <!-- Bite taken - reveals caramel inside -->
  <path d="M21 13 Q27 16 26 21 Q25 25 22 26 L22 13 Z" fill="url(#chc_caramel)" opacity="0.97"/>
  <!-- Caramel ooze edge -->
  <path d="M22 14 Q25 17 24.5 21 Q23.5 24.5 22 25.5" stroke="#c89020" stroke-width="0.5" fill="none" stroke-linecap="round"/>
  <!-- Bite edge ragged -->
  <path d="M21 13 Q23 15.5 22.5 19 Q22 22.5 22 26" stroke="#1a0a04" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- Caramel drip -->
  <path d="M23 22 Q23.5 25 23 28" stroke="#c89020" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <ellipse cx="23" cy="28.5" rx="1.2" ry="0.6" fill="#c89020" opacity="0.7"/>
  <!-- Chocolate shine top -->
  <rect x="9" y="14" width="2" height="5" rx="1" fill="white" opacity="0.15"/>
</svg>
