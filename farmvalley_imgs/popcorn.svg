<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="pc_bucket" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d02020"/>
      <stop offset="20%" stop-color="#f04040"/>
      <stop offset="40%" stop-color="#f8f8f8"/>
      <stop offset="60%" stop-color="#f04040"/>
      <stop offset="80%" stop-color="#f8f8f8"/>
      <stop offset="100%" stop-color="#d02020"/>
    </linearGradient>
    <radialGradient id="pc_pop" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff080"/>
      <stop offset="55%" stop-color="#f0c820"/>
      <stop offset="100%" stop-color="#c09010"/>
    </radialGradient>
    <radialGradient id="pc_pop2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff8a0"/>
      <stop offset="100%" stop-color="#d4a820"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Bucket (slightly tapered top) -->
  <path d="M9,16 L10,30 Q10,31 16,31 Q22,31 22,30 L23,16 Z" fill="url(#pc_bucket)"/>
  <!-- Bucket top rim -->
  <rect x="8.5" y="14.5" width="15" height="2" rx="0.5" fill="#c01818"/>
  <!-- Popcorn overflow at top - back layer -->
  <circle cx="11" cy="14" r="3" fill="url(#pc_pop)"/>
  <circle cx="16" cy="12" r="3.2" fill="url(#pc_pop)"/>
  <circle cx="21" cy="13.5" r="3" fill="url(#pc_pop)"/>
  <!-- Popcorn middle layer -->
  <circle cx="13.5" cy="12.5" r="2.8" fill="url(#pc_pop2)"/>
  <circle cx="18.5" cy="11.5" r="2.8" fill="url(#pc_pop2)"/>
  <!-- Popcorn front bumps -->
  <circle cx="11" cy="13" r="2.5" fill="url(#pc_pop)"/>
  <circle cx="14.5" cy="11.5" r="2.8" fill="url(#pc_pop2)"/>
  <circle cx="19" cy="12" r="2.5" fill="url(#pc_pop)"/>
  <circle cx="22" cy="13" r="2.5" fill="url(#pc_pop2)"/>
  <!-- Popcorn nooks (darker gaps) -->
  <circle cx="12.5" cy="13.5" r="1" fill="#c09010" opacity="0.4"/>
  <circle cx="17" cy="12.5" r="1" fill="#c09010" opacity="0.4"/>
  <circle cx="20.5" cy="13" r="0.8" fill="#c09010" opacity="0.35"/>
  <!-- Bucket stripe highlight -->
  <rect x="12" y="16.5" width="1.5" height="13" rx="0.7" fill="rgba(255,255,255,0.35)"/>
  <rect x="17.5" y="16.5" width="1.5" height="13" rx="0.7" fill="rgba(255,255,255,0.35)"/>
</svg>
