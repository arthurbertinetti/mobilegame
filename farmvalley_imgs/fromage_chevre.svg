<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="gc_log" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#f5f2ea"/>
      <stop offset="60%" stop-color="#e0dacb"/>
      <stop offset="100%" stop-color="#c4bfb0"/>
    </radialGradient>
    <radialGradient id="gc_end" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f0ece0"/>
      <stop offset="100%" stop-color="#d0c8b8"/>
    </radialGradient>
    <radialGradient id="gc_coat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8b5a8"/>
      <stop offset="100%" stop-color="#888478"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.2" rx="11" ry="0.7" fill="#00000018"/>
  <!-- Log body (cylinder lying horizontal) -->
  <path d="M5,17 Q5,14 8,13.5 L24,13.5 Q27,14 27,17 L27,23 Q27,26 24,26.5 L8,26.5 Q5,26 5,23 Z" fill="url(#gc_log)"/>
  <!-- Ash/herb coating (gray-green exterior) -->
  <path d="M5,17 Q5,14 8,13.5 L24,13.5 Q27,14 27,17" stroke="#a0a090" stroke-width="2" fill="none"/>
  <path d="M5,23 Q5,26 8,26.5 L24,26.5 Q27,26 27,23" stroke="#a0a090" stroke-width="2" fill="none"/>
  <!-- Left end circle -->
  <ellipse cx="7" cy="20" rx="2.5" ry="3.5" fill="url(#gc_end)"/>
  <ellipse cx="7" cy="20" rx="2.5" ry="3.5" fill="none" stroke="url(#gc_coat)" stroke-width="1.2"/>
  <!-- Right end circle -->
  <ellipse cx="25" cy="20" rx="2.5" ry="3.5" fill="url(#gc_end)"/>
  <ellipse cx="25" cy="20" rx="2.5" ry="3.5" fill="none" stroke="url(#gc_coat)" stroke-width="1.2"/>
  <!-- Ash coating stripes on body -->
  <path d="M5,17 L27,17" stroke="#a0a090" stroke-width="0.7" fill="none" opacity="0.6"/>
  <path d="M5,23 L27,23" stroke="#a0a090" stroke-width="0.7" fill="none" opacity="0.6"/>
  <!-- Slice cut mark showing inside -->
  <ellipse cx="16" cy="20" rx="2" ry="3" fill="#f0ece0" opacity="0.5"/>
  <!-- Shine -->
  <path d="M9,15.5 Q16,14.5 23,15.5" stroke="rgba(255,255,255,.5)" stroke-width="0.8" fill="none"/>
</svg>
