<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="cr_crepe1" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#e8b848"/>
      <stop offset="55%" stop-color="#c08828"/>
      <stop offset="100%" stop-color="#8a6020"/>
    </radialGradient>
    <radialGradient id="cr_crepe2" cx="42%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0c858"/>
      <stop offset="55%" stop-color="#d4a040"/>
      <stop offset="100%" stop-color="#9a7030"/>
    </radialGradient>
    <radialGradient id="cr_edge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b07820"/>
      <stop offset="100%" stop-color="#7a5010"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Bottom crepe (wider, slightly angled) -->
  <ellipse cx="16" cy="28" rx="10" ry="2" fill="#8a6020"/>
  <path d="M6,27 Q8,22 16,22 Q24,22 26,27 Q24,30 16,30 Q8,30 6,27 Z" fill="url(#cr_crepe1)"/>
  <!-- Bottom crepe folded edge -->
  <path d="M6,27 Q10,25 16,25 Q22,25 26,27" stroke="#7a5010" stroke-width="0.7" fill="none"/>
  <!-- Crepe rolled end (right side) -->
  <ellipse cx="25" cy="27" rx="1.5" ry="2.5" fill="url(#cr_edge)"/>
  <!-- Top crepe (slightly smaller, offset) -->
  <ellipse cx="15" cy="22" rx="9.5" ry="1.8" fill="#9a7030"/>
  <path d="M6,21 Q8,16 15,16 Q22,16 24,21 Q22,24 15,24 Q8,24 6,21 Z" fill="url(#cr_crepe2)"/>
  <!-- Top crepe folded edge -->
  <path d="M6,21 Q10,19.5 15,19.5 Q20,19.5 24,21" stroke="#8a6020" stroke-width="0.7" fill="none"/>
  <!-- Top crepe rolled end -->
  <ellipse cx="23.5" cy="21" rx="1.5" ry="2.2" fill="url(#cr_edge)"/>
  <!-- Texture spots on top crepe (golden bubbles) -->
  <circle cx="11" cy="20" r="1" fill="rgba(160,100,20,0.4)"/>
  <circle cx="15" cy="19" r="0.8" fill="rgba(160,100,20,0.35)"/>
  <circle cx="19" cy="20" r="1" fill="rgba(160,100,20,0.4)"/>
  <circle cx="13" cy="21.5" r="0.7" fill="rgba(160,100,20,0.3)"/>
  <!-- Shine on top crepe -->
  <ellipse cx="10" cy="18.5" rx="3" ry="1" fill="rgba(255,240,180,0.3)" transform="rotate(-10,10,18.5)"/>
</svg>
