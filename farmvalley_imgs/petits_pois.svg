<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pp_pod" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#88d840"/>
      <stop offset="55%" stop-color="#40a010"/>
      <stop offset="100%" stop-color="#206008"/>
    </radialGradient>
    <radialGradient id="pp_pea" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#aae840"/>
      <stop offset="60%" stop-color="#58c018"/>
      <stop offset="100%" stop-color="#30800a"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Pod lower half -->
  <path d="M3.5,19 Q4,24 8,26 Q16,29 24,26 Q28,24 28.5,19 Q16,20 3.5,19 Z" fill="url(#pp_pod)"/>
  <!-- Peas sitting in lower pod -->
  <circle cx="7.5" cy="19.5" r="3.2" fill="url(#pp_pea)"/>
  <circle cx="13" cy="18.8" r="3.2" fill="url(#pp_pea)"/>
  <circle cx="18.5" cy="18.8" r="3.2" fill="url(#pp_pea)"/>
  <circle cx="24" cy="19.5" r="3.2" fill="url(#pp_pea)"/>
  <!-- Pea shine highlights -->
  <circle cx="6.5" cy="18.2" r="1.1" fill="rgba(220,255,180,.55)"/>
  <circle cx="12" cy="17.5" r="1.1" fill="rgba(220,255,180,.55)"/>
  <circle cx="17.5" cy="17.5" r="1.1" fill="rgba(220,255,180,.55)"/>
  <circle cx="23" cy="18.2" r="1.1" fill="rgba(220,255,180,.55)"/>
  <!-- Pod upper half (open) -->
  <path d="M3.5,19 Q4,14 8,12 Q16,9 24,12 Q28,14 28.5,19 Q16,18 3.5,19 Z" fill="url(#pp_pod)"/>
  <!-- Pod upper shine -->
  <path d="M6,15 Q16,13 26,15" stroke="rgba(200,255,140,.4)" stroke-width="1.2" fill="none"/>
  <!-- Pod tip left -->
  <path d="M3.5,19 Q2,18.5 2.5,19 Q2,19.5 3.5,19 Z" fill="#206008"/>
  <!-- Pod tip right -->
  <path d="M28.5,19 Q30,18.5 29.5,19 Q30,19.5 28.5,19 Z" fill="#206008"/>
  <!-- Stem -->
  <path d="M16,9 Q16,6 15,3.5" stroke="#2a8010" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Leaf -->
  <ellipse cx="18.5" cy="5" rx="2.8" ry="1.4" fill="#38a020" transform="rotate(30,18.5,5)"/>
</svg>
