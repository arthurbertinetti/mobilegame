<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="ma_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ma_jar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8e8f8"/>
      <stop offset="30%" stop-color="#f0f8ff"/>
      <stop offset="70%" stop-color="#e0f0fa"/>
      <stop offset="100%" stop-color="#a8d0e8"/>
    </linearGradient>
    <linearGradient id="ma_marm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09040"/>
      <stop offset="100%" stop-color="#e07020"/>
    </linearGradient>
    <linearGradient id="ma_lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f09030"/>
      <stop offset="100%" stop-color="#b05010"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="10" ry="2.5" fill="url(#ma_shadow)"/>
  <!-- Jar body -->
  <rect x="8" y="13" width="16" height="15" rx="3" ry="3" fill="url(#ma_jar)" stroke="#90b8d0" stroke-width="0.8"/>
  <!-- Marmalade fill -->
  <rect x="9" y="17" width="14" height="10" rx="2" ry="2" fill="url(#ma_marm)" opacity="0.88"/>
  <!-- Orange rind pieces inside -->
  <rect x="11" y="21" width="3" height="1" rx="0.5" fill="#c05010" opacity="0.8" transform="rotate(-10,12.5,21.5)"/>
  <rect x="17" y="19.5" width="3" height="1" rx="0.5" fill="#c05010" opacity="0.8" transform="rotate(15,18.5,20)"/>
  <rect x="14" y="23" width="2.5" height="1" rx="0.5" fill="#c05010" opacity="0.8" transform="rotate(5,15.25,23.5)"/>
  <!-- Jar shine -->
  <rect x="10" y="14" width="2.5" height="8" rx="1" fill="white" opacity="0.45"/>
  <!-- Label background -->
  <rect x="10.5" y="18.5" width="11" height="5.5" rx="1.5" fill="white" opacity="0.8"/>
  <!-- Orange slice on label -->
  <circle cx="16" cy="21.5" r="2.2" fill="#f09030" stroke="#c06010" stroke-width="0.5"/>
  <line x1="16" y1="19.3" x2="16" y2="23.7" stroke="#c06010" stroke-width="0.4"/>
  <line x1="13.8" y1="21.5" x2="18.2" y2="21.5" stroke="#c06010" stroke-width="0.4"/>
  <line x1="14.4" y1="19.9" x2="17.6" y2="23.1" stroke="#c06010" stroke-width="0.4"/>
  <line x1="17.6" y1="19.9" x2="14.4" y2="23.1" stroke="#c06010" stroke-width="0.4"/>
  <!-- Neck ring -->
  <rect x="9" y="12" width="14" height="2" rx="1" fill="#b0cfe0" stroke="#90b0c8" stroke-width="0.5"/>
  <!-- Lid -->
  <rect x="9" y="8" width="14" height="5" rx="2" fill="url(#ma_lid)" stroke="#904010" stroke-width="0.6"/>
  <!-- Lid shine -->
  <rect x="11" y="9" width="3" height="2" rx="1" fill="white" opacity="0.3"/>
</svg>
