<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Pot en terre cuite (style rustique) -->
  <path d="M10 14 Q9 20 10 27 Q10 29 16 29 Q22 29 22 27 Q23 20 22 14Z" fill="#d7ccc8"/>
  <!-- Col du pot -->
  <path d="M8 12 Q9 9 16 9 Q23 9 24 12 Q23 14 16 14 Q9 14 8 12Z" fill="#bcaaa4"/>
  <!-- Lait blanc visible dans le pot -->
  <ellipse cx="16" cy="14" rx="6" ry="2.5" fill="white"/>
  <!-- Petite corne de chèvre comme décoration -->
  <path d="M13 6 Q12 4 13 3" fill="none" stroke="#795548" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 6 Q15 4 14 3" fill="none" stroke="#795548" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Motif chèvre -->
  <ellipse cx="14" cy="7" rx="3" ry="2.5" fill="#efebe9"/>
  <!-- Reflet -->
  <line x1="11" y1="15" x2="11" y2="26" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
