<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pg_body" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#ffc8d8"/>
      <stop offset="55%" stop-color="#f090a8"/>
      <stop offset="100%" stop-color="#c05070"/>
    </radialGradient>
    <radialGradient id="pg_head" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#ffd0dc"/>
      <stop offset="60%" stop-color="#f09ab0"/>
      <stop offset="100%" stop-color="#d06080"/>
    </radialGradient>
    <radialGradient id="pg_snout" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0a0b8"/>
      <stop offset="100%" stop-color="#d06080"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="15.5" cy="31.4" rx="10" ry="0.65" fill="#00000020"/>
  <!-- Curly tail -->
  <path d="M25,20 Q29,17.5 29.5,15 Q28.5,14.2 28,15.5 Q27.5,17.5 25.5,19.5" stroke="#e07090" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Back legs -->
  <rect x="18.5" y="26" width="3" height="5" rx="1.4" fill="#e080a0"/>
  <rect x="22.5" y="25.5" width="3" height="5" rx="1.4" fill="#e080a0"/>
  <!-- Front legs -->
  <rect x="7" y="26.5" width="3" height="5" rx="1.4" fill="#e080a0"/>
  <rect x="11" y="26.5" width="3" height="5" rx="1.4" fill="#e080a0"/>
  <!-- Body (round, plump) -->
  <ellipse cx="17" cy="22" rx="10" ry="8" fill="url(#pg_body)"/>
  <!-- Belly lighter patch -->
  <ellipse cx="16" cy="23.5" rx="5.5" ry="4" fill="#ffd8e4" opacity="0.45"/>
  <!-- Head -->
  <ellipse cx="9" cy="17" rx="6.5" ry="6" fill="url(#pg_head)"/>
  <!-- Ear (floppy, folded forward) -->
  <path d="M9,11.5 Q9.5,8 12,8 Q13,9.5 11.5,11.5 Z" fill="#f090a8"/>
  <path d="M9.5,11.5 Q10,9 11.5,9 Q12,10 11,11.5 Z" fill="#d06080" opacity="0.5"/>
  <!-- Big round snout (THE key pig feature) -->
  <ellipse cx="5.5" cy="18.5" rx="4" ry="3.2" fill="url(#pg_snout)"/>
  <!-- Nostrils -->
  <ellipse cx="4.2" cy="18.2" rx="1" ry="1.1" fill="#8a2040"/>
  <ellipse cx="6.8" cy="18.2" rx="1" ry="1.1" fill="#8a2040"/>
  <!-- Eye -->
  <circle cx="9.5" cy="13.5" r="1.3" fill="#1a0a10"/>
  <circle cx="9.1" cy="13.1" r="0.4" fill="#ffffff55"/>
  <!-- Shine on body -->
  <path d="M9,18.5 Q14,16 20,18" stroke="rgba(255,220,230,.4)" stroke-width="1" fill="none"/>
</svg>
