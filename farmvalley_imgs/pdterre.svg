<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Plante dessus sol -->
  <line x1="16" y1="18" x2="16" y2="6" stroke="#558b2f" stroke-width="1.5"/>
  <ellipse cx="10" cy="12" rx="5.5" ry="3" fill="#4caf50" transform="rotate(-20 10 12)"/>
  <ellipse cx="22" cy="12" rx="5.5" ry="3" fill="#388e3c" transform="rotate(20 22 12)"/>
  <ellipse cx="9" cy="7" rx="5" ry="2.8" fill="#66bb6a" transform="rotate(-15 9 7)"/>
  <ellipse cx="23" cy="7" rx="5" ry="2.8" fill="#4caf50" transform="rotate(15 23 7)"/>
  <ellipse cx="16" cy="5" rx="4.5" ry="2.5" fill="#81c784"/>
  <!-- Sol (ligne de sol) -->
  <rect x="3" y="18" width="26" height="13" rx="2" fill="#5d3c1e"/>
  <ellipse cx="16" cy="18" rx="13" ry="2.5" fill="#7a5c38"/>
  <!-- Pommes de terre sous le sol -->
  <defs>
    <radialGradient id="ptg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d4a76a"/>
      <stop offset="100%" stop-color="#a0784a"/>
    </radialGradient>
  </defs>
  <ellipse cx="10" cy="24" rx="5.5" ry="4" fill="url(#ptg)"/>
  <ellipse cx="22" cy="24" rx="5.5" ry="4" fill="url(#ptg)"/>
  <ellipse cx="16" cy="27" rx="4.5" ry="3.5" fill="url(#ptg)"/>
  <!-- Yeux des pommes de terre -->
  <circle cx="9" cy="23" r="0.7" fill="#8d6e63"/>
  <circle cx="12" cy="25" r="0.6" fill="#8d6e63"/>
  <circle cx="21" cy="23" r="0.7" fill="#8d6e63"/>
  <circle cx="24" cy="25" r="0.6" fill="#8d6e63"/>
  <!-- Radicelles -->
  <line x1="16" y1="18" x2="10" y2="22" stroke="#a0784a" stroke-width="0.8"/>
  <line x1="16" y1="18" x2="22" y2="22" stroke="#a0784a" stroke-width="0.8"/>
  <line x1="16" y1="18" x2="16" y2="25" stroke="#a0784a" stroke-width="0.8"/>
</svg>
