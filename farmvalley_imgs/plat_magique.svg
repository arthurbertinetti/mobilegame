<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="magic_plate" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f8f0d0"/>
      <stop offset="100%" stop-color="#e0d090"/>
    </radialGradient>
    <radialGradient id="magic_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8e84080"/>
      <stop offset="60%" stop-color="#f0c02040"/>
      <stop offset="100%" stop-color="#f0d02000"/>
    </radialGradient>
    <radialGradient id="food_glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffe060"/>
      <stop offset="100%" stop-color="#c09010"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Glow aura under plate -->
  <ellipse cx="16" cy="24" rx="13" ry="6" fill="url(#magic_glow)"/>
  <!-- Plate -->
  <ellipse cx="16" cy="23" rx="12" ry="5" fill="url(#magic_plate)"/>
  <ellipse cx="16" cy="23" rx="12" ry="5" fill="none" stroke="#e0d060" stroke-width="1"/>
  <ellipse cx="16" cy="23" rx="9" ry="3.8" fill="none" stroke="#f0e080" stroke-width="0.4"/>
  <!-- Glowing food on plate -->
  <ellipse cx="16" cy="21.5" rx="5" ry="3" fill="url(#food_glow)"/>
  <ellipse cx="16" cy="21" rx="3.5" ry="2" fill="#ffe880"/>
  <!-- Swirling magic sparkles above -->
  <path d="M13 19 Q11 15 13 12 Q16 9 19 12 Q21 15 19 19" stroke="#f0d020" stroke-width="0.8" fill="none" opacity="0.8"/>
  <!-- Sparkle stars -->
  <line x1="12" y1="14" x2="14" y2="16" stroke="#ffe060" stroke-width="0.8"/>
  <line x1="12" y1="16" x2="14" y2="14" stroke="#ffe060" stroke-width="0.8"/>
  <circle cx="13" cy="15" r="0.5" fill="#ffffff"/>
  <line x1="18" y1="11" x2="20" y2="13" stroke="#ffc020" stroke-width="0.8"/>
  <line x1="18" y1="13" x2="20" y2="11" stroke="#ffc020" stroke-width="0.8"/>
  <circle cx="19" cy="12" r="0.5" fill="#ffffff"/>
  <line x1="22" y1="15" x2="24" y2="17" stroke="#ffe060" stroke-width="0.8"/>
  <line x1="22" y1="17" x2="24" y2="15" stroke="#ffe060" stroke-width="0.8"/>
  <!-- Swirl particles -->
  <circle cx="11" cy="17" r="0.6" fill="#f0d020" opacity="0.8"/>
  <circle cx="21" cy="17" r="0.6" fill="#f0d020" opacity="0.8"/>
  <circle cx="16" cy="10" r="0.7" fill="#ffe060" opacity="0.9"/>
  <circle cx="14" cy="11" r="0.4" fill="#ffffff" opacity="0.8"/>
  <circle cx="18" cy="10" r="0.4" fill="#ffffff" opacity="0.8"/>
</svg>
