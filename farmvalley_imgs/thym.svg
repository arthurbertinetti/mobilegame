<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Thym: petite plante ligneuse, minuscules feuilles gris-vert, petites fleurs mauves -->
  <rect x="14.5" y="27" width="3" height="4" rx="1" fill="#5d4037"/>
  <!-- Tige principale -->
  <line x1="16" y1="27" x2="16" y2="8" stroke="#6d4c41" stroke-width="1.5"/>
  <!-- Branches gauche -->
  <line x1="16" y1="23" x2="9" y2="19" stroke="#6d4c41" stroke-width="1.2"/>
  <ellipse cx="8.5" cy="18" rx="2.5" ry="1.4" fill="#78909c" transform="rotate(-20 8.5 18)"/>
  <ellipse cx="6.5" cy="20" rx="2" ry="1.2" fill="#90a4ae" transform="rotate(-40 6.5 20)"/>
  <line x1="16" y1="17" x2="8" y2="12" stroke="#6d4c41" stroke-width="1.2"/>
  <ellipse cx="7" cy="11" rx="2.5" ry="1.4" fill="#78909c" transform="rotate(-30 7 11)"/>
  <ellipse cx="5" cy="13" rx="2" ry="1.2" fill="#90a4ae" transform="rotate(-50 5 13)"/>
  <!-- Branches droite -->
  <line x1="16" y1="23" x2="23" y2="19" stroke="#6d4c41" stroke-width="1.2"/>
  <ellipse cx="23.5" cy="18" rx="2.5" ry="1.4" fill="#78909c" transform="rotate(20 23.5 18)"/>
  <ellipse cx="25.5" cy="20" rx="2" ry="1.2" fill="#90a4ae" transform="rotate(40 25.5 20)"/>
  <line x1="16" y1="17" x2="24" y2="12" stroke="#6d4c41" stroke-width="1.2"/>
  <ellipse cx="25" cy="11" rx="2.5" ry="1.4" fill="#78909c" transform="rotate(30 25 11)"/>
  <ellipse cx="27" cy="13" rx="2" ry="1.2" fill="#90a4ae" transform="rotate(50 27 13)"/>
  <!-- Fleurs mauves au sommet -->
  <ellipse cx="16" cy="7" rx="2.5" ry="1.4" fill="#78909c"/>
  <circle cx="14" cy="6" r="1.3" fill="#ce93d8"/>
  <circle cx="16" cy="5" r="1.3" fill="#ba68c8"/>
  <circle cx="18" cy="6" r="1.3" fill="#ce93d8"/>
</svg>
