<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tablecloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#d8c8a8"/>
    </linearGradient>
    <linearGradient id="table_side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b09070"/>
      <stop offset="100%" stop-color="#705030"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Table top (angled perspective) -->
  <path d="M2 16 L4 12 L28 12 L30 16 L28 20 L4 20 Z" fill="url(#tablecloth)"/>
  <!-- Table side -->
  <path d="M2 16 L4 20 L28 20 L30 16 Z" fill="url(#table_side)" opacity="0.7"/>
  <!-- Tablecloth border pattern -->
  <path d="M2 16 L4 12 L28 12 L30 16" stroke="#c0a880" stroke-width="0.5" fill="none"/>
  <!-- Plates on table -->
  <!-- Red plate -->
  <ellipse cx="7" cy="15" rx="3" ry="2" fill="#e04030"/>
  <ellipse cx="7" cy="15" rx="2" ry="1.3" fill="#f06050"/>
  <ellipse cx="7" cy="14.7" rx="1" ry="0.7" fill="#c0a060"/>
  <!-- White plate -->
  <ellipse cx="16" cy="14" rx="3" ry="2" fill="#f0f0f0" stroke="#c0c0c0" stroke-width="0.3"/>
  <ellipse cx="16" cy="13.7" rx="1.5" ry="1" fill="#d0b080"/>
  <!-- Blue plate -->
  <ellipse cx="25" cy="15" rx="3" ry="2" fill="#4060d0"/>
  <ellipse cx="25" cy="14.7" rx="1.5" ry="1" fill="#e0c080"/>
  <!-- Candle -->
  <rect x="15" y="9" width="2" height="4" fill="#f0e8c0"/>
  <path d="M16 9 Q16.5 7.5 16 7 Q15.5 7.5 16 9" fill="#f08020"/>
  <!-- Glasses -->
  <path d="M10 13 Q9.5 15 10 16 L11.5 16 Q12 15 11.5 13 Z" fill="#e0f0f080" stroke="#a0c0d0" stroke-width="0.3"/>
  <path d="M21 13 Q20.5 15 21 16 L22.5 16 Q23 15 22.5 13 Z" fill="#e0f0f080" stroke="#a0c0d0" stroke-width="0.3"/>
  <!-- Flower vase -->
  <rect x="15.5" y="7" width="1" height="2" fill="#c0c0c0"/>
  <circle cx="14.5" cy="7" r="0.8" fill="#f06080"/>
  <circle cx="16" cy="6.5" r="0.8" fill="#f0d020"/>
  <circle cx="17.5" cy="7" r="0.8" fill="#e06080"/>
</svg>
