<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="fr_main" cx="38%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#f8e060"/>
      <stop offset="55%" stop-color="#e0b820"/>
      <stop offset="100%" stop-color="#b88010"/>
    </radialGradient>
    <radialGradient id="fr_cut" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f0d448"/>
      <stop offset="100%" stop-color="#c89018"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.2" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Cheese wheel main face (front) -->
  <ellipse cx="16" cy="24" rx="12" ry="6" fill="url(#fr_main)"/>
  <!-- Cheese wheel side (thickness) -->
  <path d="M4,20 Q4,24 16,26 Q28,24 28,20 L28,22 Q28,26 16,28 Q4,26 4,22 Z" fill="#c89018"/>
  <!-- Top of wheel -->
  <ellipse cx="16" cy="20" rx="12" ry="6" fill="url(#fr_main)"/>
  <!-- Rind edge -->
  <ellipse cx="16" cy="20" rx="12" ry="6" fill="none" stroke="#b07808" stroke-width="1.2"/>
  <!-- Holes (bubbles in cheese) -->
  <ellipse cx="11" cy="19" rx="2" ry="1.3" fill="#c08808" opacity="0.7"/>
  <ellipse cx="20" cy="21" rx="1.8" ry="1.2" fill="#c08808" opacity="0.7"/>
  <ellipse cx="16" cy="17" rx="1.5" ry="1" fill="#c08808" opacity="0.65"/>
  <ellipse cx="23" cy="18" rx="1.2" ry="0.8" fill="#c08808" opacity="0.6"/>
  <!-- Shine -->
  <path d="M7,18 Q14,16 21,18" stroke="rgba(255,255,200,.45)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
