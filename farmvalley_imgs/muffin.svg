<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="muf_top" cx="38%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#b06040"/>
      <stop offset="55%" stop-color="#8a4020"/>
      <stop offset="100%" stop-color="#5a2010"/>
    </radialGradient>
    <linearGradient id="muf_wrapper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="50%" stop-color="#f8f4ec"/>
      <stop offset="100%" stop-color="#e0d8c8"/>
    </linearGradient>
    <radialGradient id="muf_swirl" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6a3018"/>
      <stop offset="100%" stop-color="#4a2010"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Paper wrapper -->
  <path d="M9,20 L10,30 Q10,31 16,31 Q22,31 22,30 L23,20 Z" fill="url(#muf_wrapper)"/>
  <!-- Wrapper pleats (vertical lines) -->
  <line x1="11" y1="20" x2="11.5" y2="30.5" stroke="#c8c0b0" stroke-width="0.5"/>
  <line x1="13.5" y1="20" x2="14" y2="30.8" stroke="#c8c0b0" stroke-width="0.5"/>
  <line x1="16" y1="20" x2="16" y2="31" stroke="#c8c0b0" stroke-width="0.5"/>
  <line x1="18.5" y1="20" x2="18" y2="30.8" stroke="#c8c0b0" stroke-width="0.5"/>
  <line x1="21" y1="20" x2="20.5" y2="30.5" stroke="#c8c0b0" stroke-width="0.5"/>
  <!-- Wrapper top rim -->
  <rect x="8.5" y="18.5" width="15" height="2" rx="0.5" fill="#d0c8b8"/>
  <!-- Muffin top (dome) -->
  <ellipse cx="16" cy="17" rx="9.5" ry="5" fill="url(#muf_top)"/>
  <!-- Chocolate swirl on top -->
  <path d="M16,13 Q19,14 20,16.5 Q21,19 18,20 Q15,21 13,19 Q11,17 12,15 Q13,13.5 16,13 Z" stroke="url(#muf_swirl)" stroke-width="1.5" fill="none"/>
  <path d="M16,14.5 Q18,15.5 18.5,17.5 Q17,19.5 15,18.5" stroke="#3a1808" stroke-width="0.8" fill="none"/>
  <!-- Chocolate chips on muffin top -->
  <ellipse cx="12" cy="17" rx="1" ry="0.7" fill="#3a1808"/>
  <ellipse cx="20" cy="16" rx="1" ry="0.7" fill="#3a1808"/>
  <ellipse cx="15" cy="14.5" rx="0.9" ry="0.6" fill="#3a1808"/>
  <ellipse cx="19" cy="19" rx="0.8" ry="0.6" fill="#3a1808"/>
  <!-- Muffin top highlight -->
  <ellipse cx="13" cy="15" rx="3" ry="1.5" fill="rgba(200,140,80,0.35)"/>
</svg>
