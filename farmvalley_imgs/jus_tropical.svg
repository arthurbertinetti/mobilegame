<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="jt_glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0e8ff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#e8f8ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#90c8e8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="jt_orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8a030"/>
      <stop offset="100%" stop-color="#e06010"/>
    </linearGradient>
    <linearGradient id="jt_yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e040"/>
      <stop offset="100%" stop-color="#d0b010"/>
    </linearGradient>
    <radialGradient id="jt_shine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Glass body -->
  <path d="M10,7 L10,28 Q10,30 16,30 Q22,30 22,28 L22,7 Z" fill="url(#jt_glass)" stroke="#a0c8e0" stroke-width="0.5"/>
  <!-- Orange layer (bottom) -->
  <path d="M10.2,18 L10.2,28 Q10.2,29.8 16,29.8 Q21.8,29.8 21.8,28 L21.8,18 Z" fill="url(#jt_orange)"/>
  <!-- Yellow layer (top) -->
  <path d="M10.2,10 L10.2,18 L21.8,18 L21.8,10 Z" fill="url(#jt_yellow)"/>
  <!-- Layer divider wave -->
  <path d="M10.2,18 Q13,17 16,18 Q19,19 21.8,18" stroke="#e09020" stroke-width="0.6" fill="none"/>
  <!-- Glass overlay (shine) -->
  <path d="M10,7 L10,28 Q10,30 16,30 Q22,30 22,28 L22,7 Z" fill="url(#jt_shine)"/>
  <!-- Glass rim -->
  <rect x="9.5" y="6" width="13" height="1.5" rx="0.7" fill="#c0d8e8"/>
  <!-- Glass left highlight -->
  <rect x="11" y="10" width="1.2" height="14" rx="0.6" fill="rgba(255,255,255,0.45)"/>
  <!-- Straw -->
  <rect x="19" y="4" width="1.5" height="16" rx="0.7" fill="#ff6060"/>
  <rect x="19.3" y="4" width="0.5" height="16" rx="0.25" fill="rgba(255,255,255,0.4)"/>
  <!-- Tropical flower garnish -->
  <circle cx="13" cy="6" r="1.5" fill="#ff80a0"/>
  <circle cx="13" cy="4.5" r="1" fill="#ffb040"/>
  <circle cx="11.5" cy="5.5" r="1" fill="#ff80a0"/>
  <circle cx="14.5" cy="5.5" r="1" fill="#ff80a0"/>
  <circle cx="11.8" cy="7" r="1" fill="#ff80a0"/>
  <circle cx="14.2" cy="7" r="1" fill="#ff80a0"/>
  <circle cx="13" cy="5.8" r="1.2" fill="#ffe060"/>
</svg>
