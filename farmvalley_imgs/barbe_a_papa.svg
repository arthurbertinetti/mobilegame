<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bap_cloud" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#f090d8"/>
      <stop offset="55%" stop-color="#e060c0"/>
      <stop offset="100%" stop-color="#c040a0"/>
    </radialGradient>
    <radialGradient id="bap_inner" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f8b0e8"/>
      <stop offset="100%" stop-color="#d050b0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="5" ry="0.7" fill="#00000028"/>
  <!-- White stick -->
  <rect x="14.5" y="22" width="3" height="9.5" rx="1.5" fill="#f8f8f8"/>
  <rect x="15" y="22" width="2" height="9.5" rx="1" fill="#ffffff"/>
  <!-- Cotton candy cloud - fluffy bumps -->
  <circle cx="16" cy="16" r="9" fill="url(#bap_cloud)"/>
  <circle cx="10" cy="15" r="6" fill="url(#bap_cloud)"/>
  <circle cx="22" cy="15" r="6" fill="url(#bap_cloud)"/>
  <circle cx="13" cy="10" r="5.5" fill="url(#bap_inner)"/>
  <circle cx="19" cy="10" r="5.5" fill="url(#bap_inner)"/>
  <circle cx="16" cy="8" r="5" fill="url(#bap_cloud)"/>
  <!-- Purple accent swirls -->
  <circle cx="8" cy="18" r="4" fill="#c040a0" opacity="0.6"/>
  <circle cx="24" cy="18" r="4" fill="#c040a0" opacity="0.6"/>
  <circle cx="16" cy="22" r="3.5" fill="#d050b0" opacity="0.5"/>
  <!-- Highlights -->
  <ellipse cx="12" cy="11" rx="4" ry="2.5" fill="rgba(255,200,240,0.5)" transform="rotate(-20,12,11)"/>
  <ellipse cx="10" cy="13" rx="2.5" ry="1.5" fill="rgba(255,220,250,0.45)"/>
</svg>
