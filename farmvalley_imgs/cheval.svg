<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="hr_body" cx="40%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#cc7030"/>
      <stop offset="40%" stop-color="#944810"/>
      <stop offset="80%" stop-color="#5c2808"/>
      <stop offset="100%" stop-color="#3a1804"/>
    </radialGradient>
    <radialGradient id="hr_head" cx="38%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#c26820"/>
      <stop offset="55%" stop-color="#8a3a08"/>
      <stop offset="100%" stop-color="#541e04"/>
    </radialGradient>
    <linearGradient id="hr_mane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c1a06"/>
      <stop offset="100%" stop-color="#1a0804"/>
    </linearGradient>
    <radialGradient id="hr_muz" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d09860"/>
      <stop offset="100%" stop-color="#9a6030"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10.5" ry="0.65" fill="#00000020"/>
  <!-- Flowing tail (dark, multi-strand) -->
  <path d="M26.5,21 Q31.5,17 32,12.5 Q29.5,16.5 28.5,20.5 Q32,14 31.5,10.5 Q28.5,14.5 27.5,19.5 Q30,13 29,10 Q26.5,14.5 26,20" fill="url(#hr_mane)" opacity="0.9"/>
  <!-- Rear legs -->
  <path d="M20,25.5 L19.5,29 Q20,30.5 19.5,31.5" stroke="#5a2808" stroke-width="1.9" fill="none" stroke-linecap="round"/>
  <path d="M22.5,24.5 L22,28 Q22.5,29.5 22,31" stroke="#5a2808" stroke-width="1.9" fill="none" stroke-linecap="round"/>
  <!-- Front legs -->
  <path d="M10.5,25.5 L10,29 Q10.5,30.5 10,31.5" stroke="#5a2808" stroke-width="1.9" fill="none" stroke-linecap="round"/>
  <path d="M13,26 L12.5,29.5 Q13,31 12.5,31.5" stroke="#5a2808" stroke-width="1.9" fill="none" stroke-linecap="round"/>
  <!-- Hooves -->
  <ellipse cx="10" cy="31.8" rx="1.3" ry="0.6" fill="#1a0804"/>
  <ellipse cx="12.5" cy="31.8" rx="1.3" ry="0.6" fill="#1a0804"/>
  <ellipse cx="19.5" cy="31.8" rx="1.3" ry="0.6" fill="#1a0804"/>
  <ellipse cx="22" cy="31.3" rx="1.3" ry="0.6" fill="#1a0804"/>
  <!-- Body (muscular, slightly arched back) -->
  <path d="M9,22 Q8.5,15.5 13.5,13.5 Q21,12 25.5,16 Q28.5,19 27.5,25.5 Q24.5,29 17,29 Q9,28.5 9,22 Z" fill="url(#hr_body)"/>
  <!-- Hindquarter muscle shading -->
  <path d="M22.5,16.5 Q27,19 27,25" stroke="#3a1504" stroke-width="3" fill="none" opacity="0.18"/>
  <!-- Neck (arched, muscular) -->
  <path d="M11,16.5 Q9,11.5 10,8 Q12.5,8.5 13.5,15.5 Z" fill="url(#hr_head)"/>
  <!-- Head (elongated horse profile) -->
  <path d="M8,13 Q8.5,8.5 11.5,6.5 Q14,5.5 15,7 Q15.5,9.5 14,12.5 Q14.5,14.5 13,16.5 Q10.5,17 8,13 Z" fill="url(#hr_head)"/>
  <!-- Muzzle (slightly paler) -->
  <ellipse cx="8.3" cy="14.5" rx="2.3" ry="1.7" fill="url(#hr_muz)"/>
  <!-- Nostril -->
  <ellipse cx="7.5" cy="14.7" rx="0.68" ry="0.75" fill="#5a2808"/>
  <!-- Ear (pricked, pointed) -->
  <path d="M13.5,6.5 Q14,4 15,3.5 Q15.5,5 15,6.5 Z" fill="#7a3a08"/>
  <!-- Forelock falling over forehead -->
  <path d="M12.5,6.5 Q11,7 10,9 Q11.5,9.5 13,7.5" fill="url(#hr_mane)"/>
  <!-- Mane (thick, flowing down neck) -->
  <path d="M11.5,9 Q10,10.5 10.5,13 Q12,12.5 13,10" fill="url(#hr_mane)"/>
  <path d="M11,11.5 Q9.5,13 10.2,15.5 Q11.5,15 12.5,12.5" fill="url(#hr_mane)" opacity="0.8"/>
  <!-- Eye (large, dark with highlight) -->
  <ellipse cx="13.2" cy="8.5" rx="1.3" ry="1.15" fill="#180a00"/>
  <ellipse cx="12.9" cy="8.2" rx="0.5" ry="0.42" fill="#6a3008" opacity="0.65"/>
  <circle cx="13.7" cy="7.9" r="0.3" fill="#ffffff50"/>
</svg>
