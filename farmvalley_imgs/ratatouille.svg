<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dishG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e0c8b0"/>
      <stop offset="100%" stop-color="#b8a090"/>
    </radialGradient>
    <radialGradient id="tomatoG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f04030"/>
      <stop offset="100%" stop-color="#b02010"/>
    </radialGradient>
    <radialGradient id="squashG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f08020"/>
      <stop offset="100%" stop-color="#c05010"/>
    </radialGradient>
    <radialGradient id="eggplantG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8040a0"/>
      <stop offset="100%" stop-color="#502060"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="14" ry="2.5" fill="url(#shadowG)"/>
  <!-- Oval baking dish -->
  <ellipse cx="16" cy="18" rx="14" ry="11" fill="url(#dishG)" stroke="#a08870" stroke-width="0.8"/>
  <!-- Dish inner -->
  <ellipse cx="16" cy="18.5" rx="12" ry="9" fill="#c8a888" opacity="0.4"/>
  <!-- Vegetable slices in spiral arrangement -->
  <!-- Outer ring -->
  <circle cx="16" cy="10" r="3.2" fill="url(#tomatoG)" stroke="#c03020" stroke-width="0.4"/>
  <line x1="13" y1="10" x2="19" y2="10" stroke="#d03020" stroke-width="0.3" opacity="0.5"/>
  <line x1="16" y1="7" x2="16" y2="13" stroke="#d03020" stroke-width="0.3" opacity="0.5"/>
  <circle cx="23" cy="14" r="3.2" fill="url(#squashG)" stroke="#c06010" stroke-width="0.4"/>
  <circle cx="23" cy="22" r="3.2" fill="url(#eggplantG)" stroke="#602080" stroke-width="0.4"/>
  <circle cx="16" cy="26" r="3.2" fill="url(#tomatoG)" stroke="#c03020" stroke-width="0.4"/>
  <line x1="13" y1="26" x2="19" y2="26" stroke="#d03020" stroke-width="0.3" opacity="0.5"/>
  <circle cx="9" cy="22" r="3.2" fill="url(#squashG)" stroke="#c06010" stroke-width="0.4"/>
  <circle cx="9" cy="14" r="3.2" fill="url(#eggplantG)" stroke="#602080" stroke-width="0.4"/>
  <!-- Center -->
  <circle cx="16" cy="18" r="3" fill="url(#tomatoG)" stroke="#c03020" stroke-width="0.4"/>
  <line x1="13.2" y1="18" x2="18.8" y2="18" stroke="#d03020" stroke-width="0.3" opacity="0.6"/>
  <line x1="16" y1="15.2" x2="16" y2="20.8" stroke="#d03020" stroke-width="0.3" opacity="0.6"/>
</svg>
