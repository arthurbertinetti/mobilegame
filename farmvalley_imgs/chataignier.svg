<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sol -->
  <rect x="3" y="28" width="26" height="4" rx="2" fill="#6b4f2c"/>
  <!-- Tronc large et robuste -->
  <path d="M13 28 Q12 22 13 17 Q14.5 15 16 16 Q17.5 15 19 17 Q20 22 19 28Z" fill="#5d4037"/>
  <path d="M14 28 Q13 22 14 18 Q15 16.5 16 17 Q17 16.5 18 18 Q19 22 18 28Z" fill="#795548"/>
  <!-- Canopée large et étalée (châtaignier a une forme étalée) -->
  <ellipse cx="16" cy="12" rx="14" ry="10" fill="#1b5e20"/>
  <ellipse cx="16" cy="11" rx="13" ry="9" fill="#2e7d32"/>
  <ellipse cx="6" cy="14" rx="9" ry="7" fill="#1b5e20"/>
  <ellipse cx="26" cy="14" rx="9" ry="7" fill="#1b5e20"/>
  <ellipse cx="16" cy="5" rx="11" ry="7" fill="#33691e"/>
  <ellipse cx="11" cy="7" rx="7" ry="5" fill="#388e3c"/>
  <ellipse cx="21" cy="7" rx="7" ry="5" fill="#388e3c"/>
  <!-- Châtaignes (petites, avec bogues) -->
  <defs>
    <radialGradient id="chg" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="50%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </radialGradient>
  </defs>
  <!-- Bogue épineuse (cercle vert avec pointes) -->
  <circle cx="9" cy="18" r="3" fill="#558b2f"/>
  <line x1="9" y1="14.8" x2="9" y2="14" stroke="#33691e" stroke-width="0.8"/>
  <line x1="11.8" y1="16" x2="12.5" y2="15.5" stroke="#33691e" stroke-width="0.8"/>
  <line x1="12" y1="18.5" x2="12.8" y2="18.5" stroke="#33691e" stroke-width="0.8"/>
  <line x1="6.2" y1="16" x2="5.5" y2="15.5" stroke="#33691e" stroke-width="0.8"/>
  <line x1="6" y1="19" x2="5.2" y2="19" stroke="#33691e" stroke-width="0.8"/>
  <!-- Châtaignes visibles -->
  <circle cx="8.5" cy="18.2" r="1.5" fill="url(#chg)"/>
  <circle cx="10" cy="18.5" r="1.5" fill="url(#chg)"/>
  <!-- Deuxième bogue -->
  <circle cx="23" cy="17" r="3" fill="#558b2f"/>
  <line x1="23" y1="13.8" x2="23" y2="13" stroke="#33691e" stroke-width="0.8"/>
  <line x1="25.8" y1="15" x2="26.5" y2="14.5" stroke="#33691e" stroke-width="0.8"/>
  <line x1="26" y1="17.5" x2="26.8" y2="17.5" stroke="#33691e" stroke-width="0.8"/>
  <line x1="20.2" y1="15" x2="19.5" y2="14.5" stroke="#33691e" stroke-width="0.8"/>
  <circle cx="22.5" cy="17.2" r="1.5" fill="url(#chg)"/>
  <circle cx="24" cy="17.5" r="1.5" fill="url(#chg)"/>
  <!-- Lumière canopée -->
  <ellipse cx="12" cy="7" rx="5.5" ry="3.5" fill="#43a047" opacity="0.35"/>
</svg>
