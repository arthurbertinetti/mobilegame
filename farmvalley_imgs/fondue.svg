<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="fo_pot" cx="38%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#c09060"/>
      <stop offset="55%" stop-color="#907040"/>
      <stop offset="100%" stop-color="#604820"/>
    </radialGradient>
    <radialGradient id="fo_cheese" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f8e060"/>
      <stop offset="60%" stop-color="#e0b820"/>
      <stop offset="100%" stop-color="#b88010"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="11" ry="0.7" fill="#00000020"/>
  <!-- Pot stand legs -->
  <rect x="8" y="27" width="3" height="3.5" rx="0.5" fill="#504030"/>
  <rect x="21" y="27" width="3" height="3.5" rx="0.5" fill="#504030"/>
  <!-- Fondue pot body -->
  <path d="M5,18 Q5,14 8,13 L24,13 Q27,14 27,18 L27,26 Q27,28 24,28.5 L8,28.5 Q5,28 5,26 Z" fill="url(#fo_pot)"/>
  <!-- Melted cheese inside -->
  <ellipse cx="16" cy="16.5" rx="10" ry="3.5" fill="url(#fo_cheese)"/>
  <!-- Cheese surface bubbles -->
  <ellipse cx="12" cy="16" rx="1.5" ry="0.8" fill="#f0d040" opacity="0.7"/>
  <ellipse cx="20" cy="16.5" rx="1.3" ry="0.7" fill="#f0d040" opacity="0.65"/>
  <ellipse cx="16" cy="15.5" rx="1.2" ry="0.6" fill="#f8e860" opacity="0.6"/>
  <!-- Fork dipping in -->
  <path d="M22,8 L22,20" stroke="#808080" stroke-width="1.2" fill="none"/>
  <path d="M20.5,12 L20.5,8" stroke="#808080" stroke-width="0.8" fill="none"/>
  <path d="M23.5,12 L23.5,8" stroke="#808080" stroke-width="0.8" fill="none"/>
  <!-- Bread on fork tip -->
  <rect x="20.5" y="18" width="3" height="2.5" rx="1" fill="#d4904a"/>
  <!-- Pot handle -->
  <path d="M3,20 Q1.5,20 1.5,22 Q1.5,24 3,24" stroke="url(#fo_pot)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M29,20 Q30.5,20 30.5,22 Q30.5,24 29,24" stroke="url(#fo_pot)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Shine on pot -->
  <path d="M7,15 Q10,14 14,14.5" stroke="rgba(255,220,150,.4)" stroke-width="1" fill="none"/>
  <!-- Stand flame -->
  <path d="M11.5,30 Q12,28 13,29.5" stroke="#e08020" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M19,30 Q19.5,28 20.5,29.5" stroke="#e08020" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
