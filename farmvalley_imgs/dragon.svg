<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="dg_body" cx="42%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#4a9848"/>
      <stop offset="50%" stop-color="#2e6828"/>
      <stop offset="100%" stop-color="#143808"/>
    </radialGradient>
    <radialGradient id="dg_head" cx="40%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#408038"/>
      <stop offset="100%" stop-color="#1e4010"/>
    </radialGradient>
    <radialGradient id="dg_belly" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#d8c870"/>
      <stop offset="60%" stop-color="#b0a040"/>
      <stop offset="100%" stop-color="#807018"/>
    </radialGradient>
    <linearGradient id="dg_wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e6828"/>
      <stop offset="60%" stop-color="#1a4010"/>
      <stop offset="100%" stop-color="#0a2004"/>
    </linearGradient>
    <linearGradient id="dg_scale" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a7830"/>
      <stop offset="100%" stop-color="#1e5018"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="15" cy="31.5" rx="10" ry="0.8" fill="#00000020"/>
  <!-- Leathery wing (folded, behind body) -->
  <path d="M14,20 Q9,16 7,11 Q8,9 10,10 Q11,13 13,17 Q14,18.5 14,20 Z" fill="url(#dg_wing)"/>
  <!-- Wing membrane veins -->
  <path d="M10,10.5 Q11.5,13.5 13,17.5" stroke="#3a6030" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M9.5,11 Q10.5,14 12.5,18" stroke="#3a6030" stroke-width="0.4" fill="none" opacity="0.5"/>
  <!-- Tail (curved, powerful) -->
  <path d="M24,21 Q28.5,19 30,17 Q29,18.5 28.5,21 Q30,19 30.5,16 Q28.5,18 28,21.5 Q30,18.5 29.5,15.5 Q27,18.5 26.5,22 Q27.5,19 27,16.5 Q25,19.5 24.5,23" stroke="#2e6828" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Tail tip (arrow/spade) -->
  <path d="M24,23 Q26,24 25.5,25.5 Q24,25 23.5,23.5 Z" fill="#1a4010"/>
  <!-- Rear legs -->
  <path d="M19,25 L18.5,29.5" stroke="#2a5818" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M18.5,29.5 L17,31 M18.5,29.5 L19,31 M18.5,29.5 L20.5,30.5" stroke="#1a3808" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Front legs (clawed) -->
  <path d="M11,24.5 L10.5,28" stroke="#2a5818" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M10.5,28 L9,29.5 M10.5,28 L10.5,29.5 M10.5,28 L12,29" stroke="#1a3808" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Body (main) -->
  <path d="M9,21.5 Q9,16.5 13.5,15.5 Q20,14.5 23.5,17.5 Q26,20.5 25.5,25 Q23,28 17,28.5 Q9,28 9,21.5 Z" fill="url(#dg_body)"/>
  <!-- Scale texture on body -->
  <path d="M11,19.5 Q13.5,17.5 18,18.5" stroke="#4aaa48" stroke-width="0.4" fill="none" opacity="0.4"/>
  <path d="M10.5,21.5 Q13.5,19.5 19,20.5" stroke="#4aaa48" stroke-width="0.4" fill="none" opacity="0.4"/>
  <path d="M11,23.5 Q14,21.5 20,22.5" stroke="#4aaa48" stroke-width="0.4" fill="none" opacity="0.4"/>
  <!-- Belly plates (lighter) -->
  <path d="M12,22 Q14,19.5 17.5,20 Q20,21 20.5,24 Q19,27 16,27.5 Q12.5,27 12,22 Z" fill="url(#dg_belly)" opacity="0.65"/>
  <!-- Belly plate segmentation -->
  <path d="M12.5,22 Q16,21.2 20,22" stroke="#907018" stroke-width="0.4" fill="none" opacity="0.5"/>
  <path d="M12.5,23.5 Q16,22.7 20,23.5" stroke="#907018" stroke-width="0.4" fill="none" opacity="0.5"/>
  <path d="M13,25 Q16,24.2 19.5,25" stroke="#907018" stroke-width="0.4" fill="none" opacity="0.5"/>
  <!-- Neck -->
  <path d="M10,17.5 Q9.5,13.5 11,11 Q13,12 12.5,17.5 Z" fill="url(#dg_head)"/>
  <!-- Head (reptilian, elongated) -->
  <path d="M8.5,14 Q9,10 11,8 Q13.5,7 15,8 Q16,9.5 14.5,12 Q15,14 14,16 Q12,17 9,15 Z" fill="url(#dg_head)"/>
  <!-- Dorsal crest/spines on head -->
  <path d="M11,8.5 Q11.5,6.5 12.5,6 Q12.5,7.5 12,9" fill="#3a8030" opacity="0.8"/>
  <path d="M12.5,8 Q13.5,5.5 14.5,5.5 Q14,7 13.5,8.5" fill="#3a8030" opacity="0.7"/>
  <!-- Horns (backward-curved) -->
  <path d="M13.5,8 Q15,6 14.5,4 Q13,5 12.5,7.5 Z" fill="#1a4010"/>
  <!-- Snout (longer) -->
  <path d="M8.5,14.5 Q6.5,14 5.5,15.5 Q6,17 7.5,17.5 Q9,17.5 9.5,16 Z" fill="#3a6830"/>
  <!-- Nostril -->
  <ellipse cx="6.5" cy="15.8" rx="0.65" ry="0.7" fill="#0a1804"/>
  <!-- Smoke from nostril -->
  <path d="M6,15 Q5,13.5 5.5,12 Q6.5,13 6.5,15" stroke="#c8c8c840" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M7,14.5 Q6.5,13 7,11.5 Q7.5,12.5 7.5,14.5" stroke="#b0b0b030" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Eye (slit pupil, amber) -->
  <ellipse cx="12" cy="10.5" rx="1.4" ry="1.2" fill="#d8a820"/>
  <ellipse cx="12" cy="10.5" rx="0.5" ry="1" fill="#0a0804"/>
  <circle cx="11.6" cy="9.9" r="0.3" fill="#ffffff50"/>
</svg>