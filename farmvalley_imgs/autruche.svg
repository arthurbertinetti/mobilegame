<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="os_body" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#2a2828"/>
      <stop offset="60%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="os_wing" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0ece8"/>
      <stop offset="60%" stop-color="#d8d4d0"/>
      <stop offset="100%" stop-color="#b0acac"/>
    </radialGradient>
    <linearGradient id="os_neck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d07888"/>
      <stop offset="50%" stop-color="#e8908a"/>
      <stop offset="100%" stop-color="#c06870"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.8" fill="#00000020"/>
  <!-- Long legs (ostrich legs are very long) -->
  <path d="M13,27 L12,32" stroke="#d07880" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M17,27.5 L16.5,32" stroke="#d07880" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Two-toed feet -->
  <path d="M12,32 L10,32.5 M12,32 L13,32.5" stroke="#d07880" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M16.5,32 L14.5,32.5 M16.5,32 L17.5,32.5" stroke="#d07880" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Knee joints -->
  <circle cx="12.5" cy="29.5" r="0.9" fill="#e09098"/>
  <circle cx="16.7" cy="29.5" r="0.9" fill="#e09098"/>
  <!-- Body (black) -->
  <path d="M6.5,22 Q6.5,16 12,15 Q19,14 23,17.5 Q25,20.5 24.5,25 Q22,28.5 15,28.5 Q6.5,27.5 6.5,22 Z" fill="url(#os_body)"/>
  <!-- White wing feathers on side -->
  <path d="M7,22 Q7,17 10.5,16 Q12.5,16 12,20 Q11,24 7,25 Z" fill="url(#os_wing)"/>
  <path d="M22.5,18.5 Q25,17.5 25.5,19 Q25,22 23.5,23 Q22,23 22.5,18.5 Z" fill="url(#os_wing)" opacity="0.7"/>
  <!-- White fluffy plume tail -->
  <path d="M22.5,22 Q26,22 27.5,23.5 Q26,25 24,24.5 Q22.5,24 22.5,22 Z" fill="url(#os_wing)" opacity="0.8"/>
  <!-- Long neck (pink/bare) -->
  <path d="M13,16.5 Q11.5,13 12,8 Q13,6 14.5,7 Q15.5,8.5 15,13 Q14.5,16 13,16.5 Z" stroke="url(#os_neck)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Neck front lighter -->
  <path d="M13,16 Q12,13 12.5,8.5 Q13.5,7 14,8 Q14.5,9.5 14,14" stroke="#f0a890" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Small head -->
  <ellipse cx="13.5" cy="6" rx="3" ry="2.5" fill="#e08888"/>
  <!-- Flat beak -->
  <path d="M11.5,6 L9.5,5.5 L9.2,6.5 L11.5,6.8 Z" fill="#e8c020"/>
  <!-- Eye (with lashes) -->
  <ellipse cx="13.5" cy="5.2" rx="1.2" ry="1" fill="#0a0606"/>
  <ellipse cx="13.2" cy="4.9" rx="0.4" ry="0.35" fill="#3a2808" opacity="0.6"/>
  <circle cx="14" cy="4.8" r="0.22" fill="#ffffff55"/>
  <!-- Eyelashes (ostrich is known for long lashes) -->
  <path d="M12.5,4.5 L12,3.5 M13.2,4.3 L13,3.2 M14,4.5 L14.2,3.4" stroke="#0a0606" stroke-width="0.5" fill="none" stroke-linecap="round"/>
</svg>