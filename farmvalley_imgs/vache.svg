<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="cw_body" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f0ece8"/>
      <stop offset="60%" stop-color="#d8d0c8"/>
      <stop offset="100%" stop-color="#b8b0a0"/>
    </radialGradient>
    <radialGradient id="cw_head" cx="40%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#e8e0d8"/>
      <stop offset="100%" stop-color="#c0b0a0"/>
    </radialGradient>
    <radialGradient id="cw_udder" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f0b8c0"/>
      <stop offset="100%" stop-color="#d89090"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.2" rx="10" ry="0.8" fill="#00000018"/>
  <!-- Legs (back) -->
  <path d="M19,27 L18.5,31" stroke="#8a7860" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M22,26.5 L21.5,30.5" stroke="#8a7860" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Legs (front) -->
  <path d="M10,27 L9.5,31" stroke="#8a7860" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M13,27.5 L12.5,31.5" stroke="#8a7860" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Hooves -->
  <ellipse cx="9.5" cy="31.3" rx="1.1" ry="0.6" fill="#3a2a18"/>
  <ellipse cx="12.5" cy="31.7" rx="1.1" ry="0.6" fill="#3a2a18"/>
  <ellipse cx="18.5" cy="31.3" rx="1.1" ry="0.6" fill="#3a2a18"/>
  <ellipse cx="21.5" cy="30.8" rx="1.1" ry="0.6" fill="#3a2a18"/>
  <!-- Body -->
  <path d="M7,22 Q7,16 12,15.5 Q20,14.5 24,18 Q27,21 26,26 Q23,29.5 16,29.5 Q7,29 7,22 Z" fill="url(#cw_body)"/>
  <!-- Black patches on body -->
  <path d="M15,16 Q19,15 22,17 Q23,20 21,22 Q18,22.5 15,21 Q13,19 15,16 Z" fill="#2a2018"/>
  <path d="M8,21 Q10,19 12,20 Q13,22 12,24 Q10,25 8,24 Z" fill="#2a2018"/>
  <!-- Udder -->
  <path d="M12,27.5 Q16,30 20,27.5 Q20,25.5 16,25 Q12,25.5 12,27.5 Z" fill="url(#cw_udder)"/>
  <!-- Tail -->
  <path d="M25.5,20 Q28.5,18 29,15" stroke="#8a7860" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <ellipse cx="29" cy="14.5" rx="1.5" ry="1" fill="#5a4828" transform="rotate(-20 29 14.5)"/>
  <!-- Neck -->
  <path d="M9.5,17 Q9,13.5 10.5,11 Q12.5,12 12,17 Z" fill="url(#cw_head)"/>
  <!-- Head -->
  <ellipse cx="10" cy="10.5" rx="4.5" ry="3.8" fill="url(#cw_head)"/>
  <!-- Black patch on head -->
  <path d="M11,8 Q13,7.5 14,9 Q13.5,10.5 12,10.5 Q10.5,10 11,8 Z" fill="#2a2018"/>
  <!-- Muzzle -->
  <ellipse cx="8.2" cy="12.2" rx="2.5" ry="1.8" fill="#d8b8a8"/>
  <!-- Nostrils -->
  <ellipse cx="7.5" cy="12.3" rx="0.55" ry="0.65" fill="#8a6858"/>
  <ellipse cx="9" cy="12.3" rx="0.55" ry="0.65" fill="#8a6858"/>
  <!-- Ear -->
  <path d="M8.5,8 Q6.5,6.5 6,8.5 Q6.5,10.5 9,10 Z" fill="#d0b898"/>
  <!-- Horn -->
  <path d="M11,7.5 Q11.5,5 13,4.5 Q13.5,5.5 12.5,7 Z" fill="#c8a020"/>
  <!-- Eye -->
  <ellipse cx="11" cy="9.5" rx="1.2" ry="1.1" fill="#1a0800"/>
  <ellipse cx="10.7" cy="9.2" rx="0.4" ry="0.35" fill="#6a4020" opacity="0.8"/>
  <circle cx="11.5" cy="9.0" r="0.25" fill="#ffffff55"/>
</svg>