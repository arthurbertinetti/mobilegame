<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="water_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80c8f0"/>
      <stop offset="100%" stop-color="#4090b8"/>
    </linearGradient>
    <linearGradient id="glass_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0e8f8"/>
      <stop offset="40%" stop-color="#e8f8ff"/>
      <stop offset="100%" stop-color="#a0d0e8"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Tank body -->
  <rect x="4" y="8" width="24" height="20" rx="1.5" fill="url(#water_grad)"/>
  <!-- Glass sheen -->
  <rect x="4" y="8" width="24" height="20" rx="1.5" fill="url(#glass_grad)" opacity="0.35"/>
  <!-- Tank frame -->
  <rect x="4" y="8" width="24" height="20" rx="1.5" fill="none" stroke="#606060" stroke-width="1"/>
  <rect x="4" y="8" width="24" height="3" rx="1" fill="#808080"/>
  <!-- Pebbles at bottom -->
  <ellipse cx="7" cy="27" rx="2" ry="0.8" fill="#806040"/>
  <ellipse cx="11" cy="27.3" rx="1.5" ry="0.7" fill="#908050"/>
  <ellipse cx="15" cy="27" rx="2" ry="0.8" fill="#704030"/>
  <ellipse cx="19" cy="27.3" rx="1.5" ry="0.7" fill="#907060"/>
  <ellipse cx="23" cy="27" rx="2" ry="0.8" fill="#806040"/>
  <!-- Green coral -->
  <path d="M22 26 L22 20 L21 17 M22 22 L24 19 M22 20 L20 18" stroke="#20a040" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="21" cy="17" r="1.2" fill="#30c050"/>
  <circle cx="24" cy="19" r="1" fill="#20b040"/>
  <circle cx="20" cy="18" r="1" fill="#30c050"/>
  <!-- Orange/white fish body -->
  <ellipse cx="13" cy="19" rx="4" ry="2.5" fill="#f06010"/>
  <!-- White stripes on fish -->
  <path d="M12 16.5 Q12 21.5" stroke="#ffffff" stroke-width="1.2" fill="none"/>
  <line x1="13" y1="16.6" x2="13" y2="21.4" stroke="#ffffff" stroke-width="1"/>
  <!-- Fish tail -->
  <path d="M17 19 L20 17 L20 21 Z" fill="#f06010"/>
  <!-- Fish eye -->
  <circle cx="10" cy="18.5" r="0.9" fill="#ffffff"/>
  <circle cx="10" cy="18.5" r="0.5" fill="#202020"/>
  <!-- Bubbles -->
  <circle cx="9" cy="14" r="0.7" fill="none" stroke="#ffffff80" stroke-width="0.5"/>
  <circle cx="11" cy="11" r="0.5" fill="none" stroke="#ffffff70" stroke-width="0.4"/>
  <circle cx="18" cy="13" r="0.6" fill="none" stroke="#ffffff80" stroke-width="0.4"/>
</svg>
