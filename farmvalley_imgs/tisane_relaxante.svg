<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="cup_grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f8f0e8"/>
      <stop offset="100%" stop-color="#d0c0a0"/>
    </radialGradient>
    <radialGradient id="tea_golden" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ece090"/>
      <stop offset="100%" stop-color="#c0b050"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Saucer -->
  <ellipse cx="16" cy="28" rx="11" ry="3" fill="#e8e0d0" stroke="#c0b090" stroke-width="0.5"/>
  <!-- Cup body -->
  <path d="M9 16 Q8 22 10 26 Q13 28 16 28 Q19 28 22 26 Q24 22 23 16 Z" fill="url(#cup_grad)"/>
  <!-- Cup outline -->
  <path d="M9 16 Q8 22 10 26 Q13 28 16 28 Q19 28 22 26 Q24 22 23 16 Z" fill="none" stroke="#c0b090" stroke-width="0.8"/>
  <!-- Tea liquid surface -->
  <ellipse cx="16" cy="17" rx="7" ry="2" fill="url(#tea_golden)"/>
  <!-- Handle -->
  <path d="M23 18 Q27 18 27 22 Q27 25 23 25" stroke="#c0b090" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Herb sprig (chamomile) floating -->
  <path d="M14 15 Q16 13 18 15" stroke="#a08030" stroke-width="0.7" fill="none"/>
  <circle cx="14" cy="15" r="1" fill="#f0d040"/>
  <circle cx="16" cy="13" r="0.8" fill="#f0e050"/>
  <circle cx="18" cy="15" r="1" fill="#f0d040"/>
  <!-- Tiny petals -->
  <circle cx="13.5" cy="14" r="0.5" fill="#f8f0c0"/>
  <circle cx="16" cy="12.2" r="0.5" fill="#f8f0c0"/>
  <circle cx="18.5" cy="14" r="0.5" fill="#f8f0c0"/>
  <!-- Steam wisps -->
  <path d="M13 16 Q12 13 13 11" stroke="#c0b06060" stroke-width="0.8" fill="none"/>
  <path d="M16 15.5 Q15 12 16 10" stroke="#c0b06060" stroke-width="0.8" fill="none"/>
  <path d="M19 16 Q20 13 19 11" stroke="#c0b06060" stroke-width="0.8" fill="none"/>
  <!-- Subtle floral decoration on cup -->
  <circle cx="11" cy="22" r="1" fill="#f0d04030"/>
  <circle cx="11" cy="22" r="0.5" fill="#e0c03040"/>
</svg>
