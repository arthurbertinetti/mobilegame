<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glass_g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="40%" stop-color="#f8f8f8"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
    <linearGradient id="liq_g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a820"/>
      <stop offset="100%" stop-color="#8a6010"/>
    </linearGradient>
    <clipPath id="glass_clip">
      <path d="M10,28 Q10,30 16,30 Q22,30 22,28 L20,13 L12,13 Z"/>
    </clipPath>
  </defs>
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- liquid fill -->
  <rect x="9" y="16" width="14" height="14" fill="url(#liq_g)" clip-path="url(#glass_clip)"/>
  <!-- glass body -->
  <path d="M10,28 Q10,30 16,30 Q22,30 22,28 L20,13 L12,13 Z" fill="url(#glass_g)" fill-opacity="0.55" stroke="#a0a0a0" stroke-width="0.7"/>
  <!-- glass rim highlight -->
  <line x1="12" y1="13" x2="20" y2="13" stroke="#d0d0d0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- apple slice garnish: green circle with indent -->
  <circle cx="23" cy="11" r="3.5" fill="#5db830"/>
  <circle cx="23" cy="11" r="3.5" fill="none" stroke="#3a8a10" stroke-width="0.5"/>
  <path d="M23,7.5 C23,7.5 22,8.5 23,9.5 C24,8.5 23,7.5 23,7.5Z" fill="#3a8a10"/>
  <line x1="23" y1="9.5" x2="23" y2="14.5" stroke="#3a8a10" stroke-width="0.5"/>
</svg>
