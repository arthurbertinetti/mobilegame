<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pr_body" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e83030"/>
      <stop offset="55%" stop-color="#c01818"/>
      <stop offset="100%" stop-color="#7a0808"/>
    </radialGradient>
    <radialGradient id="pr_head" cx="38%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#e83030"/>
      <stop offset="100%" stop-color="#9a1010"/>
    </radialGradient>
    <linearGradient id="pr_wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2878d8"/>
      <stop offset="50%" stop-color="#1850a8"/>
      <stop offset="100%" stop-color="#0c2870"/>
    </linearGradient>
    <linearGradient id="pr_wing2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c020"/>
      <stop offset="100%" stop-color="#c09010"/>
    </linearGradient>
  </defs>
  <!-- Branch -->
  <path d="M6,28 Q16,26.5 28,27" stroke="#6a4010" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M6,27.5 Q16,26 28,26.5" stroke="#8a5818" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Shadow -->
  <ellipse cx="16" cy="27.5" rx="8" ry="0.7" fill="#00000015"/>
  <!-- Tail feathers (long macaw tail) -->
  <path d="M18,25 Q23,27 25,31" stroke="#2878d8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M17,25.5 Q21,27.5 22,32" stroke="#1a5aa0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M16,25.5 Q19,27 19,32" stroke="#e8c020" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M15,25 Q16.5,27 15.5,32" stroke="#2878d8" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Blue wing (folded against body) -->
  <path d="M14,22 Q11,19 13,14 Q15,12 18,13 Q21,14 21,18 Q21,22 18,23 Z" fill="url(#pr_wing)"/>
  <!-- Yellow wing stripe -->
  <path d="M14.5,20 Q13,17 14.5,14.5 Q16,13.5 17.5,14.5" stroke="#e8c020" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M15,21 Q13.5,18 15,15" stroke="#d8a010" stroke-width="0.8" fill="none" opacity="0.6"/>
  <!-- Body (red) -->
  <path d="M12,21.5 Q12,17.5 15,16.5 Q19,16 21,18.5 Q22.5,21 21.5,24.5 Q19.5,27 16,27 Q12,26.5 12,21.5 Z" fill="url(#pr_body)"/>
  <!-- Feet gripping branch -->
  <path d="M15,26.5 L14,28 L13,28.5 M14,28 L15,28.5" stroke="#6a3808" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M17.5,26.5 L17,28 L16,28.5 M17,28 L18,28.5" stroke="#6a3808" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <path d="M13.5,17.5 Q12.5,14 14,11.5 Q16,12 15.5,17.5 Z" fill="url(#pr_head)"/>
  <!-- Head -->
  <ellipse cx="14.5" cy="11" rx="4.5" ry="3.8" fill="url(#pr_head)"/>
  <!-- Bare facial patch (white/pale) -->
  <path d="M11,12 Q12,11 13,12.5 Q12.5,14 11.5,13.5 Z" fill="#d8c8c0" opacity="0.8"/>
  <!-- Powerful hooked beak (grey) -->
  <path d="M11.5,11 Q9,10.5 8.5,12 Q9,13.5 11.5,13.5 Q12.5,13 12.5,12 Z" fill="#8a8888"/>
  <path d="M11.5,12 Q9.5,12 9,12.5 Q9.5,13 11,13" stroke="#6a6868" stroke-width="0.4" fill="none"/>
  <!-- Beak lower mandible -->
  <path d="M10,12.5 Q9,13 9.5,14 Q11,14 12,13 Z" fill="#7a7878"/>
  <!-- Blue forehead -->
  <path d="M14,8.5 Q16,8 18,9 Q18,11 16.5,11.5 Q14.5,11 14,8.5 Z" fill="#2878d8" opacity="0.7"/>
  <!-- Eye (with bare patch ring) -->
  <circle cx="14.5" cy="10" r="1.3" fill="#f0c020"/>
  <circle cx="14.5" cy="10" r="0.7" fill="#1a0808"/>
  <circle cx="14.2" cy="9.6" r="0.25" fill="#ffffff60"/>
</svg>