<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tige et feuilles -->
  <line x1="16" y1="31" x2="16" y2="18" stroke="#4caf50" stroke-width="2"/>
  <ellipse cx="10" cy="24" rx="5.5" ry="2.8" fill="#388e3c" transform="rotate(-20 10 24)"/>
  <ellipse cx="22" cy="24" rx="5.5" ry="2.8" fill="#2e7d32" transform="rotate(20 22 24)"/>
  <!-- Pétales extérieurs (grand anneau) -->
  <ellipse cx="16" cy="9" rx="2" ry="5" fill="#ffd600"/>
  <ellipse cx="16" cy="9" rx="2" ry="5" fill="#ffd600" transform="rotate(30 16 16)"/>
  <ellipse cx="16" cy="9" rx="2" ry="5" fill="#ffca28" transform="rotate(60 16 16)"/>
  <ellipse cx="16" cy="9" rx="2" ry="5" fill="#ffd600" transform="rotate(90 16 16)"/>
  <ellipse cx="16" cy="9" rx="2" ry="5" fill="#ffca28" transform="rotate(120 16 16)"/>
  <ellipse cx="16" cy="9" rx="2" ry="5" fill="#ffd600" transform="rotate(150 16 16)"/>
  <!-- Pétales intermédiaires -->
  <ellipse cx="16" cy="10" rx="1.5" ry="4" fill="#ffab00" transform="rotate(15 16 16)"/>
  <ellipse cx="16" cy="10" rx="1.5" ry="4" fill="#ffc107" transform="rotate(45 16 16)"/>
  <ellipse cx="16" cy="10" rx="1.5" ry="4" fill="#ffab00" transform="rotate(75 16 16)"/>
  <ellipse cx="16" cy="10" rx="1.5" ry="4" fill="#ffc107" transform="rotate(105 16 16)"/>
  <ellipse cx="16" cy="10" rx="1.5" ry="4" fill="#ffab00" transform="rotate(135 16 16)"/>
  <ellipse cx="16" cy="10" rx="1.5" ry="4" fill="#ffc107" transform="rotate(165 16 16)"/>
  <!-- Centre doré -->
  <circle cx="16" cy="16" r="5.5" fill="#ff8f00"/>
  <circle cx="16" cy="16" r="4" fill="#f57f17"/>
  <circle cx="16" cy="16" r="2.5" fill="#e65100"/>
  <!-- Pistil/étamines (petits points) -->
  <circle cx="14" cy="15" r="0.7" fill="#fdd835"/>
  <circle cx="18" cy="15" r="0.7" fill="#fdd835"/>
  <circle cx="16" cy="13.5" r="0.7" fill="#fdd835"/>
  <circle cx="16" cy="18" r="0.7" fill="#fdd835"/>
  <!-- Reflet pétales -->
  <ellipse cx="13.5" cy="11.5" rx="1" ry="3" fill="rgba(255,255,255,0.2)" transform="rotate(-30 13.5 11.5)"/>
