<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pe_body" cx="38%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#8a4818"/>
      <stop offset="55%" stop-color="#6a3010"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </radialGradient>
    <linearGradient id="pe_crust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b06028"/>
      <stop offset="100%" stop-color="#804010"/>
    </linearGradient>
    <radialGradient id="pe_anise" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c8b070"/>
      <stop offset="100%" stop-color="#907040"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Bread slice base -->
  <rect x="6" y="12" width="20" height="18" rx="2" fill="url(#pe_body)"/>
  <!-- Golden-brown crust edge (top) -->
  <rect x="6" y="12" width="20" height="4" rx="2" fill="url(#pe_crust)"/>
  <!-- Crust side left -->
  <rect x="6" y="12" width="3" height="18" rx="1" fill="#9a5020"/>
  <!-- Crust side right -->
  <rect x="23" y="12" width="3" height="18" rx="1" fill="#9a5020"/>
  <!-- Crust bottom -->
  <rect x="6" y="27" width="20" height="3" rx="1" fill="#8a4018"/>
  <!-- Bread texture lines -->
  <path d="M9,17 Q16,16 23,17" stroke="#4a2008" stroke-width="0.6" fill="none"/>
  <path d="M9,20 Q16,19 23,20" stroke="#4a2008" stroke-width="0.6" fill="none"/>
  <path d="M9,23 Q16,22 23,23" stroke="#4a2008" stroke-width="0.5" fill="none"/>
  <path d="M9,26 Q16,25 23,26" stroke="#4a2008" stroke-width="0.5" fill="none"/>
  <!-- Star anise on top -->
  <circle cx="16" cy="14" r="2.5" fill="url(#pe_anise)"/>
  <!-- Star anise petals (8-pointed) -->
  <ellipse cx="16" cy="11.5" rx="0.8" ry="1.5" fill="#a07838"/>
  <ellipse cx="16" cy="16.5" rx="0.8" ry="1.5" fill="#a07838"/>
  <ellipse cx="13.5" cy="14" rx="1.5" ry="0.8" fill="#a07838"/>
  <ellipse cx="18.5" cy="14" rx="1.5" ry="0.8" fill="#a07838"/>
  <ellipse cx="14.2" cy="11.7" rx="0.8" ry="1.5" fill="#a07838" transform="rotate(45,14.2,11.7)"/>
  <ellipse cx="17.8" cy="11.7" rx="0.8" ry="1.5" fill="#a07838" transform="rotate(-45,17.8,11.7)"/>
  <ellipse cx="14.2" cy="16.3" rx="0.8" ry="1.5" fill="#a07838" transform="rotate(-45,14.2,16.3)"/>
  <ellipse cx="17.8" cy="16.3" rx="0.8" ry="1.5" fill="#a07838" transform="rotate(45,17.8,16.3)"/>
  <!-- Star anise center -->
  <circle cx="16" cy="14" r="1" fill="#7a5828"/>
  <circle cx="16" cy="14" r="0.4" fill="#503818"/>
</svg>
