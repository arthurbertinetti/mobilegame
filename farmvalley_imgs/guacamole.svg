<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bowlG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8e0d8"/>
      <stop offset="100%" stop-color="#b0a898"/>
    </radialGradient>
    <radialGradient id="guacG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#60c830"/>
      <stop offset="100%" stop-color="#208010"/>
    </radialGradient>
    <radialGradient id="avocadoG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#70d040"/>
      <stop offset="100%" stop-color="#286820"/>
    </radialGradient>
    <radialGradient id="pitG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a07840"/>
      <stop offset="100%" stop-color="#604820"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="11" ry="2.5" fill="url(#shadowG)"/>
  <!-- Bowl outer -->
  <circle cx="16" cy="19" r="12" fill="url(#bowlG)" stroke="#a09888" stroke-width="0.6"/>
  <!-- Guacamole dip -->
  <circle cx="16" cy="19" r="10" fill="url(#guacG)"/>
  <!-- Dip texture -->
  <ellipse cx="13" cy="17" rx="3" ry="2" fill="#50b828" opacity="0.5"/>
  <ellipse cx="20" cy="20" rx="2.5" ry="1.8" fill="#289018" opacity="0.4"/>
  <!-- Avocado half slice on top -->
  <path d="M13 13 Q16 9 19 13 Q20 17 16 18.5 Q12 17 13 13 Z" fill="url(#avocadoG)" stroke="#309020" stroke-width="0.5"/>
  <!-- Avocado inner lighter flesh -->
  <path d="M13.5 13.5 Q16 10.5 18.5 13.5 Q19.5 16.5 16 17.5 Q12.5 16.5 13.5 13.5 Z" fill="#90d860" opacity="0.6"/>
  <!-- Avocado pit -->
  <circle cx="16" cy="14.5" r="2.2" fill="url(#pitG)"/>
  <circle cx="15.3" cy="13.8" r="0.7" fill="#c8a060" opacity="0.5"/>
</svg>
