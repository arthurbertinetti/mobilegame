<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="tf_base" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e8b850"/>
      <stop offset="60%" stop-color="#d4a040"/>
      <stop offset="100%" stop-color="#a87020"/>
    </radialGradient>
    <radialGradient id="tf_cream" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fffff0"/>
      <stop offset="100%" stop-color="#f0e8c8"/>
    </radialGradient>
    <radialGradient id="tf_straw" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff6060"/>
      <stop offset="100%" stop-color="#c01818"/>
    </radialGradient>
    <radialGradient id="tf_kiwi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#90d050"/>
      <stop offset="80%" stop-color="#508020"/>
      <stop offset="100%" stop-color="#304810"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="11" ry="0.8" fill="#00000028"/>
  <!-- Tart rim/crust -->
  <ellipse cx="16" cy="22" rx="13" ry="4" fill="#c07818"/>
  <!-- Tart base top -->
  <ellipse cx="16" cy="20" rx="13" ry="4" fill="url(#tf_base)"/>
  <!-- Cream filling -->
  <ellipse cx="16" cy="19.5" rx="11" ry="3.2" fill="url(#tf_cream)"/>
  <!-- Apricot arc (orange) -->
  <path d="M16,17 Q21,16 23,19.5 Q21,21 16,21 Z" fill="#f08020" opacity="0.9"/>
  <!-- Kiwi slice (green) -->
  <circle cx="11" cy="19" r="3.5" fill="url(#tf_kiwi)"/>
  <circle cx="11" cy="19" r="2.2" fill="#c8e890"/>
  <line x1="11" y1="15.5" x2="11" y2="22.5" stroke="#508020" stroke-width="0.5" opacity="0.7"/>
  <line x1="7.5" y1="19" x2="14.5" y2="19" stroke="#508020" stroke-width="0.5" opacity="0.7"/>
  <line x1="8.5" y1="16.5" x2="13.5" y2="21.5" stroke="#508020" stroke-width="0.4" opacity="0.5"/>
  <line x1="13.5" y1="16.5" x2="8.5" y2="21.5" stroke="#508020" stroke-width="0.4" opacity="0.5"/>
  <!-- Strawberry (red circle) -->
  <circle cx="20" cy="18.5" r="2.8" fill="url(#tf_straw)"/>
  <path d="M19,16 Q20,15.2 21,16" stroke="#40a020" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <!-- Seeds on strawberry -->
  <circle cx="19.5" cy="18" r="0.3" fill="#ffeecc"/>
  <circle cx="20.8" cy="17.6" r="0.3" fill="#ffeecc"/>
  <circle cx="20.2" cy="19.2" r="0.3" fill="#ffeecc"/>
  <!-- Shine on tart -->
  <ellipse cx="12" cy="18.5" rx="3" ry="1" fill="rgba(255,255,255,0.3)" transform="rotate(-10,12,18.5)"/>
</svg>
