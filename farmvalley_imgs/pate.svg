  <path d="M10 17 Q12 14 14 17 Q16 20 18 17 Q20 14 22 17" fill="none" stroke="#c89040" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M10 19 Q12 16 14 19 Q16 22 18 19 Q20 16 22 19" fill="none" stroke="#b87830" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M11 15 Q13 12.5 15 15 Q17 17.5 19 15 Q21 12.5 22.5 15" fill="none" stroke="#c89040" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
