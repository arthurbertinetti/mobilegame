<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadow_po" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tin_po" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="60%" stop-color="#c0c8d0"/>
      <stop offset="100%" stop-color="#a0a8b0"/>
    </radialGradient>
    <radialGradient id="ointment_po" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffff8"/>
      <stop offset="60%" stop-color="#f8f8f0"/>
      <stop offset="100%" stop-color="#e8e8e0"/>
    </radialGradient>
    <radialGradient id="lid_po" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d8e0e8"/>
      <stop offset="70%" stop-color="#b8c0c8"/>
      <stop offset="100%" stop-color="#9098a0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="9" ry="2" fill="url(#shadow_po)"/>
  <!-- Tin body (open, showing ointment inside) -->
  <ellipse cx="14" cy="26" rx="9" ry="2.5" fill="#9098a0"/>
  <rect x="5" y="20" width="18" height="6" rx="1" fill="url(#tin_po)"/>
  <ellipse cx="14" cy="20" rx="9" ry="2.5" fill="url(#tin_po)"/>
  <!-- Ointment surface inside (cream/white visible) -->
  <ellipse cx="14" cy="20" rx="7.5" ry="2" fill="url(#ointment_po)"/>
  <!-- Ointment texture swirl -->
  <path d="M10 19.5 Q13 18.5 16 19.5 Q14 20.5 11 20" stroke="#e0e0d8" stroke-width="0.6" fill="none" opacity="0.8"/>
  <!-- Tin rim highlight -->
  <ellipse cx="14" cy="20" rx="9" ry="2.5" fill="none" stroke="#d0d8e0" stroke-width="0.8"/>
  <!-- Lid (beside tin, slightly to the right) -->
  <ellipse cx="25" cy="22" rx="5" ry="1.4" fill="#8090a0" opacity="0.7"/>
  <rect x="20" y="18.5" width="10" height="3.5" rx="0.8" fill="url(#lid_po)"/>
  <ellipse cx="25" cy="18.5" rx="5" ry="1.4" fill="#c8d0d8"/>
  <!-- Lid shine -->
  <ellipse cx="23" cy="17.8" rx="2.5" ry="0.8" fill="#fff" opacity="0.45"/>
  <!-- Tin side shine -->
  <rect x="6.5" y="20.5" width="2" height="4.5" rx="1" fill="#fff" opacity="0.3"/>
</svg>
