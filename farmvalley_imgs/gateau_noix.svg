<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="gn_body" cx="38%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#a86830"/>
      <stop offset="55%" stop-color="#8a5020"/>
      <stop offset="100%" stop-color="#5a3010"/>
    </radialGradient>
    <radialGradient id="gn_top" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#b07838"/>
      <stop offset="100%" stop-color="#704010"/>
    </radialGradient>
    <radialGradient id="gn_walnut" cx="38%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#d89848"/>
      <stop offset="55%" stop-color="#c08030"/>
      <stop offset="100%" stop-color="#885018"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Cake body (round, rustic) -->
  <ellipse cx="16" cy="27" rx="10" ry="3" fill="#5a3010"/>
  <rect x="6" y="17" width="20" height="10" rx="3" fill="url(#gn_body)"/>
  <!-- Cake top surface -->
  <ellipse cx="16" cy="17" rx="10" ry="3.5" fill="url(#gn_top)"/>
  <!-- Rustic icing drips -->
  <path d="M9,17.5 Q8.5,19 9,20.5" stroke="#906030" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M22,17 Q22.5,19.5 22,21" stroke="#906030" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M25,18 Q25.5,20 25,21.5" stroke="#806028" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Walnut half on top -->
  <ellipse cx="16" cy="14.5" rx="4.5" ry="3" fill="url(#gn_walnut)"/>
  <!-- Walnut ridges -->
  <path d="M13,14 Q14,12.5 16,12.5 Q18,12.5 19,14" stroke="#a07028" stroke-width="0.8" fill="none"/>
  <path d="M12.5,15.5 Q13.5,14 16,14 Q18.5,14 19.5,15.5" stroke="#a07028" stroke-width="0.6" fill="none"/>
  <!-- Walnut center groove -->
  <line x1="16" y1="12.5" x2="16" y2="17" stroke="#8a5818" stroke-width="0.8"/>
  <!-- Walnut highlight -->
  <ellipse cx="14.5" cy="13.5" rx="1.5" ry="0.8" fill="rgba(220,170,80,0.4)" transform="rotate(-15,14.5,13.5)"/>
  <!-- Cake side texture marks -->
  <path d="M7,20 Q16,19 25,20" stroke="rgba(100,60,20,0.3)" stroke-width="0.5" fill="none"/>
  <path d="M7,23 Q16,22 25,23" stroke="rgba(100,60,20,0.3)" stroke-width="0.5" fill="none"/>
  <!-- Cake top texture (coarse crumb) -->
  <circle cx="11" cy="17" r="0.8" fill="rgba(100,60,20,0.25)"/>
  <circle cx="14" cy="16" r="0.7" fill="rgba(100,60,20,0.2)"/>
  <circle cx="20" cy="16.5" r="0.8" fill="rgba(100,60,20,0.25)"/>
  <circle cx="22" cy="17.5" r="0.6" fill="rgba(100,60,20,0.2)"/>
</svg>
