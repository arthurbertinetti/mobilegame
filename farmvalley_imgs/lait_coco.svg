<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="lc_body" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="60%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#b8c8d8"/>
    </radialGradient>
    <radialGradient id="lc_top" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8f0f8"/>
      <stop offset="100%" stop-color="#c0ccd8"/>
    </radialGradient>
    <radialGradient id="lc_coco" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a06030"/>
      <stop offset="100%" stop-color="#603010"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Can body -->
  <rect x="8" y="10" width="16" height="20" rx="2" fill="url(#lc_body)"/>
  <!-- Blue stripe band -->
  <rect x="8" y="18" width="16" height="5" fill="#2050c0"/>
  <!-- Can top lid -->
  <ellipse cx="16" cy="10" rx="8" ry="1.5" fill="url(#lc_top)"/>
  <!-- Can bottom rim -->
  <ellipse cx="16" cy="30" rx="8" ry="1.2" fill="#b0c0d0"/>
  <!-- Coconut half image on white section -->
  <circle cx="16" cy="14.5" rx="4" fill="url(#lc_coco)"/>
  <!-- Coconut flesh (white inside) -->
  <path d="M13,14.5 Q13,12.5 16,12.5 Q19,12.5 19,14.5 Z" fill="#f0e8d8"/>
  <!-- Coconut shell texture lines -->
  <path d="M12.5,14 Q16,15.5 19.5,14" stroke="#7a4820" stroke-width="0.5" fill="none"/>
  <path d="M13,15.5 Q16,16.5 19,15.5" stroke="#7a4820" stroke-width="0.4" fill="none"/>
  <!-- White text area on blue stripe -->
  <rect x="9" y="19" width="14" height="3" rx="0.5" fill="rgba(255,255,255,0.9)"/>
  <rect x="10.5" y="19.8" width="11" height="1.2" rx="0.3" fill="#2050c0"/>
  <!-- Lower white label section -->
  <rect x="9" y="24" width="14" height="5" rx="0.5" fill="rgba(255,255,255,0.7)"/>
  <!-- Can shine -->
  <rect x="9" y="11" width="1.5" height="18" rx="0.7" fill="rgba(255,255,255,0.4)"/>
</svg>
