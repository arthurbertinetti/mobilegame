<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="sh_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh_jar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8e8f8"/>
      <stop offset="30%" stop-color="#f0f8ff"/>
      <stop offset="70%" stop-color="#e0f0fa"/>
      <stop offset="100%" stop-color="#a8d0e8"/>
    </linearGradient>
    <linearGradient id="sh_salt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f8f0"/>
      <stop offset="100%" stop-color="#e8e8d8"/>
    </linearGradient>
    <linearGradient id="sh_lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f0"/>
      <stop offset="100%" stop-color="#c8c8b8"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="9" ry="2" fill="url(#sh_shadow)"/>
  <!-- Small jar body -->
  <rect x="9" y="14" width="14" height="14" rx="3" ry="3" fill="url(#sh_jar)" stroke="#90b8d0" stroke-width="0.8"/>
  <!-- Salt fill -->
  <rect x="10" y="18" width="12" height="9" rx="2" ry="2" fill="url(#sh_salt)" opacity="0.95"/>
  <!-- Herb flecks (green specks) -->
  <circle cx="12" cy="20" r="0.6" fill="#20a030"/>
  <circle cx="14.5" cy="19.5" r="0.5" fill="#28b838"/>
  <circle cx="17" cy="21" r="0.6" fill="#20a030"/>
  <circle cx="20" cy="20" r="0.55" fill="#30b840"/>
  <circle cx="13" cy="22.5" r="0.5" fill="#20a030"/>
  <circle cx="16" cy="23" r="0.6" fill="#28b838"/>
  <circle cx="19.5" cy="23" r="0.5" fill="#20a030"/>
  <circle cx="11.5" cy="24.5" r="0.55" fill="#30b840"/>
  <circle cx="15" cy="25" r="0.5" fill="#20a030"/>
  <circle cx="18.5" cy="25" r="0.6" fill="#28b838"/>
  <circle cx="20.5" cy="22" r="0.5" fill="#20a030"/>
  <!-- Jar shine -->
  <rect x="10.5" y="15" width="2" height="7" rx="1" fill="white" opacity="0.4"/>
  <!-- Neck ring -->
  <rect x="10" y="13" width="12" height="2" rx="1" fill="#b0cfe0" stroke="#90b0c8" stroke-width="0.5"/>
  <!-- Lid -->
  <rect x="10" y="9" width="12" height="5" rx="2" fill="url(#sh_lid)" stroke="#a0a090" stroke-width="0.6"/>
  <!-- Lid shine -->
  <rect x="12" y="10" width="3" height="2" rx="1" fill="white" opacity="0.4"/>
  <!-- Tiny holes on lid -->
  <circle cx="14" cy="11.5" r="0.5" fill="#a0a090"/>
  <circle cx="16" cy="11.5" r="0.5" fill="#a0a090"/>
  <circle cx="18" cy="11.5" r="0.5" fill="#a0a090"/>
</svg>
