  <!-- seeds inside -->
  <circle cx="21.5" cy="11.5" r="0.7" fill="#ff3050"/>
  <circle cx="23" cy="10.5" r="0.7" fill="#ff3050"/>
  <circle cx="24.5" cy="11.5" r="0.7" fill="#ff3050"/>
  <circle cx="26" cy="12" r="0.7" fill="#ff3050"/>
  <circle cx="22.5" cy="12.5" r="0.7" fill="#ff3050"/>
  <circle cx="24" cy="13" r="0.7" fill="#ff3050"/>
