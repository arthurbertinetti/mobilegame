<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Basilic: grandes feuilles ovales, vert foncé, touffu -->
  <rect x="14.5" y="22" width="3" height="9" rx="1" fill="#4e342e"/>
  <!-- Feuilles du bas -->
  <ellipse cx="11" cy="22" rx="7" ry="4.5" fill="#2e7d32" transform="rotate(-20 11 22)"/>
  <ellipse cx="21" cy="22" rx="7" ry="4.5" fill="#1b5e20" transform="rotate(20 21 22)"/>
  <!-- Feuilles du milieu -->
  <ellipse cx="9" cy="16" rx="6.5" ry="4" fill="#388e3c" transform="rotate(-30 9 16)"/>
  <ellipse cx="23" cy="16" rx="6.5" ry="4" fill="#2e7d32" transform="rotate(30 23 16)"/>
  <!-- Feuilles du haut -->
  <ellipse cx="16" cy="10" rx="7" ry="4.5" fill="#43a047"/>
  <ellipse cx="12" cy="7" rx="5" ry="3" fill="#4caf50" transform="rotate(-15 12 7)"/>
  <ellipse cx="20" cy="7" rx="5" ry="3" fill="#66bb6a" transform="rotate(15 20 7)"/>
  <!-- Veine centrale -->
  <line x1="16" y1="6" x2="16" y2="13" stroke="#1b5e20" stroke-width="0.6"/>
</svg>
