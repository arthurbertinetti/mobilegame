<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="cup_green" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8f0e0"/>
      <stop offset="100%" stop-color="#b0c890"/>
    </radialGradient>
    <radialGradient id="tea_green" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#b0e060"/>
      <stop offset="100%" stop-color="#70a020"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Saucer (green tinted) -->
  <ellipse cx="16" cy="28" rx="11" ry="3" fill="#d8e8c8" stroke="#a0b880" stroke-width="0.5"/>
  <!-- Cup body -->
  <path d="M9 16 Q8 22 10 26 Q13 28 16 28 Q19 28 22 26 Q24 22 23 16 Z" fill="url(#cup_green)"/>
  <!-- Cup outline -->
  <path d="M9 16 Q8 22 10 26 Q13 28 16 28 Q19 28 22 26 Q24 22 23 16 Z" fill="none" stroke="#a0b880" stroke-width="0.8"/>
  <!-- Green tea liquid surface -->
  <ellipse cx="16" cy="17" rx="7" ry="2" fill="url(#tea_green)"/>
  <!-- Handle -->
  <path d="M23 18 Q27 18 27 22 Q27 25 23 25" stroke="#a0b880" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Different herbs: mint leaves floating -->
  <path d="M13 15 Q16 16 19 15" stroke="#30a030" stroke-width="0.6" fill="none"/>
  <!-- Mint leaf left -->
  <ellipse cx="13" cy="14.5" rx="1.5" ry="0.8" fill="#50c050" transform="rotate(-20,13,14.5)"/>
  <path d="M12.5 14.5 Q13 13.8 13.5 14.5" stroke="#30a030" stroke-width="0.4" fill="none"/>
  <!-- Mint leaf right -->
  <ellipse cx="19" cy="14.5" rx="1.5" ry="0.8" fill="#50c050" transform="rotate(20,19,14.5)"/>
  <path d="M18.5 14.5 Q19 13.8 19.5 14.5" stroke="#30a030" stroke-width="0.4" fill="none"/>
  <!-- Small leaf center -->
  <ellipse cx="16" cy="13.5" rx="1.2" ry="0.6" fill="#60d060"/>
  <!-- Stem with leaf at back of cup -->
  <path d="M22 22 L24 20 L23 19" stroke="#50a030" stroke-width="0.6" fill="none"/>
  <!-- Steam wisps (more vertical, digestive style) -->
  <path d="M13 16 Q11 12 13 9" stroke="#90c04060" stroke-width="0.8" fill="none"/>
  <path d="M19 16 Q21 12 19 9" stroke="#90c04060" stroke-width="0.8" fill="none"/>
  <!-- Cup pattern: simple green circle motif -->
  <circle cx="11" cy="23" r="1.2" fill="none" stroke="#90b07040" stroke-width="0.6"/>
  <circle cx="11" cy="23" r="0.5" fill="#80a06030"/>
</svg>
