<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="ga_meat" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d07040"/>
      <stop offset="55%" stop-color="#c06030"/>
      <stop offset="100%" stop-color="#803020"/>
    </radialGradient>
    <radialGradient id="ga_crust" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#b85028"/>
      <stop offset="100%" stop-color="#6a2010"/>
    </radialGradient>
    <linearGradient id="ga_bone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e0d8"/>
      <stop offset="100%" stop-color="#f4f0ec"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="12" ry="0.8" fill="#00000028"/>
  <!-- Bone handle -->
  <rect x="21" y="8" width="4" height="12" rx="2" fill="url(#ga_bone)"/>
  <ellipse cx="23" cy="8" rx="3" ry="2" fill="#f0ece8"/>
  <ellipse cx="23" cy="20" rx="3" ry="2.5" fill="#f0ece8"/>
  <!-- Leg of lamb main body -->
  <path d="M4,25 Q3,19 5,14 Q8,8 13,8 Q18,8 21,12 Q23,16 22,21 Q20,26 14,27 Q9,27 4,25 Z" fill="url(#ga_meat)"/>
  <!-- Herb crust on top -->
  <path d="M5,15 Q8,9 13,9 Q18,9 21,13 Q17,11 13,11 Q9,11 5,15 Z" fill="url(#ga_crust)" opacity="0.8"/>
  <!-- Rosemary sprigs -->
  <line x1="7" y1="22" x2="12" y2="18" stroke="#3a7820" stroke-width="0.8"/>
  <circle cx="8" cy="21.5" r="0.7" fill="#4a9020"/>
  <circle cx="9.5" cy="20.5" r="0.7" fill="#4a9020"/>
  <circle cx="11" cy="19.5" r="0.7" fill="#4a9020"/>
  <!-- Garlic cloves scattered (small white circles) -->
  <circle cx="5" cy="27" r="1.5" fill="#f8f4ec"/>
  <ellipse cx="5" cy="27" rx="1.5" ry="1.2" fill="#f0ecdc"/>
  <line x1="5" y1="25.8" x2="5" y2="26.2" stroke="#c8c0b0" stroke-width="0.5"/>
  <circle cx="9" cy="29" r="1.4" fill="#f8f4ec"/>
  <ellipse cx="9" cy="29" rx="1.4" ry="1.1" fill="#f0ecdc"/>
  <line x1="9" y1="27.9" x2="9" y2="28.3" stroke="#c8c0b0" stroke-width="0.5"/>
  <circle cx="3" cy="22" r="1.3" fill="#f8f4ec"/>
  <ellipse cx="3" cy="22" rx="1.3" ry="1" fill="#f0ecdc"/>
  <circle cx="13" cy="29" r="1.3" fill="#f8f4ec"/>
  <ellipse cx="13" cy="29" rx="1.3" ry="1" fill="#f0ecdc"/>
  <!-- Meat highlight -->
  <ellipse cx="11" cy="16" rx="4" ry="3" fill="rgba(210,120,60,0.35)" transform="rotate(-15,11,16)"/>
