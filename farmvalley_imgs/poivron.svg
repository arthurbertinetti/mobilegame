<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pv_body" cx="35%" cy="25%" r="68%">
      <stop offset="0%" stop-color="#ff7050"/>
      <stop offset="45%" stop-color="#e81010"/>
      <stop offset="100%" stop-color="#880808"/>
    </radialGradient>
    <radialGradient id="pv_lobe" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff6040"/>
      <stop offset="100%" stop-color="#800808"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="8.5" ry="0.7" fill="#00000022"/>
  <!-- Bell pepper body (3 lobes) -->
  <!-- Left lobe -->
  <path d="M10,14 Q7,14.5 7,19 Q7,26 10,28 Q13,30 16,29.5 L16,13 Q13,12.5 10,14 Z" fill="url(#pv_lobe)"/>
  <!-- Right lobe -->
  <path d="M22,14 Q25,14.5 25,19 Q25,26 22,28 Q19,30 16,29.5 L16,13 Q19,12.5 22,14 Z" fill="url(#pv_lobe)"/>
  <!-- Center lobe (front, slightly brighter) -->
  <path d="M13,12.5 Q12,13 11.5,16 Q11,22 13,27 Q14.5,30 16,30 Q17.5,30 19,27 Q21,22 20.5,16 Q20,13 19,12.5 Q17.5,11.5 16,11.5 Q14.5,11.5 13,12.5 Z" fill="url(#pv_body)"/>
  <!-- Lobe dividers (subtle shadow lines) -->
  <line x1="11.5" y1="16" x2="12" y2="28" stroke="rgba(0,0,0,.18)" stroke-width="0.8"/>
  <line x1="20.5" y1="16" x2="20" y2="28" stroke="rgba(0,0,0,.18)" stroke-width="0.8"/>
  <!-- Shine on center lobe -->
  <ellipse cx="14" cy="17" rx="1.8" ry="3.5" fill="rgba(255,220,200,.30)" transform="rotate(-8,14,17)"/>
  <!-- Calyx (green star) -->
  <path d="M14,12 Q12,10 14,11.5 Q14,9 16,10.5 Q18,9 18,11.5 Q20,10 18,12" fill="#2a8018"/>
  <path d="M13.5,11.5 Q12,9.5 13.5,11" fill="#38a020"/>
  <path d="M18.5,11.5 Q20,9.5 18.5,11" fill="#38a020"/>
  <!-- Stem -->
  <line x1="16" y1="11" x2="16" y2="6" stroke="#2a8018" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Small stem bump -->
  <ellipse cx="16" cy="11.5" rx="2" ry="1" fill="#38a020"/>
</svg>
