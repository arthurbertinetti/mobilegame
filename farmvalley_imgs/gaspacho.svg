<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bowlG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8e0d4"/>
      <stop offset="100%" stop-color="#b0a898"/>
    </radialGradient>
    <radialGradient id="soupG" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f04030"/>
      <stop offset="100%" stop-color="#b01808"/>
    </radialGradient>
    <radialGradient id="tomatoG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f05040"/>
      <stop offset="100%" stop-color="#c02010"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="12" ry="2.5" fill="url(#shadowG)"/>
  <!-- Bowl outer -->
  <ellipse cx="16" cy="20" rx="13" ry="9" fill="url(#bowlG)" stroke="#a09080" stroke-width="0.6"/>
  <!-- Bowl inner / soup -->
  <ellipse cx="16" cy="19" rx="11" ry="7.5" fill="url(#soupG)"/>
  <!-- Soup surface sheen -->
  <ellipse cx="13" cy="16" rx="3" ry="1.5" fill="#f06050" opacity="0.4"/>
  <!-- Tomato slice floating -->
  <circle cx="14" cy="18" r="3" fill="url(#tomatoG)" stroke="#c03020" stroke-width="0.4"/>
  <line x1="11.2" y1="18" x2="16.8" y2="18" stroke="#d03020" stroke-width="0.4" opacity="0.6"/>
  <line x1="14" y1="15.2" x2="14" y2="20.8" stroke="#d03020" stroke-width="0.4" opacity="0.6"/>
  <circle cx="14" cy="18" r="1" fill="#e84030" opacity="0.5"/>
  <!-- Cucumber piece -->
  <ellipse cx="21" cy="19" rx="2.2" ry="1.5" fill="#60b840" stroke="#409020" stroke-width="0.4"/>
  <ellipse cx="21" cy="19" rx="1.2" ry="0.8" fill="#80c850" opacity="0.7"/>
  <!-- Oil drizzle -->
  <path d="M17 15 Q20 14 22 16" fill="none" stroke="#d4b020" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <circle cx="22.5" cy="16.5" r="0.7" fill="#d4b020" opacity="0.8"/>
</svg>
