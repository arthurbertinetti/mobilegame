<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pug" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffcc02"/>
      <stop offset="50%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </radialGradient>
  </defs>
  <!-- Feuille et vrille -->
  <ellipse cx="7" cy="9" rx="6.5" ry="5" fill="#2e7d32" transform="rotate(-20 7 9)"/>
  <path d="M22 7 Q26 3 28 5" fill="none" stroke="#4caf50" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Tige de la citrouille -->
  <rect x="14.5" y="10" width="3" height="5" rx="1.5" fill="#558b2f"/>
  <!-- Corps citrouille (5 lobes) -->
  <ellipse cx="16" cy="22" rx="14" ry="11" fill="url(#pug)"/>
  <!-- Lobes (côtes) -->
  <ellipse cx="8" cy="22" rx="5.5" ry="10.5" fill="#e64a19" opacity="0.35"/>
  <ellipse cx="12" cy="21" rx="5" ry="10.5" fill="#f57c00" opacity="0.25"/>
  <ellipse cx="20" cy="21" rx="5" ry="10.5" fill="#f57c00" opacity="0.25"/>
  <ellipse cx="24" cy="22" rx="5.5" ry="10.5" fill="#e64a19" opacity="0.35"/>
  <!-- Lignes de côtes (stries) -->
  <line x1="16" y1="10" x2="16" y2="33" stroke="#bf360c" stroke-width="0.8" opacity="0.4"/>
  <line x1="10" y1="11" x2="9" y2="32" stroke="#bf360c" stroke-width="0.7" opacity="0.3"/>
  <line x1="22" y1="11" x2="23" y2="32" stroke="#bf360c" stroke-width="0.7" opacity="0.3"/>
  <line x1="5" y1="16" x2="5" y2="28" stroke="#bf360c" stroke-width="0.6" opacity="0.3"/>
  <line x1="27" y1="16" x2="27" y2="28" stroke="#bf360c" stroke-width="0.6" opacity="0.3"/>
  <!-- Reflet -->
  <ellipse cx="9" cy="17" rx="3.5" ry="5.5" fill="rgba(255,255,255,0.18)" transform="rotate(-10 9 17)"/>
</svg>
