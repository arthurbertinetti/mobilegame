<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Épinards: feuilles larges, ovales, vert très foncé, légèrement gaufrées -->
  <rect x="14.5" y="27" width="3" height="4" rx="1" fill="#4e342e"/>
  <!-- Tige centrale -->
  <line x1="16" y1="27" x2="16" y2="10" stroke="#1b5e20" stroke-width="1.8"/>
  <!-- Grandes feuilles sombres -->
  <ellipse cx="8" cy="23" rx="9" ry="5.5" fill="#1b5e20" transform="rotate(-15 8 23)"/>
  <ellipse cx="24" cy="23" rx="9" ry="5.5" fill="#2e7d32" transform="rotate(15 24 23)"/>
  <ellipse cx="7" cy="16" rx="8.5" ry="5" fill="#1b5e20" transform="rotate(-20 7 16)"/>
  <ellipse cx="25" cy="16" rx="8.5" ry="5" fill="#2e7d32" transform="rotate(20 25 16)"/>
  <ellipse cx="16" cy="9.5" rx="7.5" ry="4.5" fill="#2e7d32"/>
  <!-- Veines principales (plus claires) -->
  <line x1="5" y1="21" x2="11" y2="25" stroke="#33691e" stroke-width="0.9"/>
  <line x1="27" y1="21" x2="21" y2="25" stroke="#33691e" stroke-width="0.9"/>
  <line x1="4" y1="14" x2="10" y2="18" stroke="#33691e" stroke-width="0.9"/>
  <line x1="28" y1="14" x2="22" y2="18" stroke="#33691e" stroke-width="0.9"/>
  <!-- Veines secondaires -->
  <line x1="6" y1="23" x2="9" y2="26" stroke="#388e3c" stroke-width="0.5"/>
  <line x1="10" y1="24" x2="12" y2="27" stroke="#388e3c" stroke-width="0.5"/>
  <line x1="22" y1="24" x2="20" y2="27" stroke="#388e3c" stroke-width="0.5"/>
</svg>
