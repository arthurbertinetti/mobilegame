<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="gf_body" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#6880a0"/>
      <stop offset="55%" stop-color="#485878"/>
      <stop offset="100%" stop-color="#283048"/>
    </radialGradient>
    <radialGradient id="gf_head" cx="40%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#5870a0"/>
      <stop offset="100%" stop-color="#303858"/>
