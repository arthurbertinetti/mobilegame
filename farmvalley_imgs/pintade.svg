  <path d="M8.5,10 Q7,10.5 6.5,11.5 Q7,12.5 8.5,12 Q9.5,11.5 8.8,10 Z" fill="#cc2020"/>
  <path d="M7.5,9.5 Q6.5,10 6.5,11 Q7,11.5 8,11 Z" fill="#2040aa"/>
