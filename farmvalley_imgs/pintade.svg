  <circle cx="15.5" cy="21.5" r="1" fill="white" opacity="0.85"/>
  <circle cx="18" cy="21.5" r="1" fill="white" opacity="0.82"/>
  <circle cx="21" cy="21" r="0.9" fill="white" opacity="0.8"/>
  <circle cx="9.5" cy="25" r="0.9" fill="white" opacity="0.78"/>
