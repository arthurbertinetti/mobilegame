  <path d="M22,21 Q25,20 25,22 Q24,23.5 22,23 Z" fill="url(#gf_wing)"/>
  <circle cx="24.5" cy="21.5" r="0.7" fill="white" opacity="0.7"/>
  <!-- Neck -->
  <path d="M9.5,16 Q8.5,12 10,9.5 Q12,10.5 11.5,16 Z" fill="url(#gf_head)"/>
  <!-- Head (blue-grey) -->
  <ellipse cx="10" cy="9" rx="3.8" ry="3.2" fill="url(#gf_head)"/>
