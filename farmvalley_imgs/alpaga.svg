<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="al_body" cx="42%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0ece0"/>
      <stop offset="55%" stop-color="#d8d0bc"/>
      <stop offset="100%" stop-color="#b0a888"/>
    </radialGradient>
    <radialGradient id="al_neck" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e0d8c8"/>
      <stop offset="100%" stop-color="#b0a880"/>
    </radialGradient>
    <radialGradient id="al_head" cx="38%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#d8cdb8"/>
      <stop offset="100%" stop-color="#a89870"/>
    </radialGradient>
    <radialGradient id="al_fleece" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#faf8f0"/>
      <stop offset="100%" stop-color="#e0d8c0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.3" rx="8.5" ry="0.7" fill="#00000018"/>
  <!-- Legs (slender camelid) -->
  <path d="M11,25 L10.5,31" stroke="#a09070" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M13.5,25.5 L13,31.5" stroke="#a09070" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M19,25 L18.5,31" stroke="#a09070" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M21.5,24.5 L21,30.5" stroke="#a09070" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Hooves (split) -->
  <path d="M10,31.2 L10.2,32 M11,31.2 L11.2,32" stroke="#706050" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M12.5,31.7 L12.7,32 M13.5,31.7 L13.7,32" stroke="#706050" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M18,31 L18.2,31.8 M19,31 L19.2,31.8" stroke="#706050" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M20.5,30.5 L20.7,31.3 M21.5,30.5 L21.7,31.3" stroke="#706050" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <!-- Fluffy body (layered ellipses for fleece) -->
  <path d="M9,22 Q9,17 14,16.5 Q21,16 23,19.5 Q25,22.5 24,26 Q21,28.5 15,28.5 Q9,28 9,22 Z" fill="url(#al_body)"/>
  <!-- Fleece texture on body -->
  <ellipse cx="11" cy="19.5" rx="3.5" ry="3" fill="url(#al_fleece)" opacity="0.7"/>
  <ellipse cx="15" cy="18.5" rx="3.5" ry="2.8" fill="url(#al_fleece)" opacity="0.65"/>
  <ellipse cx="19.5" cy="19.5" rx="3.2" ry="2.7" fill="url(#al_fleece)" opacity="0.65"/>
  <ellipse cx="22" cy="22" rx="2.5" ry="2.3" fill="url(#al_fleece)" opacity="0.6"/>
  <!-- Tail (stub) -->
  <path d="M23.5,22.5 Q26,21 25.5,19 Q24.5,20.5 23.5,22.5 Z" fill="#d8d0bc"/>
  <!-- Long elegant neck -->
  <path d="M12,18 Q11,14.5 12,11 Q13.5,9.5 15,10.5 Q15,14 14,18 Z" fill="url(#al_neck)"/>
  <!-- Neck fleece tuft -->
  <ellipse cx="13" cy="12" rx="2.5" ry="2.5" fill="url(#al_fleece)" opacity="0.6"/>
  <!-- Head (camelid shape — long and narrow) -->
  <path d="M10.5,12 Q10,9.5 11,7.5 Q12.5,6 14.5,6.5 Q16,7.5 15.5,10 Q15,12 13.5,13 Q12,13.5 10.5,12 Z" fill="url(#al_head)"/>
  <!-- Muzzle split -->
  <path d="M10.5,11.5 Q9.5,12.5 10,14 Q11.5,14.5 12,12.5 Z" fill="#c0b898"/>
  <!-- Top-knot / topknot fleece -->
  <ellipse cx="13.5" cy="7" rx="2.5" ry="2.5" fill="url(#al_fleece)"/>
  <!-- Ear (banana-shaped) -->
  <path d="M12,7 Q11,5 12,4 Q13,4 13.5,5.5 Q13,6.5 12,7 Z" fill="#c8b888"/>
  <path d="M14.5,6.5 Q14,4.8 15,4 Q16,4.2 16,5.5 Q15.5,6.5 14.5,6.5 Z" fill="#c8b888"/>
  <!-- Eye (dark, almond-shaped) -->
  <ellipse cx="12.5" cy="9.8" rx="1.1" ry="0.9" fill="#2a1a08"/>
  <ellipse cx="12.2" cy="9.5" rx="0.4" ry="0.32" fill="#6a4820" opacity="0.7"/>
  <circle cx="13" cy="9.3" r="0.22" fill="#ffffff50"/>
  <!-- Nostril -->
  <ellipse cx="10.5" cy="12.5" rx="0.55" ry="0.65" fill="#8a7858"/>
</svg>