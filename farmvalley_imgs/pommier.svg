<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pm_ap" cx="33%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ff9080"/>
      <stop offset="50%" stop-color="#dd0808"/>
      <stop offset="100%" stop-color="#800000"/>
    </radialGradient>
    <radialGradient id="pm_can" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#58b830"/>
      <stop offset="60%" stop-color="#287010"/>
      <stop offset="100%" stop-color="#144808"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="8" ry="0.7" fill="#00000022"/>
  <!-- Trunk -->
  <path d="M13.5,31 Q13,26 13.5,22 Q14.5,20 16,20.5 Q17.5,20 18.5,22 Q19,26 18.5,31 Z" fill="#6b3a1f"/>
  <path d="M14.5,31 Q14,26 14.5,22.5 Q15.2,21 16,21.2 Q16.8,21 17.5,22.5 Q18,26 17.5,31 Z" fill="#905430"/>
  <!-- Main canopy -->
  <ellipse cx="16" cy="14" rx="13" ry="10.5" fill="#186010"/>
  <ellipse cx="16" cy="13" rx="12" ry="9.5" fill="#228018"/>
  <ellipse cx="9" cy="15.5" rx="8" ry="6.5" fill="#1a6812"/>
  <ellipse cx="23" cy="15.5" rx="8" ry="6.5" fill="#1a6812"/>
  <ellipse cx="16" cy="7" rx="9.5" ry="6.5" fill="url(#pm_can)"/>
  <!-- Canopy shine -->
  <ellipse cx="12" cy="9" rx="3.5" ry="2" fill="rgba(140,230,100,.22)"/>
  <!-- Apples at canopy edges — clearly visible -->
  <circle cx="6.5" cy="17" r="3.4" fill="url(#pm_ap)"/>
  <circle cx="25.5" cy="16" r="3.4" fill="url(#pm_ap)"/>
  <circle cx="16" cy="22" r="3.4" fill="url(#pm_ap)"/>
  <circle cx="10.5" cy="10.5" r="2.8" fill="url(#pm_ap)"/>
  <circle cx="22" cy="10.5" r="2.8" fill="url(#pm_ap)"/>
  <!-- Apple top dimples -->
  <path d="M6.5,13.6 Q7,13 7.5,13.6" stroke="#800000" stroke-width="0.5" fill="none"/>
  <path d="M25.5,12.6 Q26,12 26.5,12.6" stroke="#800000" stroke-width="0.5" fill="none"/>
  <!-- Apple shines -->
  <ellipse cx="5.5" cy="15.8" rx="1.1" ry="1.4" fill="rgba(255,230,220,.45)"/>
  <ellipse cx="24.5" cy="14.8" rx="1.1" ry="1.4" fill="rgba(255,230,220,.45)"/>
  <!-- Apple stems -->
  <line x1="6.5" y1="13.6" x2="6.8" y2="12.5" stroke="#2a6018" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="25.5" y1="12.6" x2="25.2" y2="11.5" stroke="#2a6018" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="16" y1="18.6" x2="16.2" y2="17.5" stroke="#2a6018" stroke-width="0.8" stroke-linecap="round"/>
</svg>
