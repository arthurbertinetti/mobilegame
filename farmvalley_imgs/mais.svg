  <line x1="20" y1="11" x2="24" y2="11" stroke="#f9a825" stroke-width="0.8" transform="rotate(15 22 16)"/>
  <line x1="19.5" y1="13" x2="24.5" y2="13" stroke="#f9a825" stroke-width="0.8" transform="rotate(15 22 16)"/>
  <line x1="19" y1="15" x2="25" y2="15" stroke="#f9a825" stroke-width="0.8" transform="rotate(15 22 16)"/>
  <line x1="19" y1="17" x2="25" y2="17" stroke="#f9a825" stroke-width="0.8" transform="rotate(15 22 16)"/>
  <line x1="19.5" y1="19" x2="24.5" y2="19" stroke="#f9a825" stroke-width="0.8" transform="rotate(15 22 16)"/>
  <!-- Soies (cheveux de maïs) -->
  <path d="M22 9 Q24 5 23 3" fill="none" stroke="#fbc02d" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M22 9 Q25 6 25 4" fill="none" stroke="#f9a825" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M22 9 Q26 7 27 5" fill="none" stroke="#fdd835" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Sommet (épi floral) -->
