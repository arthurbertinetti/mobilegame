  <path d="M16 22 Q4 16 3 10 Q8 14 16 20" fill="#4caf50"/>
  <path d="M16 22 Q28 16 29 10 Q24 14 16 20" fill="#388e3c"/>
  <path d="M16 15 Q5 10 4 5 Q9 8 16 13" fill="#66bb6a"/>
  <path d="M16 15 Q27 10 28 5 Q23 8 16 13" fill="#4caf50"/>
