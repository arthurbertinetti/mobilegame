<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="flute_glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e0c080"/>
      <stop offset="40%" stop-color="#fff8e8b0"/>
      <stop offset="100%" stop-color="#c8c09060"/>
    </linearGradient>
    <radialGradient id="champagne_liquid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f0d0c0"/>
      <stop offset="100%" stop-color="#d0b06090"/>
    </radialGradient>
    <radialGradient id="sparkle_burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c040"/>
      <stop offset="100%" stop-color="#fff8c000"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Left flute (tilted) -->
  <!-- Stem left -->
  <path d="M12 28 L11 18" stroke="#c8c090" stroke-width="0.8" fill="none"/>
  <!-- Base left -->
  <ellipse cx="12" cy="28.5" rx="2.5" ry="0.7" fill="#c8c090"/>
  <!-- Bowl left -->
  <path d="M8 10 Q8 18 11 18 L13 18 Q16 18 16 10 Z" fill="url(#flute_glass)"/>
  <!-- Champagne in left flute -->
  <path d="M8.5 14 Q8.3 18 11 18 L13 18 Q15.7 18 15.5 14 Z" fill="url(#champagne_liquid)"/>
  <!-- Right flute (tilted other way) -->
  <path d="M20 28 L21 18" stroke="#c8c090" stroke-width="0.8" fill="none"/>
  <ellipse cx="20" cy="28.5" rx="2.5" ry="0.7" fill="#c8c090"/>
  <path d="M16 10 Q16 18 19 18 L21 18 Q24 18 24 10 Z" fill="url(#flute_glass)"/>
  <path d="M16.5 14 Q16.3 18 19 18 L21 18 Q23.7 18 23.5 14 Z" fill="url(#champagne_liquid)"/>
  <!-- Clinking point -->
  <circle cx="16" cy="10" r="1.5" fill="#fff8c050"/>
  <!-- Gold bubbles left -->
  <circle cx="10" cy="17" r="0.4" fill="#f0d060" opacity="0.8"/>
  <circle cx="11.5" cy="15" r="0.35" fill="#f0d060" opacity="0.7"/>
  <circle cx="9.5" cy="13" r="0.3" fill="#f0d060" opacity="0.6"/>
  <!-- Gold bubbles right -->
  <circle cx="22" cy="17" r="0.4" fill="#f0d060" opacity="0.8"/>
  <circle cx="20.5" cy="15" r="0.35" fill="#f0d060" opacity="0.7"/>
  <circle cx="22.5" cy="13" r="0.3" fill="#f0d060" opacity="0.6"/>
  <!-- Sparkles -->
  <circle cx="16" cy="10" r="4" fill="url(#sparkle_burst)"/>
  <line x1="16" y1="6" x2="16" y2="8" stroke="#ffe060" stroke-width="0.8"/>
  <line x1="14.6" y1="6.8" x2="15.4" y2="8.4" stroke="#ffe060" stroke-width="0.8"/>
  <line x1="17.4" y1="6.8" x2="16.6" y2="8.4" stroke="#ffe060" stroke-width="0.8"/>
  <!-- Extra sparkles around clink -->
  <line x1="12" y1="8" x2="13" y2="9" stroke="#fff0a0" stroke-width="0.6"/>
  <line x1="12" y1="9" x2="13" y2="8" stroke="#fff0a0" stroke-width="0.6"/>
  <line x1="20" y1="8" x2="19" y2="9" stroke="#fff0a0" stroke-width="0.6"/>
  <line x1="20" y1="9" x2="19" y2="8" stroke="#fff0a0" stroke-width="0.6"/>
</svg>
