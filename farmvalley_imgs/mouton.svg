<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="sh_wool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="70%" stop-color="#e0d8c8"/>
      <stop offset="100%" stop-color="#c8bea8"/>
    </radialGradient>
    <radialGradient id="sh_face" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#2e1e10"/>
    </radialGradient>
    <radialGradient id="sh_tuft" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0ece0"/>
      <stop offset="100%" stop-color="#d0c8b0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31" rx="9" ry="0.8" fill="#00000018"/>
  <!-- Legs (dark brown) -->
  <path d="M11,27 L10.5,31" stroke="#3a2818" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M13.5,27.5 L13,31.5" stroke="#3a2818" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M18,27.5 L17.5,31.5" stroke="#3a2818" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M20.5,27 L20,31" stroke="#3a2818" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Hooves -->
  <ellipse cx="10.5" cy="31.2" rx="1" ry="0.6" fill="#2a1808"/>
  <ellipse cx="13" cy="31.7" rx="1" ry="0.6" fill="#2a1808"/>
  <ellipse cx="17.5" cy="31.7" rx="1" ry="0.6" fill="#2a1808"/>
  <ellipse cx="20" cy="31.2" rx="1" ry="0.6" fill="#2a1808"/>
  <!-- Main woolly body - multiple overlapping ellipses for fleece texture -->
  <ellipse cx="16.5" cy="22" rx="9.5" ry="6.5" fill="url(#sh_wool)"/>
  <!-- Wool texture clusters -->
  <ellipse cx="9.5" cy="20" rx="4" ry="3.5" fill="url(#sh_tuft)" opacity="0.9"/>
  <ellipse cx="13" cy="17.5" rx="4" ry="3.5" fill="url(#sh_tuft)" opacity="0.9"/>
  <ellipse cx="17.5" cy="17" rx="4.5" ry="3.5" fill="url(#sh_tuft)" opacity="0.9"/>
  <ellipse cx="21.5" cy="19" rx="3.8" ry="3.2" fill="url(#sh_tuft)" opacity="0.85"/>
  <ellipse cx="11" cy="23" rx="3.5" ry="3" fill="url(#sh_tuft)" opacity="0.8"/>
  <ellipse cx="20" cy="23" rx="3.5" ry="2.8" fill="url(#sh_tuft)" opacity="0.8"/>
  <ellipse cx="15.5" cy="19.5" rx="3.8" ry="3" fill="#f8f4ea" opacity="0.6"/>
  <!-- Tail (stub, wool) -->
  <ellipse cx="25.5" cy="21" rx="2" ry="2" fill="url(#sh_tuft)"/>
  <!-- Neck dark fur -->
  <path d="M9.5,18 Q8.5,14 10,11.5 Q12,12 11,18 Z" fill="url(#sh_face)"/>
  <!-- Head -->
  <ellipse cx="9.5" cy="10.5" rx="3.8" ry="3.2" fill="url(#sh_face)"/>
  <!-- Muzzle lighter -->
  <ellipse cx="8.2" cy="12" rx="2" ry="1.3" fill="#4a3828"/>
  <!-- Ear -->
  <path d="M8,8.5 Q6,7 5.5,8.5 Q6,10 8,9.5 Z" fill="#3a2818"/>
  <!-- Eye -->
  <ellipse cx="10.5" cy="9.5" rx="1.1" ry="0.9" fill="#1a0a00"/>
  <ellipse cx="10.2" cy="9.3" rx="0.45" ry="0.35" fill="#aa8855"/>
  <circle cx="10.8" cy="9" r="0.22" fill="#ffffff55"/>
  <!-- Nostril -->
  <circle cx="7.8" cy="12" r="0.4" fill="#2a1808"/>
  <!-- Wool tuft on forehead -->
  <ellipse cx="11" cy="7.5" rx="2.5" ry="2" fill="url(#sh_tuft)"/>
</svg>