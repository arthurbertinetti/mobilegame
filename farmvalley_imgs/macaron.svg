<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="mac_shell" cx="38%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#f090c0"/>
      <stop offset="55%" stop-color="#e060a0"/>
      <stop offset="100%" stop-color="#b03070"/>
    </radialGradient>
    <radialGradient id="mac_cream" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0e8e0"/>
    </radialGradient>
    <radialGradient id="mac_foot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e878b8"/>
      <stop offset="100%" stop-color="#c04888"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Bottom shell -->
  <ellipse cx="16" cy="26" rx="9" ry="3.5" fill="url(#mac_shell)"/>
  <!-- Bottom shell foot (ruffled ring) -->
  <ellipse cx="16" cy="23.5" rx="9.5" ry="2" fill="url(#mac_foot)"/>
  <!-- Cream filling -->
  <rect x="7" y="20" width="18" height="3.5" rx="1" fill="url(#mac_cream)"/>
  <ellipse cx="16" cy="20" rx="9" ry="2" fill="#fff8f5"/>
  <!-- Top shell foot -->
  <ellipse cx="16" cy="20" rx="9.5" ry="2" fill="url(#mac_foot)"/>
  <!-- Top shell -->
  <ellipse cx="16" cy="17" rx="9" ry="4.5" fill="url(#mac_shell)"/>
  <!-- Top shell highlight -->
  <ellipse cx="13" cy="15" rx="4" ry="2" fill="rgba(255,255,255,0.35)"/>
  <!-- Bottom shell highlight -->
  <ellipse cx="13" cy="25" rx="3.5" ry="1.5" fill="rgba(255,255,255,0.25)"/>
  <!-- Cream peek detail -->
  <path d="M8,21.5 Q16,22.5 24,21.5" stroke="rgba(255,220,200,0.6)" stroke-width="0.8" fill="none"/>
</svg>
