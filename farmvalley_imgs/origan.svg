  <line x1="16" y1="27" x2="16" y2="7" stroke="#a1887f" stroke-width="1.5"/>
  <!-- Paires de feuilles -->
  <ellipse cx="11" cy="24" rx="4.5" ry="2.5" fill="#558b2f" transform="rotate(-15 11 24)"/>
  <ellipse cx="21" cy="24" rx="4.5" ry="2.5" fill="#558b2f" transform="rotate(15 21 24)"/>
  <ellipse cx="10" cy="19" rx="4.5" ry="2.5" fill="#689f38" transform="rotate(-20 10 19)"/>
  <ellipse cx="22" cy="19" rx="4.5" ry="2.5" fill="#689f38" transform="rotate(20 22 19)"/>
  <ellipse cx="11" cy="14" rx="4" ry="2.2" fill="#7cb342" transform="rotate(-15 11 14)"/>
  <ellipse cx="21" cy="14" rx="4" ry="2.2" fill="#7cb342" transform="rotate(15 21 14)"/>
  <ellipse cx="12" cy="10" rx="3.5" ry="2" fill="#8bc34a" transform="rotate(-10 12 10)"/>
  <ellipse cx="20" cy="10" rx="3.5" ry="2" fill="#8bc34a" transform="rotate(10 20 10)"/>
  <!-- Fleurs mauves au sommet -->
  <circle cx="13.5" cy="7" r="1.5" fill="#ab47bc"/>
