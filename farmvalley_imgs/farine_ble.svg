  <ellipse cx="13.5" cy="18.5" rx="1.2" ry="0.7" fill="#c8b890" transform="rotate(-25,13.5,18.5)"/>
  <ellipse cx="15.5" cy="18.5" rx="1.2" ry="0.7" fill="#c8b890" transform="rotate(25,15.5,18.5)"/>
  <ellipse cx="13.8" cy="17.2" rx="1.1" ry="0.6" fill="#c8b890" transform="rotate(-20,13.8,17.2)"/>
  <ellipse cx="15.2" cy="17.2" rx="1.1" ry="0.6" fill="#c8b890" transform="rotate(20,15.2,17.2)"/>
