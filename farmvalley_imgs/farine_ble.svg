  </defs>
  <!-- Bag body -->
  <path d="M7,14 Q6,12 7,10 L12,8 L20,8 L25,10 Q26,12 25,14 L26,26 Q26,28 24,29 L8,29 Q6,28 6,26 Z" fill="url(#fb_bag)"/>
