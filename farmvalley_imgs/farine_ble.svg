      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="60%" stop-color="#e4dcd0"/>
      <stop offset="100%" stop-color="#c8bfb0"/>
    </radialGradient>
    <radialGradient id="fb_top" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8e0d4"/>
      <stop offset="100%" stop-color="#c0b8a8"/>
