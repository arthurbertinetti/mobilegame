<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skewer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a060"/>
      <stop offset="100%" stop-color="#8a5820"/>
    </linearGradient>
    <radialGradient id="meatG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d06030"/>
      <stop offset="100%" stop-color="#802010"/>
    </radialGradient>
    <radialGradient id="pepperG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e83020"/>
      <stop offset="100%" stop-color="#a02010"/>
    </radialGradient>
    <radialGradient id="zucchiniG" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#50c030"/>
      <stop offset="100%" stop-color="#208010"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="13" ry="2.5" fill="url(#shadowG)"/>
  <!-- Wooden skewer -->
  <line x1="3" y1="29" x2="29" y2="3" stroke="url(#skewer)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Piece 1: meat -->
  <rect x="5" y="22" width="5" height="5" rx="1.5" fill="url(#meatG)" transform="rotate(-45,7.5,24.5)"/>
  <!-- Piece 2: red pepper -->
  <rect x="10" y="17" width="4.5" height="4.5" rx="1.2" fill="url(#pepperG)" transform="rotate(-45,12.25,19.25)"/>
  <!-- Piece 3: green zucchini -->
  <rect x="14.5" y="12.5" width="4.5" height="4.5" rx="1.2" fill="url(#zucchiniG)" transform="rotate(-45,16.75,14.75)"/>
  <!-- Piece 4: meat -->
  <rect x="19" y="8" width="5" height="5" rx="1.5" fill="url(#meatG)" transform="rotate(-45,21.5,10.5)"/>
  <!-- Piece 5: red pepper -->
  <rect x="23.5" y="3.5" width="4" height="4" rx="1" fill="url(#pepperG)" transform="rotate(-45,25.5,5.5)"/>
  <!-- Skewer tip -->
  <circle cx="29" cy="3" r="1" fill="#c89040"/>
</svg>
