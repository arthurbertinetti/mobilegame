<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="or_fr" cx="33%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ffd040"/>
      <stop offset="45%" stop-color="#f07000"/>
      <stop offset="100%" stop-color="#a03800"/>
    </radialGradient>
    <radialGradient id="or_can" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#3c9828"/>
      <stop offset="60%" stop-color="#185810"/>
      <stop offset="100%" stop-color="#0a3808"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="7.5" ry="0.7" fill="#00000022"/>
  <!-- Trunk (short — orange trees are compact Mediterranean trees) -->
  <path d="M13.5,31 Q13,27 13.5,24.5 Q14.5,23 16,23.3 Q17.5,23 18.5,24.5 Q19,27 18.5,31 Z" fill="#6b3a1f"/>
  <path d="M14.5,31 Q14,27 14.5,25 Q15.2,24 16,24.2 Q16.8,24 17.5,25 Q18,27 17.5,31 Z" fill="#905430"/>
  <!-- Canopy (very round and dense — citrus orange) -->
  <circle cx="16" cy="15.5" r="13" fill="#104810"/>
  <circle cx="16" cy="14.5" r="12" fill="#1a6014"/>
  <circle cx="9.5" cy="16.5" r="8" fill="#104810"/>
  <circle cx="22.5" cy="16.5" r="8" fill="#104810"/>
  <circle cx="16" cy="9" r="8.5" fill="url(#or_can)"/>
  <!-- Glossy leaves shine -->
  <ellipse cx="12" cy="11" rx="3.5" ry="2" fill="rgba(80,200,60,.22)"/>
  <!-- Oranges (prominent, clearly orange) -->
  <circle cx="6.5" cy="18" r="3.5" fill="url(#or_fr)"/>
  <circle cx="25.5" cy="17" r="3.5" fill="url(#or_fr)"/>
  <circle cx="16" cy="22" r="3.5" fill="url(#or_fr)"/>
  <circle cx="11" cy="11.5" r="3" fill="url(#or_fr)"/>
  <circle cx="22" cy="11" r="3" fill="url(#or_fr)"/>
  <!-- Orange navel dot (characteristic) -->
  <circle cx="6.5" cy="21.2" r="0.8" fill="#804000"/>
  <circle cx="25.5" cy="20.2" r="0.8" fill="#804000"/>
  <circle cx="16" cy="25.2" r="0.8" fill="#804000"/>
  <!-- Orange shines -->
  <ellipse cx="5.5" cy="16.5" rx="1.1" ry="1.4" fill="rgba(255,250,200,.42)"/>
  <ellipse cx="24.5" cy="15.5" rx="1.1" ry="1.4" fill="rgba(255,250,200,.42)"/>
  <!-- Green calyx on oranges -->
  <path d="M5,17.2 Q5.5,16 6,16.5 Q6.5,16 7,16.5 Q7.5,16 8,17.2" stroke="#2a8010" stroke-width="0.5" fill="none"/>
  <path d="M24,16.2 Q24.5,15 25,15.5 Q25.5,15 26,15.5 Q26.5,15 27,16.2" stroke="#2a8010" stroke-width="0.5" fill="none"/>
</svg>
