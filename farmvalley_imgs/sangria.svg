<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glass_g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0d0d4"/>
      <stop offset="40%" stop-color="#f4ecee"/>
      <stop offset="100%" stop-color="#c0a8b0"/>
    </linearGradient>
    <linearGradient id="liq_g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b01020"/>
      <stop offset="100%" stop-color="#700010"/>
    </linearGradient>
    <clipPath id="wine_clip">
      <path d="M8,30 Q8,32 16,32 Q24,32 24,30 L22,18 Q22,15 16,15 Q10,15 10,18 Z"/>
    </clipPath>
  </defs>
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- wide wine glass liquid -->
  <rect x="7" y="18" width="18" height="14" fill="url(#liq_g)" clip-path="url(#wine_clip)"/>
  <!-- wine glass bowl (wide) -->
  <path d="M8,30 Q8,32 16,32 Q24,32 24,30 L22,18 Q22,15 16,15 Q10,15 10,18 Z" fill="url(#glass_g)" fill-opacity="0.45" stroke="#b090a0" stroke-width="0.7"/>
  <!-- rim of bowl -->
  <path d="M10,18 Q10,15 16,15 Q22,15 22,18" fill="none" stroke="#c0a8b0" stroke-width="1"/>
  <!-- stem -->
  <line x1="16" y1="32" x2="16" y2="32" stroke="none"/>
  <line x1="16" y1="30" x2="16" y2="32" stroke="#b090a0" stroke-width="0"/>
  <!-- orange slice floating inside -->
  <circle cx="16" cy="24" r="3.5" fill="#ff8800" opacity="0.85"/>
  <circle cx="16" cy="24" r="2.5" fill="#ffaa00" opacity="0.7"/>
  <!-- orange segments -->
  <line x1="16" y1="20.5" x2="16" y2="27.5" stroke="#e07000" stroke-width="0.5" opacity="0.6"/>
  <line x1="12.5" y1="24" x2="19.5" y2="24" stroke="#e07000" stroke-width="0.5" opacity="0.6"/>
  <line x1="13.5" y1="21.5" x2="18.5" y2="26.5" stroke="#e07000" stroke-width="0.4" opacity="0.5"/>
  <line x1="18.5" y1="21.5" x2="13.5" y2="26.5" stroke="#e07000" stroke-width="0.4" opacity="0.5"/>
  <!-- glass highlight -->
  <line x1="11" y1="19" x2="11" y2="28" stroke="#e0c0c8" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
</svg>
