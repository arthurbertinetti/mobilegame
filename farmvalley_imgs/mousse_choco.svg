<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="mc_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mc_glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0d8e8" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#e8f4fc" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#d0e4f0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a8c8e0" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="mc_mousse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2a10"/>
      <stop offset="100%" stop-color="#3a1a0a"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31" rx="8" ry="1.8" fill="url(#mc_shadow)"/>
  <!-- Glass cup body -->
  <path d="M9 16 L10 29 Q16 31 22 29 L23 16 Z" fill="url(#mc_glass)" stroke="#88b0cc" stroke-width="0.7"/>
  <!-- Mousse fill -->
  <path d="M9.5 18 L10 28.5 Q16 30 22 28.5 L22.5 18 Z" fill="url(#mc_mousse)" opacity="0.92"/>
  <!-- Mousse texture bumps -->
  <ellipse cx="13" cy="22" rx="2" ry="1" fill="#4a2208" opacity="0.5" transform="rotate(-5,13,22)"/>
  <ellipse cx="19" cy="24" rx="1.8" ry="0.9" fill="#4a2208" opacity="0.5" transform="rotate(8,19,24)"/>
  <!-- Glass shine -->
  <path d="M10.2 16.5 L10.5 27 L12 27.5 L11.8 16.5 Z" fill="white" opacity="0.35"/>
  <!-- Cup rim -->
  <ellipse cx="16" cy="16" rx="7" ry="1.8" fill="url(#mc_glass)" stroke="#88b0cc" stroke-width="0.7"/>
  <!-- Mousse surface -->
  <ellipse cx="16" cy="16" rx="6" ry="1.4" fill="url(#mc_mousse)" opacity="0.88"/>
  <!-- Whipped cream swirl -->
  <path d="M16 14.5 Q14.5 13.5 15 12 Q15.5 10.5 16 11 Q16.5 11.5 17.5 11 Q18.5 10.5 18 12 Q17.5 13.5 16 14.5 Z" fill="white" stroke="#e8e0d8" stroke-width="0.3"/>
  <path d="M15.5 12.5 Q16.5 11.5 17 12.5" stroke="#e8e0d8" stroke-width="0.4" fill="none" stroke-linecap="round"/>
  <!-- Cream highlight -->
  <ellipse cx="15.5" cy="12.2" rx="0.7" ry="0.4" fill="white" opacity="0.7" transform="rotate(-20,15.5,12.2)"/>
</svg>
