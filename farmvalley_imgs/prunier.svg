<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="pl_fr" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#d080e0"/>
      <stop offset="45%" stop-color="#7020a0"/>
      <stop offset="100%" stop-color="#300850"/>
    </radialGradient>
    <radialGradient id="pl_can" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#50a030"/>
      <stop offset="60%" stop-color="#246014"/>
      <stop offset="100%" stop-color="#0e3808"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="8" ry="0.7" fill="#00000022"/>
  <!-- Trunk -->
  <path d="M13.5,31 Q13,25.5 13.5,22 Q14.5,20 16,20.5 Q17.5,20 18.5,22 Q19,25.5 18.5,31 Z" fill="#4a2810"/>
  <path d="M14.5,31 Q14,25.5 14.5,22.5 Q15.2,21 16,21.2 Q16.8,21 17.5,22.5 Q18,25.5 17.5,31 Z" fill="#6a3c18"/>
  <!-- Branches spreading wide (plum tree characteristic open shape) -->
  <line x1="16" y1="21" x2="5" y2="13" stroke="#4a2810" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="27" y2="13" stroke="#4a2810" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="16" y2="9" stroke="#4a2810" stroke-width="2" stroke-linecap="round"/>
  <!-- Sub-branches -->
  <line x1="5.5" y1="13.5" x2="3" y2="10" stroke="#4a2810" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="5.5" y1="13.5" x2="8" y2="10" stroke="#4a2810" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="26.5" y1="13.5" x2="29" y2="10" stroke="#4a2810" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="26.5" y1="13.5" x2="24" y2="10" stroke="#4a2810" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Leaf clusters at branch tips -->
  <ellipse cx="5" cy="11" rx="6" ry="4.5" fill="#1c5c10"/>
  <ellipse cx="27" cy="11" rx="6" ry="4.5" fill="#1c5c10"/>
  <ellipse cx="16" cy="7" rx="7.5" ry="5.5" fill="url(#pl_can)"/>
  <ellipse cx="10" cy="9" rx="5" ry="4" fill="#267018"/>
  <ellipse cx="22" cy="9" rx="5" ry="4" fill="#1e6014"/>
  <!-- Canopy highlight -->
  <ellipse cx="12.5" cy="8" rx="3" ry="1.8" fill="rgba(120,220,80,.22)"/>
  <!-- Plums (oval, deep purple — very distinctive color) -->
  <ellipse cx="4" cy="14" rx="3" ry="3.5" fill="url(#pl_fr)"/>
  <ellipse cx="28" cy="13.5" rx="3" ry="3.5" fill="url(#pl_fr)"/>
  <ellipse cx="16" cy="21.5" rx="3" ry="3.5" fill="url(#pl_fr)"/>
  <ellipse cx="10" cy="16.5" rx="2.8" ry="3.2" fill="url(#pl_fr)"/>
  <ellipse cx="22" cy="16" rx="2.8" ry="3.2" fill="url(#pl_fr)"/>
  <!-- Plum shines -->
  <ellipse cx="3" cy="12.5" rx="1" ry="1.3" fill="rgba(255,200,255,.38)"/>
  <ellipse cx="27" cy="12" rx="1" ry="1.3" fill="rgba(255,200,255,.38)"/>
  <ellipse cx="15" cy="20" rx="1" ry="1.3" fill="rgba(255,200,255,.38)"/>
</svg>
