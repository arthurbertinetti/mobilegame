<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glass_g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="40%" stop-color="#f8f4ec"/>
      <stop offset="100%" stop-color="#c0b090"/>
    </linearGradient>
    <linearGradient id="liq_g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f09040"/>
      <stop offset="100%" stop-color="#c05010"/>
    </linearGradient>
    <radialGradient id="cream_g" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ece8e0"/>
    </radialGradient>
    <radialGradient id="apricot_g" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffb050"/>
      <stop offset="100%" stop-color="#e06010"/>
    </radialGradient>
    <clipPath id="glass_clip">
      <path d="M11,29 Q11,31 16,31 Q21,31 21,29 L19.5,12 L12.5,12 Z"/>
    </clipPath>
  </defs>
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <rect x="12" y="17" width="8" height="12" fill="url(#liq_g)" clip-path="url(#glass_clip)"/>
  <path d="M11,29 Q11,31 16,31 Q21,31 21,29 L19.5,12 L12.5,12 Z" fill="url(#glass_g)" fill-opacity="0.5" stroke="#b0a080" stroke-width="0.7"/>
  <line x1="12.5" y1="12" x2="19.5" y2="12" stroke="#d0c8b0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- whipped cream swirl -->
  <path d="M12,12 Q13,8 16,7 Q19,8 20,12" fill="url(#cream_g)" stroke="#e8e0d0" stroke-width="0.3"/>
  <path d="M13,10 Q14,7.5 16,7 Q18,7.5 19,10" fill="url(#cream_g)"/>
  <path d="M14,9 Q15,7 16,7 Q17,7 18,9" fill="#ffffff"/>
  <!-- apricot half garnish -->
  <path d="M14,7 A3,3 0 0 1 20,7 Z" fill="url(#apricot_g)" stroke="#c06010" stroke-width="0.4"/>
  <line x1="17" y1="7" x2="17" y2="4" stroke="#c06010" stroke-width="0.5" opacity="0.5"/>
  <!-- leaf on apricot -->
  <path d="M17,4 Q15.5,2.5 15,3.5 Q16,3.5 17,4Z" fill="#5a9820"/>
  <!-- straw (orange) -->
  <rect x="19.5" y="2" width="1.5" height="14" rx="0.75" fill="#f09030"/>
</svg>
