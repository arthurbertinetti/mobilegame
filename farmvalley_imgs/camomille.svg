<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Camomille: fleurs blanches à cœur jaune (marguerites) -->
  <rect x="14.5" y="27" width="3" height="4" rx="1" fill="#4e342e"/>
  <!-- Tiges -->
  <line x1="16" y1="27" x2="16" y2="14" stroke="#4caf50" stroke-width="1.4"/>
  <line x1="16" y1="22" x2="9" y2="16" stroke="#4caf50" stroke-width="1.2"/>
  <!-- Petite feuille -->
  <ellipse cx="21" cy="20" rx="3.5" ry="1.5" fill="#81c784" transform="rotate(25 21 20)"/>
  <!-- Grande fleur centrale (haut) -->
  <ellipse cx="16" cy="10" rx="1.8" ry="4" fill="white"/>
  <ellipse cx="16" cy="10" rx="1.8" ry="4" fill="white" transform="rotate(45 16 10)"/>
  <ellipse cx="16" cy="10" rx="1.8" ry="4" fill="white" transform="rotate(90 16 10)"/>
  <ellipse cx="16" cy="10" rx="1.8" ry="4" fill="white" transform="rotate(135 16 10)"/>
  <circle cx="16" cy="10" r="3.2" fill="#fdd835"/>
  <circle cx="16" cy="10" r="2.2" fill="#f9a825"/>
  <!-- Petite fleur gauche -->
  <ellipse cx="9" cy="13" rx="1.4" ry="3" fill="white"/>
  <ellipse cx="9" cy="13" rx="1.4" ry="3" fill="white" transform="rotate(60 9 13)"/>
  <ellipse cx="9" cy="13" rx="1.4" ry="3" fill="white" transform="rotate(120 9 13)"/>
  <circle cx="9" cy="13" r="2.5" fill="#fdd835"/>
  <circle cx="9" cy="13" r="1.7" fill="#f9a825"/>
</svg>
