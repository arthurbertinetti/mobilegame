<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="tortilla_grad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ecdea0"/>
      <stop offset="70%" stop-color="#d4b860"/>
      <stop offset="100%" stop-color="#b89030"/>
    </radialGradient>
    <radialGradient id="char_spot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5010a0"/>
      <stop offset="100%" stop-color="#7a501000"/>
    </radialGradient>
    <radialGradient id="char_spot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a4008b0"/>
      <stop offset="100%" stop-color="#6a400800"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- Tortilla base (slightly irregular circle) -->
  <path d="M16 4 Q21 4 25 7 Q29 10 28.5 16 Q29 22 25 25 Q22 29 16 28.5 Q10 29 7 25 Q3 22 3.5 16 Q3 10 7 7 Q10 4 16 4 Z" fill="url(#tortilla_grad)"/>
  <!-- Outer edge slightly darker -->
  <path d="M16 4 Q21 4 25 7 Q29 10 28.5 16 Q29 22 25 25 Q22 29 16 28.5 Q10 29 7 25 Q3 22 3.5 16 Q3 10 7 7 Q10 4 16 4 Z" fill="none" stroke="#b08028" stroke-width="1"/>
  <!-- Char marks (irregular brown spots) -->
  <ellipse cx="10" cy="10" rx="2.5" ry="1.8" fill="url(#char_spot1)" transform="rotate(-20,10,10)"/>
  <ellipse cx="22" cy="9" rx="2" ry="1.5" fill="url(#char_spot2)" transform="rotate(15,22,9)"/>
  <ellipse cx="24" cy="20" rx="2" ry="1.5" fill="url(#char_spot1)" transform="rotate(-30,24,20)"/>
  <ellipse cx="8" cy="22" rx="2.5" ry="1.5" fill="url(#char_spot2)" transform="rotate(10,8,22)"/>
  <ellipse cx="16" cy="24" rx="2" ry="1.2" fill="url(#char_spot1)"/>
  <ellipse cx="20" cy="15" rx="1.5" ry="1" fill="url(#char_spot2)" transform="rotate(-15,20,15)"/>
  <!-- Surface texture: subtle concentric hint -->
  <path d="M16 8 Q21 9 23 13 Q24 17 22 21 Q19 25 16 24.5 Q13 25 10 21 Q8 17 9 13 Q11 9 16 8 Z" fill="none" stroke="#d0b85080" stroke-width="0.5"/>
  <!-- Center light spot (baking) -->
