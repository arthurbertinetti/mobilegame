<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="wg" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
  </defs>
  <!-- Feuille large -->
  <ellipse cx="7" cy="10" rx="7" ry="5" fill="#2e7d32" transform="rotate(-20 7 10)"/>
  <!-- Vrille -->
  <path d="M23 9 Q27 5 28 7" fill="none" stroke="#4caf50" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Tige -->
  <line x1="16" y1="17" x2="14" y2="10" stroke="#4caf50" stroke-width="1.5"/>
  <!-- Corps pastèque (grande ellipse) -->
  <ellipse cx="17" cy="23" rx="13" ry="10" fill="url(#wg)"/>
  <!-- Rayures sombres -->
  <ellipse cx="17" cy="23" rx="13" ry="10" fill="none" stroke="#0d3b15" stroke-width="2.5" stroke-dasharray="6,5" opacity="0.5"/>
  <!-- Rayures vertes claires entre les sombres -->
  <line x1="17" y1="13" x2="17" y2="33" stroke="#388e3c" stroke-width="1.5" opacity="0.5"/>
  <line x1="10" y1="14.5" x2="8" y2="31.5" stroke="#2e7d32" stroke-width="1.2" opacity="0.4"/>
  <line x1="24" y1="14.5" x2="26" y2="31.5" stroke="#2e7d32" stroke-width="1.2" opacity="0.4"/>
  <!-- Tige du fruit -->
  <line x1="17" y1="13" x2="16" y2="11" stroke="#558b2f" stroke-width="1.5"/>
  <!-- Reflet -->
  <ellipse cx="11" cy="19" rx="4" ry="5.5" fill="rgba(255,255,255,0.15)" transform="rotate(-15 11 19)"/>
</svg>
