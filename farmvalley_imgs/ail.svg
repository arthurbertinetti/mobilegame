<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sol -->
  <rect x="4" y="22" width="24" height="9" rx="2" fill="#6b4f2c"/>
  <ellipse cx="16" cy="22" rx="12" ry="2.5" fill="#7a5c38"/>
  <!-- Bulbe d'ail (ensemble) -->
  <defs>
    <radialGradient id="garg" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
  </defs>
  <ellipse cx="16" cy="24" rx="10" ry="7" fill="url(#garg)"/>
  <!-- Enveloppe papyracée -->
  <ellipse cx="16" cy="23.5" rx="10" ry="7" fill="none" stroke="#bdbdbd" stroke-width="0.8"/>
  <!-- Gousses individuelles visibles -->
  <ellipse cx="16" cy="24" rx="5.5" ry="6" fill="#eeeeee" stroke="#d5d5d5" stroke-width="0.8"/>
  <ellipse cx="10" cy="25" rx="4" ry="5" fill="#f5f5f5" stroke="#d5d5d5" stroke-width="0.7" transform="rotate(-15 10 25)"/>
  <ellipse cx="22" cy="25" rx="4" ry="5" fill="#eeeeee" stroke="#d5d5d5" stroke-width="0.7" transform="rotate(15 22 25)"/>
  <!-- Lignes des gousses -->
  <line x1="16" y1="18.5" x2="16" y2="30" stroke="#c5c5c5" stroke-width="0.8"/>
  <!-- Nervures sur gousses -->
  <line x1="10" y1="21" x2="10" y2="29" stroke="#c5c5c5" stroke-width="0.6" opacity="0.7"/>
  <line x1="22" y1="21" x2="22" y2="29" stroke="#c5c5c5" stroke-width="0.6" opacity="0.7"/>
  <!-- Pointe du bas (radicelle) -->
  <ellipse cx="16" cy="30.5" rx="2" ry="1" fill="#bdbdbd"/>
  <!-- Tiges vertes (scapes) -->
  <line x1="14" y1="22" x2="12" y2="5" stroke="#4caf50" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="21.5" x2="16" y2="3" stroke="#43a047" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="22" x2="20" y2="5" stroke="#4caf50" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pointe des feuilles -->
  <ellipse cx="12" cy="4.5" rx="1.5" ry="2" fill="#66bb6a" transform="rotate(-10 12 4.5)"/>
  <ellipse cx="16" cy="3" rx="1.5" ry="2" fill="#81c784"/>
  <ellipse cx="20" cy="4.5" rx="1.5" ry="2" fill="#66bb6a" transform="rotate(10 20 4.5)"/>
</svg>
