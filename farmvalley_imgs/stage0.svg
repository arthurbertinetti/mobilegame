<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sol -->
  <ellipse cx="16" cy="27" rx="10" ry="3" fill="#5d3c1e"/>
  <rect x="6" y="25" width="20" height="5" rx="2" fill="#6b4f2c"/>
  <!-- Petite tige -->
  <line x1="16" y1="25" x2="16" y2="21" stroke="#558b2f" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cotylédons (premières feuilles) -->
  <ellipse cx="13" cy="21" rx="3.5" ry="2" fill="#c5e1a5" transform="rotate(-20 13 21)"/>
  <ellipse cx="19" cy="21" rx="3.5" ry="2" fill="#aed581" transform="rotate(20 19 21)"/>
  <!-- Graine visible dans le sol -->
  <ellipse cx="16" cy="26" rx="2.5" ry="1.2" fill="#8d6e63"/>
</svg>
