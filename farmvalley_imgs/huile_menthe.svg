<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadow_hm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottle_hm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#107030"/>
      <stop offset="40%" stop-color="#30c060"/>
      <stop offset="100%" stop-color="#0a5828"/>
    </linearGradient>
    <linearGradient id="dropper_hm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#208040"/>
      <stop offset="50%" stop-color="#40d070"/>
      <stop offset="100%" stop-color="#106030"/>
    </linearGradient>
    <linearGradient id="neck_hm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#188038"/>
      <stop offset="50%" stop-color="#28a850"/>
      <stop offset="100%" stop-color="#106828"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30.5" rx="5.5" ry="1.5" fill="url(#shadow_hm)"/>
  <!-- Bottle body (bright green, small) -->
  <rect x="11.5" y="17" width="9" height="12" rx="3" fill="url(#bottle_hm)"/>
  <ellipse cx="16" cy="29" rx="4.5" ry="1.3" fill="#0a4820" opacity="0.5"/>
  <!-- Neck -->
  <rect x="14" y="13" width="4" height="5" rx="1" fill="url(#neck_hm)"/>
  <!-- Dropper collar -->
  <rect x="13" y="11" width="6" height="2.5" rx="1.2" fill="url(#dropper_hm)"/>
  <!-- Dropper stem -->
  <rect x="15" y="5" width="2" height="7" rx="1" fill="#38b858"/>
  <!-- Rubber bulb -->
  <ellipse cx="16" cy="4.5" rx="2.5" ry="1.8" fill="#20a040"/>
  <!-- Bottle shine -->
  <rect x="13" y="18" width="1.8" height="9" rx="0.9" fill="#fff" opacity="0.25"/>
  <!-- Mint leaf graphic on bottle -->
  <!-- Main leaf -->
  <path d="M14 21 Q16 18.5 18 21 Q16 23.5 14 21 Z" fill="#60e080" opacity="0.85"/>
  <line x1="16" y1="18.5" x2="16" y2="23.5" stroke="#40c060" stroke-width="0.6" opacity="0.7"/>
  <line x1="14.5" y1="20" x2="17.5" y2="20" stroke="#40c060" stroke-width="0.5" opacity="0.6"/>
  <line x1="14.2" y1="21.5" x2="17.8" y2="21.5" stroke="#40c060" stroke-width="0.5" opacity="0.6"/>
  <!-- Small second leaf -->
  <path d="M13 24 Q14.5 22.5 16 24 Q14.5 25.5 13 24 Z" fill="#50d070" opacity="0.75" transform="rotate(-20,14.5,24)"/>
  <path d="M16 24 Q17.5 22.5 19 24 Q17.5 25.5 16 24 Z" fill="#50d070" opacity="0.75" transform="rotate(15,17.5,24)"/>
</svg>
