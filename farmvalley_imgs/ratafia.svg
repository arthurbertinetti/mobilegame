<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glass_g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8c8b0"/>
      <stop offset="40%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a89070"/>
    </linearGradient>
    <linearGradient id="liq_g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a3010"/>
      <stop offset="100%" stop-color="#4a1800"/>
    </linearGradient>
    <radialGradient id="liq_r" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a04020"/>
      <stop offset="100%" stop-color="#4a1800"/>
    </radialGradient>
    <clipPath id="glass_clip">
      <path d="M11,29 Q11,31 16,31 Q21,31 21,29 L20,20 Q20,17 16,17 Q12,17 12,20 Z"/>
    </clipPath>
  </defs>
  <ellipse cx="16" cy="31.5" rx="8" ry="0.7" fill="#00000020"/>
  <!-- rounded liqueur glass (short and wide) -->
  <rect x="11" y="20" width="10" height="11" fill="url(#liq_g)" clip-path="url(#glass_clip)"/>
  <!-- glass bowl rounded -->
  <path d="M11,29 Q11,31 16,31 Q21,31 21,29 L20,20 Q20,17 16,17 Q12,17 12,20 Z" fill="url(#glass_g)" fill-opacity="0.5" stroke="#a08060" stroke-width="0.7"/>
  <!-- rim -->
  <path d="M12,20 Q12,17 16,17 Q20,17 20,20" fill="none" stroke="#c0a880" stroke-width="1"/>
  <!-- stem (short) -->
  <rect x="14.5" y="31" width="3" height="2" fill="#b09060"/>
  <!-- base -->
  <ellipse cx="16" cy="33" rx="4.5" ry="0.8" fill="#a08050"/>
  <!-- liquid highlight -->
  <path d="M13,22 Q13,19 16,19 Q18,19 19,21" fill="none" stroke="#c06030" stroke-width="0.6" opacity="0.5"/>
  <!-- glass highlight -->
  <line x1="12.5" y1="22" x2="12.5" y2="28" stroke="#e0d0b8" stroke-width="0.6" opacity="0.4" stroke-linecap="round"/>
</svg>
