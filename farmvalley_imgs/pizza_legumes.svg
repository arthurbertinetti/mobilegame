<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crustG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d4a060"/>
      <stop offset="100%" stop-color="#8a5018"/>
    </radialGradient>
    <radialGradient id="sauceG" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e84030"/>
      <stop offset="100%" stop-color="#a01808"/>
    </radialGradient>
    <radialGradient id="cheeseG" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f8d848"/>
      <stop offset="100%" stop-color="#d0a010"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="13" ry="2.5" fill="url(#shadowG)"/>
  <!-- Crust ring -->
  <circle cx="16" cy="16" r="13" fill="url(#crustG)"/>
  <!-- Tomato sauce base -->
  <circle cx="16" cy="16" r="11" fill="url(#sauceG)"/>
  <!-- Cheese layer -->
  <circle cx="16" cy="16" r="9.5" fill="url(#cheeseG)" opacity="0.9"/>
  <!-- Cheese melt blobs -->
  <ellipse cx="13" cy="14" rx="3.5" ry="2.5" fill="#f8e060" opacity="0.6" transform="rotate(-20,13,14)"/>
  <ellipse cx="20" cy="15" rx="3" ry="2" fill="#f0d040" opacity="0.6" transform="rotate(15,20,15)"/>
  <!-- Green zucchini slices -->
  <circle cx="12" cy="13" r="2.2" fill="#50b830" stroke="#309018" stroke-width="0.5"/>
  <circle cx="12" cy="13" r="1" fill="#70d050" opacity="0.6"/>
  <circle cx="20" cy="18" r="2" fill="#48a828" stroke="#287018" stroke-width="0.5"/>
  <circle cx="20" cy="18" r="0.9" fill="#68c848" opacity="0.6"/>
  <!-- Red pepper strips -->
  <rect x="17" y="11" width="5" height="1.5" rx="0.7" fill="#e83020" transform="rotate(-30,19.5,11.75)"/>
  <rect x="10" y="19" width="4.5" height="1.5" rx="0.7" fill="#d02010" transform="rotate(15,12.25,19.75)"/>
  <!-- Yellow corn kernels -->
  <ellipse cx="16" cy="20" rx="1.2" ry="0.9" fill="#f0c020"/>
  <ellipse cx="18" cy="21" rx="1.2" ry="0.9" fill="#e8b818"/>
  <ellipse cx="14" cy="21" rx="1.2" ry="0.9" fill="#f0c020"/>
  <ellipse cx="13" cy="17" rx="1" ry="0.8" fill="#e8b818"/>
  <ellipse cx="22" cy="13" rx="1" ry="0.8" fill="#f0c020"/>
</svg>
