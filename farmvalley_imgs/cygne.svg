<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="sw_body" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#eeeae4"/>
      <stop offset="100%" stop-color="#d0ccc4"/>
    </radialGradient>
    <radialGradient id="sw_wing" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e8e4dc"/>
      <stop offset="100%" stop-color="#c8c4bc"/>
    </radialGradient>
    <linearGradient id="sw_water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ab8d840"/>
      <stop offset="100%" stop-color="#4488b820"/>
    </linearGradient>
    <linearGradient id="sw_neck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e4dc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0dcd4"/>
    </linearGradient>
  </defs>
  <!-- Water surface -->
  <ellipse cx="16" cy="28.5" rx="14" ry="3" fill="url(#sw_water)"/>
  <!-- Water ripple reflection -->
  <path d="M5,29.5 Q16,31 27,29.5" stroke="#88b8d840" stroke-width="0.5" fill="none"/>
  <path d="M7,30.5 Q16,32 25,30.5" stroke="#88b8d830" stroke-width="0.4" fill="none"/>
  <!-- Body (floating on water) -->
  <path d="M5,26 Q5,21 11,20 Q18,19 23,22 Q26,24 25,27.5 Q22,30 15,30 Q5,29.5 5,26 Z" fill="url(#sw_body)"/>
  <!-- Raised wing feathers -->
  <path d="M8,24 Q12,20 20,22 Q19,25.5 14,26.5 Q9,26.5 8,24 Z" fill="url(#sw_wing)"/>
  <!-- Wing feather detail lines -->
  <path d="M9,24.5 Q13,21.5 19,23" stroke="#d0ccc4" stroke-width="0.4" fill="none"/>
  <path d="M9,25.5 Q13,22.5 19.5,24" stroke="#d0ccc4" stroke-width="0.4" fill="none"/>
  <path d="M9.5,26 Q13.5,23.5 19.5,25" stroke="#d0ccc4" stroke-width="0.4" fill="none"/>
  <!-- Tail (raised) -->
  <path d="M22.5,23.5 Q27,22 27.5,19 Q25.5,21 24,23 Z" fill="#e8e4dc"/>
  <!-- Graceful S-curved neck -->
  <path d="M11.5,21.5 Q9.5,18 10,14 Q10.5,10 13,8 Q15.5,7 16.5,8.5" stroke="url(#sw_neck)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Neck highlight -->
  <path d="M12,20.5 Q10.5,17 11,13.5 Q11.5,10 14,8.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Head -->
  <ellipse cx="16.5" cy="8.5" rx="3.5" ry="2.8" fill="url(#sw_body)"/>
  <!-- Black facial mask/lore -->
  <path d="M14.5,7.5 Q15.5,6.8 17,7 Q18,7.5 17.5,8.5 Q16.5,9 14.5,8.5 Z" fill="#1a1008"/>
  <!-- Orange beak -->
  <path d="M14.5,8.5 Q12.5,8.2 11.5,8.8 Q11.5,9.5 12.5,9.8 Q14,9.8 15,9 Z" fill="#e87020"/>
  <!-- Black knob at beak base -->
  <ellipse cx="14.8" cy="7.8" rx="0.9" ry="0.7" fill="#1a1008"/>
  <!-- Eye -->
  <ellipse cx="16" cy="7.8" rx="1.1" ry="0.9" fill="#1a0800"/>
  <ellipse cx="15.7" cy="7.5" rx="0.38" ry="0.3" fill="#ffffff50"/>
  <circle cx="16.4" cy="7.5" r="0.2" fill="#ffffff60"/>
</svg>