<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="sp_body" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff5050"/>
      <stop offset="55%" stop-color="#e02020"/>
      <stop offset="100%" stop-color="#901010"/>
    </radialGradient>
    <radialGradient id="sp_label" cx="40%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe8e8"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Bottle body -->
  <rect x="10" y="10" width="12" height="20" rx="3" fill="url(#sp_body)"/>
  <!-- Bottle neck -->
  <rect x="13" y="5" width="6" height="7" rx="2" fill="#c01818"/>
  <!-- Dark cap -->
  <rect x="12.5" y="3" width="7" height="4" rx="2" fill="#1a1010"/>
  <rect x="13" y="3" width="6" height="2" rx="1" fill="#2a1818"/>
  <!-- White label -->
  <rect x="11" y="14" width="10" height="11" rx="1.5" fill="url(#sp_label)" stroke="#f0c0c0" stroke-width="0.5"/>
  <!-- Chili pepper silhouette -->
  <path d="M16,16.5 Q19,17 19.5,19.5 Q20,22 17.5,23.5 Q15,24.5 14,23 Q12.5,21 13.5,18.5 Q14.5,16.5 16,16.5 Z" fill="#e02020"/>
  <!-- Chili stem -->
  <path d="M16,16.5 Q16.5,15 17,14.5 Q17.5,14 18,14.5" stroke="#307020" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- Chili highlight -->
  <path d="M14.5,18.5 Q15,17.5 16,17.5" stroke="rgba(255,200,200,0.7)" stroke-width="0.7" fill="none" stroke-linecap="round"/>
  <!-- Bottle shine -->
  <rect x="11.5" y="11" width="1.5" height="10" rx="0.7" fill="rgba(255,255,255,0.3)"/>
</svg>
