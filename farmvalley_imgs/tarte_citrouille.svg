<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="tc_fill" cx="38%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#e89040"/>
      <stop offset="55%" stop-color="#d07020"/>
      <stop offset="100%" stop-color="#a04010"/>
    </radialGradient>
    <radialGradient id="tc_crust" cx="40%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#e8c060"/>
      <stop offset="55%" stop-color="#c89030"/>
      <stop offset="100%" stop-color="#906020"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Pie slice crust edges (pastry) -->
  <!-- Left crust edge -->
  <path d="M7,10 L16,28 L16,30 L5,12 Z" fill="url(#tc_crust)"/>
  <!-- Right crust edge -->
  <path d="M25,10 L16,28 L16,30 L27,12 Z" fill="url(#tc_crust)"/>
  <!-- Back arc crust -->
  <path d="M7,10 Q16,4 25,10 Q16,8 7,10 Z" fill="url(#tc_crust)"/>
  <!-- Pie slice fill (pumpkin) -->
  <path d="M8,11 Q16,5.5 24,11 L16,28 Z" fill="url(#tc_fill)"/>
  <!-- Crust back rim (rounded) -->
  <path d="M7,10 Q16,3.5 25,10" stroke="#b07020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Cinnamon stick on top -->
  <rect x="17" y="7" width="1.5" height="8" rx="0.7" fill="#8a4818" transform="rotate(20,17,11)"/>
  <rect x="17.2" y="7" width="0.6" height="8" rx="0.3" fill="rgba(160,90,40,0.5)" transform="rotate(20,17,11)"/>
  <!-- Filling texture (ridges) -->
  <path d="M10,14 Q16,11 22,14" stroke="rgba(180,80,20,0.4)" stroke-width="0.7" fill="none"/>
  <path d="M11,18 Q16,15 21,18" stroke="rgba(180,80,20,0.4)" stroke-width="0.7" fill="none"/>
  <path d="M12,22 Q16,20 20,22" stroke="rgba(180,80,20,0.35)" stroke-width="0.6" fill="none"/>
  <!-- Shine on filling -->
  <ellipse cx="13" cy="12" rx="3" ry="1.5" fill="rgba(240,160,60,0.35)" transform="rotate(-15,13,12)"/>
</svg>
