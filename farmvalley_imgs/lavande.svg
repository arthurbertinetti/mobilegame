<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Lavande: épis de fleurs violettes sur tiges gris-vert -->
  <rect x="14.5" y="29" width="3" height="2" rx="1" fill="#5d4037"/>
  <!-- Trois tiges gris-vert -->
  <line x1="11" y1="29" x2="9" y2="9" stroke="#90a4ae" stroke-width="1.5"/>
  <line x1="16" y1="29" x2="16" y2="7" stroke="#90a4ae" stroke-width="1.5"/>
  <line x1="21" y1="29" x2="23" y2="9" stroke="#90a4ae" stroke-width="1.5"/>
  <!-- Épi gauche (fleurs violettes) -->
  <ellipse cx="9.5" cy="24" rx="2" ry="1.3" fill="#ce93d8" transform="rotate(-10 9.5 24)"/>
  <ellipse cx="9.2" cy="21" rx="2" ry="1.3" fill="#ba68c8" transform="rotate(-10 9.2 21)"/>
  <ellipse cx="8.9" cy="18" rx="2" ry="1.3" fill="#ab47bc" transform="rotate(-10 8.9 18)"/>
  <ellipse cx="8.6" cy="15" rx="2" ry="1.3" fill="#9c27b0" transform="rotate(-10 8.6 15)"/>
  <ellipse cx="8.3" cy="12" rx="1.8" ry="1.2" fill="#7b1fa2" transform="rotate(-10 8.3 12)"/>
  <!-- Épi central -->
  <ellipse cx="16" cy="21" rx="2" ry="1.3" fill="#ce93d8"/>
  <ellipse cx="16" cy="18" rx="2" ry="1.3" fill="#ba68c8"/>
  <ellipse cx="16" cy="15" rx="2" ry="1.3" fill="#ab47bc"/>
  <ellipse cx="16" cy="12" rx="2" ry="1.3" fill="#9c27b0"/>
  <ellipse cx="16" cy="9" rx="1.8" ry="1.2" fill="#7b1fa2"/>
  <!-- Épi droit -->
  <ellipse cx="22.5" cy="24" rx="2" ry="1.3" fill="#ce93d8" transform="rotate(10 22.5 24)"/>
  <ellipse cx="22.8" cy="21" rx="2" ry="1.3" fill="#ba68c8" transform="rotate(10 22.8 21)"/>
  <ellipse cx="23.1" cy="18" rx="2" ry="1.3" fill="#ab47bc" transform="rotate(10 23.1 18)"/>
  <ellipse cx="23.4" cy="15" rx="2" ry="1.3" fill="#9c27b0" transform="rotate(10 23.4 15)"/>
  <ellipse cx="23.7" cy="12" rx="1.8" ry="1.2" fill="#7b1fa2" transform="rotate(10 23.7 12)"/>
  <!-- Feuilles à la base -->
  <ellipse cx="8" cy="27" rx="4.5" ry="1.5" fill="#78909c" transform="rotate(-20 8 27)"/>
  <ellipse cx="24" cy="27" rx="4.5" ry="1.5" fill="#78909c" transform="rotate(20 24 27)"/>
</svg>
