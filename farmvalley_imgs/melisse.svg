<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mélisse: feuilles ovales à bords crénelés, vert clair, ressemble à la menthe mais plus pâle -->
  <rect x="14.5" y="27" width="3" height="4" rx="1" fill="#4e342e"/>
  <line x1="16" y1="27" x2="16" y2="7" stroke="#66bb6a" stroke-width="1.5"/>
  <!-- Grandes feuilles ovales vert très clair -->
  <ellipse cx="9" cy="23" rx="8" ry="5" fill="#a5d6a7" transform="rotate(-15 9 23)"/>
  <ellipse cx="23" cy="23" rx="8" ry="5" fill="#80cbc4" transform="rotate(15 23 23)"/>
  <ellipse cx="8" cy="16" rx="8" ry="5" fill="#b2dfdb" transform="rotate(-20 8 16)"/>
  <ellipse cx="24" cy="16" rx="8" ry="5" fill="#a5d6a7" transform="rotate(20 24 16)"/>
  <ellipse cx="16" cy="9" rx="7" ry="4.5" fill="#c8e6c9"/>
  <!-- Veines centrales -->
  <line x1="7" y1="21" x2="11" y2="25" stroke="#4caf50" stroke-width="0.6"/>
  <line x1="25" y1="21" x2="21" y2="25" stroke="#4caf50" stroke-width="0.6"/>
  <line x1="6" y1="14" x2="10" y2="18" stroke="#4caf50" stroke-width="0.6"/>
  <line x1="26" y1="14" x2="22" y2="18" stroke="#4caf50" stroke-width="0.6"/>
  <!-- Légères petites fleurs blanches au sommet -->
  <circle cx="14" cy="7" r="1.2" fill="white"/>
  <circle cx="18" cy="7" r="1.2" fill="white"/>
</svg>
