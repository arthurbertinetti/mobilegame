<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="vi_body" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8b848"/>
      <stop offset="55%" stop-color="#c08020"/>
      <stop offset="100%" stop-color="#805010"/>
    </radialGradient>
    <radialGradient id="vi_glass" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,240,200,0.5)"/>
      <stop offset="100%" stop-color="rgba(180,120,40,0.3)"/>
    </radialGradient>
    <radialGradient id="vi_cork" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d8a860"/>
      <stop offset="100%" stop-color="#906030"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="9" ry="0.7" fill="#00000020"/>
  <!-- Wide base bottle body -->
  <path d="M8,16 Q8,10 16,10 Q24,10 24,16 L24,28 Q24,30 16,30 Q8,30 8,28 Z" fill="url(#vi_body)"/>
  <!-- Glass overlay -->
  <path d="M8,16 Q8,10 16,10 Q24,10 24,16 L24,28 Q24,30 16,30 Q8,30 8,28 Z" fill="url(#vi_glass)"/>
  <!-- Narrow neck -->
  <rect x="13" y="6" width="6" height="6" rx="2" fill="#b07018"/>
  <rect x="13.2" y="6" width="5.6" height="6" rx="2" fill="url(#vi_glass)"/>
  <!-- Cork -->
  <rect x="13.5" y="3" width="5" height="4" rx="1.5" fill="url(#vi_cork)"/>
  <!-- Label -->
  <rect x="10" y="18" width="12" height="8" rx="1" fill="#f8f0d8" stroke="#c0a040" stroke-width="0.5"/>
  <!-- Label text lines -->
  <rect x="11.5" y="19.5" width="9" height="1" rx="0.5" fill="#806020"/>
  <rect x="12" y="21.5" width="8" height="0.8" rx="0.4" fill="#a08030"/>
  <rect x="12" y="23" width="8" height="0.8" rx="0.4" fill="#a08030"/>
  <!-- Bottle shine -->
  <rect x="9.5" y="12" width="1.5" height="14" rx="0.7" fill="rgba(255,255,255,0.3)"/>
  <!-- Amber liquid shimmer -->
  <ellipse cx="12" cy="14" rx="2" ry="1" fill="rgba(255,220,100,0.3)"/>
</svg>
