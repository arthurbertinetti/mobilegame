<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cup_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f08060"/>
      <stop offset="50%" stop-color="#f8a080"/>
      <stop offset="100%" stop-color="#c05030"/>
    </linearGradient>
    <radialGradient id="lid_g" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8d0cc"/>
    </radialGradient>
    <radialGradient id="peach_g" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffb060"/>
      <stop offset="100%" stop-color="#e06030"/>
    </radialGradient>
  </defs>
  <ellipse cx="16" cy="31.5" rx="10" ry="0.7" fill="#00000020"/>
  <!-- round cup body -->
  <path d="M8,28 Q8,31 16,31 Q24,31 24,28 L22,15 Q22,13 16,13 Q10,13 10,15 Z" fill="url(#cup_body)"/>
  <path d="M11,16 Q11,14.5 16,14.5" fill="none" stroke="#ffc0a0" stroke-width="0.8" opacity="0.6"/>
  <!-- dome lid -->
  <ellipse cx="16" cy="15" rx="8" ry="2" fill="#e8e8e8"/>
  <path d="M8,15 Q8,10 16,10 Q24,10 24,15" fill="url(#lid_g)"/>
  <ellipse cx="16" cy="15" rx="8" ry="2" fill="none" stroke="#c0c0c0" stroke-width="0.5"/>
  <!-- straw (white) -->
  <rect x="19" y="3" width="1.8" height="14" rx="0.9" fill="#e8e8e8"/>
  <rect x="19" y="3" width="0.7" height="14" rx="0.35" fill="#ffffff" opacity="0.7"/>
  <!-- peach half-circle garnish -->
  <path d="M10,13 A4,4 0 0 1 18,13 Z" fill="url(#peach_g)"/>
  <line x1="14" y1="13" x2="14" y2="9" stroke="#c05030" stroke-width="0.5" opacity="0.5"/>
  <!-- leaf on peach -->
  <path d="M14,9 Q12,7 13,6 Q14,8 14,9Z" fill="#5a9820"/>
</svg>
