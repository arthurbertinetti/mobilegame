<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Coriandre: feuilles très découpées en dentelle, vert clair, fleurs blanches en ombelle -->
  <rect x="14.5" y="27" width="3" height="4" rx="1" fill="#4e342e"/>
  <line x1="16" y1="27" x2="16" y2="12" stroke="#81c784" stroke-width="1.2"/>
  <!-- Branches principales -->
  <line x1="16" y1="22" x2="8" y2="15" stroke="#81c784" stroke-width="1"/>
  <line x1="16" y1="22" x2="24" y2="15" stroke="#81c784" stroke-width="1"/>
  <!-- Folioles gauche bas -->
  <ellipse cx="7" cy="14" rx="3" ry="1.8" fill="#a5d6a7" transform="rotate(-30 7 14)"/>
  <ellipse cx="5" cy="16.5" rx="2.5" ry="1.5" fill="#c8e6c9" transform="rotate(-50 5 16.5)"/>
  <ellipse cx="9" cy="12.5" rx="2.5" ry="1.5" fill="#81c784" transform="rotate(-10 9 12.5)"/>
  <!-- Folioles droite bas -->
  <ellipse cx="25" cy="14" rx="3" ry="1.8" fill="#a5d6a7" transform="rotate(30 25 14)"/>
  <ellipse cx="27" cy="16.5" rx="2.5" ry="1.5" fill="#c8e6c9" transform="rotate(50 27 16.5)"/>
  <ellipse cx="23" cy="12.5" rx="2.5" ry="1.5" fill="#81c784" transform="rotate(10 23 12.5)"/>
  <!-- Branches hautes -->
  <line x1="16" y1="16" x2="11" y2="10" stroke="#81c784" stroke-width="0.9"/>
  <line x1="16" y1="16" x2="21" y2="10" stroke="#81c784" stroke-width="0.9"/>
  <ellipse cx="10" cy="9" rx="2.5" ry="1.5" fill="#c8e6c9" transform="rotate(-20 10 9)"/>
  <ellipse cx="22" cy="9" rx="2.5" ry="1.5" fill="#c8e6c9" transform="rotate(20 22 9)"/>
  <!-- Ombelle fleurs blanches au sommet -->
  <line x1="16" y1="12" x2="13" y2="8" stroke="#81c784" stroke-width="0.8"/>
  <line x1="16" y1="12" x2="16" y2="7" stroke="#81c784" stroke-width="0.8"/>
  <line x1="16" y1="12" x2="19" y2="8" stroke="#81c784" stroke-width="0.8"/>
  <circle cx="13" cy="7.5" r="1.5" fill="white"/>
  <circle cx="16" cy="6.5" r="1.5" fill="white"/>
  <circle cx="19" cy="7.5" r="1.5" fill="white"/>
</svg>
