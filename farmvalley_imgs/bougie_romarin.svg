<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shadow_br" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="candle_br" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0b8a0"/>
      <stop offset="40%" stop-color="#d0d8c0"/>
      <stop offset="100%" stop-color="#909880"/>
    </linearGradient>
    <radialGradient id="flame_br" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#fff8b0"/>
      <stop offset="40%" stop-color="#ffc040"/>
      <stop offset="100%" stop-color="#ff6010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow_br" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ffe070" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30.5" rx="8" ry="1.8" fill="url(#shadow_br)"/>
  <!-- Candle body -->
  <rect x="11.5" y="14" width="9" height="15" rx="2" fill="url(#candle_br)"/>
  <ellipse cx="16" cy="29" rx="4.5" ry="1.3" fill="#808870" opacity="0.5"/>
  <!-- Wax pool top -->
  <ellipse cx="16" cy="14.5" rx="4" ry="1" fill="#d8e0c8" opacity="0.7"/>
  <!-- Rosemary sprigs around base (left) -->
  <!-- Left sprig stem -->
  <path d="M6 28 Q8 24 11.5 22" stroke="#3a7030" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Left sprig needles -->
  <line x1="6.8" y1="27.5" x2="6" y2="26.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="7.5" y1="26.5" x2="6.5" y2="25.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="8.3" y1="25.5" x2="7.2" y2="24.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="6.8" y1="27.5" x2="7.8" y2="26.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="7.5" y1="26.5" x2="8.5" y2="25.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="8.3" y1="25.5" x2="9.3" y2="24.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="9.2" y1="24.3" x2="10" y2="23.3" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="9.2" y1="24.3" x2="8.2" y2="23.3" stroke="#4a8840" stroke-width="0.7"/>
  <!-- Right sprig stem -->
  <path d="M26 28 Q24 24 20.5 22" stroke="#3a7030" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Right sprig needles -->
  <line x1="25.2" y1="27.5" x2="26" y2="26.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="24.5" y1="26.5" x2="25.5" y2="25.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="23.7" y1="25.5" x2="24.8" y2="24.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="25.2" y1="27.5" x2="24.2" y2="26.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="24.5" y1="26.5" x2="23.5" y2="25.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="23.7" y1="25.5" x2="22.7" y2="24.5" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="22.8" y1="24.3" x2="22" y2="23.3" stroke="#4a8840" stroke-width="0.7"/>
  <line x1="22.8" y1="24.3" x2="23.8" y2="23.3" stroke="#4a8840" stroke-width="0.7"/>
  <!-- Wick -->
  <line x1="16" y1="14" x2="16" y2="10" stroke="#504030" stroke-width="0.8"/>
  <!-- Flame glow -->
  <ellipse cx="16" cy="8.5" rx="4" ry="4.5" fill="url(#glow_br)"/>
  <!-- Flame -->
  <path d="M16 5.5 C14.5 7 13.8 8.5 14.8 9.8 C15.2 10.5 16.8 10.5 17.2 9.8 C18.2 8.5 17.5 7 16 5.5 Z" fill="url(#flame_br)"/>
  <!-- Candle shine -->
  <rect x="12.8" y="15" width="1.5" height="12" rx="0.7" fill="#fff" opacity="0.3"/>
</svg>
