<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="cc2_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cc2_jar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8e0d4"/>
      <stop offset="30%" stop-color="#e8f0ec"/>
      <stop offset="70%" stop-color="#d8e8e0"/>
      <stop offset="100%" stop-color="#b0c8bc"/>
    </linearGradient>
    <linearGradient id="cc2_cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0a870"/>
      <stop offset="100%" stop-color="#c09060"/>
    </linearGradient>
    <linearGradient id="cc2_lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8c8b8"/>
      <stop offset="100%" stop-color="#b0988c"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="10" ry="2.5" fill="url(#cc2_shadow)"/>
  <!-- Jar body - rounded, classic cream jar -->
  <rect x="7" y="13" width="18" height="15" rx="4" fill="url(#cc2_jar)" stroke="#90b0a0" stroke-width="0.8"/>
  <!-- Cream fill -->
  <rect x="8.5" y="17" width="15" height="10" rx="3" fill="url(#cc2_cream)" opacity="0.9"/>
  <!-- Jar shine -->
  <rect x="9" y="14" width="2.5" height="9" rx="1" fill="white" opacity="0.45"/>
  <!-- Label background -->
  <rect x="9.5" y="19" width="13" height="6.5" rx="1.5" fill="white" opacity="0.85"/>
  <!-- Chestnut silhouette on label -->
  <path d="M16 20.5 Q13.5 20 13 22 Q12.5 24 16 25 Q19.5 24 19 22 Q18.5 20 16 20.5 Z" fill="#7a4020"/>
  <!-- Chestnut shine -->
  <ellipse cx="14.5" cy="21.5" rx="1" ry="0.6" fill="white" opacity="0.35" transform="rotate(-25,14.5,21.5)"/>
  <!-- Chestnut hat (prickly) -->
  <path d="M15 20.5 Q14.5 19 15.5 19.2 Q16 18.8 16.5 19.2 Q17.5 19 17 20.5" fill="#5a3010" stroke="#4a2808" stroke-width="0.3"/>
  <!-- Neck ring -->
  <rect x="8.5" y="12" width="15" height="2" rx="1" fill="#b0c8bc" stroke="#90b0a0" stroke-width="0.5"/>
  <!-- Lid -->
  <rect x="8.5" y="8" width="15" height="5" rx="2.5" fill="url(#cc2_lid)" stroke="#907868" stroke-width="0.6"/>
  <!-- Lid shine -->
  <rect x="10.5" y="9" width="3.5" height="2" rx="1" fill="white" opacity="0.35"/>
</svg>
