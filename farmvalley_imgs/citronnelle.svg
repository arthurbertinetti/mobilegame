  <!-- Tiges herbeuses en arcs -->
  <path d="M10 30 Q7 20 9 10 Q10 8 11 10 Q12 22 13 30 Z" fill="#c5e1a5"/>
  <path d="M13 30 Q10 18 12 6 Q13 4 14 6 Q15 18 16 30 Z" fill="#aed581"/>
  <path d="M15 30 Q13 16 15 4 Q16 2 17 4 Q18 16 18 30 Z" fill="#c5e1a5"/>
  <path d="M17 30 Q18 18 20 6 Q21 4 22 6 Q21 18 21 30 Z" fill="#aed581"/>
  <path d="M20 30 Q23 22 23 12 Q24 10 25 12 Q24 22 24 30 Z" fill="#dce775"/>
  <!-- Reflets pour donner texture de graminée -->
  <line x1="10" y1="15" x2="7" y2="10" stroke="#e6ee9c" stroke-width="0.8"/>
  <line x1="16" y1="12" x2="14" y2="6" stroke="#e6ee9c" stroke-width="0.8"/>
  <line x1="22" y1="15" x2="24" y2="10" stroke="#e6ee9c" stroke-width="0.8"/>
