<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="ol_olv" cx="38%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#708890"/>
      <stop offset="55%" stop-color="#303860"/>
      <stop offset="100%" stop-color="#101828"/>
    </radialGradient>
    <radialGradient id="ol_can" cx="38%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#789070"/>
      <stop offset="55%" stop-color="#486848"/>
      <stop offset="100%" stop-color="#284028"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="8" ry="0.7" fill="#00000022"/>
  <!-- Gnarled/twisted trunk (iconic olive tree feature) -->
  <path d="M12,31 Q10,26 11,22 Q10,19 12,17 Q13.5,16 14.5,17.5 Q15,19 15.5,22 Q16,19 16.5,17.5 Q17.5,16.5 19,17 Q21,19 20,22 Q21,26 20,31 Z" fill="#5d3a18"/>
  <path d="M13,31 Q11.5,26 12.5,22.5 Q11.5,20 13,18 Q14,17.5 14.5,18.5 Q15,20 15.5,22.5 Q16.5,20 17,18.5 Q18,17 19,18 Q20,20 19,22.5 Q20,26 19,31 Z" fill="#7a4f25"/>
  <!-- Trunk knots -->
  <ellipse cx="12.5" cy="23" rx="1.3" ry="1" fill="#4a2e12" transform="rotate(-25,12.5,23)"/>
  <ellipse cx="19.5" cy="24" rx="1.3" ry="1" fill="#4a2e12" transform="rotate(20,19.5,24)"/>
  <!-- Canopy (silver-grey-green — very distinct from other trees) -->
  <ellipse cx="16" cy="12" rx="13" ry="10.5" fill="#3d5c40"/>
  <ellipse cx="16" cy="11" rx="12" ry="9.5" fill="#4a6e4a"/>
  <ellipse cx="9" cy="14" rx="8" ry="6.5" fill="#3d5c40"/>
  <ellipse cx="23" cy="14" rx="8" ry="6.5" fill="#3d5c40"/>
  <ellipse cx="16" cy="6" rx="9.5" ry="6.5" fill="url(#ol_can)"/>
  <!-- Silver leaf shimmer (unique to olive — leaves are silver underneath) -->
  <ellipse cx="9" cy="10" rx="4" ry="2.2" fill="#c0d0b8" opacity="0.38" transform="rotate(-15,9,10)"/>
  <ellipse cx="23" cy="11" rx="4" ry="2.2" fill="#c0d0b8" opacity="0.38" transform="rotate(15,23,11)"/>
  <ellipse cx="16" cy="5.5" rx="4.5" ry="2" fill="#c0d0b8" opacity="0.32"/>
  <ellipse cx="12" cy="7" rx="3" ry="1.5" fill="#b8ccb0" opacity="0.28" transform="rotate(-20,12,7)"/>
  <!-- Olives (small, dark, oval — recognizable) -->
  <ellipse cx="7" cy="18" rx="2" ry="3" fill="url(#ol_olv)"/>
  <ellipse cx="25" cy="17" rx="2" ry="3" fill="url(#ol_olv)"/>
  <ellipse cx="13" cy="20.5" rx="1.8" ry="2.8" fill="url(#ol_olv)"/>
  <ellipse cx="20" cy="20" rx="1.8" ry="2.8" fill="url(#ol_olv)"/>
  <!-- Olive shines -->
  <ellipse cx="6.3" cy="16.5" rx="0.6" ry="1" fill="rgba(255,255,255,.28)"/>
  <ellipse cx="24.3" cy="15.5" rx="0.6" ry="1" fill="rgba(255,255,255,.28)"/>
</svg>
