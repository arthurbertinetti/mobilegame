<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="ab_fr" cx="33%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ffe080"/>
      <stop offset="45%" stop-color="#f07010"/>
      <stop offset="100%" stop-color="#a83800"/>
    </radialGradient>
    <radialGradient id="ab_can" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#70c040"/>
      <stop offset="60%" stop-color="#388018"/>
      <stop offset="100%" stop-color="#1c5008"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="7.5" ry="0.7" fill="#00000022"/>
  <!-- Trunk -->
  <path d="M13.5,31 Q13,25.5 13.5,22 Q14.5,20 16,20.5 Q17.5,20 18.5,22 Q19,25.5 18.5,31 Z" fill="#6b3a1f"/>
  <path d="M14.5,31 Q14,25.5 14.5,22.5 Q15.2,21 16,21.2 Q16.8,21 17.5,22.5 Q18,25.5 17.5,31 Z" fill="#905430"/>
  <!-- Canopy — rounder/lighter green than apple -->
  <ellipse cx="16" cy="14" rx="12.5" ry="10" fill="#287018"/>
  <ellipse cx="16" cy="13" rx="11.5" ry="9" fill="#348820"/>
  <ellipse cx="9.5" cy="15.5" rx="7.5" ry="6" fill="#287018"/>
  <ellipse cx="22.5" cy="15.5" rx="7.5" ry="6" fill="#287018"/>
  <ellipse cx="16" cy="7.5" rx="9" ry="6" fill="url(#ab_can)"/>
  <!-- Canopy shine -->
  <ellipse cx="12" cy="9.5" rx="3.2" ry="2" fill="rgba(160,240,100,.22)"/>
  <!-- Apricots (round, orange — at canopy edge) -->
  <circle cx="7" cy="17.5" r="3.2" fill="url(#ab_fr)"/>
  <circle cx="25" cy="16.5" r="3.2" fill="url(#ab_fr)"/>
  <circle cx="16" cy="21.5" r="3.2" fill="url(#ab_fr)"/>
  <circle cx="11" cy="10.5" r="2.6" fill="url(#ab_fr)"/>
  <circle cx="21.5" cy="10.5" r="2.6" fill="url(#ab_fr)"/>
  <!-- Characteristic apricot groove -->
  <line x1="7" y1="14.3" x2="7" y2="20.7" stroke="#a03808" stroke-width="0.6" opacity="0.55"/>
  <line x1="25" y1="13.3" x2="25" y2="19.7" stroke="#a03808" stroke-width="0.6" opacity="0.55"/>
  <line x1="16" y1="18.3" x2="16" y2="24.7" stroke="#a03808" stroke-width="0.6" opacity="0.55"/>
  <!-- Apricot shines -->
  <ellipse cx="6" cy="16.2" rx="1" ry="1.3" fill="rgba(255,245,200,.4)"/>
  <ellipse cx="24" cy="15.2" rx="1" ry="1.3" fill="rgba(255,245,200,.4)"/>
