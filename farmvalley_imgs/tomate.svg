<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="tm_big" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ff6848"/>
      <stop offset="50%" stop-color="#e81010"/>
      <stop offset="100%" stop-color="#900808"/>
    </radialGradient>
    <radialGradient id="tm_sml" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff7050"/>
      <stop offset="55%" stop-color="#d81010"/>
      <stop offset="100%" stop-color="#800808"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="16" cy="31.5" rx="12" ry="0.8" fill="#00000022"/>
  <!-- Left tomato -->
  <circle cx="10" cy="24" r="7.5" fill="url(#tm_sml)"/>
  <!-- Right tomato -->
  <circle cx="22" cy="24" r="7.5" fill="url(#tm_sml)"/>
  <!-- Center-top tomato (front) -->
  <circle cx="16" cy="17" r="8" fill="url(#tm_big)"/>
  <!-- Shines -->
  <ellipse cx="8.5" cy="21" rx="2" ry="2.8" fill="rgba(255,220,200,.30)" transform="rotate(-10,8.5,21)"/>
  <ellipse cx="20.5" cy="21" rx="2" ry="2.8" fill="rgba(255,220,200,.28)" transform="rotate(10,20.5,21)"/>
  <ellipse cx="14" cy="14" rx="2.2" ry="3" fill="rgba(255,220,200,.32)" transform="rotate(-10,14,14)"/>
  <!-- Calyx left tomato -->
  <path d="M8,17 Q6.5,15.5 8.5,17 Q8,15 10,16.5 Q11,15 12,16.5 Q14,15 13.5,17" fill="#2a8818"/>
  <!-- Calyx right tomato -->
  <path d="M20,17 Q18.5,15.5 20.5,17 Q20,15 22,16.5 Q23,15 24,16.5 Q26,15 25.5,17" fill="#2a8818"/>
  <!-- Calyx center tomato -->
  <path d="M13.5,9.5 Q11.5,7.5 14,9 Q13.5,6.5 16,8 Q18.5,6.5 18,9 Q20.5,7.5 18.5,9.5" fill="#2a8818"/>
  <!-- Stems -->
  <line x1="10" y1="16.5" x2="10.5" y2="14" stroke="#2a8818" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="16.5" x2="21.5" y2="14" stroke="#2a8818" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="9" x2="16" y2="5" stroke="#2a8818" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Small leaf at top stem -->
  <ellipse cx="18.5" cy="6" rx="2.2" ry="1.1" fill="#38a020" transform="rotate(25,18.5,6)"/>
</svg>
