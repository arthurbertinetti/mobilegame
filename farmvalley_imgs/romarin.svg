<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Romarin: feuilles en aiguilles sur tiges ligneuses, très vert foncé -->
  <rect x="14.5" y="28" width="3" height="3" rx="1" fill="#4e342e"/>
  <!-- Tige principale -->
  <line x1="16" y1="28" x2="16" y2="6" stroke="#4e342e" stroke-width="1.8"/>
  <!-- Branches gauche -->
  <line x1="16" y1="24" x2="8" y2="19" stroke="#5d4037" stroke-width="1.3"/>
  <line x1="16" y1="18" x2="7" y2="13" stroke="#5d4037" stroke-width="1.3"/>
  <line x1="16" y1="12" x2="9" y2="7" stroke="#5d4037" stroke-width="1.3"/>
  <!-- Branches droite -->
  <line x1="16" y1="24" x2="24" y2="19" stroke="#5d4037" stroke-width="1.3"/>
  <line x1="16" y1="18" x2="25" y2="13" stroke="#5d4037" stroke-width="1.3"/>
  <line x1="16" y1="12" x2="23" y2="7" stroke="#5d4037" stroke-width="1.3"/>
  <!-- Aiguilles branche basse gauche -->
  <line x1="9" y1="18" x2="10" y2="21" stroke="#263238" stroke-width="1.2"/>
  <line x1="11" y1="19.5" x2="12" y2="22.5" stroke="#37474f" stroke-width="1.2"/>
  <line x1="13" y1="20.5" x2="14" y2="23.5" stroke="#455a64" stroke-width="1.2"/>
  <!-- Aiguilles branche milieu gauche -->
  <line x1="8" y1="12" x2="9" y2="15" stroke="#263238" stroke-width="1.2"/>
  <line x1="10" y1="13" x2="11" y2="16" stroke="#37474f" stroke-width="1.2"/>
  <line x1="12" y1="14" x2="13" y2="17" stroke="#455a64" stroke-width="1.2"/>
  <!-- Aiguilles branche haute gauche -->
  <line x1="10" y1="6.5" x2="11" y2="9.5" stroke="#263238" stroke-width="1.2"/>
  <line x1="12" y1="7.5" x2="13" y2="10.5" stroke="#37474f" stroke-width="1.2"/>
  <!-- Aiguilles branche basse droite -->
  <line x1="23" y1="18" x2="22" y2="21" stroke="#263238" stroke-width="1.2"/>
  <line x1="21" y1="19.5" x2="20" y2="22.5" stroke="#37474f" stroke-width="1.2"/>
  <line x1="19" y1="20.5" x2="18" y2="23.5" stroke="#455a64" stroke-width="1.2"/>
  <!-- Aiguilles branche milieu droite -->
  <line x1="24" y1="12" x2="23" y2="15" stroke="#263238" stroke-width="1.2"/>
  <line x1="22" y1="13" x2="21" y2="16" stroke="#37474f" stroke-width="1.2"/>
  <line x1="20" y1="14" x2="19" y2="17" stroke="#455a64" stroke-width="1.2"/>
  <!-- Petites fleurs bleues au sommet -->
  <circle cx="16" cy="5" r="1.8" fill="#90caf9"/>
  <circle cx="14" cy="6.5" r="1.3" fill="#bbdefb"/>
  <circle cx="18" cy="6.5" r="1.3" fill="#90caf9"/>
</svg>
