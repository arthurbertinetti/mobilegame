  <path d="M6,18.5 Q5,16.5 5.5,15 Q7,13.5 8,15 Q8.5,16.5 7.5,18.5 Q6.5,19.5 6,18.5 Z" fill="url(#fi_fig)"/>
  <circle cx="6.8" cy="19" r="0.7" fill="#1a0820"/>
  <path d="M25.5,17.5 Q24.5,15.5 25,14 Q26.5,12.5 27.5,14 Q28,15.5 27,17.5 Q26,18.5 25.5,17.5 Z" fill="url(#fi_fig)"/>
  <circle cx="26.3" cy="18" r="0.7" fill="#1a0820"/>
  <path d="M15,22.5 Q14,20.5 14.5,19 Q16,17.5 17,19 Q17.5,20.5 16.5,22.5 Q15.5,23.5 15,22.5 Z" fill="url(#fi_fig)"/>
  <circle cx="15.8" cy="23" r="0.7" fill="#1a0820"/>
  <!-- Fig shines -->
  <ellipse cx="5.5" cy="16.2" rx="0.7" ry="1" fill="rgba(255,200,255,.3)"/>
  <ellipse cx="25" cy="15.2" rx="0.7" ry="1" fill="rgba(255,200,255,.3)"/>
